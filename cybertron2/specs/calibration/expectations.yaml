# The calibration suite's expectations (proposals/calibration_worlds.md, "The expectations"; D2-228, D2-245; WORK W-54).
#
# For each of the twelve worlds, the ranges a real place of its kind shows, written before calibrating and drawn from the places
# each stands for. Ranges are wide on purpose: "a place of this kind looks like this", not a number to hit. A range is [low, high];
# null means no expectation (the measure says nothing about this kind of place, or the generator cannot make it yet).
#
# Where each number is measured (docs/review/37_growth/02zzt_calibration_suite.py):
#   weather   at the world's villages (the settled valleys and lowland, not the tops), per real year. Two columns: the generator's
#             climate (rain_mm, mean_temp_c only: it has no seasons, days or wind) and the engine's weather (climate.py, D4-109)
#             over 20 engine years, put per real year (a day's share x 365), as 02zzo did.
#   land      over the whole window's land, from the cells (150 m).
#   water     at the villages, on 02zzn's two-clock water model (a storm one day, the seasonal stores at 365/32 days a day).
#   ecosystems the share of the window's land (sea left out) in each group; present / absent: ecosystems found on at least 0.1%
#             of the land / on none of it.
#   wildlife  present: kinds of the wild layer with at least 0.01 a km2 over the window after its history (engine/wild.py).
#
# The real numbers are the Met Office's 1991-2020 station normals and the land's own descriptions in the sources below, as read
# and rounded; the ranges are widened well past them (about a third either side, or more where places of a kind differ), so a
# few per cent's error in a source does not move a verdict.

units:
  rain_mm: rain a year, mm
  wet_days: days a year with 1 mm or more
  mean_temp_c: a year's mean air temperature, C
  winter_c: the winter quarter's mean, C (engine only)
  summer_c: the summer quarter's mean, C (engine only)
  frost_nights: nights a year with the low below 0 C (air frost)
  snow_lying_days: days a year with snow lying (over 5 mm water held as snow, 02zzn)
  wind_ms: mean wind, m/s
  gale_days: days a year with the wind at 17 m/s or more
  max_height_m: the land's highest point, m
  share_over_500m: share of land over 500 m
  share_over_10deg: share of land steeper than 10 degrees
  floodplain_share: share of land the generator calls river floodplain
  terrace_share: share of land it calls river terrace
  low_ground_share: share of land within 2 m of a river of class 2 or more (height above the river, f)
  wet_ground_share: share of land with wetness 0.75 or more
  treeline_m: the lowest land too cold for wood (a year's mean under treeline_c), m; null where no land is that cold
  above_treeline_share: share of land above the tree line
  spates_a_year: spates begun a year at a village (flow 4 to 8 x the median)
  floods_a_year: floods begun a year at a village (flow over 8 x the median)
  flood_years: share of years with the river at least 1 m above normal at least once
  low_water_share: share of the year the river is low or dry (under 0.6 x the median)
  ice_days: days a real year with 5 cm or more of ice on still water (Stefan's law on the weather, 02zzn)
  woodland_share: share of land in wood (cover forest)
  heath_share: lowland heath
  moor_share: moor and blanket bog
  wetland_share: fen, reedbed, alder carr and wet grassland
  saltmarsh_share: saltmarsh
  lake_share: lakes (meres and tarns)

