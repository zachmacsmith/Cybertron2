sources:
  metoffice_normals: "Met Office, UK climate averages 1991-2020, station normals (rain, days of 1 mm or more, mean, max and min
    temperature, air frost days): Birmingham Airport, Sutton Bonington (midlands); Cambridge NIAB, Wattisham (East Anglia);
    Plymouth Mountbatten, Exeter, Aberporth (Devon, west Wales); Tiree, Dunstaffnage (west Scotland); Bradford, Bingley,
    Moor House (the Pennines); Braemar, Fort Augustus, Cairngorm summit (the Highlands); Hull, Bristol (estuaries); Marlborough
    (downs); Santon Downham (the Brecks); Keswick, Ambleside, Seathwaite (the Lakes); and the same series' snow lying and wind."
  midlands: "Natural England, National Character Areas: Trent Valley Washlands, Avon Valley, Dunsmore and Feldon (landform,
    floodplain and terraces, wood cover)."
  floodplain_meadows: "Floodplain Meadows Partnership, the meadows' hydrology (meadows flooding most winters, 0.5 to 2 m above the
    river's normal level)."
  ea_flood_freq: "Environment Agency and CEH, the Flood Estimation Handbook: bankfull flow about every 1 to 2 years on lowland
    rivers; flashy upland and western rivers several times a year; chalk streams groundwater-fed with rare spates."
  uk_woodland: "Rackham, The History of the Countryside (1986): Domesday England about 15% wood; a settled lowland 15 to 35%."
  east_anglia: "Natural England NCAs: South Suffolk and North Essex Clayland, Breckland; the driest region of Britain."
  brecks: "Breckland NCA 85; Dolman and others on the Brecks' climate (frost hollows, air frost in any month, about 600 mm)."
  devon_wales: "Natural England NCAs: Devon Redlands, the Culm; NRW Landmap: Ceredigion coast (oak woods, flashy rivers)."
  saltmarsh_uk: "JNCC and the Saltmarsh Extent of England and Wales: saltmarsh along estuaries and sheltered western coasts."
  west_scotland: "NatureScot Landscape Character Assessment: Argyll and Lochaber coasts; the rain gradient from coast (1,100 to 1,600)
    to the hills (2,500 to 4,000)."
  lakes_rain: "The Lake District's rain gradient: St Bees about 1,000 mm, Seathwaite about 3,500, Penrith in the lee about 850
    (Met Office normals; Manley, Climate and the British Scene)."
  pennines: "Natural England NCAs: Dark Peak, South Pennines, North Pennines (moor and blanket bog above about 400 m, cloughs,
    reservoirs and tarns, tops to 893 m at Cross Fell)."
  moor_house: "Moor House NNR (556 m): about 2,000 mm a year, mean about 5.5 C, snow lying about 50 to 70 days (ECN records)."
  uk_treeline: "Natural tree line in Britain about 450 to 650 m (Pennines and Lakes lower, the Cairngorms' pine to about 650 m);
    Pears, Mountains and Moorlands."
  highlands: "NatureScot LCAs: Cairngorms, Lochaber; Braemar (339 m): mean about 7 C, air frost about 130 days, snow lying about
    50 days."
  cairngorm: "Cairngorm summit (1,245 m) weather station: mean about 1 C, gales on many days, snow lying 150 days or more."
  nordic_normals: "Norwegian and Swedish meteorological institutes' 1991-2020 normals for lowland stations near 6 C mean (Oslo
    Blindern, Uppsala, Linköping): 550 to 750 mm, winter -4 to 0 C, frost nights 100 to 160, snow cover 40 to 110 days."
  lake_ice: "Lake and river ice records: southern Scandinavian lakes frozen 60 to 120 days a year; English lakes rarely freeze over
    (Windermere completely in 1895, 1929, 1946, 1963), tarns more often."
  boreal_woods: "Hemiboreal forest: birch and Scots pine with oak at its northern edge; beech's natural northern limit in southern
    Sweden."
  fens: "Natural England NCA 46, The Fens; Darby, The Medieval Fenland (meres, reed, sedge, eels and fowl, islands of higher
    ground such as Ely)."
  fen_floods: "The Fens before drainage flooded most winters over wide areas (Darby; the washes still do)."
  estuaries: "Natural England NCAs: Severn and Avon Vales, Humberhead Levels, Humber Estuary (tidal flats, saltmarsh, warp land,
    winter wildfowl)."
  downs: "Natural England NCAs: North Wessex Downs, Vale of White Horse, Berkshire and Marlborough Downs (chalk grassland, beech
    hangers, springs at the scarp foot, a wet clay vale)."
  chalk_streams: "Environment Agency, The State of England's Chalk Streams (2004): groundwater-fed, steady flows, winterbournes
    dry in late summer."
  new_forest: "New Forest NCA 131: heath, valley mire, pine and birch on sand and gravel, about 800 mm."
