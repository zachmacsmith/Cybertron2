# Orderings (the proposal's check 2): pairs that must come out in a known order whatever the constants. `a` and `b` are
# [world, where, measure]; `where` is `villages` or a probe named in make_calibration_worlds.probes. a < b unless `more`.
orderings:
  - {name: the dry east is drier than the lowland, a: [w02, villages, rain_mm], b: [w01, villages, rain_mm], from: proposal}
  - {name: the wet west's coast frosts less than the cold north, a: [w03, coast, frost_nights], b: [w07, villages, frost_nights],
     from: proposal, generator_stand_in: "mean_temp_c, more (the generator has no frost)"}
  - {name: the fells are wetter than the lee, a: [w04, lee, rain_mm], b: [w04, fells, rain_mm], from: proposal}
  - {name: the fen floods more than the chalk, a: [w10, villages, flooded], b: [w08, villages, flooded], from: proposal}
  - {name: the sand holds less water than the clay, a: [w11, on sand, held_mm], b: [w10, vale, held_mm], from: proposal}
  - {name: the wet west is wetter than the lowland, a: [w01, villages, rain_mm], b: [w03, villages, rain_mm], from: "rows 1 and 3"}
  - {name: the wet west has more wet days than the dry east, a: [w02, villages, wet_days], b: [w03, villages, wet_days], from: "rows 2 and 3"}
  - {name: the cold north is colder than the lowland, a: [w07, villages, mean_temp_c], b: [w01, villages, mean_temp_c], from: "rows 1 and 7"}
  - {name: the cold north has more ice than the lowland, a: [w01, villages, ice_days], b: [w07, villages, ice_days], from: "row 7: frozen still water"}
  - {name: the wet west's coast is windier than the lowland, a: [w01, villages, wind_ms], b: [w03, coast, wind_ms], from: "row 3: windy"}
  - {name: the high mountains' tops are colder than the upland's, a: [w06, tops, mean_temp_c], b: [w05, tops, mean_temp_c], from: "rows 5 and 6"}
  - {name: snow lies longer on the mountains' tops than in the lowland, a: [w01, villages, snow_lying_days], b: [w06, tops, snow_lying_days], from: "row 6: long snow"}
  - {name: the wet west's rivers are flashier than the dry east's, a: [w02, villages, spates_a_year], b: [w03, villages, spates_a_year], from: "rows 2 and 3"}
  - {name: the dry east has more low water than the wet west, a: [w03, villages, low_water_share], b: [w02, villages, low_water_share], from: "rows 2 and 3"}
  - {name: the fen has more wet ground than the lowland, a: [w01, land, wet_ground_share], b: [w08, land, wet_ground_share], from: "row 8"}
  - {name: the estuary has more saltmarsh than the lowland, a: [w01, land, saltmarsh_share], b: [w09, land, saltmarsh_share], from: "row 9"}
  - {name: the sand has more heath than the lowland, a: [w01, land, heath_share], b: [w11, land, heath_share], from: "row 11"}
  - {name: the downs lie drier than the vale, a: [w10, downs, wet], b: [w10, vale, wet], from: "row 10"}
