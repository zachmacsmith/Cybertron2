    - text: What I know of a craft I got by watching, by trying and failing, and by being taught; a day beside one who knows is worth many tries alone.
      source: family lore
    - text: 'What is made wears: gear with use, fittings with work, houses with the weather. Mended in time it costs a little; left, it costs the whole.'
      source: family lore
    - text: Our line's founders, Maud and Simon Reeve, came to Fallowmere and built the first Reeve house.
      source: family lore
    - text: Hay is cut most in summer, half as much in spring, a third as much in autumn, none in winter; beasts on bare winter grass without it begin to die after about 4 hungry nights.
      source: family lore
    - text: Cattle stray through an open gate, and most walk home at dusk; a beast that strays onto the road may die there or be lost.
      source: family lore
    - text: Pasture and meadow feed beasts best, fen half as well, heath and moor less; the murrain goes worst where herds share the grass, and comes from the deer.
      source: family lore
    - text: Barley does best sown in spring, and well early in summer or late in winter; sown at other times it comes up poor or not at all.
      source: family lore
    - text: A plot wants about 16 kilos of seed; seed chosen from the best ears of a ripe crop ripens sooner. Seed eaten in a hungry spring is next year's harvest gone.
      source: family lore
    - text: We hold 3 beasts on the Common, which Maud herds. They want hay through the winter.
      source: a holding
    - text: The Ashbys sow and reap their fields; they have grain after harvest and want hands at reaping.
      source: family lore
    - text: 'The Colles build: a frame, a wheel or a hearth is their work.'
      source: family lore
