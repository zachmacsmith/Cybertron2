    - text: 'The year turns in four seasons of 8 days: spring, summer, autumn, winter. Summer days are longest for work, winter''s shortest. What land and water give changes each season; one season''s emptiness
        says nothing of the next.'
      source: family lore
    - text: 'Winter is the hungry time: the fields give nothing, the wild little, a cold night burns about three times the fuel. What a house eats and burns through winter must be in by autumn''s end.'
      source: family lore
    - text: Fresh meat and fish go off in a night or two, faster in the hand; dry grain and beans keep more than a year. Dried, smoked or salted, food keeps for seasons. Raw food feeds about half what cooked
        does.
      source: family lore
    - text: A wood, a water or a heath gives less the more it is worked, and comes back when it is rested; game grows wary where it is hunted. Young growth cut comes again; dead wood gathered does not.
      source: family lore
    - text: A grown person eats about one food a night, more after a hard day or a night in the cold. A household of 4 wants about 28 food to see a winter through, and more if the frost comes early.
      source: family lore
    - text: 'Our household eats from one store and keeps one hearth. Other houses hold their own land, beasts and stores and live by other crafts than ours: what we lack, a neighbour may make, and what
        they lack, we may.'
      source: family lore
    - text: Heavy rain raises the rivers and a flood carries off what is set in them; a hard frost kills tender crops.
      source: family lore
