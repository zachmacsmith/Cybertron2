      source: family lore
    - text: Our line's founders, Osric and Orabel Field, came to Middleham and built the first Field house.
      source: family lore
    - text: Our store at Field House holds about 8 nights' food for the 4 of us as it stands; winter is 8 nights, and the hungry time is its end and the first days of spring.
      source: family lore
    - text: 'Fresh fish and meat go first or go off; what is dried, smoked, salted or in grain keeps. In a hungry spring the keeping food is what is left: eat the soft first, by rule if need be.'
      source: family lore
    - text: What we carry home stays in our hands at night unless we put it away or a rule does; a full store takes no more, and what will not go in lies at the door, where anyone may take it.
      source: family lore
    - text: 'The hearth burns about a bundle of firewood a night and three on a cold one: a winter wants about 8 to 24 bundles in by autumn''s end. Timber burns longer than firewood.'
      source: family lore
    - text: The household's rules and stores pass to whoever heads it after me. I should name an heir, and tell them where things are kept, and why.
      source: family lore
    - text: 'When the others'' plans leave units over, our rules can give them chores: who tends the fire, who hangs the catch, who fetches wood. Each of us may set our own fallback instead, and theirs
        comes first.'
      source: family lore
    - text: 'In the evening, under one roof, we look again at the household''s rules: what goes where, what is eaten first, who sees to which chore. What no longer serves we change then.'
      source: family lore
    - text: The Brooks boil salt at the spring; they want firewood for the pan.
      source: family lore
    - text: 'The Marshs live by the Wen: they know when the eels run, and dry and salt the catch; in late autumn they have fish to spare.'
      source: family lore
