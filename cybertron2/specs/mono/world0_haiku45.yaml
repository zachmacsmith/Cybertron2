    - salt fish
    - smoke fish
    - tend the smoke
    - wicker trap
    - hand line
    livelihood: You live by boiling salt at the spring, and by fishing beside it, and you are best at the pan, and you keep the Salt House.
    kept:
    - text: 'YOUR GOAL, on which you will be graded: grow your line, everyone descended from your household''s founders, to be as many as you can, and see them survive and spread over as many generations
        as you can. Your score is the number of people descended from your household''s founders who are living at the end of day 200, in whatever household or place they live: the more, the better.'
      fixed: true
    - text: 'The year turns in four seasons of 8 days: spring, summer, autumn, winter. Summer days are longest for work, winter''s shortest. What land and water give changes each season; one season''s emptiness
        says nothing of the next.'
      source: family lore
    - text: 'Winter is the hungry time: the wild little, a cold night burns about three times the fuel. What a house eats and burns through winter must be in by autumn''s end.'
      source: family lore
    - text: Fresh meat and fish go off in a night or two, faster in the hand; dry grain and beans keep more than a year. Dried, smoked or salted, food keeps for seasons. Raw food feeds about half what cooked
        does.
      source: family lore
    - text: A wood, a water or a heath gives less the more it is worked, and comes back when it is rested; game grows wary where it is hunted. Young growth cut comes again; dead wood gathered does not.
      source: family lore
    - text: A grown person eats about one food a night, more after a hard day or a night in the cold. A household of 5 wants about 32 food to see a winter through, and more if the frost comes early.
      source: family lore
    - text: 'Our household eats from one store and keeps one hearth. Other houses hold their own land, beasts and stores and live by other crafts than ours: what we lack, a neighbour may make, and what
        they lack, we may.'
      source: family lore
    - text: What I know of a craft I got by watching, by trying and failing, and by being taught; a day beside one who knows is worth many tries alone. What I do not teach my children dies with me.
      source: family lore
    - text: Our line's founders, Lambert and Mabel Brook, came to Highpool and built the first Brook house.
      source: family lore
    - text: Our store at Brook House holds about 5 nights' food for the 5 of us as it stands; winter is 8 nights, and the hungry time is its end and the first days of spring.
      source: family lore
