    born_line: Brook
    trade: ''
    aim: See the Brook household through the winter, fed and warm. You will not be shamed by Hamo again.
    places:
    - w4
    band: expert
    specialism: the_pan
    livelihoods: &id001
    - salter
    - fisher
    crafts_first:
    - boil salt
    - salt meat
    - salt fish
    - firewood
    - cut
    - mend the brine pan
    - salt pan
    - fish by hand
    - angle
    - fishing rod
    - trap in water
