    - text: Barley and rye sown year on year tires the ground; beans give it back. A field rested, or dunged, bears better.
      source: family lore
    - text: Lowbury Field lies empty, its soil rich.
      source: a holding
    - text: We hold Lowbury Field, which Henry sees to, and the ox team and plough, which Cecily keeps. Seed must be kept back for them; they
