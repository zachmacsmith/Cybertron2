    livelihood: You live by fishing, and by boiling salt at the spring beside it, and you are best at the traps and the runs, and you see to Middle
      Field.
    model: claude-sonnet-5-5
    kept:
    - text: 'YOUR GOAL, on which you will be graded: grow the people of this world, everyone in it whatever their household, to be as many as
        you can, and see them survive and spread over as many generations as you can. Your score is the number of people living anywhere in the
        world at the end of day 200, in every household and place together, not your household alone: the more, the better.'
      fixed: true
      tag: goal
    - text: My sister Avice took her family north toward the high moors after the dark year; Henry went east to the river country, and Gilbert
        into the great wood.
      source: family lore
    - text: 'The year turns in four seasons of 8 days: spring, summer, autumn, winter. Summer days are longest for work, winter''s shortest. What
        land and water give changes each season; one season''s emptiness says nothing of the next.'
      source: family lore
    - text: 'Winter is the hungry time: the fields give nothing, the wild little, a cold night burns about three times the fuel. What a house
        eats and burns through winter must be in by autumn''s end.'
      source: family lore
    - text: Fresh meat and fish go off in a night or two, faster in the hand; dry grain and beans keep more than a year. Dried, smoked or salted,
        food keeps for seasons. Raw food feeds about half what cooked does.
      source: family lore
    - text: A wood, a water or a heath gives less the more it is worked, and comes back when it is rested; game grows wary where it is hunted.
        Young growth cut comes again; dead wood gathered does not.
      source: family lore
    - text: A grown person eats about one food a night, more after a hard day or a night in the cold. A household of 4 wants about 29 food to
        see a winter through, and more if the frost comes early.
      source: family lore
    - text: 'Our household eats from one store and keeps one hearth. Other houses hold their own land, beasts and stores and live by other crafts
        than ours: what we lack, a neighbour may make, and what they lack, we may.'
      source: family lore
    - text: Heavy rain raises the rivers and a flood carries off what is set in them; a hard frost kills tender crops.
      source: family lore
    - text: What I know of a craft I got by watching, by trying and failing, and by being taught; a day beside one who knows is worth many tries
        alone.
      source: family lore
    - text: 'What is made wears: gear with use, fittings with work, houses with the weather. Mended in time it costs a little; left, it costs
        the whole.'
      source: family lore
    - text: Fresh fish goes off in a night or two in the hand. Dry it at the hearth, up to 8 kilos at a time, or salt it the day it is caught,
        a kilo of salt to four of fish.
      source: family lore
    - text: A spate smashes about half the traps in the water, and a flood nearly all; an otter that finds full traps comes back each night. When
        the water drops, set again.
      source: family lore
    - text: Middle Field lies empty, its soil rich.
      source: a holding
    - text: A kilo of salt keeps four of fish or eight of meat for about a year. Every house that kills, fishes or makes cheese needs it, and
        few can make it.
      source: family lore
