# The records' checks on every push to main (D2-233 to D2-235): the views against their items, the pushed commits' trailers,
# hygiene, the branches, and the Obsidian vault rebuilt on its own branch `vault` (D2-240). Only a view out of step, or a broken item, fails the run;
# the rest is reported in the run's summary (a direct push to main cannot be refused).
name: records
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: records
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Items and views
        run: |
          echo '## Items and views' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/records.py check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The pushed commits
        if: always()
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
          echo '## The pushed commits (D2-235)' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/records.py check-commits "$BEFORE..${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Hygiene and branches
        if: always()
        run: |
          echo '## Branches (D2-238)' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/records.py branches >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Hygiene' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/hygiene.py >> "$GITHUB_STEP_SUMMARY" || true
      - name: The vault, rebuilt on its own branch (D2-240)
        if: always()
        run: |
          git config user.name "records-bot"
          git config user.email "records-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin vault >/dev/null; then
            git fetch -q origin vault:refs/remotes/origin/vault
            git worktree add -q vault-out origin/vault
            git -C vault-out checkout -q -B vault origin/vault
          else
            git worktree add -q --detach vault-out
            git -C vault-out checkout -q --orphan vault
            git -C vault-out rm -rfq . >/dev/null 2>&1 || true
          fi
          python3 tools/records.py vault vault-out
          cd vault-out
          git add -A
          if git diff --cached --quiet; then echo "vault unchanged"; exit 0; fi
          git commit -q -m "vault: rebuilt from main ${GITHUB_SHA::7}"
          git push -q origin vault
