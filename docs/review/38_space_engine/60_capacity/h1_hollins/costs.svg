<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460"><title>h1_hollins: what each level costs</title><rect width="860" height="460" fill="#fcfcfb"/><text x="16.0" y="26.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">h1_hollins: what each level costs</text><text x="16.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Each level: food a plot of field a year (log) against food a unit of work; the mark&#x27;s size is its capital a head.</text><line x1="70.0" y1="70" x2="70.0" y2="400" stroke="#e1e0d9"/><text x="70.0" y="418.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">10</text><line x1="365.0" y1="70" x2="365.0" y2="400" stroke="#e1e0d9"/><text x="365.0" y="418.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">100</text><line x1="660.0" y1="70" x2="660.0" y2="400" stroke="#e1e0d9"/><text x="660.0" y="418.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1000</text><line x1="70" y1="400.0" x2="660" y2="400.0" stroke="#e1e0d9"/><text x="62.0" y="404.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0.0</text><line x1="70" y1="317.5" x2="660" y2="317.5" stroke="#e1e0d9"/><text x="62.0" y="321.5" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0.4</text><line x1="70" y1="235.0" x2="660" y2="235.0" stroke="#e1e0d9"/><text x="62.0" y="239.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif