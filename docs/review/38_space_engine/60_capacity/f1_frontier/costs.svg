<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460"><title>f1_frontier: what each level costs</title><rect width="860" height="460" fill="#fcfcfb"/><text x="16.0" y="26.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">f1_frontier: what each level costs</text><text x="16.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Each level: food a plot of field a year (log) against food a unit of work; the mark&#x27;s size is its capital a head.</text><line x1="70.0" y1="70" x2="70.0" y2="400" stroke="#e1e0d9"/><text x="70.0" y="418.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">100</text><line x1="660.0" y1="70" x2="660.0" y2="400" stroke="#e1e0d9"/><text x="660.0" y="418.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1000</text><line x1="70" y1="400.0" x2="660" y2="400.0" stroke="#e1e0d9"/><text x="62.0" y="404.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0.0</text><line x1="70" y1="317.5" x2="660" y2="317.5" stroke="#e1e0d9"/><text x="62.0" y="321.5" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0.4</text><line x1="70" y1="235.0" x2="660" y2="235.0" stroke="#e1e0d9"/><text x="62.0" y="239.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0.8</text><line x1="70" y1="152.5" x2="660" y2="152.5" stroke="#e1e0d9"/><text x="62.0" y="156.5" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1.2</text><line x1="70" y1="70.0" x2="660" y2="70.0" stroke="#e1e0d9"/><text x="62.0" y="74.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1.6</text><text x="365.0" y="444.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">food a plot a year</text><text x="18" y="235.0" font-size="11" fill="#898781" transform="rotate(-90 18 235.0)" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">food a unit of work</text><circle cx="339.7" cy="136.0" r="20.0" fill="#0d366b" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"><title>ceiling: 286.5 a plot, 1.26 a unit, 25.6 units a head a year, capital 9.1 units a head</title></circle><text x="363.7" y="140.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">ceiling: capital 9 units a head</text></svg>