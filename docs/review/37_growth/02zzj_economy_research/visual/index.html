s":["03"]},{"id":"forest_law","label":"Forest law and game rights","domain":"institutions","kind":"institution","start":1079,"date_src":"general","wide":1200,"place":"Norman England","paradigm":"feudal_manorial","desc":"The Norman kings put perhaps a quarter to a third of England under forest law, reserving deer to the king [rough]; small game needed a grant of free warren. Poaching was among the commonest offences into the 19th century.","chokepoint":true,"part":"03","parts":["03","05"]},{"id":"deer_park","label":"Deer park","domain":"food","kind":"infrastructure","start":1086,"date_src":"general","wide":1300,"place":"England","paradigm":"feudal_manorial","desc":"Deer fed, guarded and culled inside a pale of fence, bank and hedge: about 3,200 parks by 1300, some 2% of England (cited). Capital sunk in the pale, enforced by law and keepers.","chokepoint":false,"part":"03","parts":["03"]},{"id":"fuel_rent_in_kind","label":"Fuel rent for salt","domain":"institutions","kind":"institution","start":1086,"date_src":"general","place":"Worcestershire manors","paradigm":"feudal_manorial","desc":"Manors owed the salt works wood in return for salt: Martin Hussingtree owed 100 cartloads a year for a set quantity [V]. A chokepoint tied to its sink at a distance by rent in kind.","chokepoint":false,"part":"01","parts":["01"]},{"id":"lead_pan_brine","label":"Brine boiling in lead pans","domain":"materials","kind":"industry","start":1086,"date_src":"general","wide":1500,"place":"Droitwich","paradigm":"feudal_manorial","desc":"Near-saturated brine boiled over wood in lead pans: four tons of brine gave a ton of salt [V]. Droitwich burned about 6,000 loads of wood a year in the 1530s [V], brought from Worcester, Bromsgrove and Alcester. A chokepoint (salt) bound to distant woods.","chokepoint":true,"part":"01","parts":["01"]},{"id":"mill_soke","label":"Mill soke (suit of mill)","domain":"institutions","kind":"institution","start":1086,"date_src":"general","place":"English manors","paradigm":"feudal_manorial","desc":"Tenants were bound to grind at the lord's mill and pay multure, a twelfth to a thirtieth of the grain (one source: a thirteenth for serfs, a twenty-fourth for free men) [checked]. Domesday records about 6,000 mills [unchecked]; about 43% of 14th-century powered mills were the church's [checked]. A monopoly rent and an archetype of evasion.","chokepoint":true,"part":"05","parts":["05"]},{"id":"wage_labour","label":"Day labour for wages","domain":"institutions","kind":"institution","start":1086,"date_src":"part","wide":1600,"place":"England (bordars and cottars)","paradigm":"feudal_manorial","desc":"Households with little or no land living by wages, with a garden, common rights and the wife's spinning; by the 17th century perhaps a third of rural households [rough]. Casual workers' days rose from under 150 a year to well over 300 by the Industrial Revolution (Humphries and Weisdorf) [checked, contested].","chokepoint":false,"part":"05","parts":["05"]},{"id":"banal_oven","label":"Lord's oven (four banal)","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"France","paradigm":"feudal_manorial","desc":"A seigneurial monopoly like the mill: tenants paid to bake in the lord's oven [s]. Less common and less enforced in England [s, r].","chokepoint":true,"part":"02","parts":["02"]},{"id":"chartered_market_town","label":"Chartered market town","domain":"exchange","kind":"institution","start":1100,"date_src":"general","place":"medieval Europe","paradigm":"feudal_manorial","desc":"A market place and market day under a lord's or king's charter, with tolls, its own court and peace on the roads, serving villages within a day's walk (about 10 to 15 km) and supporting smiths, tanners, bakers and brewers.","chokepoint":false,"part":"12","parts":["12"]},{"id":"chinampas","label":"Chinampa raised beds","domain":"food","kind":"technique","start":1100,"date_src":"general","place":"Xochimilco and Chalco lakes","paradigm":"agrarian_empire","desc":"Long raised beds of mud and vegetation between canals, anchored by willows, renewed with canal muck and planted from seedling nurseries for several crops a year; perhaps 9,000 to 9,500 ha at their height (rough).","chokepoint":false,"part":"11","parts":["11"]},{"id":"community_responsibility","label":"Community responsibility system","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"Medieval European towns","paradigm":"commercial_city_state","desc":"A whole town's merchants were liable for one member's debts abroad, so a creditor's town could seize the goods of any of them (Avner Greif) [s]. It gave towns reason to police their own and let strangers from different towns trade, while towns were few and members identifiable.","chokepoint":false,"part":"04","parts":["04"]},{"id":"fishponds","label":"Fishponds and stews","domain":"food","kind":"infrastructure","start":1100,"date_src":"general","wide":1300,"place":"manors, castles, monasteries","paradigm":"feudal_manorial","desc":"Dug ponds with dams and sluices, 'living larders' of high-status sites: keeping instead of catching.","chokepoint":false,"part":"03","parts":["03"]},{"id":"flemish_cloth","label":"Flemish fine cloth industry","domain":"textiles","kind":"industry","start":1100,"date_src":"general","place":"Flanders and Brabant","paradigm":"commercial_city_state","desc":"Fine woollen cloth made from imported English wool and sold across Europe. A region's industry built on another's raw material, made fragile by any war that closed the route.","chokepoint":false,"part":"04","parts":["04"]},{"id":"forest_glass","label":"Forest glass","domain":"materials","kind":"industry","start":1100,"date_src":"part","place":"German and central European woods","paradigm":"feudal_manorial","desc":"Glass fluxed with beech ash: Theophilus (c.1100) gives two parts ash to one of quartz, and with furnace fuel 150 to 200 kg of wood per kg of glass [V]. The works moved with the forest.","chokepoint":false,"part":"01","parts":["01"]},{"id":"frankpledge","label":"Frankpledge tithings","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"England","paradigm":"feudal_manorial","desc":"Every man over twelve was in a tithing of about ten, bound to produce any member who offended: policing by neighbours, checked at the view of frankpledge once or twice a year.","chokepoint":false,"part":"05","parts":["05"]},{"id":"fulling_mill","label":"Fulling mill","domain":"textiles","kind":"infrastructure","start":1100,"date_src":"general","paradigm":"feudal_manorial","place":"","desc":"Water-driven hammers to finish woollen cloth. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"great_zimbabwe","label":"Great Zimbabwe gold and cattle","domain":"institutions","kind":"institution","start":1100,"date_src":"part","place":"Zimbabwe plateau","paradigm":"early_state","desc":"A capital of mortarless stone enclosures (about 1100 to 1450; population estimates fallen from 18,000 to under 10,000, contested) living on cattle herded seasonally under the court and on control of gold won by many small miners and carried to Sofala and Kilwa. Abandoned perhaps as gold ran out, routes moved north, or overgrazing and drought struck.","chokepoint":false,"part":"11","parts":["11"]},{"id":"guilds","label":"Craft guilds","domain":"institutions","kind":"institution","start":1100,"date_src":"general","wide":1300,"place":"European towns","paradigm":"commercial_city_state","desc":"Regulated entry (apprenticeship, fees, masterpiece), quality (searches, seals on cloth), prices and apprentices per master, and judged members' disputes. Epstein: they enforced training and spread skills; Ogilvie: mostly rent-seeking and exclusion. Abolished in France 1791.","chokepoint":true,"part":"05","parts":["05"]},{"id":"merchant_guild","label":"Merchant guilds","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"European towns","paradigm":"commercial_city_state","desc":"Gilds merchant held town charters, controlled who could trade retail in the town, set terms for outsiders and negotiated privileges abroad. Ogilvie argues their main effect was to capture rents through monopoly and exclusion [s, x].","chokepoint":true,"part":"04","parts":["04"]},{"id":"peat","label":"Peat","domain":"energy","kind":"resource","start":1100,"date_src":"general","paradigm":"commercial_city_state","place":"","desc":"Dug bog fuel; powered the Dutch Golden Age's industries before coal. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"periodic_market_system","label":"Periodic market cycle","domain":"exchange","kind":"practice","start":1100,"date_src":"general","place":"Rural China (Skinner)","paradigm":"agrarian_empire","desc":"A standard market town served about 18 villages, some 1,500 households, within a few hours' walk; markets met every few days on staggered schedules so itinerant traders could visit each in turn, nesting upward into larger towns (G. William Skinner) [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"primogeniture","label":"Primogeniture and partible inheritance","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"England; Kent and France for partible","paradigm":"feudal_manorial","desc":"Primogeniture kept holdings whole and pushed younger children into service, crafts and towns; partible inheritance (Kent's gavelkind, much of France) supported denser, poorer populations with more by-employment.","chokepoint":false,"part":"05","parts":["05"]},{"id":"rabbit_warren","label":"Rabbit warren","domain":"food","kind":"infrastructure","start":1100,"date_src":"part","wide":1300,"place":"Breckland, England","paradigm":"feudal_manorial","desc":"Rabbits introduced by the Normans by about 1100 and kept in guarded, often leased warrens for meat and fur (cited); a luxury in the 13th century, a common pest by the 19th (m).","chokepoint":false,"part":"03","parts":["03"]},{"id":"saw_pit","label":"Saw pit","domain":"building","kind":"technique","start":1100,"date_src":"general","place":"Europe","paradigm":"feudal_manorial","desc":"A pair of sawyers, one above and one in the pit, ripping timber into boards. Worked wood (boards, staves, poles) went into building, barrels, carts, ploughs and boats.","chokepoint":false,"part":"03","parts":["03"]},{"id":"stockfish","label":"Stockfish","domain":"food","kind":"good","start":1100,"date_src":"general","wide":1300,"place":"Lofoten, Norway; Iceland","paradigm":"maritime_trading","desc":"Cod dried in wind without salt, from Norway and Iceland (m): a long-distance commodity carried with grain.","chokepoint":false,"part":"03","parts":["03"]},{"id":"stockfish_trade","label":"Norwegian stockfish trade","domain":"food","kind":"industry","start":1100,"date_src":"general","place":"Bergen, Norway","paradigm":"maritime_trading","desc":"Wind-dried cod from northern Norway traded through the Hanse kontor at Bergen for grain. A region specialised in a durable food it could not eat all of.","chokepoint":false,"part":"04","parts":["04"]},{"id":"suit_of_mill","label":"Suit of mill and multure","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"England (Domesday mills)","paradigm":"feudal_manorial","desc":"The lord's monopoly on grinding: tenants had to use his mill and pay multure, often a sixteenth to a twentieth of the grain [M]. The first rent on shared capital, with about 6,000 mills in 1086 and perhaps 10,000 by 1300 [V]. One of the main frictions between lords and tenants.","chokepoint":true,"part":"01","parts":["01","02"],"wide":1300},{"id":"sureties_pledges","label":"Sureties and pledges","domain":"institutions","kind":"institution","start":1100,"date_src":"general","place":"Manor courts, England","paradigm":"feudal_manorial","desc":"Neighbours who promise to pay if the debtor does not, named when deals were made before witnesses. Chris Briggs found debt the commonest civil plea in 14th-century manor courts, with loans in grain, malt and cash backed by personal pledges [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"tally_sticks","label":"Split tally sticks","domain":"information","kind":"technique","start":1100,"date_src":"general","place":"Medieval Europe; English Exchequer","paradigm":"feudal_manorial","desc":"A hazel stick notched for the sum and split lengthwise, each party keeping a half that must match. Used from villages to the English Exchequer, which kept them until 1826; burning the old tallies set fire to Parliament in 1834 [s]. A record of debt that needs no literacy.","chokepoint":false,"part":"04","parts":["04"]},{"id":"work_horses","label":"Work horses","domain":"energy","kind":"technique","start":1100,"date_src":"general","place":"England and north-west Europe","paradigm":"feudal_manorial","desc":"Faster than oxen (a third to a half more work a day [r]) and better for carting, but need oats, shoes and a padded collar. Oxen still outnumbered horses about two to one on English demesnes at the end of the 14th century, while peasants adopted horses faster than lords (Langdon 1986) [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"venice_arsenal","label":"Venetian Arsenal","domain":"transport","kind":"industry","start":1104,"date_src":"general","place":"Venice","paradigm":"commercial_city_state","desc":"The state shipyard that built and fitted galleys on something like an assembly line: 1,500 to 2,000 workers, 4,000 to 5,000 in war (16,000 often repeated, contested), 'perhaps the largest industrial plant of that time' (Lane). Its timber, hemp, pitch and sailcloth came by trade.","chokepoint":false,"part":"12","parts":["12"]},{"id":"bridges_pontage","label":"Bridges and pontage tolls","domain":"transport","kind":"infrastructure","start":1150,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"A wave of bridge building in the 12th and 13th centuries, paid by lords, towns, religious guilds and pontage tolls [s]. Towns grew at the lowest bridging point (London, Rouen, Cologne), at fords and at the head of navigation.","chokepoint":true,"part":"04","parts":["04"]},{"id":"chimney","label":"Chimney and enclosed hearth","domain":"building","kind":"technique","start":1150,"date_src":"general","wide":1550,"place":"England and northern Europe","paradigm":"feudal_manorial","desc":"A brick or stone flue that let houses have upper floors and waste less fuel; it spread in England in the 16th century [M]. An open hearth delivered perhaps 10 to 20% of its heat to the room [M].","chokepoint":false,"part":"01","parts":["01"]},{"id":"commutation_money_rent","label":"Commutation to money rent","domain":"institutions","kind":"institution","start":1150,"date_src":"part","wide":1400,"place":"English manors","paradigm":"feudal_manorial","desc":"Replacing labour services with money, in waves: much in the 12th century, a return to services in the 13th under high grain prices, then commutation from the later 14th. By 1300 money rents were already most of what tenants paid [rough]. Needed markets and coin; it pushed tenants to sell.","chokepoint":false,"part":"05","parts":["05"]},{"id":"fair_courts","label":"Fair courts and law merchant","domain":"institutions","kind":"institution","start":1150,"date_src":"general","place":"Fairs and boroughs of Europe","paradigm":"commercial_city_state","desc":"Quick courts at fairs with merchant judges (the English 'piepowder' court, for dusty-footed travellers). Milgrom, North and Weingast modelled them as a third-party record of unpaid judgements; Edwards and Ogilvie found no private merchant code, only public courts [c].","chokepoint":false,"part":"04","parts":["04"]},{"id":"horse_haulage","label":"Horse haulage replaces oxen","domain":"transport","kind":"technique","start":1150,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"From the 12th century horses replaced oxen in English haulage (John Langdon): a one-horse cart carried 0.3 to 0.5 t at 25 to 35 km a day against an ox wagon's 15 to 20 km. Faster, but horses eat oats where oxen eat grass.","chokepoint":false,"part":"04","parts":["04"]},{"id":"mason_lodges","label":"Mason crews and lodges","domain":"institutions","kind":"institution","start":1150,"date_src":"general","wide":1300,"place":"cathedral works of England and France","paradigm":"feudal_manorial","desc":"Itinerant crews of rough masons and freemasons moving between large works under a master, paid by the day. A stone church or castle took years and hundreds of workers (rough).","chokepoint":false,"part":"03","parts":["03"]},{"id":"mining_law","label":"Mining law and free miners","domain":"institutions","kind":"institution","start":1150,"date_src":"general","wide":1300,"place":"Cornwall stannaries; German Bergregal; Forest of Dean","paradigm":"feudal_manorial","desc":"A right to a resource separated from ownership of the land: miners staked claims under a special law and paid dues to the crown (m). Chartered rights and royal dues on Cornish and Devon tin.","chokepoint":false,"part":"03","parts":["03"]},{"id":"moneychangers","label":"Moneychangers","domain":"exchange","kind":"practice","start":1150,"date_src":"general","place":"Italian towns and fairs","paradigm":"commercial_city_state","desc":"Exchanged coins of many mints at fairs and in towns and began to hold deposits, the first step toward deposit banking.","chokepoint":false,"part":"04","parts":["04"]},{"id":"salt_fish","label":"Salt herring and cod","domain":"food","kind":"good","start":1150,"date_src":"general","wide":1400,"place":"Baltic and North Sea","paradigm":"commercial_city_state","desc":"Fish packed in salt and barrels, the staple of fast days across Europe [M, part 01]. An assembly with salt as its chokepoint.","chokepoint":false,"part":"03","parts":["03"]},{"id":"huizi_notes","label":"Southern Song huizi","domain":"exchange","kind":"good","start":1160,"date_src":"part","place":"Hangzhou, Southern Song","paradigm":"agrarian_empire","desc":"Southern Song notes from the 1160s, which depreciated badly in the wars with the Jin and Mongols. The Yuan then made paper the main money and over-issued it too.","chokepoint":false,"part":"11","parts":["11"]},{"id":"freehold_tenure","label":"Freehold under royal courts","domain":"institutions","kind":"institution","start":1166,"date_src":"part","place":"England (Henry II's assizes)","paradigm":"feudal_manorial","desc":"Land held for fixed, often nominal, services, heritable and saleable, protected by the king's courts from Henry II's assizes (1160s to 1170s). Villein land, by contrast, was protected only in the manor court.","chokepoint":false,"part":"05","parts":["05"]},{"id":"champagne_fairs","label":"Champagne fairs","domain":"exchange","kind":"institution","start":1180,"date_src":"part","place":"Lagny, Bar-sur-Aube, Provins, Troyes","paradigm":"feudal_manorial","desc":"Six fairs a year in four towns so one was nearly always running, at their height about 1180 to 1300 [c]. Each ended with a settlement period that cleared debts between Italian and Flemish merchants. The counts supplied a fair court, safe-conducts and fair-keepers [c]; they declined after the French crown took the county (1285) and Genoese galleys reached Bruges (1277).","chokepoint":false,"part":"04","parts":["04"]},{"id":"windmill","label":"Windmill","domain":"energy","kind":"infrastructure","start":1180,"date_src":"general","paradigm":"feudal_manorial","place":"","desc":"Wind-driven mill for grinding and drainage, spreading where streams were scarce. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"apprenticeship","label":"Apprenticeship indentures","domain":"institutions","kind":"institution","start":1200,"date_src":"general","place":"London and European towns","paradigm":"commercial_city_state","desc":"The master gives board, lodging and training, often for a premium, and the youth his labour for a term. A high share of London apprenticeships ended early (Wallis; Minns and Wallis) [checked, qualitative]: the master's cost came first, the apprentice's useful work last.","chokepoint":false,"part":"05","parts":["05"]},{"id":"banking","label":"Deposit and giro banking","domain":"exchange","kind":"institution","start":1200,"date_src":"part","place":"Genoa and Venice","paradigm":"commercial_city_state","desc":"Deposit bankers in Genoa and Venice by the 12th to 13th century made transfers between accounts on spoken order (giro), so merchants could pay each other without moving coin [s]. The Medici bank later had branches from London to Rome.","chokepoint":false,"part":"04","parts":["04"]},{"id":"blast_furnace","label":"Blast furnace","domain":"metals","kind":"technique","start":1200,"date_src":"general","paradigm":"feudal_manorial","place":"","desc":"Tall water-blown furnace making liquid cast iron. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"cacao_cloak_money","label":"Cacao and cloak money","domain":"exchange","kind":"good","start":1200,"date_src":"general","place":"Mesoamerica","paradigm":"agrarian_empire","desc":"Cacao beans for small sums and cotton cloaks (quachtli) worth 65 to 300 beans for large ones, with copper axe blanks and quills of gold dust.","chokepoint":false,"part":"11","parts":["11"]},{"id":"corporation","label":"Corporate bodies","domain":"institutions","kind":"institution","start":1200,"date_src":"general","place":"Medieval towns, guilds, monasteries, colleges","paradigm":"feudal_manorial","desc":"Bodies that hold property, sue and outlive their members: medieval towns, guilds, monasteries and colleges, then chartered companies with tradable shares.","chokepoint":false,"part":"05","parts":["05"]},{"id":"currying","label":"Currying and leather guilds","domain":"textiles","kind":"institution","start":1200,"date_src":"general","place":"medieval towns","paradigm":"feudal_manorial","desc":"Shaving, oiling with tallow or fish oil, and finishing the tanned hide. Curriers and cordwainers were separate guilds from tanners and fought over who did which step (m): trades formed round the steps of one chain.","chokepoint":false,"part":"03","parts":["03"]},{"id":"hanse_cog","label":"Hanseatic cog","domain":"transport","kind":"technique","start":1200,"date_src":"general","place":"North Sea and Baltic","paradigm":"maritime_trading","desc":"A clinker-built sailing ship of about 100 to 200 t making 100 to 150 km a day in fair wind; winter sailing stopped in the Baltic. Carried Hanse bulk trade, later replaced by the hulk.","chokepoint":false,"part":"04","parts":["04"]},{"id":"hops_beer","label":"Hopped beer","domain":"food","kind":"technique","start":1200,"date_src":"general","wide":1500,"place":"Low Countries and Germany","paradigm":"feudal_manorial","desc":"Beer with hops, which keeps and travels where ale soured; in England from the 15th century [M]. It let brewing grow from the household to the town brewhouse.","chokepoint":false,"part":"01","parts":["01"]},{"id":"inns","label":"Inns and stabling","domain":"transport","kind":"infrastructure","start":1200,"date_src":"general","place":"England and Europe","paradigm":"feudal_manorial","desc":"Lodging for people, stabling for beasts, storage for goods and a place to hear news and meet buyers: the infrastructure of trade. The English 1686 War Office survey counted inns for tens of thousands of travellers [s, r].","chokepoint":false,"part":"04","parts":["04"]},{"id":"lay_subsidy","label":"Taxes on movables","domain":"institutions","kind":"institution","start":1200,"date_src":"general","place":"England","paradigm":"feudal_manorial","desc":"A fraction of movable goods' value (often a fifteenth in the countryside, a tenth in towns), assessed by local juries and fixed as quotas per vill from 1334 [unchecked]; the poll taxes of 1377 to 1381 set off the Peasants' Revolt.","chokepoint":false,"part":"05","parts":["05"]},{"id":"manor_court","label":"Manor court and tenant jury","domain":"institutions","kind":"institution","start":1200,"date_src":"general","place":"English manors","paradigm":"feudal_manorial","desc":"Met every three weeks or so, handling land transfers, by-laws, trespass, debts between tenants and failed services. Juries of tenants found facts and declared custom into the rolls; deals before witnesses were backed by pledges. Most villagers both borrowed and lent, and the court was why (Briggs).","chokepoint":false,"part":"02","parts":["02","05"]},{"id":"market_charters","label":"Royal market charters","domain":"institutions","kind":"institution","start":1200,"date_src":"part","wide":1300,"place":"England","paradigm":"feudal_manorial","desc":"A weekly market or yearly fair was a royal franchise bought by a lord, abbey or town; grants peaked in the late 13th century, for well over a thousand places [c source, r count]. Bracton's rule: a new market within 6 2/3 miles harmed an old one [s]. The lord took tolls, stall rents and court fines.","chokepoint":false,"part":"04","parts":["04"]},{"id":"marling","label":"Marling","domain":"food","kind":"technique","start":1200,"date_src":"general","place":"England","paradigm":"feudal_manorial","desc":"Lime-rich clay spread on light or acid soils at tens of tons an acre, lasting a generation or more ('marl for your son') [r]. A time-capital work paid once, by the landholder.","chokepoint":false,"part":"01","parts":["01","02"],"wide":1750},{"id":"night_soil","label":"Night-soil trade","domain":"food","kind":"good","start":1200,"date_src":"general","place":"Chinese cities; Edo and Osaka","paradigm":"agrarian_empire","desc":"Excreta collected from privies and sold to farmers as fertiliser, closing the city's nutrient loop. In Edo the tenement landlord owned it and sold it under annual contracts; ten households' night soil for a year was worth two to three bu of silver (as reported), and in 1789 villages petitioned the shogunate over the price.","chokepoint":false,"part":"01","parts":["01","12"]},{"id":"payment_in_kind","label":"Harvest pay in kind","domain":"institutions","kind":"practice","start":1200,"date_src":"general","place":"Medieval England","paradigm":"feudal_manorial","desc":"Meals at work, a share of the harvest, gleaning rights, a tied cottage: a medieval harvest worker's pay was often half food and drink.","chokepoint":false,"part":"05","parts":["05"]},{"id":"poaching_game_laws","label":"Poaching and game laws","domain":"institutions","kind":"institution","start":1200,"date_src":"general","wide":1800,"place":"England","paradigm":"feudal_manorial","desc":"The peasant snared and poached for food and was punished for it: the contest over a commons that law took away. Later game laws and gamekeepers guarded the shooting estate (m).","chokepoint":false,"part":"03","parts":["03"]},{"id":"river_ordinances","label":"Mill, weir and river rules","domain":"institutions","kind":"institution","start":1200,"date_src":"general","place":"European rivers","paradigm":"feudal_manorial","desc":"Rules for one river with many claims: mill rights, weir laws, fixed fishing times, ordinances on where tanners and retters may work. Mills hold water, fish need runs, tanning and retting foul it.","chokepoint":false,"part":"01","parts":["01"]},{"id":"scania_herring_fair","label":"Scania herring fair","domain":"exchange","kind":"practice","start":1200,"date_src":"general","wide":1350,"place":"Scania, Baltic","paradigm":"commercial_city_state","desc":"The medieval Baltic herring market where the Hanse packed herring in Luneburg salt (m).","chokepoint":false,"part":"03","parts":["03"]},{"id":"sheep_folding","label":"Folding sheep on arable","domain":"food","kind":"practice","start":1200,"date_src":"general","place":"chalk and sand lands of England","paradigm":"feudal_manorial","desc":"Sheep penned by night on the fallow inside hurdles of withies, with a shepherd, so their dung fertilised the arable. The fold course tied a lord's flock to tenants' fields.","chokepoint":false,"part":"01","parts":["01","02"]},{"id":"shroffs_hundi","label":"Shroffs and hundi bills","domain":"exchange","kind":"institution","start":1200,"date_src":"general","place":"Mughal and earlier India","paradigm":"agrarian_empire","desc":"Shroffs tested coin, lent to officers against revenue assignments and remitted money by hundi, bills drawn on correspondents in other cities, so value moved without carrying coin.","chokepoint":false,"part":"11","parts":["11"]},{"id":"sun_bleaching","label":"Linen bleachfields","domain":"textiles","kind":"practice","start":1200,"date_src":"general","wide":1700,"place":"Flanders, Holland, Ireland","paradigm":"commercial_city_state","desc":"Linen laid out in the sun for weeks with lye: a seasonal pulse at the end of the flax chain.","chokepoint":false,"part":"03","parts":["03"]},{"id":"timber_frame","label":"Timber frame","domain":"building","kind":"technique","start":1200,"date_src":"part","wide":1450,"place":"England","paradigm":"feudal_manorial","desc":"Standards felled, hewn and jointed by the carpenter on a framing yard, then raised by a crew; infill of wattle and daub. Grundle House used about 330 mostly small, young oaks (m), so building fit the coppice-with-standards.","chokepoint":false,"part":"03","parts":["03"]},{"id":"water_bloomery_hammer","label":"Water-powered bloomery and hammer","domain":"metals","kind":"technique","start":1200,"date_src":"part","place":"European mill sites","paradigm":"feudal_manorial","desc":"A wheel driving bellows and hammer at a bloomery from the 13th century (m): larger blooms, at the lord's or a monastery's mill site.","chokepoint":false,"part":"03","parts":["03"]},{"id":"woodbank_fencing","label":"Fenced coppice by year","domain":"institutions","kind":"institution","start":1200,"date_src":"general","place":"English woods","paradigm":"feudal_manorial","desc":"Woods divided in time (fenced panels by year of cut) and in right (who may take what, when). Restraint enforced by bank, ditch, hedge and calendar, with fines for breaking it.","chokepoint":false,"part":"03","parts":["03"]},{"id":"fire_regulations","label":"Town fire regulations","domain":"institutions","kind":"institution","start":1212,"date_src":"part","wide":1667,"place":"London","paradigm":"feudal_manorial","desc":"After London's fire of 1212, fitz Ailwin's rules banned new roofs of reed, rush or straw (widely flouted); after 1666, when about 13,200 houses burned, the rebuilding acts required brick and stone (m). One house's thatch threatens the street, so the rule had to be collective.","chokepoint":false,"part":"03","parts":["03"]},{"id":"regulated_commons","label":"Regulated commons and stints","domain":"institutions","kind":"institution","start":1224,"date_src":"part","place":"English villages; Törbel, Switzerland","paradigm":"feudal_manorial","desc":"Manor by-laws set when fields opened, how many beasts each holding might graze (the stint, in proportion to arable), who might glean, and fines for over-use. Not Hardin's open access: Ostrom's design principles are met by stint, jury, hayward and graded fines; Törbel's meadows governed by village rules since at least 1224.","chokepoint":false,"part":"05","parts":["05"]},{"id":"mongol_yam","label":"Mongol yam relay post","domain":"information","kind":"institution","start":1230,"date_src":"general","place":"Mongol empire","paradigm":"pastoral_nomadic","desc":"Under the Mongols one power held the whole road, with safe-conduct tablets (paiza) and relay post stations (yam); travel peaked, and the plague of 1346 came the same way.","chokepoint":false,"part":"11","parts":["11"]},{"id":"great_conduit","label":"London Great Conduit","domain":"building","kind":"infrastructure","start":1245,"date_src":"part","place":"London","paradigm":"feudal_manorial","desc":"Lead pipes from springs to a public conduit (1245): water carried to the city by gravity, kept by conduit keepers.","chokepoint":false,"part":"12","parts":["12"]},{"id":"bills_of_exchange","label":"Bills of exchange","domain":"exchange","kind":"institution","start":1250,"date_src":"part","place":"Florence, Bruges and Italian networks","paradigm":"commercial_city_state","desc":"A merchant pays florins to a banker, who writes to a correspondent in Bruges to pay local money at a set date (the usance) [s]. It combined transfer across distance, currency exchange and credit, and let bankers earn interest despite the usury ban. Needed correspondents in many towns and trust between bankers.","chokepoint":false,"part":"04","parts":["04"]},{"id":"civic_grain_office","label":"Civic grain office","domain":"institutions","kind":"institution","start":1250,"date_src":"general","place":"Venice","paradigm":"commercial_city_state","desc":"A state grain office bringing grain by sea from Apulia, the Black Sea and Sicily for a city of about 100,000 to 120,000 before 1348 (contested) with little land of its own.","chokepoint":false,"part":"12","parts":["12"]},{"id":"compagnia","label":"Florentine compagnia","domain":"exchange","kind":"institution","start":1250,"date_src":"part","place":"Florence","paradigm":"commercial_city_state","desc":"Partners with unlimited liability running branches across Europe: the Bardi, Peruzzi and later the Medici. The Bardi and Peruzzi failed in the 1340s after lending to Edward III, who stopped paying [s, x].","chokepoint":false,"part":"04","parts":["04"]},{"id":"florentine_wool_cloth","label":"Florentine woollen industry","domain":"textiles","kind":"industry","start":1250,"date_src":"general","wide":1338,"place":"Florence","paradigm":"commercial_city_state","desc":"English wool and Levantine alum worked by a putting-out system of wage workers barred from guilds of their own (the Ciompi revolt, 1378). Villani (about 1338): about 30,000 paid by the cloth trade, about 200 workshops, 70,000 to 80,000 cloths a year (contested).","chokepoint":false,"part":"12","parts":["12"]},{"id":"hanse_kontor","label":"Hanse Kontor","domain":"exchange","kind":"institution","start":1250,"date_src":"general","place":"Bruges, London, Bergen, Novgorod","paradigm":"commercial_city_state","desc":"A foreign nation's house where Hanse merchants lived and traded under the host city's law, bringing Baltic grain and goods to Bruges.","chokepoint":false,"part":"12","parts":["12"]},{"id":"hanseatic_league","label":"Hanseatic League","domain":"exchange","kind":"institution","start":1250,"date_src":"part","wide":1370,"place":"North German and Baltic towns","paradigm":"maritime_trading","desc":"A loose association of over 100, by some counts about 200, towns at its 14th-century height [c, x], with privileged kontore (London Steelyard, Bruges, Bergen, Novgorod) and shared Lübeck law. Baltic grain, timber, furs and wax went west for cloth, salt and herring; embargoes and war (Stralsund 1370) defended its privileges.","chokepoint":false,"part":"04","parts":["04"]},{"id":"herring_salting_trade","label":"Salt herring trade","domain":"exchange","kind":"industry","start":1250,"date_src":"general","place":"Baltic and North Sea (Hanse)","paradigm":"commercial_city_state","desc":"Baltic and North Sea herring salted in barrels and traded far; the Hanse's control of Luneburg salt made it a chokepoint [s].","chokepoint":true,"part":"02","parts":["02"]},{"id":"mamluk_sugar_refining","label":"Mamluk sugar refining","domain":"food","kind":"industry","start":1250,"date_src":"general","place":"Egypt","paradigm":"agrarian_empire","desc":"Egypt refined sugar at scale with peasants and wage workers and exported it to Europe. Cane must be crushed within a day or two or the juice spoils, so field and mill had to be one unit.","chokepoint":false,"part":"11","parts":["11"]},{"id":"peasant_land_market","label":"Peasant land market","domain":"institutions","kind":"practice","start":1250,"date_src":"part","place":"English villages (court rolls)","paradigm":"feudal_manorial","desc":"From the 13th century court rolls show small plots bought, leased and mortgaged between villagers to balance land with family size. A villein's transfer was a surrender and regrant entered on the roll.","chokepoint":false,"part":"05","parts":["05"]},{"id":"sea_coal_shipping","label":"Sea coal, Tyne to London","domain":"energy","kind":"industry","start":1250,"date_src":"part","wide":1600,"place":"Newcastle to London","paradigm":"feudal_manorial","desc":"Coal from outcrops near the Tyne shipped to London: for lime-burning and smithing from the 13th century, household fuel from the later 16th [V]. Coal gave half of England's energy by 1700 and over 90% by 1850 [V].","chokepoint":false,"part":"01","parts":["01"]},{"id":"sealed_bond","label":"Sealed bond with penalty","domain":"exchange","kind":"institution","start":1250,"date_src":"general","place":"England","paradigm":"feudal_manorial","desc":"A sealed written promise to pay, often for double the sum as penalty on default, enforceable at common law. Written bonds replaced living witnesses as the record of a debt.","chokepoint":false,"part":"04","parts":["04"]},{"id":"florin","label":"Gold florin","domain":"exchange","kind":"good","start":1252,"date_src":"part","place":"Florence","paradigm":"commercial_city_state","desc":"Florence's gold coin from 1252, the money of its cloth trade and banks.","chokepoint":false,"part":"12","parts":["12"]},{"id":"assize_bread_ale","label":"Assize of Bread and Ale","domain":"institutions","kind":"institution","start":1266,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"Fixed the weight of a penny loaf by the price of wheat, enforced by local courts with fines and the pillory; ale-tasters tested quality and routine fines worked as a licence [s]. It lasted in London until 1815.","chokepoint":false,"part":"02","parts":["02","05","12"]},{"id":"english_wool_export","label":"English wool export trade","domain":"exchange","kind":"practice","start":1270,"date_src":"part","wide":1300,"place":"England to Flanders and Italy","paradigm":"feudal_manorial","desc":"England specialised in raw wool, tens of thousands of sacks a year around 1300 [s, r], sold to Flanders and Italy for cloth, wine, luxuries and cash for the crown's taxes; later England made the cloth itself.","chokepoint":false,"part":"03","parts":["03","04"]},{"id":"fabriano_paper","label":"Fabriano paper","domain":"materials","kind":"industry","start":1270,"date_src":"part","place":"Fabriano, Italy","paradigm":"commercial_city_state","desc":"Christian Europe's first major paper centre by the 1270s, sizing with gelatine instead of starch.","chokepoint":false,"part":"11","parts":["11"]},{"id":"mesta_transhumance","label":"Mesta sheep guild","domain":"institutions","kind":"institution","start":1273,"date_src":"part","place":"Castile","paradigm":"feudal_manorial","desc":"Chartered in 1273, it moved merino flocks hundreds of km between north and south, a few million head in the early 16th century [s, r]. Protected drove roads (canadas), grazing rights at both ends, tolls and its own courts.","chokepoint":false,"part":"02","parts":["02"]},{"id":"wool_customs","label":"Wool export customs","domain":"institutions","kind":"institution","start":1275,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"Customs on wool exports became the English crown's most reliable revenue from 1275: a tax on a chokepoint trade collected at the ports.","chokepoint":true,"part":"05","parts":["05"]},{"id":"spinning_wheel","label":"Spinning wheel","domain":"textiles","kind":"technique","start":1280,"date_src":"part","wide":1400,"place":"Europe (13th c.)","paradigm":"feudal_manorial","desc":"Faster spinning than distaff and spindle, which managed 40 to 100 m of yarn an hour (cited); guilds sometimes banned wheel yarn for warps at first (m). Spinning was the bottleneck of cloth and the main paid work of women.","chokepoint":false,"part":"03","parts":["03"]},{"id":"statute_merchant","label":"Statute merchant and staple","domain":"institutions","kind":"institution","start":1283,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"Debts registered before a town official, with fast seizure of the debtor's goods or body on default (England from 1283 and 1285) [s]. A public register of debts that made credit between merchants enforceable quickly.","chokepoint":false,"part":"04","parts":["04"]},{"id":"bardi_peruzzi_banks","label":"Bardi and Peruzzi banks","domain":"exchange","kind":"institution","start":1300,"date_src":"general","place":"Florence","paradigm":"commercial_city_state","desc":"The deepest merchant banks of the century, which failed in the 1340s: a default chain running from royal borrowers through the city.","chokepoint":false,"part":"12","parts":["12"]},{"id":"book_credit","label":"Shop book credit","domain":"exchange","kind":"practice","start":1300,"date_src":"general","wide":1600,"place":"Town and village shops, England","paradigm":"feudal_manorial","desc":"A shopkeeper's or craftsman's ledger of what each customer owes, the main form of early modern retail credit. Muldrew argued almost all buying and selling ran on credit and that a household's 'credit' meant its reputation for paying [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"brewsters_alewives","label":"Brewsters and alewives","domain":"food","kind":"practice","start":1300,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"In the 14th and 15th centuries most ale was brewed by women, for the household and then for sale, as a by-employment of wives and widows (Bennett 1996) [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"bruges_bourse","label":"Bruges bourse and hostellers","domain":"exchange","kind":"institution","start":1300,"date_src":"part","place":"Bruges","paradigm":"commercial_city_state","desc":"Bruges (about 40,000 to 46,000) was the market of northern Europe: brokers and hostellers who were also bankers hosted foreign merchants, and the 'bourse' took its name from the Van der Beurse inn. When the Zwin channel silted and Antwerp offered better terms the market moved: a hub's advantage is an equilibrium, not a resource.","chokepoint":false,"part":"12","parts":["12"]},{"id":"droving","label":"Long-distance droving","domain":"transport","kind":"practice","start":1300,"date_src":"general","place":"Wales and Scotland to London","paradigm":"feudal_manorial","desc":"Drovers walked cattle and sheep hundreds of miles from the uplands to fattening grounds and London, the outer ring of von Thünen's pattern: animals carry themselves to market.","chokepoint":false,"part":"04","parts":["04"]},{"id":"firewood_ring","label":"City firewood ring","domain":"energy","kind":"practice","start":1300,"date_src":"part","place":"London region","paradigm":"feudal_manorial","desc":"The ring of coppice that heated a medieval city. London burned about 141,000 tons of wood fuel a year c.1300 [V], carted by land up to about 18 to 20 km [V]; [C] some 45,000 to 55,000 ha of coppice under rotation.","chokepoint":false,"part":"01","parts":["01"]},{"id":"mine_drainage","label":"Mine drainage (adits, pumps)","domain":"metals","kind":"infrastructure","start":1300,"date_src":"general","wide":1700,"place":"central European and English mines","paradigm":"feudal_manorial","desc":"As mines went deeper they needed adits, then pumps, then steam (m). Pumping mines was the Newcomen engine's first job, at about 4 kW [M, part 01].","chokepoint":false,"part":"03","parts":["03"]},{"id":"pedlars_chapmen","label":"Pedlars and chapmen","domain":"exchange","kind":"practice","start":1300,"date_src":"general","wide":1650,"place":"England and Europe","paradigm":"feudal_manorial","desc":"Walked village to village with a pack of small wares (pins, ribbons, needles, cheap print); a mass trade in 17th and 18th century England.","chokepoint":false,"part":"04","parts":["04"]},{"id":"reckoning_days","label":"Reckoning days between neighbours","domain":"exchange","kind":"practice","start":1300,"date_src":"general","place":"Medieval and early modern England","paradigm":"feudal_manorial","desc":"Neighbours kept running accounts in memory, chalk, notches or books and met to reckon at intervals (quarter days, after harvest), cancelling mutual debts and settling only the balance in coin, goods or a new bond. Clearing between neighbours saved scarce coin.","chokepoint":false,"part":"04","parts":["04"]},{"id":"venice_mude","label":"Venetian galley convoys","domain":"transport","kind":"institution","start":1300,"date_src":"part","place":"Venice to Byzantium, the Levant, Flanders","paradigm":"commercial_city_state","desc":"State-owned galley convoys (mude) whose voyages were auctioned to merchant syndicates: a city of little land living by carrying and credit.","chokepoint":false,"part":"12","parts":["12"]},{"id":"wool_staple","label":"Wool export and the Staple","domain":"exchange","kind":"institution","start":1300,"date_src":"part","place":"England; the Staple at Calais","paradigm":"feudal_manorial","desc":"English wool exports ran to roughly 30,000 to 40,000 sacks a year at their early-14th-century height, several million fleeces [s, r], through merchants and the Staple to Flemish and Italian clothmakers. A chokepoint at the port and the tax; the customs paid for the Crown's wars.","chokepoint":true,"part":"02","parts":["02"]},{"id":"blue_and_white_ware","label":"Blue-and-white porcelain","domain":"materials","kind":"good","start":1320,"date_src":"general","place":"Jingdezhen","paradigm":"agrarian_empire","desc":"Underglaze cobalt-painted porcelain begun under the Yuan, sold to the court, Japan, Southeast Asia, the Islamic world (to Persian taste) and Europe after 1600.","chokepoint":false,"part":"11","parts":["11"]},{"id":"persian_cobalt","label":"Persian cobalt","domain":"materials","kind":"resource","start":1320,"date_src":"general","place":"Qamsar near Kashan, Persia","paradigm":"agrarian_empire","desc":"The blue of Yuan and Ming blue-and-white came from cobalt imported from Persia through Mongol and sea trade: the porcelain chain's one imported chokepoint. When supply failed potters used duller local cobalt, a substitute with a trade-off.","chokepoint":true,"part":"11","parts":["11"]},{"id":"double_entry","label":"Double-entry bookkeeping","domain":"information","kind":"technique","start":1340,"date_src":"part","place":"Genoa; Italy","paradigm":"commercial_city_state","desc":"Every transaction entered twice, as debit and credit, so accounts balance and errors show. Genoa's city accounts used it by 1340; Luca Pacioli printed a description in 1494 [s]. It let firms with many branches know their position.","chokepoint":false,"part":"04","parts":["04"]},{"id":"statute_of_labourers","label":"Statute of Labourers","domain":"institutions","kind":"institution","start":1349,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"After the Black Death the Ordinance (1349) and Statute of Labourers (1351) tried to hold wages at pre-plague levels and compel the able-bodied to work [checked]. Enforcement was patchy and it lapsed in effect by the 1370s; real farm wages rose about 64% by the 15th century (Clark) [checked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"broadcloth_export","label":"English broadcloth exports","domain":"textiles","kind":"industry","start":1350,"date_src":"part","wide":1540,"place":"English cloth districts","paradigm":"feudal_manorial","desc":"England wove its own wool: cloth exports rose from about 10,000 a year in 1349-50 to about 140,000 in 1539-40 (secondary summary). A sack of wool made about 4.3 broadcloths.","chokepoint":false,"part":"03","parts":["03"]},{"id":"hiring_fairs","label":"Hiring fairs","domain":"institutions","kind":"practice","start":1350,"date_src":"general","place":"England (Michaelmas, Martinmas)","paradigm":"early_modern_state","desc":"Yearly fairs where servants changed masters; the hiring fair of the village labour market, ancestor of the gig economy's digital one.","chokepoint":false,"part":"05","parts":["05"]},{"id":"insurance","label":"Marine insurance","domain":"exchange","kind":"institution","start":1350,"date_src":"part","place":"Italian maritime cities","paradigm":"commercial_city_state","desc":"Premiums paid to underwriters against loss at sea, from 14th-century Italy, then life insurance and annuities in the 17th century. Insurance took over the work of stores, kin and the parish.","chokepoint":false,"part":"05","parts":["05"]},{"id":"servants_in_husbandry","label":"Servants in husbandry","domain":"institutions","kind":"institution","start":1350,"date_src":"general","wide":1600,"place":"England and north-west Europe","paradigm":"early_modern_state","desc":"Unmarried young people hired by the year, living in the employer's house for board and a small wage. In 63 English parish listings (1574 to 1821) servants were 13.4% of the population and about 60% of those aged 15 to 24 [checked] (Kussmaul). A life stage that moved young labour where needed and let it save to marry.","chokepoint":false,"part":"05","parts":["05"]},{"id":"solar_sea_salt","label":"Bay salt (solar pans)","domain":"materials","kind":"industry","start":1350,"date_src":"general","wide":1450,"place":"Bay of Bourgneuf, Atlantic France","paradigm":"maritime_trading","desc":"Sea salt made by the sun in coastal pans; seawater is about 3.5% salt [M], too weak to boil cheaply. Atlantic bay salt undersold boiled salt for fish-curing [M].","chokepoint":false,"part":"01","parts":["01"]},{"id":"imperial_weaving_bureaus","label":"Imperial weaving bureaus","domain":"institutions","kind":"institution","start":1368,"date_src":"general","place":"Suzhou, Hangzhou, Nanjing","paradigm":"agrarian_empire","desc":"State silk workshops in the brocade cities under the Ming and Qing: one of several social forms (households, city workshops, bureaus) for the same cloth chain.","chokepoint":false,"part":"11","parts":["11"]},{"id":"imperial_kiln","label":"Imperial kiln","domain":"institutions","kind":"institution","start":1369,"date_src":"part","place":"Jingdezhen","paradigm":"agrarian_empire","desc":"Founded in 1369 or 1402 among hundreds of private kilns, it made the state a quality-setting customer: it commissioned designs, drew the best workers and passed its rejects to the market.","chokepoint":false,"part":"11","parts":["11"]},{"id":"quarantine","label":"Plague quarantine","domain":"institutions","kind":"practice","start":1377,"date_src":"general","place":"Ragusa; Venice","paradigm":"commercial_city_state","desc":"Isolation of ships and travellers against plague; with other measures plague left western Europe by the 1720s.","chokepoint":false,"part":"05","parts":["05"]},{"id":"demesne_leasing","label":"Leasing the demesne","domain":"institutions","kind":"institution","start":1380,"date_src":"part","place":"England","paradigm":"feudal_manorial","desc":"From the late 14th century lords leased their demesnes for years at money rent, creating the tenant farmers of the early modern period. After the Black Death rents fell and tenants who stayed held more land on better terms.","chokepoint":false,"part":"05","parts":["05"]},{"id":"baltic_grain_trade","label":"Baltic grain trade","domain":"exchange","kind":"practice","start":1400,"date_src":"general","wide":1650,"place":"Poland and Prussia to Amsterdam","paradigm":"early_modern_state","desc":"Grain, timber, flax and potash from the Baltic lands to Amsterdam, the Dutch 'mother trade', for cloth, salt, herring and colonial goods. It needed cheap bulk ships, credit and passage through the Sound.","chokepoint":false,"part":"01","parts":["01","04"]},{"id":"cast_iron","label":"Cast pig iron","domain":"metals","kind":"good","start":1400,"date_src":"part","wide":1600,"place":"Europe (earlier in China)","paradigm":"feudal_manorial","desc":"Liquid iron from the blast furnace, carbon-rich and brittle, good for guns and pots. A charcoal furnace took about 8 t of wood for 2 t of charcoal to smelt 1 t of pig (cited).","chokepoint":false,"part":"03","parts":["03"]},{"id":"copyhold","label":"Copyhold tenure","domain":"institutions","kind":"institution","start":1400,"date_src":"general","place":"England","paradigm":"early_modern_state","desc":"Customary tenure after serfdom: the title a copy of the court-roll entry, protected by royal courts by the 16th century, held for lives, by inheritance or at will, with entry fines as the lord's lever.","chokepoint":false,"part":"05","parts":["05"]},{"id":"european_marriage_pattern","label":"European marriage pattern","domain":"institutions","kind":"practice","start":1400,"date_src":"general","place":"West of Trieste-St Petersburg","paradigm":"early_modern_state","desc":"Late marriage (women about 24 to 26), 10 to 20% never marrying and a new household on marriage (Hajnal) [checked]. It needed service as a life stage and neolocal norms, and tied population to wages: Malthus's preventive check through an institution.","chokepoint":false,"part":"05","parts":["05"]},{"id":"hopped_beer","label":"Hopped beer","domain":"food","kind":"technique","start":1400,"date_src":"part","place":"Low Countries to England","paradigm":"commercial_city_state","desc":"Hops make beer that keeps for weeks or months, so brewing could grow larger, more capitalised and male [c, Bennett]. A paradigm switch: keeping, then scale, then capital.","chokepoint":false,"part":"02","parts":["02"]},{"id":"kula_ring","label":"Kula ring","domain":"exchange","kind":"institution","start":1400,"date_src":"general","place":"Massim islands, Melanesia","paradigm":"gift_economy","desc":"Shell necklaces and armbands circulated in opposite directions around a ring of islands (Malinowski, 1922), carrying rank and partnership. Practical barter (gimwali) went on beside them: ceremonial exchange made the peace that let ordinary trade happen.","chokepoint":false,"part":"04","parts":["04"]},{"id":"mining_shares","label":"Mine shares (Kuxe)","domain":"exchange","kind":"institution","start":1400,"date_src":"general","place":"Saxony and Bohemia","paradigm":"feudal_manorial","desc":"Joint ownership of a mine in parts, an early home of shares and investors (m). Deeper mines needed drainage capital no one miner had.","chokepoint":false,"part":"03","parts":["03"]},{"id":"mulberry_dike_fishpond","label":"Mulberry-dike fish ponds","domain":"food","kind":"practice","start":1400,"date_src":"general","place":"Pearl River delta; Lake Tai","paradigm":"agrarian_empire","desc":"Ponds dug for fish, the spoil heaped into dikes planted with mulberry, leaves fed to silkworms, their droppings to the fish, and pond mud dredged back onto the dikes: joint products closed into a loop at landscape scale.","chokepoint":false,"part":"11","parts":["11"]},{"id":"pochteca","label":"Pochteca merchant guild","domain":"exchange","kind":"institution","start":1400,"date_src":"general","place":"Tenochtitlan","paradigm":"agrarian_empire","desc":"A hereditary guild of long-distance merchants with its own courts, who traded far beyond the empire and spied for it.","chokepoint":false,"part":"11","parts":["11"]},{"id":"putting_out","label":"Putting-out system","domain":"institutions","kind":"institution","start":1400,"date_src":"general","wide":1700,"place":"Flanders, England, Germany","paradigm":"early_modern_state","desc":"A merchant gives wool or flax to rural households who spin and weave at home for piece wages in the farm's slack season. It rested on the winter slack of the labour calendar; Mendels argued it loosened the link between land and marriage [contested].","chokepoint":false,"part":"05","parts":["05"]},{"id":"ropewalk","label":"Ropewalk","domain":"textiles","kind":"infrastructure","start":1400,"date_src":"general","wide":1700,"place":"naval ports of Europe","paradigm":"early_modern_state","desc":"A long shed where hemp was laid into rope; capital sunk in one long building. It paid only for navies and merchant fleets.","chokepoint":false,"part":"01","parts":["01"]},{"id":"herring_buss","label":"Dutch herring buss","domain":"food","kind":"technique","start":1415,"date_src":"general","wide":1600,"place":"Holland","paradigm":"maritime_trading","desc":"A decked vessel of about 15 crew on a 50 ft keel that gutted and salted herring at sea in barrels, so it could stay out for weeks (cited); fleets of 400 to 500 (cited). Its assembly (Biscay salt, barrels, hemp nets, Baltic timber) tied the Dutch economy to half of Europe.","chokepoint":false,"part":"03","parts":["03"]},{"id":"lazaretto","label":"Lazaretto quarantine","domain":"institutions","kind":"institution","start":1423,"date_src":"part","place":"Venice","paradigm":"commercial_city_state","desc":"Plague orders and quarantine in an island hospital, Venice's lazaretto of 1423: public health before sanitation, at the port.","chokepoint":false,"part":"12","parts":["12"]},{"id":"aztec_tribute","label":"Aztec tribute schedules","domain":"institutions","kind":"institution","start":1428,"date_src":"part","place":"Triple Alliance, Basin of Mexico","paradigm":"agrarian_empire","desc":"The Codex Mendoza records the tribute of 38 or 39 provinces on fixed schedules: maize, beans, cacao, cotton cloaks by the tens of thousands (rough), feathers, jade, gold, paper, lime and timber. Much was redistributed or sold.","chokepoint":false,"part":"11","parts":["11"]},{"id":"ming_silver_by_weight","label":"Ming uncoined silver","domain":"exchange","kind":"good","start":1430,"date_src":"general","place":"Ming China","paradigm":"agrarian_empire","desc":"After paper lost trust the Ming returned in the 15th century to copper and above all to uncoined silver by weight. This made China the world's silver sink; gold:silver stood about 1:6 in China against 1:12 in Spain c.1600.","chokepoint":false,"part":"11","parts":["11"]},{"id":"tlatelolco_market","label":"Tlatelolco market","domain":"exchange","kind":"institution","start":1430,"date_src":"general","place":"Tlatelolco, Tenochtitlan","paradigm":"agrarian_empire","desc":"Cortes reported 'more than sixty thousand' buying and selling daily (a conquistador's estimate; others say 20,000 to 25,000). Goods were sold by count and measure in streets by kind under judges sitting in the market.","chokepoint":false,"part":"11","parts":["11"]},{"id":"inca_mita","label":"Inca mit'a labour tax","domain":"institutions","kind":"institution","start":1438,"date_src":"part","place":"Andes (Tawantinsuyu)","paradigm":"agrarian_empire","desc":"Households owed turns of labour, not goods (farming state and temple land, herding, building, soldiering, carrying), organised by local lords (kurakas). The state fed workers while they worked, with food and maize beer at feasts: hospitality as payment.","chokepoint":false,"part":"11","parts":["11"]},{"id":"inca_staple_finance","label":"Inca staple finance","domain":"exchange","kind":"institution","start":1438,"date_src":"part","place":"Inca empire","paradigm":"agrarian_empire","desc":"The state paid in food and fine cloth (woven by aqllakuna) from its own stores rather than in money (D'Altroy and Earle), ruling perhaps 6 to 14 million people (contested) without markets or money. The strongest case that storage, roads, records and a labour obligation can coordinate a large society.","chokepoint":false,"part":"11","parts":["11"]},{"id":"qhapaq_nan","label":"Qhapaq Nan road system","domain":"transport","kind":"infrastructure","start":1438,"date_src":"part","place":"the Andes","paradigm":"agrarian_empire","desc":"Some 30,000 to 40,000 km of roads (estimates 23,000 to 60,000) with way stations (tambos) a day apart, stocked from the storehouses, and relay runners (chasqui).","chokepoint":false,"part":"11","parts":["11"]},{"id":"qollqa_storehouses","label":"Qollqa storehouses","domain":"building","kind":"infrastructure","start":1438,"date_src":"part","place":"Huanuco Pampa; Cotapachi","paradigm":"agrarian_empire","desc":"Rows of storehouses on cool, windy hillsides near state centres: Huanuco Pampa had 497, mostly of highland tubers; Cotapachi about 2,400 (reported). They stocked way stations and paid workers and soldiers; the Spanish found them full.","chokepoint":false,"part":"11","parts":["11"]},{"id":"atlantic_sugar_plantation","label":"Atlantic sugar plantation","domain":"food","kind":"industry","start":1450,"date_src":"part","wide":1640,"place":"Madeira, Sao Tome, Brazil, the Caribbean","paradigm":"plantation_slave","desc":"Sugar moved via Cyprus to Madeira (1450s), Sao Tome, Brazil (leading producer from the later 16th century) and the Caribbean (from the 1640s): cane field, roller mill and a boiling house of copper kettles under one command, worked by enslaved Africans in gangs and burning fuel in vast amounts. The cane's need for immediate crushing made the plantation.","chokepoint":false,"part":"11","parts":["11"]},{"id":"enclosure","label":"Enclosure","domain":"institutions","kind":"institution","start":1450,"date_src":"part","wide":1800,"place":"England","paradigm":"early_modern_state","desc":"Open fields and commons replaced by hedged holdings in severalty, by agreement and lords from the 15th century and by about 4,000 Acts covering a fifth of England, mostly 1750 to 1830 [s, r]. Heldring, Robinson and Vollmer find yields up ~45% by 1830 and land inequality up [c]; cottagers lost common rights.","chokepoint":false,"part":"02","parts":["02","05"]},{"id":"enclosure_for_sheep","label":"Enclosure for sheep","domain":"institutions","kind":"institution","start":1450,"date_src":"part","wide":1550,"place":"Midland England","paradigm":"early_modern_state","desc":"Arable and commons turned to fenced sheepwalk in 15th- and 16th-century England ('sheep eat men'). Statutes against depopulation failed where wool paid.","chokepoint":false,"part":"01","parts":["01"]},{"id":"pawnbroking","label":"Pawnbroking and monti di pieta","domain":"exchange","kind":"institution","start":1462,"date_src":"part","place":"Perugia, Italy","paradigm":"commercial_city_state","desc":"A good handed over as security for a loan: Lombard and Jewish pawnbrokers in medieval Europe, then Franciscan charitable pawn banks (monti di pietà) from Perugia in 1462 [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"intellectual_property","label":"Patents and copyright","domain":"institutions","kind":"institution","start":1474,"date_src":"part","place":"Venice; England","paradigm":"commercial_city_state","desc":"Venice's patent statute (1474), England's Statute of Monopolies (1624), copyright from the Statute of Anne (1710) [unchecked]. Ideas are non-rival, so property in them is wholly an institution: a monopoly for a term as reward for invention.","chokepoint":false,"part":"05","parts":["05"]},{"id":"brass_manillas","label":"Brass manillas","domain":"metals","kind":"good","start":1480,"date_src":"general","place":"Benin, West Africa","paradigm":"early_modern_state","desc":"Brass bracelets brought by the Portuguese by the tens of thousands and melted down to cast Benin's later bronzes.","chokepoint":false,"part":"11","parts":["11"]},{"id":"finery_forge","label":"Charcoal finery forge","domain":"metals","kind":"technique","start":1490,"date_src":"part","wide":1600,"place":"the Weald, Forest of Dean, Shropshire","paradigm":"early_modern_state","desc":"Pig iron from the charcoal blast furnace was refined in a charcoal finery to bar iron under a water hammer. Each furnace needed the coppice of thousands of acres [R], so output was capped near 25,000 tons a year about 1720 [R] and much bar iron came from Sweden and Russia.","chokepoint":false,"part":"03","parts":["03","07"]},{"id":"banjara_caravans","label":"Banjara bullock caravans","domain":"transport","kind":"practice","start":1500,"date_src":"general","place":"Mughal India","paradigm":"agrarian_empire","desc":"Caste caravanners moving grain with pack bullocks in herds of thousands; Peter Mundy reported about 14,000 laden oxen in one train in 1632 (reported).","chokepoint":false,"part":"11","parts":["11"]},{"id":"convertible_husbandry","label":"Convertible (ley) husbandry","domain":"food","kind":"practice","start":1500,"date_src":"part","place":"English Midlands","paradigm":"early_modern_state","desc":"Fields alternate several years of grain with several of grass, carrying more stock and more grain at once; yields up perhaps a third [r]. It needed control of one's land, fences and stock; Kerridge called it the real agricultural revolution [s, r].","chokepoint":false,"part":"02","parts":["02"]},{"id":"field_liming","label":"Liming fields","domain":"food","kind":"technique","start":1500,"date_src":"general","place":"England and Europe","paradigm":"early_modern_state","desc":"Limestone burned in kilns to quicklime and spread on acid soils; it needs a kiln and much fuel [r], tying farming to the fuel and building chains.","chokepoint":false,"part":"02","parts":["02"]},{"id":"grass_bleachfields","label":"Grass bleachfields","domain":"textiles","kind":"practice","start":1500,"date_src":"general","place":"bleachfields near European cloth towns","paradigm":"early_modern_state","desc":"In the organic economy cloth was bleached with lye from wood or kelp ash, soured in buttermilk, and laid on grass in the sun for weeks to months. When machine output rose many times, bleaching (land, months, ash) became the bottleneck.","chokepoint":true,"part":"07","parts":["07"]},{"id":"kelp_barilla","label":"Kelp and barilla ash","domain":"materials","kind":"good","start":1500,"date_src":"general","place":"Scottish and Irish shores; Spain","paradigm":"early_modern_state","desc":"Soda ash from burned seaweed (kelp) and Spanish saltwort (barilla) [M]. With wood ash, one of three land- and shore-based alkali chains that the Leblanc process replaced.","chokepoint":false,"part":"01","parts":["01"]},{"id":"nailers_cutlers","label":"Nailers and cutlers","domain":"metals","kind":"industry","start":1500,"date_src":"general","wide":1700,"place":"Black Country and Sheffield","paradigm":"early_modern_state","desc":"Metal trades among the first organised on putting-out lines (m): a merchant's iron worked at home by the piece.","chokepoint":false,"part":"03","parts":["03"]},{"id":"smithfield_droving","label":"Droving to Smithfield","domain":"food","kind":"practice","start":1500,"date_src":"general","place":"Scotland, Wales, the north to London","paradigm":"early_modern_state","desc":"Cattle and sheep walked from Scotland, Wales and the north, fattened in the Midlands and Home Counties and slaughtered in the city: 76,210 cattle and 514,700 sheep in 1732 (Youatt), about 1.7 million animals a year by the 1820s.","chokepoint":false,"part":"12","parts":["12"]},{"id":"atlantic_slave_trade","label":"Atlantic slave trade","domain":"institutions","kind":"institution","start":1501,"date_src":"part","wide":1700,"place":"West Africa to the Americas","paradigm":"plantation_slave","desc":"About 12.5 million Africans embarked across the Atlantic from 1501 to 1866, about 10.7 million surviving the crossing, mostly for sugar. Indian cloth was a main currency exchanged for captives; the collapse of the American population from Old World disease (about 56 million deaths by 1600, contested in detail) was the precondition of the colonial economy.","chokepoint":false,"part":"05","parts":["05","11"]},{"id":"portuguese_cartaz","label":"Portuguese cartaz passes","domain":"institutions","kind":"institution","start":1502,"date_src":"general","place":"Indian Ocean","paradigm":"maritime_trading","desc":"After 1498 the Portuguese sold passes to Indian Ocean shippers at gunpoint: selling protection, not goods, breaking the pattern of open emporia.","chokepoint":false,"part":"11","parts":["11"]},{"id":"maize_old_world","label":"Maize in the Old World","domain":"food","kind":"good","start":1520,"date_src":"general","place":"Africa, southern Europe, China's uplands","paradigm":"early_modern_state","desc":"An American crop that became a staple in Africa, southern Europe and China's uplands.","chokepoint":false,"part":"11","parts":["11"]},{"id":"silver_rupee","label":"Silver rupee","domain":"exchange","kind":"good","start":1540,"date_src":"part","place":"India (Sher Shah)","paradigm":"agrarian_empire","desc":"A coin of about 11 g of silver from the 1540s. India sold cloth and drew in the world's silver, and Mughal mint output swelled with American silver.","chokepoint":false,"part":"11","parts":["11"]},{"id":"woods_preservation_law","label":"Laws preserving the woods","domain":"institutions","kind":"institution","start":1543,"date_src":"part","place":"England","paradigm":"early_modern_state","desc":"State rules for fuel against timber: the 1543 Act for the Preservation of Woods [M] and bans on wood in glass furnaces (1615) [M]. They pushed fuel-hungry trades toward coal.","chokepoint":false,"part":"01","parts":["01"]},{"id":"potosi_silver","label":"Potosi silver","domain":"metals","kind":"industry","start":1545,"date_src":"part","place":"Cerro Rico, Potosi (Bolivia); Zacatecas (1546)","paradigm":"early_modern_state","desc":"Found in 1545; a city of perhaps 100,000 at 4,000 m (rough), fed by llama trains from valleys far below, with stamp mills on dammed lakes. Spanish America produced about 150,000 t of silver from 1500 to 1800, perhaps 80 per cent of world output.","chokepoint":true,"part":"11","parts":["11"]},{"id":"assumpsit","label":"Action of assumpsit","domain":"institutions","kind":"institution","start":1550,"date_src":"part","place":"England","paradigm":"early_modern_state","desc":"A 16th-century action that made informal promises enforceable in royal courts. Suing became the last resort that made the threat of default credible across long chains of informal credit.","chokepoint":false,"part":"05","parts":["05"]},{"id":"bill_endorsement","label":"Endorsement and discounting","domain":"exchange","kind":"practice","start":1550,"date_src":"part","place":"Antwerp","paradigm":"early_modern_state","desc":"In 16th-century Antwerp bills became transferable by endorsement and could be sold at a discount before due [s], making them close to money.","chokepoint":false,"part":"04","parts":["04"]},{"id":"dutch_peat_economy","label":"Dutch peat fuel economy","domain":"energy","kind":"industry","start":1550,"date_src":"part","wide":1650,"place":"Holland and Frisia","paradigm":"commercial_city_state","desc":"Bog peat cut in spring, dried in summer and moved by canal: stored land, many years of growth in each cut. The Dutch Golden Age ran on it [V] (contested as a sufficient cause); output fell about 20% in the 1660s [V, weakly sourced].","chokepoint":false,"part":"01","parts":["01"]},{"id":"great_rebuilding","label":"Great rebuilding in brick","domain":"building","kind":"practice","start":1550,"date_src":"part","wide":1650,"place":"England","paradigm":"early_modern_state","desc":"Houses rebuilt in brick and stone with chimneys, glazing and upper floors in the 16th and 17th centuries (m); brick became a mass good.","chokepoint":false,"part":"03","parts":["03"]},{"id":"ironmaster_wood_lease","label":"Ironmaster's woodland leases","domain":"institutions","kind":"institution","start":1550,"date_src":"part","wide":1650,"place":"Weald, Forest of Dean, Furness","paradigm":"early_modern_state","desc":"A furnace ran for months on the wood of about a three-mile radius (cited), so the ironmaster leased woods for miles and bought coppice on long rotations; colliers, cutters, carters and founders became a hired crew. The Weald made over 9,000 tons a year in the 1590s (cited).","chokepoint":false,"part":"03","parts":["03"]},{"id":"morvan_log_floating","label":"Morvan log floating","domain":"energy","kind":"practice","start":1550,"date_src":"part","place":"Morvan, Yonne and Seine to Paris","paradigm":"early_modern_state","desc":"Wood cut in the Morvan in winter was released down the streams in a spring flood when dams opened, sorted at Clamecy and rafted to Paris (about 3,000 rafts a year c.1700, 5,000 by c.1800). Paris burned about 830,000 steres c.1700 and 1.5 million by the 1780s (as summarised): a forest managed as a city's fuel ring at a distance land carriage forbids.","chokepoint":false,"part":"12","parts":["12"]},{"id":"sea_coal_trade","label":"London sea-coal trade","domain":"energy","kind":"industry","start":1550,"date_src":"part","place":"Newcastle to London by collier ship","paradigm":"early_modern_state","desc":"London burnt Newcastle coal shipped down the coast from the sixteenth century, because wood near the city ran short. By 1700 coal already fired brewing, salt and soap boiling, brick, lime and glass, so later industrial uses were grafted onto an existing chain. British output was about 3 million tons in 1700 [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"stage_wagon","label":"Stage wagons and carriers","domain":"transport","kind":"practice","start":1550,"date_src":"part","place":"England","paradigm":"early_modern_state","desc":"Regular wagon or pack services on fixed days between a town and London, carrying goods and letters for anyone who paid; listed in printed carrier guides from 1637 [s]. By the 18th century a stage wagon carried 3 to 4 t behind 6 to 8 horses on turnpikes.","chokepoint":false,"part":"04","parts":["04"]},{"id":"patio_process","label":"Potosi patio silver","domain":"metals","kind":"industry","start":1554,"date_src":"part","wide":1600,"place":"Potosi, Andes","paradigm":"agrarian_empire","desc":"After 1572 Potosi's ores were refined by mercury amalgamation (patio) with mita labour (cited): chokepoint at the lode, assembly of ore, mercury, salt, fuel and labour. Its share of world silver is contested: 60 to 80% in the late 16th century by some estimates (contested).","chokepoint":true,"part":"03","parts":["03","11"]},{"id":"parish_road_repair","label":"Parish statute labour on roads","domain":"institutions","kind":"institution","start":1555,"date_src":"part","place":"England","paradigm":"early_modern_state","desc":"From 1555 English parishes had to repair their roads, each householder owing about six days' labour a year [unchecked]; it was done badly. A public good provided by compulsory labour, later replaced by tolled turnpikes.","chokepoint":false,"part":"04","parts":["04"]},{"id":"statute_of_artificers","label":"Statute of Artificers","domain":"institutions","kind":"institution","start":1563,"date_src":"part","place":"England","paradigm":"early_modern_state","desc":"Let justices of the peace set wages, made yearly hiring the norm and made seven years the minimum apprenticeship for crafts [unchecked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"huancavelica_mercury","label":"Huancavelica mercury","domain":"metals","kind":"resource","start":1564,"date_src":"general","wide":1600,"place":"Huancavelica, Peru","paradigm":"agrarian_empire","desc":"The mercury mine that fed Potosi's refining. With Potosi it put out more than a quarter of the mercury vapour emitted in Latin America from 1500 to 1800 (cited).","chokepoint":true,"part":"03","parts":["03"]},{"id":"coal_grate","label":"Coal grate","domain":"energy","kind":"technique","start":1570,"date_src":"part","wide":1650,"place":"London","paradigm":"early_modern_state","desc":"An iron grate and tall chimney for burning coal at home, from the late 16th century in London where coal was cheap by water [V]. Coal needed new grates, chimneys and processes before it could replace wood [V].","chokepoint":false,"part":"01","parts":["01"]},{"id":"potato_old_world","label":"Potato in the Old World","domain":"food","kind":"good","start":1570,"date_src":"general","place":"Europe, from the Andes","paradigm":"early_modern_state","desc":"Nunn and Qian credit the potato with about a quarter of Old World population and urban growth 1700 to 1900 (conservative); a critical review says a sixth to a quarter.","chokepoint":false,"part":"11","parts":["11"]},{"id":"single_whip_reform","label":"Single-whip silver tax","domain":"institutions","kind":"institution","start":1570,"date_src":"part","place":"Ming China","paradigm":"agrarian_empire","desc":"Reforms of the 1570s and 1580s turned taxes and labour service into payments in silver: a money tax that forced sales and drew in Japanese and American silver.","chokepoint":false,"part":"11","parts":["11"]},{"id":"spanish_dollar","label":"Spanish piece of eight","domain":"exchange","kind":"good","start":1570,"date_src":"general","place":"Potosi and Mexico mints","paradigm":"early_modern_state","desc":"The silver peso minted from American silver, the first global coin; Europe could pay for Asian goods mainly because it had American silver.","chokepoint":false,"part":"11","parts":["11"]},{"id":"manila_galleon","label":"Manila galleon","domain":"transport","kind":"institution","start":1571,"date_src":"part","place":"Acapulco to Manila","paradigm":"early_modern_state","desc":"Galleons from 1571 carried about 2 million pesos (50 t) of silver a year to Manila to buy silk and porcelain from Chinese junks. Flynn and Giraldez date the birth of a global economy to 1571.","chokepoint":false,"part":"11","parts":["11"]},{"id":"royal_exchange","label":"Royal Exchange","domain":"exchange","kind":"institution","start":1571,"date_src":"part","place":"London","paradigm":"early_modern_state","desc":"London's merchants' exchange of 1571, beside livery companies and later the Bank of England (1694) and Lloyd's.","chokepoint":false,"part":"12","parts":["12"]},{"id":"mita_draft","label":"Mita labour draft","domain":"institutions","kind":"institution","start":1572,"date_src":"general","place":"Andean highlands","paradigm":"agrarian_empire","desc":"A colonial draft that took about one in seven able-bodied men of the subject districts each year for the mines (cited). Coerced labour where the capital needed more hands than wages could draw.","chokepoint":false,"part":"03","parts":["03"]},{"id":"potosi_mita","label":"Potosi mita","domain":"institutions","kind":"institution","start":1572,"date_src":"part","place":"Potosi and seventeen provinces","paradigm":"early_modern_state","desc":"Viceroy Toledo turned the Inca mit'a into forced mine labour: about 13,000 to 14,000 men a year, a seventh of the eligible men, each working a year in the mines and mills. Its effects still show in household consumption in the supplying districts (Dell 2010).","chokepoint":false,"part":"11","parts":["11"]},{"id":"bill_clearing_fairs","label":"Exchange fairs for bills","domain":"exchange","kind":"institution","start":1579,"date_src":"part","place":"Piacenza (Genoese 'Besançon' fairs)","paradigm":"commercial_city_state","desc":"Fairs held four times a year that existed only to clear bills of exchange [s]: pure financial settlement without goods.","chokepoint":false,"part":"04","parts":["04"]},{"id":"collier_shipping","label":"Coastal collier fleet","domain":"transport","kind":"industry","start":1580,"date_src":"general","place":"North Sea coast","paradigm":"early_modern_state","desc":"Collier ships carrying coal down the coast; English coastal coal shipping cost about 0.8 pence a ton-km in 1700 and 0.4 by 1785 (Clark and Jacks), far below road haulage.","chokepoint":false,"part":"12","parts":["12"]},{"id":"london_sea_coal","label":"London sea-coal trade","domain":"energy","kind":"industry","start":1580,"date_src":"part","place":"Tyne and Wear to London","paradigm":"early_modern_state","desc":"Coal dug on Tyneside, carried in keels to colliers, shipped down the coast, unloaded by coal-heavers, measured by sworn meters and sold on the Coal Exchange: about 450,000 t a year by 1700 (rough), about 1 t a head in 1850 and 2.5 t in 1890. A monopoly at the source port, a pulse with sailing season and war, a tax at the city end and smoke on every
