<style>
/* Layout: a full-height workbench. Top: name, view tabs, the year scrubber with a depth sparkline.

:root{
  --bg:#ECF0EE; --surface:#F7F9F8; --ink:#16201C; --muted:#5A6964; --rule:#CBD5D1;
  --lane-a:#E4EAE7; --lane-b:#ECF0EE; --accent:#0E5D6B; --needs:#B0531B; --unlocks:#16798F;
  --switch:#9B3770; --by:#8C6A06; --locked:#A7B3AE; --edge:#3F4D48;
  --d-energy:#C0561C; --d-food:#55862B; --d-materials:#86683A; --d-metals:#476580; --d-textiles:#9E437A;
  --d-building:#71569E; --d-transport:#238585; --d-exchange:#A47F0B; --d-institutions:#9A3A3A; --d-information:#3559BC;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#151D1A; --ink:#E2EAE6; --muted:#93A39D; --rule:#2A3531;
  --lane-a:#131B18; --lane-b:#0F1513; --accent:#5DC2D2; --needs:#EA955C; --unlocks:#5DC2D2;
  --switch:#E07AB4; --by:#D9B44A; --locked:#4A5853; --edge:#B5C3BE;
  --d-energy:#EE8A50; --d-food:#8DC064; --d-materials:#C9A36B; --d-metals:#8AAAC8; --d-textiles:#DA7FB4;
  --d-building:#AE93DA; --d-transport:#5FC4C4; --d-exchange:#DDB84A; --d-institutions:#E07C7C; --d-information:#7F9CF0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#151D1A; --ink:#E2EAE6; --muted:#93A39D; --rule:#2A3531;
  --lane-a:#131B18; --lane-b:#0F1513; --accent:#5DC2D2; --needs:#EA955C; --unlocks:#5DC2D2;
  --switch:#E07AB4; --by:#D9B44A; --locked:#4A5853; --edge:#B5C3BE;
  --d-energy:#EE8A50; --d-food:#8DC064; --d-materials:#C9A36B; --d-metals:#8AAAC8; --d-textiles:#DA7FB4;
  --d-building:#AE93DA; --d-transport:#5FC4C4; --d-exchange:#DDB84A; --d-institutions:#E07C7C; --d-information:#7F9CF0;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--rule);padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px}
.headrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0;min-width:0;flex:1 1 320px}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--rule);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:4px 10px;border-radius:5px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.controls{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.yearbox{display:flex;align-items:center;gap:8px;flex:1 1 420px;min-width:0}
.yr{font:500 15px var(--f-mono);min-width:92px;font-variant-numeric:tabular-nums}
.scrub{position:relative;flex:1;min-width:160px;height:38px}
.scrub svg{position:absolute;inset:0;width:100%;height:100%}
.scrub input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.scrub input:focus-visible + .focusring{outline:2px solid var(--accent);outline-offset:2px}
.focusring{position:absolute;inset:0;border-radius:4px;pointer-events:none}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 12px var(--f-body);padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:500 11px var(--f-body);padding:3px 7px 3px 6px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.chip[aria-pressed="false"]{opacity:.42}
input[type=search]{border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:13px var(--f-body);padding:5px 9px;border-radius:6px;width:190px}
.stat{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:500}
main{flex:1;min-height:0;display:flex;position:relative}
.stage{flex:1;min-width:0;position:relative;overflow:hidden}
#web{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#web:active{cursor:grabbing}
.zoombtns{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.zoombtns .btn{width:32px;padding:5px 0;font-size:15px}
aside{width:380px;flex:0 0 380px;background:var(--surface);border-left:1px solid var(--rule);overflow:auto;padding:16px 18px 24px;min-width:0}
aside h2{font-family:var(--f-display);font-stretch:105%;font-weight:700;font-size:21px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
aside h3{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
aside p{margin:0 0 10px;max-width:65ch}
.meta{font:12px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);padding:2px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--rule)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.badge.choke{color:var(--needs);border-color:var(--needs)}
.rel{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.rel li{display:grid;grid-template-columns:64px 1fr;gap:6px;align-items:baseline;padding:3px 4px;border-radius:4px;cursor:pointer}
.rel li:hover{background:var(--bg)}
.rel .t{font:10px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.rel .t.replaces{color:var(--switch)} .rel .t.byproduct{color:var(--by)}
.rel .n{font-weight:500} .rel .note{display:block;color:var(--muted);font-size:12px;font-weight:400}
.modes{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 2px}
.modes .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px}
.legend svg{display:block}
.close{display:none}
.src{font-size:12px;color:var(--muted)}
.src a,aside a{color:var(--accent)}
.caveat{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;margin-top:16px}
/* svg */
.lane-bg.a{fill:var(--lane-a)} .lane-bg.b{fill:var(--lane-b)}
.lane-label{font:600 11px var(--f-body);fill:var(--ink);letter-spacing:.02em}
.lane-count{font:10px var(--f-mono);fill:var(--muted)}
.lanecol{fill:var(--surface)} .colrule{stroke:var(--rule)}
.topband{fill:var(--surface)} .tick line{stroke:var(--rule)} .tick text{font:10px var(--f-mono);fill:var(--muted)}
.gridline{stroke:var(--rule);stroke-dasharray:2 4}
.edge{fill:none;stroke:var(--edge);stroke-opacity:.13;stroke-width:1}
.edge.enables{stroke-opacity:.09}
.edge.replaces{stroke:var(--switch);stroke-opacity:.45;stroke-dasharray:5 3;stroke-width:1.3}
.edge.byproduct{stroke:var(--by);stroke-opacity:.45;stroke-dasharray:1.5 2.5;stroke-width:1.4}
.focus .edge{stroke-opacity:0}
.focus .edge.on{stroke-opacity:.85;stroke-width:1.6}
.focus .edge.on.needs{stroke:var(--needs)} .focus .edge.on.unlocks{stroke:var(--unlocks)}
.focus .edge.on.replaces{stroke:var(--switch)} .focus .edge.on.byproduct{stroke:var(--by)}
.node{cursor:pointer}
.node circle.dot{fill:var(--c);stroke:var(--surface);stroke-width:1.2}
.node.choke circle.dot{stroke:var(--ink);stroke-width:1.6}
.node text{font:500 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.node.locked circle.dot{fill:var(--bg);stroke:var(--locked);stroke-width:1.2}
.node.locked text{fill:var(--locked)}
.focus .node{opacity:.18} .focus .node.rel-on{opacity:1}
.node.sel circle.dot{stroke:var(--ink);stroke-width:2.4}
.node.sel text{font-weight:700}
.ring{fill:none;stroke:var(--c);stroke-width:2;opacity:0;pointer-events:none}
.node.pop .ring{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:.9;r:4}100%{opacity:0;r:22}}
@media (prefers-reduced-motion: reduce){.node.pop .ring{animation:none}}
.nowline{stroke:var(--accent);stroke-width:1.5}
.nowlab{font:600 10px var(--f-mono);fill:var(--accent)}
.pbar{cursor:pointer}
.pbar path{fill:var(--surface);stroke:var(--muted);stroke-width:1.3}
.pbar.branch path{stroke-dasharray:2 1.5}
.pbar text{font:600 10px var(--f-body);fill:var(--muted)}
.pbar.live path{fill:var(--accent);stroke:var(--accent)} .pbar.live text{fill:var(--ink)}
.pbar.ended path{fill:none;stroke:var(--locked)} .pbar.ended text{fill:var(--locked);text-decoration:line-through}
.pbar.sel path{stroke:var(--ink);stroke-width:2.5} .pbar.sel text{fill:var(--ink);font-weight:700}
.pbar:hover text{fill:var(--ink)}
.tracklab{font:600 10px var(--f-body);letter-spacing:.08em;fill:var(--muted)}
/* societies view */
.socwrap{position:absolute;inset:0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.socwrap h3{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.socsvg{display:block}
.sbar rect{fill:var(--surface);stroke:var(--muted)} .sbar.branch rect{stroke-dasharray:4 3}
.sbar{cursor:pointer} .sbar:hover rect{stroke:var(--accent);stroke-width:2} .sbar.sel rect{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:2}
.sbar text{font:600 12px var(--f-body);fill:var(--ink)} .sbar .eng{font:10px var(--f-mono);fill:var(--muted)}
.trans{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-opacity:.45}
.trans-hit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
.collapse line{stroke:var(--needs);stroke-dasharray:3 3} .collapse text{font:600 10px var(--f-body);fill:var(--needs)}
.theories{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px 18px;max-width:1200px}
.theories div{min-width:0} .theories b{font-family:var(--f-display);font-stretch:105%} .theories p{margin:2px 0;font-size:13px}
.theories .crit{color:var(--muted)}
@media (max-width:760px){
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;flex:none;max-height:58%;border-left:0;border-top:1px solid var(--rule);
    box-shadow:0 -8px 24px rgba(0,0,0,.18);z-index:20;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  aside.shut{display:none}
  .close{display:inline-block;position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:10px}
  input[type=search]{width:140px}
  .sub{display:none} #stat{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px} .chip{flex:0 0 auto}
  .yearbox{flex-basis:100%}
}
</style>

<script id="econ-data" type="application/json">{"nodes":[{"id":"foraging","label":"Foraging","domain":"food","kind":"practice","start":-2600000,"date_src":"general","place":"Africa, then worldwide","paradigm":"foraging","desc":"Bands of about 25 to 30 people [firm] moving over territories, taking wild food and sharing most of it. Diet-breadth logic ranks foods by return: big game ~16,000 to 31,000 kcal an hour once found, small seeds ~300 to 1,300 [rough], so lower foods join the diet only as the best run short.","chokepoint":false,"part":"10","parts":["10"]},{"id":"stone_tools","label":"Stone tools (Oldowan)","domain":"materials","kind":"technique","start":-2600000,"date_src":"part","place":"Ledi-Geraru and Gona, Ethiopia","paradigm":"foraging","desc":"Sharp flakes knocked off cobbles, for butchering large carcasses and reaching marrow. At Nyayanga chosen cobbles were carried up to 13 km [firm]; knapping is long skill on a chokepoint, since fine-grained stone is patchy.","chokepoint":false,"part":"10","parts":["10"]},{"id":"hunting","label":"Hunting","domain":"food","kind":"practice","start":-2000000,"date_src":"part","place":"Africa","paradigm":"foraging","desc":"From scavenging carcasses with clubs and stones (>2 Ma) to spears, bows, nets and dogs (well before 15 ka [contested]). Men target big game partly for prestige (Hawkes 1991); the kill is pooled across the band.","chokepoint":false,"part":"10","parts":["10"]},{"id":"acheulean_handaxe","label":"Acheulean hand-axe","domain":"materials","kind":"technique","start":-1760000,"date_src":"part","place":"East Africa","paradigm":"foraging","desc":"A planned shape worked on both faces: an all-purpose tool unchanged for a million years. Stone usually local (under ~20 km) but chosen for quality.","chokepoint":false,"part":"10","parts":["10"]},{"id":"fire","label":"Fire use","domain":"energy","kind":"technique","start":-1000000,"date_src":"part","wide":-350000,"place":"Wonderwerk Cave, South Africa","paradigm":"foraging","desc":"Burnt bone and ash ~1.0 Ma [contested]; repeated hearths ~790 ka and habitual fire ~400 to 300 ka. The first general-purpose hub: cooking, heat treatment, glue, smoking, plaster, pottery, salt and metal all pass through a hearth or kiln.","chokepoint":false,"part":"10","parts":["10"]},{"id":"cooking","label":"Cooking","domain":"food","kind":"practice","start":-400000,"date_src":"part","place":"Qesem Cave and European sites","paradigm":"foraging","desc":"Cooking gelatinises starch and softens fibre, so the same food yields more energy (Carmody et al. 2011) [firm for the effect; size in humans rough]. It made tubers and seeds worth eating; its cost is fuel, which pushes camps to move.","chokepoint":false,"part":"10","parts":["10"]},{"id":"wood_fuel","label":"Firewood","domain":"energy","kind":"resource","start":-400000,"date_src":"general","paradigm":"foraging","place":"","desc":"Wood burned as fuel, the main source of heat until coal; one to two tonnes a person a year in organic economies (part 01). (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"wooden_spears","label":"Wooden spears","domain":"food","kind":"technique","start":-400000,"date_src":"part","place":"Clacton, England; Schoningen, Germany","paradigm":"foraging","desc":"Thrust or thrown 10 to 20 m; needs straight young trees and a stone tool to shape them. Schoningen's eight or more spears, long dated ~300 ka, were re-dated in 2025 to ~200 ka [contested date].","chokepoint":false,"part":"10","parts":["10"]},{"id":"hafting_composite_tools","label":"Hafted composite tools","domain":"materials","kind":"technique","start":-300000,"date_src":"part","place":"Africa and Eurasia","paradigm":"foraging","desc":"Stone point, wooden shaft, glue and binding assembled from three or four chains. It opened stone-tipped spears, later the bow, and blades set in a haft as sickles.","chokepoint":false,"part":"10","parts":["10"]},{"id":"ochre","label":"Ochre","domain":"materials","kind":"resource","start":-300000,"date_src":"general","place":"southern Africa; Australia (Wilgie Mia, Parachilna)","paradigm":"foraging","desc":"Iron-oxide pigment used in glues, on bodies and in ceremony, and carried hundreds of km along Aboriginal kin routes [distances rough]. The part lists ochre with good stone and water as forager chokepoints; quarries were owned by one group.","chokepoint":true,"part":"10","parts":["10"]},{"id":"prepared_core_levallois","label":"Prepared-core (Levallois) flaking","domain":"materials","kind":"technique","start":-300000,"date_src":"part","place":"Olorgesailie, Kenya","paradigm":"foraging","desc":"A core shaped so one blow gives a planned flake, making points for hafting. At Olorgesailie obsidian came from 25 to 95 km away ~300 ka [firm].","chokepoint":false,"part":"10","parts":["10"]},{"id":"stone_tipped_spears","label":"Stone-tipped spears","domain":"food","kind":"technique","start":-300000,"date_src":"part","place":"Kathu Pan, South Africa","paradigm":"foraging","desc":"Stone, shaft, glue and binding assembled into a point that wounds deeper. Claimed ~500 ka at Kathu Pan [contested]; common by ~300 ka.","chokepoint":false,"part":"10","parts":["10"]},{"id":"birch_tar_adhesive","label":"Birch tar and gum glues","domain":"materials","kind":"technique","start":-200000,"date_src":"part","place":"Italy (Neanderthals); South Africa","paradigm":"foraging","desc":"Birch tar from ~200 ka, made by heating bark; gum-and-ochre glues ~70 ka in South Africa. One of the first uses of fire to make a material, and the joint of every hafted tool.","chokepoint":false,"part":"10","parts":["10"]},{"id":"demand_sharing","label":"Demand sharing and risk pooling","domain":"institutions","kind":"institution","start":-200000,"date_src":"general","place":"Hadza, !Kung, Ache (ethnographic)","paradigm":"foraging","desc":"Food is shared because others ask, and refusing shames; big chancy kills are pooled while plant food is kept. Among the Ache most of a hunter's kill is eaten outside his family: the band as an insurance pool.","chokepoint":false,"part":"05","parts":["05","10"]},{"id":"heat_treated_stone","label":"Heat-treated stone","domain":"materials","kind":"technique","start":-164000,"date_src":"part","place":"Pinnacle Point, South Africa","paradigm":"foraging","desc":"Silcrete heated to ~350 C flakes better: the first use of fire to change a material. The bottom rung of the pyrotechnology ladder.","chokepoint":false,"part":"10","parts":["10"]},{"id":"shellfish_gathering","label":"Shellfish gathering","domain":"food","kind":"practice","start":-164000,"date_src":"part","place":"Pinnacle Point, South Africa","paradigm":"foraging","desc":"Shellfish as a staple ~164 ka (Marean et al. 2007) [firm]: predictable, low risk, gathered by anyone. Holocene coasts grew great shell middens (Jomon, Ertebolle, sambaquis).","chokepoint":false,"part":"10","parts":["10"]},{"id":"reverse_dominance","label":"Reverse dominance hierarchy","domain":"institutions","kind":"practice","start":-100000,"date_src":"general","place":"Forager bands","paradigm":"foraging","desc":"Foragers keep promises by repeated dealing, gossip, ridicule, sharing withdrawn and exit; the group levels anyone who tries to dominate (Christopher Boehm). Order without a state, but trade with strangers barely possible.","chokepoint":false,"part":"05","parts":["05"]},{"id":"shell_beads","label":"Shell beads","domain":"exchange","kind":"good","start":-100000,"date_src":"part","place":"Skhul, Israel; Blombos, South Africa","paradigm":"foraging","desc":"Pierced Nassarius shell beads ~100 to 75 ka: among the first goods moved far, being light, durable, valued and hard to get.","chokepoint":false,"part":"10","parts":["10"]},{"id":"fishing","label":"Fishing","domain":"food","kind":"practice","start":-90000,"date_src":"part","place":"Katanda, DR Congo; Jerimalai, East Timor","paradigm":"foraging","desc":"Barbed bone points ~90 ka [contested date]; open-sea tuna fishing ~42 ka and shell hooks ~23 ka. Fish are the forager resource most like crops: dense, predictable, seasonal.","chokepoint":false,"part":"10","parts":["10"]},{"id":"microliths","label":"Microliths","domain":"materials","kind":"technique","start":-71000,"date_src":"part","wide":-18000,"place":"Pinnacle Point, South Africa","paradigm":"foraging","desc":"Tiny geometric pieces set in rows in a shaft: arrows, barbed spears, sickles with replaceable parts. A substitute that relaxed the stone chokepoint, since small poor nodules sufficed; general after ~20 ka.","chokepoint":false,"part":"10","parts":["10"]},{"id":"bow_and_arrow","label":"Bow and arrow","domain":"food","kind":"technique","start":-52000,"date_src":"part","place":"Grotte Mandrin, France; Sibudu, South Africa","paradigm":"foraging","desc":"Accurate at 20 to 50 m, so one person can hunt alone and take small fast prey. Needs stave, cord, feathers, small points and glue: five chains; ~54 ka at Mandrin, ~61.7 ka at Sibudu [contested].","chokepoint":false,"part":"10","parts":["10"]},{"id":"boats","label":"Boats","domain":"transport","kind":"technique","start":-50000,"date_src":"general","paradigm":"foraging","place":"","desc":"Rafts, dugouts and hide boats. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"carcass_joint_products","label":"Carcass joint products","domain":"food","kind":"practice","start":-50000,"date_src":"general","place":"everywhere","paradigm":"foraging","desc":"A slaughtered beast gives meat, hide, fat, horn, bone, sinew, guts and dung at once; the butcher's leftovers fed half a dozen trades, zoned by smell in the medieval town. About half of a modern meat animal is not eaten (cited).","chokepoint":false,"part":"03","parts":["03"]},{"id":"hxaro_partnership","label":"Hxaro gift partnerships","domain":"exchange","kind":"practice","start":-50000,"date_src":"general","place":"Ju/'hoansi, Kalahari","paradigm":"foraging","desc":"Delayed gift partnerships among the Ju/'hoansi (Polly Wiessner), some with partners far away. In a bad year a household could move to a partner's water hole, so the gifts worked as insurance against local failure [s]. The start date is a guess at the antiquity of such networks.","chokepoint":false,"part":"04","parts":["04"]},{"id":"blade_technology","label":"Blades and burins","domain":"materials","kind":"technique","start":-48000,"date_src":"part","place":"Upper Palaeolithic Eurasia; earlier in Africa","paradigm":"foraging","desc":"Long thin blades from prismatic cores give more edge per kilo; burins cut bone and antler into needles, harpoons and spear-thrower hooks. Good flint moved 100 to 200 km and more [rough].","chokepoint":false,"part":"10","parts":["10"]},{"id":"cordage","label":"Cordage","domain":"textiles","kind":"technique","start":-48000,"date_src":"part","place":"Abri du Maras, France","paradigm":"foraging","desc":"A Neanderthal three-ply cord ~50 to 40 ka; cordage at Ohalo II, 19.4 ka. Many hours of twisting bast or sinew; it opened nets, snares, bowstrings and, later, spinning.","chokepoint":false,"part":"10","parts":["10"]},{"id":"drying_smoking","label":"Drying, smoking, rendering","domain":"food","kind":"technique","start":-40000,"date_src":"general","place":"everywhere","paradigm":"foraging","desc":"Drying, smoking, rendering and pemmican turn a pulse (a kill, a fish run) into months of food. Needs fire and fuel; the first form of storage.","chokepoint":false,"part":"10","parts":["10"]},{"id":"landscape_burning","label":"Landscape burning","domain":"food","kind":"practice","start":-40000,"date_src":"general","place":"Australia (firestick farming)","paradigm":"foraging","desc":"Fire set on the land so fresh growth draws game: a managed commons. Late Pleistocene and Holocene, from charcoal records and ethnography.","chokepoint":false,"part":"10","parts":["10"]},{"id":"traps_snares","label":"Traps and snares","domain":"food","kind":"technique","start":-40000,"date_src":"general","place":"Upper Palaeolithic Eurasia","paradigm":"foraging","desc":"Gear that works while people do other things: time capital. Inferred in the Upper Palaeolithic; wooden fish traps survive from ~7000 to 5000 BC.","chokepoint":false,"part":"10","parts":["10"]},{"id":"gift_exchange","label":"Gift exchange","domain":"exchange","kind":"practice","start":-31000,"date_src":"part","place":"Forager bands everywhere","paradigm":"foraging","desc":"Gifts and counter-gifts between kin, partners and neighbours, with the return delayed and unstated (Polanyi's reciprocity, Sahlins's generalised and balanced reciprocity). It needs lasting relations and memory of who gave what. It binds people over time, insures against local failure and makes the peace in which barter with outsiders can happen.","chokepoint":false,"part":"04","parts":["04","10"]},{"id":"bast_cord","label":"Bast fibre cord","domain":"textiles","kind":"good","start":-30000,"date_src":"general","place":"everywhere","paradigm":"foraging","desc":"Cord twisted from lime, nettle or willow bark after retting in water; with sinew, rawhide and withies, the first binding. It made nets, snares, lines and lashing.","chokepoint":false,"part":"01","parts":["01"]},{"id":"horn_bone_glue","label":"Horn, bone and glue trades","domain":"materials","kind":"industry","start":-30000,"date_src":"general","wide":1300,"place":"medieval town streets","paradigm":"foraging","desc":"Horners, bone-workers and glue-boilers: combs, lantern panes, handles, dice, needles, glue and size from the carcass's leftovers. Bone ash also lined the cupellation hearth.","chokepoint":false,"part":"03","parts":["03"]},{"id":"saddle_quern","label":"Grinding slabs (saddle quern)","domain":"food","kind":"technique","start":-28000,"date_src":"part","place":"Ohalo II, Sea of Galilee","paradigm":"foraging","desc":"Grinding slabs from ~30 ka; wild barley ground on stone at Ohalo II, 23,000 BP. Seeds rank low because of processing, so grinding tools are what raise their return.","chokepoint":false,"part":"10","parts":["10"]},{"id":"nets","label":"Nets","domain":"food","kind":"technique","start":-27000,"date_src":"part","place":"Pavlov and Dolni Vestonice, Moravia","paradigm":"foraging","desc":"Cord impressions in clay ~29 to 26 ka. Nets made hunting hares and fishing a crowd's work, among the first occasions a group had to be organised and fed in one place.","chokepoint":false,"part":"10","parts":["10"]},{"id":"broad_spectrum_revolution","label":"Broad spectrum revolution","domain":"food","kind":"practice","start":-18000,"date_src":"part","place":"Near East and Europe","paradigm":"foraging","desc":"After ~20 ka diets widened from large game to small fast animals, fish, shellfish and seeds, as the diet-breadth model predicts under growing numbers (Flannery 1969; Stiner 2001). Cultivation began from this base.","chokepoint":false,"part":"10","parts":["10"]},{"id":"pottery","label":"Pottery","domain":"materials","kind":"technique","start":-18000,"date_src":"part","place":"Xianrendong Cave, China","paradigm":"foraging","desc":"Invented by foragers ~20,000 cal BP [firm], later in Japan and Mali; in the Near East only ~7000 BC, after farming. A paradigm switch for cooking: boiling extracts more from low-ranked foods, and pots store grain, oil and milk.","chokepoint":false,"part":"10","parts":["10"]},{"id":"spear_thrower","label":"Spear-thrower (atlatl)","domain":"food","kind":"technique","start":-18000,"date_src":"part","place":"Solutrean and Magdalenian France","paradigm":"foraging","desc":"An antler hook throws light darts 30 to 50 m with more force. Firm finds ~20 to 17 ka, probably older [contested].","chokepoint":false,"part":"10","parts":["10"]},{"id":"delayed_return_property","label":"Delayed-return property","domain":"institutions","kind":"institution","start":-13000,"date_src":"general","place":"Natufian Levant; rich coasts","paradigm":"foraging","desc":"Woodburn's (1982) shift: foragers with stores, traps, boats or weirs hold assets that must be guarded and inherited, so they develop property, binding kin rules and often rank. Storage turns sharing into a question of who owns the store.","chokepoint":false,"part":"10","parts":["10"]},{"id":"sedentary_villages","label":"Settled forager villages","domain":"building","kind":"infrastructure","start":-13000,"date_src":"part","place":"Natufian Levant","paradigm":"foraging","desc":"Stone houses, cemeteries, mortars and sickles ~15,000 to 11,700 BP among people who still foraged. Sedentism came with storage, before farming.","chokepoint":false,"part":"10","parts":["10"]},{"id":"sickle","label":"Flint sickle","domain":"food","kind":"technique","start":-13000,"date_src":"part","place":"Natufian Levant","paradigm":"foraging","desc":"Blades set in a haft, glossed from cutting grass. Harlan cut wild einkorn with one and argued a family could gather a year's grain in about three weeks [widely quoted; not re-checked].","chokepoint":false,"part":"10","parts":["10"]},{"id":"storage_pits_caches","label":"Storage pits and caches","domain":"food","kind":"infrastructure","start":-13000,"date_src":"part","place":"Mezhyrich, Ukraine","paradigm":"foraging","desc":"Meat cached in cold ground and pits beside mammoth-bone houses ~15 ka; nut stores (Jomon chestnut pits, California acorns). Stores must be guarded, which pushes people to stay put.","chokepoint":false,"part":"10","parts":["10"]},{"id":"obsidian_exchange","label":"Obsidian down-the-line exchange","domain":"exchange","kind":"practice","start":-12000,"date_src":"part","place":"Anatolian and Armenian sources to the Levant","paradigm":"foraging","desc":"Volcanic glass for blades, traced to source by trace elements (Renfrew, Dixon and Cann). Within about 300 km of a source it made over 80% of chipped stone, then fell off almost exponentially with distance [c]; each community passed part on to the next. Models show some long-distance carriers or visits to source must also have existed [c].","chokepoint":true,"part":"04","parts":["04","10"],"wide":-7000},{"id":"barter","label":"Barter between strangers","domain":"exchange","kind":"practice","start":-10000,"date_src":"general","place":"Between groups without common authority","paradigm":"horticultural_tribal","desc":"Direct swap of goods without money, with haggling (Sahlins's negative reciprocity). Anthropologists found no society where barter was everyday exchange between neighbours: it appears between strangers or where money has failed (the late Roman west, post-Soviet Russia). In the engine runs spot barter made up 61% of formal agreements (38.68).","chokepoint":false,"part":"04","parts":["04"]},{"id":"household_production","label":"Household production","domain":"institutions","kind":"institution","start":-10000,"date_src":"general","place":"Everywhere; Chayanov's peasant","paradigm":"horticultural_tribal","desc":"Through almost all of history the household was the unit of production: a few adults, children and servants making grain, beasts, ale, bread, yarn and fuel. Chayanov: it works until one more day's drudgery balances what it adds; the consumer-worker ratio sets effort. Western European households were small, about 4.75 people [unchecked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"timber","label":"Timber","domain":"materials","kind":"resource","start":-10000,"date_src":"general","paradigm":"foraging","place":"","desc":"Wood for building, ships and tools. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"monumental_feasting","label":"Monumental feasting sites","domain":"institutions","kind":"practice","start":-9600,"date_src":"part","place":"Gobekli Tepe, Turkey","paradigm":"horticultural_tribal","desc":"Monumental pillars raised ~9600 to 8200 BC by people still largely foraging, with feasting on a large scale (wild cereal beer [contested]). An early case of labour gathered and fed for a common work.","chokepoint":false,"part":"10","parts":["10"]},{"id":"wild_grain_granaries","label":"Granaries for wild grain","domain":"food","kind":"infrastructure","start":-9350,"date_src":"part","place":"Dhra', Jordan","paradigm":"foraging","desc":"Raised floors against damp and rodents, between houses and perhaps shared, ~11,300 cal BP: about a thousand years before domestic cereals (Kuijt and Finlayson 2009) [firm].","chokepoint":false,"part":"10","parts":["10"]},{"id":"granary_storage","label":"Stored grain surplus","domain":"food","kind":"practice","start":-9000,"date_src":"general","place":"Near East","paradigm":"horticultural_tribal","desc":"Grain can be seen, measured, stored, stolen and taxed (James C. Scott). Owning a surplus, holding dependants and extracting from others begin here, and with them slavery, tribute and the state. Storage was costly (rats, damp, tied-up capital); at scale it was a public good.","chokepoint":false,"part":"05","parts":["05"]},{"id":"hand_quern","label":"Rotary hand quern","domain":"food","kind":"technique","start":-9000,"date_src":"general","place":"Iron Age Europe","paradigm":"horticultural_tribal","desc":"Two stones turned by hand to grind grain at home: slow but needing no capital. Lords with mill soke confiscated querns; the abbots of St Albans paved a floor with them and townsmen dug them up in 1381.","chokepoint":false,"part":"01","parts":["01","05"]},{"id":"lime","label":"Lime plaster","domain":"materials","kind":"technique","start":-9000,"date_src":"part","place":"Levant","paradigm":"horticultural_tribal","desc":"Limestone burned at ~750 to 900 C for plaster, at a heavy fuel cost. In the Near East two thousand years of plaster and stone vessels came before pottery.","chokepoint":false,"part":"10","parts":["10"]},{"id":"mudbrick","label":"Mudbrick","domain":"building","kind":"technique","start":-9000,"date_src":"general","paradigm":"horticultural_tribal","place":"","desc":"Sun-dried clay bricks. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"polished_stone_axe","label":"Polished stone axe","domain":"materials","kind":"technique","start":-9000,"date_src":"general","place":"Near East and Neolithic Europe","paradigm":"horticultural_tribal","desc":"Shaped by pecking and grinding tough rock from a few quarries, for clearing woodland; it fells a medium tree in hours, many times slower than steel [rough].","chokepoint":false,"part":"10","parts":["10"]},{"id":"animal_domestication","label":"Herd animal domestication","domain":"food","kind":"technique","start":-8500,"date_src":"part","place":"Zagros, Taurus, upper Euphrates","paradigm":"horticultural_tribal","desc":"Goat, sheep, cattle and pig ~10,500 BP; later donkey, llama, horse, camel and chicken. A herd is a bundle of joint products (meat, milk, hide, dung, fibre, power) taken over a lifetime: time capital that needs fodder, folds and inheritance.","chokepoint":false,"part":"10","parts":["10"]},{"id":"cereal_domestication","label":"Cereal domestication","domain":"food","kind":"technique","start":-8500,"date_src":"part","wide":-7000,"place":"Fertile Crescent; also China, Mesoamerica, Andes, New Guinea, Sahel","paradigm":"horticultural_tribal","desc":"Einkorn, emmer, barley and pulses from ~10,500 BP, in at least seven centres; non-shattering grain took 2,000 to 3,000 years to dominate. Early cultivation paid ~63% of the wild-food mean per hour (Bowles 2011) [rough] but fed more per hectare, stored, and raised birth rates.","chokepoint":false,"part":"10","parts":["10"]},{"id":"flax_linen","label":"Flax and linen","domain":"textiles","kind":"resource","start":-8500,"date_src":"part","place":"Fertile Crescent; Egypt","paradigm":"horticultural_tribal","desc":"Flax was a Fertile Crescent founder crop; linen was Egypt's cloth, made in temple workshops. Possible wild flax fibres ~30 ka at Dzudzuana [contested].","chokepoint":false,"part":"10","parts":["10"]},{"id":"hoe_cultivation","label":"Hoe and digging stick","domain":"food","kind":"technique","start":-8500,"date_src":"general","place":"worldwide; Africa and the tropics","paradigm":"horticultural_tribal","desc":"Holes for seed and breaking and weeding soil by one person: the base of African and much tropical farming, and of weeding everywhere. The engine's hoe does a quarter of a plough team's work.","chokepoint":false,"part":"02","parts":["02"]},{"id":"native_copper_working","label":"Cold-hammered native copper","domain":"metals","kind":"technique","start":-8500,"date_src":"part","place":"Cayonu, Anatolia; Lake Superior","paradigm":"horticultural_tribal","desc":"Native copper and malachite hammered into beads from the 9th to 8th millennium BC. The Old Copper Complex by Lake Superior (~4000 to 1000 BC) never went on to smelting.","chokepoint":false,"part":"10","parts":["10"]},{"id":"clay_tokens","label":"Clay accounting tokens","domain":"information","kind":"technique","start":-8000,"date_src":"part","place":"Levant and Mesopotamia","paradigm":"horticultural_tribal","desc":"Small clay tokens recording grain and beasts from about 8000 BC (Schmandt-Besserat's reading, debated). Accounting came before writing: writing at Uruk began about 3300 BC as accounts of goods owed and delivered [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"fishing_nets","label":"Fishing nets","domain":"food","kind":"technique","start":-8000,"date_src":"general","place":"everywhere","paradigm":"foraging","desc":"Seines and drift nets of flax or hemp cord, many hours of netting: a long skill.","chokepoint":false,"part":"03","parts":["03"]},{"id":"record_keeping","label":"Tokens and bullae","domain":"information","kind":"technique","start":-8000,"date_src":"part","place":"Near East","paradigm":"horticultural_tribal","desc":"Clay tokens in simple shapes from ~8000 BC, sealed in clay envelopes (bullae) in the 4th millennium BC and then impressed on them (Schmandt-Besserat) [contested in strong form; bullae firm].","chokepoint":false,"part":"10","parts":["10"]},{"id":"withies_rods","label":"Withies and rods","domain":"materials","kind":"good","start":-8000,"date_src":"general","place":"hazel and willow coppice","paradigm":"foraging","desc":"Hazel and willow rods on 1 to 10 years: 25,000 to 30,000 rods a hectare from eight- or nine-year hazel (cited). They made wattle, hurdles, fences, baskets, fish traps and weirs.","chokepoint":false,"part":"03","parts":["03"]},{"id":"neolithic_town","label":"Neolithic town (Catalhoyuk)","domain":"building","kind":"infrastructure","start":-7100,"date_src":"part","place":"Catalhoyuk, Turkey","paradigm":"horticultural_tribal","desc":"A dense mud-brick town of 3,500 to 8,000 people [rough], 7100 to 5950 BC, each household with its own store and no visible central authority; obsidian from 140 km.","chokepoint":false,"part":"10","parts":["10"]},{"id":"fish_weirs","label":"Weirs and fixed fish traps","domain":"food","kind":"infrastructure","start":-7000,"date_src":"part","place":"Mesolithic Europe","paradigm":"foraging","desc":"Fixed gear across a river: time capital, and a commons for those downstream. Holocene everywhere.","chokepoint":false,"part":"10","parts":["10"]},{"id":"game_drives_kites","label":"Game drives and desert kites","domain":"food","kind":"infrastructure","start":-7000,"date_src":"part","place":"Near East; Head-Smashed-In, Canada","paradigm":"foraging","desc":"Stone funnels kilometres long and buffalo jumps take hundreds of animals in a day: a pulse. They need crowds, leaders, years of building and meat processed at once; many kites ~9,000 to 5,000 BP.","chokepoint":false,"part":"10","parts":["10"]},{"id":"milk_dairy","label":"Dairying","domain":"food","kind":"technique","start":-7000,"date_src":"part","place":"north-west Anatolia","paradigm":"horticultural_tribal","desc":"Milk fats in pots from ~7000 BC (Evershed et al. 2008, >2,200 vessels): dairying is nearly as old as herding, not part of a 4th-millennium package. Milk was first eaten as cheese, yogurt and butter, since lactase persistence spread mostly in the last ~3,000 years.","chokepoint":false,"part":"10","parts":["10"]},{"id":"property_in_land","label":"Household and lineage land","domain":"institutions","kind":"institution","start":-7000,"date_src":"general","place":"Early farming villages","paradigm":"horticultural_tribal","desc":"Land held by lineages and households, herds as movable wealth, and inheritance that begins to matter. Property is a bundle of rights (access, withdrawal, management, exclusion, alienation; Schlager and Ostrom), usually split between holders.","chokepoint":false,"part":"05","parts":["05"]},{"id":"reciprocal_work_parties","label":"Kin work-parties","domain":"institutions","kind":"practice","start":-7000,"date_src":"general","place":"Early farming villages","paradigm":"horticultural_tribal","desc":"Households helping each other at peak work, repaid in kind or by return help: the first answer to a labour calendar with a harvest peak several times the winter's demand.","chokepoint":false,"part":"05","parts":["05"]},{"id":"retting","label":"Retting ponds","domain":"textiles","kind":"technique","start":-7000,"date_src":"general","place":"flax and hemp lands","paradigm":"horticultural_tribal","desc":"Flax and hemp stems rotted in water for days to free the fibre, fouling the water and killing fish downstream. A water conflict at one step of the linen chain.","chokepoint":false,"part":"03","parts":["03"]},{"id":"spinning","label":"Hand spinning","domain":"textiles","kind":"technique","start":-7000,"date_src":"general","place":"Neolithic Near East","paradigm":"horticultural_tribal","desc":"Spinning is the bottleneck: a hand spindle makes ~50 to 100 m of yarn an hour and a square metre of cloth needs one to several kilometres, so a garment takes hundreds of hours [rough]. Cloth was thus a store of value and the first cities' main export.","chokepoint":true,"part":"10","parts":["10"]},{"id":"swidden","label":"Shifting cultivation (swidden)","domain":"food","kind":"technique","start":-7000,"date_src":"general","place":"forest zones; Finland and Sweden later","paradigm":"horticultural_tribal","desc":"Fell or ring trees, burn, sow into the ash, crop one to three years, move on; the territory is fifteen to twenty times the cropped area and densities stay under a few tens per km2 [r]. Returns per hour are among the highest of any farming [s, r]; the regrowing forest is the stored fertility.","chokepoint":false,"part":"02","parts":["02"]},{"id":"wicker_fish_traps","label":"Wicker fish traps","domain":"food","kind":"technique","start":-7000,"date_src":"general","place":"Mesolithic Europe","paradigm":"foraging","desc":"Eel baskets and traps woven of withies in a few days: the coppice into the water.","chokepoint":false,"part":"03","parts":["03"]},{"id":"irrigation_farming","label":"Canal irrigation","domain":"food","kind":"technique","start":-6500,"date_src":"part","place":"Mesopotamian alluvium (Ubaid)","paradigm":"irrigation","desc":"Small canals off river levees from the Ubaid; later canals dug and cleaned by labour gangs, and fought over for generations by Lagash and Umma. At Larsa ~1700 BC yields averaged ~900 litres per hectare (Jacobsen and Adams).","chokepoint":false,"part":"10","parts":["10"]},{"id":"weaving","label":"Weaving (warp-weighted loom)","domain":"textiles","kind":"technique","start":-6500,"date_src":"part","place":"Nahal Hemar, Israel; Catalhoyuk","paradigm":"horticultural_tribal","desc":"Woven linen ~8,500 BP, textiles at Catalhoyuk ~7000 BC, spindle whorls and warp-weighted looms with the Neolithic. Turns yarn into cloth, among the most labour-dense goods of the ancient world.","chokepoint":false,"part":"10","parts":["10"]},{"id":"dung_straw_fuel","label":"Straw, dung and furze fuel","domain":"energy","kind":"practice","start":-6000,"date_src":"general","place":"open-field villages, steppe, uplands","paradigm":"horticultural_tribal","desc":"Farm by-products burned where wood was short. They burn fast, and every load of dung burned is manure lost to the fields. National accounts count them poorly, which is part of why rural English fuel per head reads as low as 0.5 t of wood [V].","chokepoint":false,"part":"01","parts":["01"]},{"id":"kiln","label":"Pottery kiln","domain":"materials","kind":"infrastructure","start":-6000,"date_src":"general","place":"Near East","paradigm":"horticultural_tribal","desc":"A closed firing chamber with draught control, 600 to 1,000 C. The rung that led to faience and to the closed smelting furnace.","chokepoint":false,"part":"10","parts":["10"]},{"id":"salt_making","label":"Brine salt-making","domain":"materials","kind":"industry","start":-6000,"date_src":"part","place":"Poiana Slatinei, Romania; Provadia-Solnitsata, Bulgaria","paradigm":"chiefdom","desc":"Brine boiled in ceramic vessels in domed kilns (briquetage); Provadia's output rose from ~25 kg a load ~5500 BC to perhaps 4 to 5 t a cycle by 4700 to 4500 BC [rough] and the site grew a wall. A chokepoint for keeping food and for herds, joining the fuel and clay chains.","chokepoint":true,"part":"10","parts":["10"]},{"id":"wattle_daub","label":"Wattle and daub","domain":"building","kind":"technique","start":-6000,"date_src":"general","paradigm":"horticultural_tribal","place":"","desc":"Woven withies plastered with clay and dung. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"cheese_making","label":"Cheese making","domain":"food","kind":"technique","start":-5500,"date_src":"general","place":"Europe; later Cheshire, Suffolk","paradigm":"horticultural_tribal","desc":"The way to keep milk, needing salt, rennet and a cool store. An English estate rule expected 98 lb of cheese and 14 lb of butter per cow between May and Michaelmas [c, r]; regions specialised in cheese from the 16th century.","chokepoint":false,"part":"02","parts":["02"]},{"id":"manure","label":"Manuring and the manure gap","domain":"food","kind":"practice","start":-5500,"date_src":"general","place":"Europe's first farmers; medieval England","paradigm":"horticultural_tribal","desc":"Stable isotopes show manuring from the start among Europe's first farmers (Bogaard et al. 2013, part 10) [firm]. Grain needs nitrogen, nitrogen came from dung, dung from beasts whose grass competed with grain for land: the binding limit in north-west Europe for a thousand years.","chokepoint":true,"part":"02","parts":["02"]},{"id":"prestige_goods_exchange","label":"Prestige goods chains","domain":"exchange","kind":"practice","start":-5500,"date_src":"part","place":"central Europe; Mycenae; Mesopotamia","paradigm":"chiefdom","desc":"Gifts between leaders, held not used: Spondylus shell (~1,500 km) in Linearbandkeramik graves ~5500 BC, Baltic amber (~2,000 km) at Mycenae, lapis from Badakhshan (~2,500 km). Signature: rich graves and hoards far from source.","chokepoint":false,"part":"10","parts":["10"]},{"id":"spondylus_trade","label":"Spondylus shell trade","domain":"exchange","kind":"practice","start":-5500,"date_src":"part","place":"Aegean to central Europe","paradigm":"horticultural_tribal","desc":"Shell ornaments carried up to about 1,500 km through many hands [s, r], worn as status and buried with the dead. Prestige goods moving down the line built hierarchies and knowledge of distant sources.","chokepoint":false,"part":"04","parts":["04"]},{"id":"copper_mining","label":"Copper mines","domain":"metals","kind":"industry","start":-5400,"date_src":"part","place":"Rudna Glava, Serbia; Ai Bunar, Bulgaria","paradigm":"chiefdom","desc":"Ore mined ~5400 BC at Rudna Glava; open trenches tens of metres long at Ai Bunar ~5000 BC.","chokepoint":false,"part":"10","parts":["10"]},{"id":"jadeitite_axes","label":"Alpine jade axes","domain":"exchange","kind":"good","start":-5300,"date_src":"part","place":"Monte Viso and Monte Beigua, Italian Alps","paradigm":"chiefdom","desc":"Axes of Alpine jadeitite, 5300 to 4000 BC, reached Brittany, Britain, Ireland and Denmark up to ~1,800 km away (Projet JADE) [firm]. Many were never used and were laid in bogs and graves: prestige goods.","chokepoint":false,"part":"10","parts":["10"]},{"id":"charcoal","label":"Charcoal","domain":"energy","kind":"good","start":-5000,"date_src":"general","paradigm":"chiefdom","place":"","desc":"Wood charred in clamps by colliers; a hotter, lighter fuel for smelting and smithing. A bloomery took 10 to 18 kg of charcoal for each kg of iron (part 03, from memory), so metal was bound to woodland until coke. Wood charred in clamps; a hotter, lighter fuel for smelting and smithing. Bound metal to woodland until coke. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"copper_smelting","label":"Copper smelting","domain":"metals","kind":"technique","start":-5000,"date_src":"part","place":"Belovode, Serbia","paradigm":"chiefdom","desc":"The earliest secure smelting, 49th century BC (~5 g of slag) [firm]. Needs ore, charcoal, a furnace or crucible at ~1,100 to 1,200 C from pottery skills, forced draught and long skill; it opened metal as stored wealth.","chokepoint":false,"part":"10","parts":["10"]},{"id":"cotton","label":"Cotton","domain":"textiles","kind":"resource","start":-5000,"date_src":"part","place":"Mehrgarh, South Asia","paradigm":"horticultural_tribal","desc":"Earliest known cotton at Mehrgarh ~7,000 BP, also domesticated in the Andes; the Indus made the earliest known cotton cloth.","chokepoint":false,"part":"10","parts":["10"]},{"id":"fire_setting","label":"Fire-setting ore mining","domain":"metals","kind":"technique","start":-5000,"date_src":"general","place":"Balkans and Near East","paradigm":"horticultural_tribal","desc":"Heat the rock face, quench it, break it with stone mauls and antler picks (m). The first way to mine copper ore.","chokepoint":false,"part":"03","parts":["03"]},{"id":"forced_draught_bellows","label":"Blowpipes and bellows","domain":"metals","kind":"technique","start":-5000,"date_src":"general","place":"Balkans and Near East","paradigm":"chiefdom","desc":"Forced draught, first by blowpipes and later by leather bellows, lifts a furnace to the 1,100 to 1,200 C copper smelting needs.","chokepoint":false,"part":"10","parts":["10"]},{"id":"pack_animals","label":"Donkey pack transport","domain":"transport","kind":"technique","start":-5000,"date_src":"part","place":"north-east Africa","paradigm":"early_state","desc":"Donkeys domesticated ~5000 BC (Todd et al. 2022) for pack transport in dry country; llamas carried ~30 kg in the Andes. A black donkey took ~65 kg of tin from Assur to Kanesh [rough].","chokepoint":false,"part":"10","parts":["10"]},{"id":"redistribution","label":"Redistribution by a centre","domain":"exchange","kind":"institution","start":-5000,"date_src":"general","place":"Chiefdoms; Mesopotamian temples","paradigm":"chiefdom","desc":"Goods flow to a centre (chief, temple, palace, lord, state) and back out as rations, feasts, wages or works. It needs a centre that can collect and store, and records. It enabled units of account, rations as wages, big works and writing.","chokepoint":false,"part":"04","parts":["04"]},{"id":"tanning","label":"Tanning","domain":"textiles","kind":"industry","start":-5000,"date_src":"general","paradigm":"horticultural_tribal","place":"","desc":"Hides into leather with bark tannin, later chrome salts. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"thatch_roof","label":"Thatch","domain":"building","kind":"good","start":-5000,"date_src":"general","place":"everywhere grain or reed grows","paradigm":"horticultural_tribal","desc":"Straw (a by-product of grain, 15 to 30 years) or water reed (up to about 50) (m). The cheapest roof and the worst fire risk.","chokepoint":false,"part":"03","parts":["03"]},{"id":"transhumance","label":"Transhumance","domain":"food","kind":"practice","start":-5000,"date_src":"general","place":"Alps; Britain (shielings); Iberia","paradigm":"pastoral_nomadic","desc":"Flocks and herds moved seasonally between lowland winter and upland summer pasture; in British shielings women and young people made butter and cheese for the summer [s]. A commons at each end and a corridor that must be kept open.","chokepoint":false,"part":"02","parts":["02"]},{"id":"wet_rice_farming","label":"Wet-rice farming","domain":"food","kind":"technique","start":-5000,"date_src":"general","place":"Yangzi and South-East Asia","paradigm":"irrigation","desc":"Transplanting, water control, double cropping, night soil and careful weeding on small plots: Bray's skill-oriented path against Europe's capital- and animal-oriented one [s]. Yields per acre far above European grain; the key capital is irrigation works kept by communities or states.","chokepoint":false,"part":"02","parts":["02"]},{"id":"gold_working_varna","label":"Varna gold","domain":"metals","kind":"good","start":-4600,"date_src":"part","place":"Varna, Bulgaria","paradigm":"chiefdom","desc":"~3,000 gold objects, ~6 kg, mostly in a few graves, ~4600 to 4300 BC [rough]: the first sharp inequality in Europe's graves, 40 km from the Provadia salt works.","chokepoint":false,"part":"10","parts":["10"]},{"id":"faience_glazes","label":"Faience and glazes","domain":"materials","kind":"technique","start":-4500,"date_src":"part","place":"Near East and Egypt","paradigm":"chiefdom","desc":"Glazed bodies fired at ~900 C in the 5th to 4th millennium BC, a rung of the pyrotechnology ladder between kiln and smelting.","chokepoint":false,"part":"10","parts":["10"]},{"id":"antler_picks","label":"Antler picks","domain":"materials","kind":"good","start":-4400,"date_src":"part","place":"Grimes Graves; European flint mines","paradigm":"chiefdom","desc":"Red-deer antler picks, hundreds per shaft: a joint product of herds and hunting that made mining possible.","chokepoint":false,"part":"10","parts":["10"]},{"id":"flint_mining","label":"Flint mines","domain":"materials","kind":"industry","start":-4400,"date_src":"part","place":"Grime's Graves, Norfolk; Spiennes","paradigm":"horticultural_tribal","desc":"The first extractive industry: shafts dug through chalk to the floorstone. Grime's Graves had at least 433 shafts over about 37 ha, mostly 2600 to 2300 BC (cited), and may have yielded 16,000 to 18,000 t of flint (rough). Crew work for a place-bound good traded far.","chokepoint":true,"part":"03","parts":["03","10"],"wide":-2400},{"id":"coppice","label":"Coppice","domain":"materials","kind":"practice","start":-4000,"date_src":"general","paradigm":"horticultural_tribal","place":"","desc":"Woodland cut on rotation for poles, withies and charcoal wood. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"hemp","label":"Hemp","domain":"textiles","kind":"resource","start":-4000,"date_src":"general","wide":1600,"place":"China; later the Baltic","paradigm":"horticultural_tribal","desc":"A bast fibre crop for rope, sailcloth and sacking; like flax it needed good land, manure and retting water. Navies imported Baltic hemp.","chokepoint":false,"part":"01","parts":["01"]},{"id":"malt","label":"Malt","domain":"food","kind":"good","start":-4000,"date_src":"general","place":"Mesopotamia; every barley land","paradigm":"early_state","desc":"Barley steeped, sprouted and dried on a floor and kiln. It made ale and beer (a staple drink and much of a household's calories [M]), vinegar and spirits.","chokepoint":false,"part":"01","parts":["01"]},{"id":"temple_palace_economy","label":"Temple and palace economy","domain":"institutions","kind":"institution","start":-4000,"date_src":"part","place":"Sumer, Ur III","paradigm":"early_state","desc":"Large institutions owned land, herds and workshops, paid workers rations of barley, oil and wool, and recorded flows in units of account (Ur III, about 2100 to 2000 BC). They ran rations and also traded through merchants, so redistribution and markets coexisted.","chokepoint":false,"part":"04","parts":["04","10"]},{"id":"arsenical_copper","label":"Arsenical copper","domain":"metals","kind":"technique","start":-3700,"date_src":"part","place":"Near East","paradigm":"chiefdom","desc":"Copper with 2 to 5% arsenic from mixed ores, perhaps first by accident; harder and better for casting than pure copper. It dominated the 4th and early 3rd millennia BC.","chokepoint":false,"part":"03","parts":["03","10"]},{"id":"lost_wax_casting","label":"Lost-wax casting","domain":"metals","kind":"technique","start":-3700,"date_src":"part","place":"Nahal Mishmar, Judaean desert","paradigm":"chiefdom","desc":"The Nahal Mishmar hoard of over 400 objects, ~3700 BC, cast in arsenical copper. Mould and lost-wax casting led toward bronze.","chokepoint":false,"part":"10","parts":["10"]},{"id":"baking","label":"Bread baking","domain":"food","kind":"technique","start":-3500,"date_src":"general","place":"Near East and Egypt; medieval towns","paradigm":"early_state","desc":"Flat breads on a bake-stone, bread under a pot, then ovens heated by burning faggots inside; an oven pays only if fired often with a full load. In towns baking was an early guild trade; rural households often ate pottage more than bread [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"brewing","label":"Ale brewing","domain":"food","kind":"technique","start":-3500,"date_src":"general","place":"Mesopotamia; medieval England","paradigm":"early_state","desc":"Malt mashed in hot water, the wort boiled and fermented; unhopped ale sours within days, so brewing stays local and frequent. Bennett estimates adults drank about a gallon a day in medieval England [c; r as an average]: food, safe drink and part of wages, and a large grain sink.","chokepoint":false,"part":"02","parts":["02"]},{"id":"brick","label":"Fired brick","domain":"building","kind":"good","start":-3500,"date_src":"general","paradigm":"early_state","place":"","desc":"Kiln-fired clay bricks. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"cities","label":"First cities","domain":"institutions","kind":"institution","start":-3500,"date_src":"part","place":"Uruk, Mesopotamia","paradigm":"early_state","desc":"Uruk reached ~250 ha, perhaps ~600 ha and 40,000 to 50,000 people by ~2900 BC [rough; contested]. Redistributive machines with an export industry: grain and wool turned into rations and cloth by dependent labour.","chokepoint":false,"part":"10","parts":["10"]},{"id":"draught_animals","label":"Ox traction","domain":"energy","kind":"technique","start":-3500,"date_src":"part","place":"South Street, England; Near East","paradigm":"horticultural_tribal","desc":"Ard marks under a long barrow ~3500 BC, draught pathologies in cattle earlier in places. An increasing-returns threshold: an ox team paid only on enough land, concentrating land in families that owned teams.","chokepoint":false,"part":"10","parts":["10"]},{"id":"grain_rations","label":"Grain rations","domain":"institutions","kind":"institution","start":-3500,"date_src":"part","place":"Uruk; Ur III; Giza; Deir el-Medina","paradigm":"early_state","desc":"Labour paid in standard measures by an institution, perhaps marked by mass-produced bevelled-rim bowls [contested]. Ur III: an adult man 60 sila of barley a month, a woman 30 [firm]; the first wage.","chokepoint":false,"part":"10","parts":["10"]},{"id":"malting","label":"Malting","domain":"food","kind":"technique","start":-3500,"date_src":"general","place":"Mesopotamia; medieval Europe","paradigm":"early_state","desc":"Barley steeped, germinated on a floor for several days, then dried in a kiln: malt. A long skill, later the trade of the maltster.","chokepoint":false,"part":"02","parts":["02"]},{"id":"numerical_tablets","label":"Numerical tablets","domain":"information","kind":"technique","start":-3500,"date_src":"part","place":"Uruk, Susa","paradigm":"early_state","desc":"Clay tablets ~3500 BC carrying numbers and a seal: counting written down before words, with a different number system for each kind of good.","chokepoint":false,"part":"10","parts":["10"]},{"id":"plough","label":"Ard (scratch plough)","domain":"food","kind":"technique","start":-3500,"date_src":"part","place":"Near East and Europe","paradigm":"chiefdom","desc":"A beam scoring the soil without turning it, pulled by a pair of oxen and worked twice across. Opened heavier soils and made ploughing men's work (Sherratt).","chokepoint":false,"part":"10","parts":["10"]},{"id":"potters_wheel","label":"Potter's wheel","domain":"materials","kind":"technique","start":-3500,"date_src":"part","place":"Mesopotamia","paradigm":"early_state","desc":"Turns potting into a specialist trade once demand is concentrated, ~4th millennium BC. Good clay, temper and fuel are local and potting is long skill.","chokepoint":false,"part":"10","parts":["10"]},{"id":"sail","label":"Sail","domain":"transport","kind":"technique","start":-3500,"date_src":"general","paradigm":"early_state","place":"","desc":"Wind-driven ships. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"uruk_colonies","label":"Uruk colonies","domain":"exchange","kind":"practice","start":-3500,"date_src":"part","place":"Habuba Kabira, Jebel Aruda, Hacinebi","paradigm":"early_state","desc":"Uruk-style settlements planted far upriver ~3500 to 3100 BC, read by Algaze as a world system trading cloth and manufactures for metal, timber and stone [contested as a model; colonies firm].","chokepoint":false,"part":"10","parts":["10"]},{"id":"wheel_cart","label":"Wheel and cart","domain":"transport","kind":"technique","start":-3500,"date_src":"part","place":"Bronocice, Poland; Ljubljana marshes","paradigm":"chiefdom","desc":"A cart image on the Bronocice pot ~3500 BC and a wheel ~3150 BC; the wheel appeared within a few centuries in several regions. With oxen it gave bulk land transport.","chokepoint":false,"part":"10","parts":["10"]},{"id":"wool_sheep","label":"Woolly sheep","domain":"textiles","kind":"resource","start":-3500,"date_src":"part","place":"Mesopotamia","paradigm":"early_state","desc":"Woolly fleeces came only with selected breeds in the 4th millennium BC. Wool, gathered from many herders and spun by many hands, became the commodity the first cities ran on; Knossos tracked at least ~80,000 sheep [rough].","chokepoint":false,"part":"10","parts":["10"]},{"id":"uruk_temple_economy","label":"Uruk temple ration economy","domain":"institutions","kind":"institution","start":-3300,"date_src":"part","place":"Uruk, southern Mesopotamia","paradigm":"early_state","desc":"Temple and palace estates fed dependants with rations of barley, oil and wool, recorded on clay; writing was invented for these accounts. Algaze argues Uruk (about 20,000 to 50,000, contested) grew on cheap water transport and high yields, trading textiles for the metal, stone and timber it lacked.","chokepoint":false,"part":"12","parts":["12"]},{"id":"writing","label":"Proto-cuneiform writing","domain":"information","kind":"technique","start":-3300,"date_src":"part","place":"Uruk IV, Mesopotamia","paradigm":"early_state","desc":"~5,000 to 6,000 archaic tablets, the great majority administrative (grain, beer, sheep, workers, fields) [firm in outline]. It let institutions plan rations against a harvest, carry debts over years and audit officials: the information good that let a household scale to thousands.","chokepoint":false,"part":"10","parts":["10"]},{"id":"scribal_schools","label":"Scribal schooling","domain":"information","kind":"institution","start":-3200,"date_src":"part","place":"Uruk","paradigm":"early_state","desc":"Lexical lists for training scribes make up the non-administrative share of the archaic tablets: a school to reproduce the skill.","chokepoint":false,"part":"10","parts":["10"]},{"id":"basin_irrigation_nile","label":"Nile basin irrigation","domain":"food","kind":"technique","start":-3100,"date_src":"general","place":"Egypt","paradigm":"irrigation","desc":"The predictable late-summer flood filled earth-banked basins, soaked them and drained; one winter crop was sown in the mud, with little canal-cleaning and little salt. The river was also the road, carrying grain cheaply to any granary.","chokepoint":false,"part":"10","parts":["10"]},{"id":"bronze","label":"Tin bronze","domain":"metals","kind":"technique","start":-3000,"date_src":"part","wide":-2600,"place":"Mesopotamia","paradigm":"early_state","desc":"Copper with ~10% tin: harder, casts well, follows a recipe, and can be remelted as a stock. Common in Mesopotamia by ~2600 BC, central Europe ~1800 BC; copper and tin rarely lie together, so every bronze society depended on routes of 1,000 km or more, brittle when they failed together (~1200 BC).","chokepoint":true,"part":"10","parts":["10"]},{"id":"census_cadastre","label":"Census and land survey","domain":"information","kind":"practice","start":-3000,"date_src":"general","place":"Early states; Domesday England 1086","paradigm":"early_state","desc":"Counting people and fields: the measurement behind state capacity. Domesday (1086) recorded villeins as about 41% of people holding about 45% of land, bordars and cottars about 32% holding about 5% [checked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"credit_accounting","label":"Credit in units of account","domain":"exchange","kind":"practice","start":-3000,"date_src":"general","place":"Mesopotamia","paradigm":"early_state","desc":"Money began as units of account and credit well before coins: debts reckoned in silver or barley and recorded by scribes. Most Mesopotamian transactions were recorded in silver but paid in barley or goods. Even in coined economies most village exchange later ran on credit.","chokepoint":false,"part":"04","parts":["04"]},{"id":"dyeing","label":"Dyeing","domain":"textiles","kind":"industry","start":-3000,"date_src":"general","paradigm":"early_state","place":"","desc":"Colouring cloth with plant, insect and later synthetic dyes and mordants. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"feud_wergild","label":"Feud and wergild","domain":"institutions","kind":"institution","start":-3000,"date_src":"general","place":"Early farmers; early medieval Europe","paradigm":"horticultural_tribal","desc":"Kin groups answer injury with vengeance or a payment, such as the Anglo-Saxon wergild, a price on each rank's life. Order rests on kin able to retaliate.","chokepoint":false,"part":"05","parts":["05"]},{"id":"leather_bellows","label":"Leather bellows","domain":"metals","kind":"technique","start":-3000,"date_src":"general","place":"Near East","paradigm":"early_state","desc":"A leather bag pumped by hand or foot to blow the furnace and forge; it tied metal to the carcass. Later driven by water wheels.","chokepoint":false,"part":"03","parts":["03"]},{"id":"long_distance_trade","label":"Long-distance trade","domain":"exchange","kind":"practice","start":-3000,"date_src":"general","place":"Mesopotamia and beyond","paradigm":"early_state","desc":"Trade over hundreds to thousands of kilometres in goods valuable for their weight: silver, spices, silk, fine cloth for thousands of miles; wool, wine, salt and fish for hundreds by water; grain for tens by land. It needed merchants, credit to carry stock, cheap water carriage and a guarantor of merchants' rights abroad.","chokepoint":false,"part":"04","parts":["04"]},{"id":"oil_lamp","label":"Oil lamp","domain":"energy","kind":"good","start":-3000,"date_src":"general","place":"Mediterranean","paradigm":"early_state","desc":"A wick in vegetable or animal oil: olive oil in the south, rapeseed and linseed in the north, whale oil from the 17th to 19th centuries. It paid where oil was cheaper than tallow.","chokepoint":false,"part":"01","parts":["01"]},{"id":"potash","label":"Potash (wood-ash lye)","domain":"materials","kind":"good","start":-3000,"date_src":"general","wide":1700,"place":"every wooded region; later the Baltic and North America","paradigm":"early_state","desc":"Wood ash leached to lye: the alkali of glass, soap, bleaching and dyeing. The Spiegelberg glassworks needed about 800 centners a year, some 40,000 m3 of wood [V]. Ash-burning competed with hearths and ironworks for the woods.","chokepoint":false,"part":"01","parts":["01"]},{"id":"roads","label":"Rights-of-way roads","domain":"transport","kind":"infrastructure","start":-3000,"date_src":"general","place":"Everywhere; Roman roads","paradigm":"early_state","desc":"After Roman roads decayed, roads were mostly rights of way, not built surfaces. A medieval English cart added about 3% to wheat's price every 10 miles (Clark) [c], about 0.25% per km (Masschaele) [c]; overland firewood paid only within about 18 to 20 km of London [c].","chokepoint":false,"part":"04","parts":["04"]},{"id":"salmon_economies","label":"Salmon economies (complex foragers)","domain":"food","kind":"practice","start":-3000,"date_src":"part","place":"North-west coast of North America","paradigm":"gift_economy","desc":"Settled foragers with plank-house villages, ranked chiefs, slaves and potlatch, from ~5,000 BP. They show that storage, not farming, opened the door to wealth and rank (Testart 1982).","chokepoint":false,"part":"10","parts":["10"]},{"id":"slavery","label":"Slavery","domain":"institutions","kind":"institution","start":-3000,"date_src":"general","place":"Ancient states; Roman Italy","paradigm":"agrarian_empire","desc":"Appears wherever there is a surplus to guard, war to make captives, and estates or mines needing hands more than skill. Roman Italy may have held one to two million slaves among six to seven million people [rough, contested]; in Domesday England slaves were just under one in ten of those recorded [checked] and faded within two generations.","chokepoint":false,"part":"05","parts":["05"]},{"id":"state_taxation","label":"Grain and labour taxation","domain":"institutions","kind":"institution","start":-3000,"date_src":"general","place":"Mesopotamia, Egypt, China","paradigm":"early_state","desc":"Early states took taxes in grain and labour, kept granaries, counted people and fields, and wrote first of all to keep accounts. Farmers grew what could be taxed; later states taxed goods, trade and incomes.","chokepoint":false,"part":"05","parts":["05"]},{"id":"stone_masonry","label":"Stone masonry","domain":"building","kind":"technique","start":-3000,"date_src":"general","paradigm":"early_state","place":"","desc":"Cut stone building. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"tin","label":"Tin","domain":"metals","kind":"resource","start":-3000,"date_src":"part","place":"Kestel, Anatolia; Mushiston, Tajikistan; Erzgebirge; Cornwall","paradigm":"early_state","desc":"Small 3rd-millennium mines at Kestel [contested scale]; Central Asian Bronze Age mines matched to Uluburun's tin [firm for mining]; Cornish ingots on wrecks off Israel [contested but growing]. The Near East had almost none, so tin was the rarer of bronze's two chokepoints.","chokepoint":true,"part":"10","parts":["10"]},{"id":"tin_lapis_trade","label":"Tin and lapis trade","domain":"exchange","kind":"practice","start":-3000,"date_src":"part","place":"Afghanistan and Central Asia to Mesopotamia","paradigm":"early_state","desc":"Organised long-distance trade in tin and lapis lazuli into Mesopotamia in the 3rd millennium BC. Tin was needed to make bronze, so the bronze economy depended on routes no single state controlled.","chokepoint":false,"part":"04","parts":["04"]},{"id":"woad","label":"Woad","domain":"textiles","kind":"resource","start":-3000,"date_src":"general","place":"Europe","paradigm":"feudal_manorial","desc":"Europe's own blue dye plant. Woad interests won bans and duties on indigo in the 16th and 17th centuries, which the stronger dye eventually broke: a substitution decided by politics as much as chemistry.","chokepoint":false,"part":"11","parts":["11"]},{"id":"wood_pasture","label":"Wood pasture and pannage","domain":"food","kind":"practice","start":-3000,"date_src":"general","place":"European wildwood","paradigm":"horticultural_tribal","desc":"Grazing beasts and deer under scattered trees, with pigs on the autumn mast (pannage). Browsing kills young regrowth, so wood pasture and coppice exclude each other.","chokepoint":false,"part":"03","parts":["03"]},{"id":"town_walls_market","label":"Walls, gates and market place","domain":"building","kind":"infrastructure","start":-2900,"date_src":"general","place":"Uruk; every walled town","paradigm":"early_state","desc":"Layer 1 of the city's works: streets, walls, gates and a market place giving movement, safety and a place where offers meet, with tolls at the gates. It needs a site, labour and an authority.","chokepoint":false,"part":"12","parts":["12"]},{"id":"soap_boiling","label":"Soap boiling","domain":"materials","kind":"industry","start":-2800,"date_src":"general","place":"Mesopotamia; medieval towns","paradigm":"early_state","desc":"Fat (tallow, oil) boiled with lye from wood ash, later with soda. A soap-boiler competed with glassworks and hearths for wood and with chandlers for fat.","chokepoint":false,"part":"01","parts":["01"]},{"id":"sericulture","label":"Sericulture","domain":"textiles","kind":"technique","start":-2700,"date_src":"general","place":"China","paradigm":"horticultural_tribal","desc":"Mulberry trees (years to grow) feed silkworms reared for a month in warm rooms by women, with leaves fed hourly at the end: a labour pulse. Egg cards are kept over winter.","chokepoint":false,"part":"11","parts":["11"]},{"id":"carnelian_bead_craft","label":"Carnelian bead craft","domain":"materials","kind":"industry","start":-2600,"date_src":"part","place":"Indus; Gujarat","paradigm":"early_state","desc":"Blanks heated to redden and drilled end to end with a special hard-stone drill: one long bead could take a week or more [rough]. Exported to Mesopotamia, found in Ur's Royal Cemetery.","chokepoint":false,"part":"10","parts":["10"]},{"id":"corvee_labour","label":"Labour gangs","domain":"institutions","kind":"institution","start":-2600,"date_src":"part","place":"Giza; Mesopotamian canals","paradigm":"early_state","desc":"Gangs fed from the granary dug canals and built temples and pyramids: perhaps 8,000 to 10,000 at Giza at a time [rough], with a workers' town of bakeries, breweries and fish-processing.","chokepoint":false,"part":"05","parts":["05","10"]},{"id":"indus_chert_weights","label":"Indus chert weights","domain":"exchange","kind":"institution","start":-2600,"date_src":"part","place":"Harappa, Mohenjo-daro","paradigm":"early_state","desc":"Polished chert cubes in a binary series 1 to 64 (commonest ~13.7 g) then decimal multiples, consistent across sites hundreds of km apart [firm]. Probably for trade, taxing goods and allocating craft materials [rough reading].","chokepoint":false,"part":"10","parts":["10"]},{"id":"indus_covered_drains","label":"Indus planned drains","domain":"building","kind":"infrastructure","start":-2600,"date_src":"part","place":"Mohenjo-daro","paradigm":"early_state","desc":"Grid streets, covered drains and wells in baked bricks of a 1:2:4 ratio; Mohenjo-daro covered ~200 to 250 ha with perhaps 40,000 people [rough], with no visible palace.","chokepoint":false,"part":"10","parts":["10"]},{"id":"meluhha_gulf_trade","label":"Gulf trade (Meluhha, Dilmun)","domain":"exchange","kind":"practice","start":-2600,"date_src":"part","place":"Indus to Mesopotamia via Dilmun (Bahrain)","paradigm":"maritime_trading","desc":"The Indus (Meluhha) sent carnelian, ivory, timber and gold by sea; Meluhhans lived at Guabba and Dilmun used Indus-standard weights. Magan (Oman) supplied copper.","chokepoint":false,"part":"10","parts":["10"]},{"id":"royal_expeditions","label":"Royal trade expeditions","domain":"exchange","kind":"practice","start":-2600,"date_src":"general","place":"Egypt: Byblos, Sinai, Nubia, Punt","paradigm":"early_state","desc":"Egypt's imports came mostly by royal expedition: cedar from Byblos, copper and turquoise from Sinai, gold from Nubia, incense and ebony from Punt by Red Sea ships.","chokepoint":false,"part":"10","parts":["10"]},{"id":"steatite_seals","label":"Steatite seals","domain":"information","kind":"good","start":-2600,"date_src":"part","place":"Indus","paradigm":"early_state","desc":"Carved, fired seals with the undeciphered script; sealings show corded packages, a check on goods in transit.","chokepoint":false,"part":"10","parts":["10"]},{"id":"papyrus_parchment","label":"Papyrus work logs","domain":"information","kind":"good","start":-2560,"date_src":"part","place":"Wadi al-Jarf, Egypt","paradigm":"early_state","desc":"Merer's diary, the oldest papyrus known, logs a crew of ~40 shipping Tura limestone to Giza along flood canals: the first papyrus is a work log.","chokepoint":false,"part":"10","parts":["10","11"]},{"id":"cupellation","label":"Cupellation of silver","domain":"metals","kind":"technique","start":-2500,"date_src":"general","place":"Near East; at scale in Laurion and Iberia","paradigm":"early_state","desc":"Lead bullion smelted from galena is oxidised in a hearth so the lead burns off and silver remains, leaving lead as a by-product. Roman-era smelting put lead into the Greenland ice at about four times the natural level (Hong 1994).","chokepoint":false,"part":"03","parts":["03","11"]},{"id":"glass","label":"Glass","domain":"materials","kind":"industry","start":-2500,"date_src":"general","paradigm":"early_state","place":"","desc":"A forest glassworks burned 150 to 200 kg of wood for each kg of glass (part 01). Sand, soda or potash and lime fused with heavy fuel use. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"indian_handloom","label":"Indian handloom cotton","domain":"textiles","kind":"industry","start":-2500,"date_src":"general","wide":1700,"place":"Bengal and Gujarat","paradigm":"agrarian_empire","desc":"Hand-spun, handwoven Indian cotton cloth that supplied the Indian Ocean trade; mill-spun cotton displaced it after the 1770s.","chokepoint":false,"part":"03","parts":["03"]},{"id":"lime_mortar","label":"Lime mortar","domain":"building","kind":"technique","start":-2500,"date_src":"general","place":"Near East; Rome","paradigm":"early_state","desc":"Quicklime slaked and mixed with sand. The lime kiln was a hub: rock, fuel, building, farming and leather in one fitting.","chokepoint":false,"part":"03","parts":["03"]},{"id":"nilometer","label":"Nilometers","domain":"institutions","kind":"infrastructure","start":-2500,"date_src":"general","place":"Egypt","paradigm":"early_state","desc":"Gauges by which the state measured the flood to set taxes, since the risk was a low or a too-high flood.","chokepoint":false,"part":"10","parts":["10"]},{"id":"silk_reeling","label":"Silk reeling","domain":"textiles","kind":"technique","start":-2500,"date_src":"general","place":"China","paradigm":"horticultural_tribal","desc":"Cocoons are boiled and the filament reeled off in skilled hours at a reel into raw silk, then twisted and dyed.","chokepoint":false,"part":"11","parts":["11"]},{"id":"silver_by_weight","label":"Silver by weight (shekel)","domain":"exchange","kind":"institution","start":-2500,"date_src":"general","place":"Mesopotamia","paradigm":"early_state","desc":"Silver weighed in shekels of ~8.3 g, beside barley, as money and measure; Old Assyrian merchants were paid in silver and gold. Needs an authority to fix and check
