one: the first large city on mineral energy.","chokepoint":true,"part":"12","parts":["12"]},{"id":"mughal_zabt","label":"Mughal zabt cash revenue","domain":"institutions","kind":"institution","start":1580,"date_src":"part","place":"Mughal India (Akbar)","paradigm":"agrarian_empire","desc":"Land measured and assessed by crop and average prices at a third to a half of produce, collected mostly in money, so peasants had to sell grain and the countryside was pulled into markets. Revenue around 1595 was roughly 90 to 100 million rupees (rough), assigned to mansabdars as jagirs rotated every few years.","chokepoint":false,"part":"11","parts":["11"]},{"id":"price_currents","label":"Printed price currents","domain":"information","kind":"good","start":1580,"date_src":"part","place":"Antwerp and Amsterdam","paradigm":"early_modern_state","desc":"Weekly printed lists of commodity prices and exchange rates from the late 16th century [s]. Public prices let anyone compare places and moved profit from knowing to carrying and financing.","chokepoint":false,"part":"04","parts":["04","12"]},{"id":"sweet_potato_china","label":"Sweet potato in China","domain":"food","kind":"good","start":1590,"date_src":"general","place":"south China uplands","paradigm":"agrarian_empire","desc":"Allowed upland settlement in south China from the 16th century (Ho Ping-ti).","chokepoint":false,"part":"11","parts":["11"]},{"id":"wind_sawmill","label":"Zaan wind sawmill","domain":"energy","kind":"industry","start":1592,"date_src":"part","wide":1650,"place":"Zaan district, Holland","paradigm":"commercial_city_state","desc":"Cornelis Corneliszoon's wind-driven sawmill of 1592 turned the windmill to industry. The Zaan had 600 to 1,000 windmills at its peak, over 200 of them sawmills [V]; they cut Baltic logs into boards for shipyards.","chokepoint":false,"part":"01","parts":["01"]},{"id":"dutch_fluyt","label":"Dutch fluyt","domain":"transport","kind":"technique","start":1595,"date_src":"general","place":"Holland","paradigm":"maritime_trading","desc":"A cheap bulk carrier of 200 to 500 t with a small crew; part of why Amsterdam won the Baltic grain trade.","chokepoint":false,"part":"04","parts":["04"]},{"id":"old_poor_law","label":"Old Poor Law","domain":"institutions","kind":"institution","start":1597,"date_src":"part","wide":1601,"place":"England","paradigm":"early_modern_state","desc":"Every parish raised a rate to relieve the old, sick, widowed, children and in bad years the able-bodied. In 1696 relief cost about £400,000, just under 1% of national income [checked]. Solar argues reliable local relief let labourers give up land for wages without risking starvation [contested].","chokepoint":false,"part":"05","parts":["05"]},{"id":"amsterdam_entrepot","label":"Amsterdam staple entrepot","domain":"exchange","kind":"institution","start":1600,"date_src":"part","place":"Amsterdam","paradigm":"commercial_city_state","desc":"Amsterdam (about 60,000 in 1600 to 200,000 in 1700) earned by storing, grading, pricing and re-exporting others' goods, with Baltic grain the 'mother trade' and the cheapest shipping: a city as an information and trust good.","chokepoint":false,"part":"12","parts":["12"]},{"id":"dadni_advances","label":"Dadni merchant advances","domain":"exchange","kind":"institution","start":1600,"date_src":"general","place":"Bengal and Coromandel","paradigm":"agrarian_empire","desc":"Merchants advanced cash to dispersed household weavers before the season and collected the cloth, on a credit network of shroffs and hundis: proto-industry centuries before Europe's.","chokepoint":false,"part":"11","parts":["11"]},{"id":"dung_market_gardens","label":"Dung-fed market gardens","domain":"food","kind":"practice","start":1600,"date_src":"general","place":"Middlesex, Surrey, Essex","paradigm":"early_modern_state","desc":"Market gardens around London fed with the city's dung and carted to Covent Garden: von Thunen's first ring, made by the city's own manure.","chokepoint":false,"part":"12","parts":["12"]},{"id":"funded_public_debt","label":"Funded public debt","domain":"exchange","kind":"institution","start":1600,"date_src":"general","wide":1694,"place":"Dutch Republic; Britain after 1688","paradigm":"early_modern_state","desc":"Long-term state borrowing at low rates against taxes voted by a parliament. Rates fell from 10 to 20% on medieval loans to about 4% on Dutch public debt and 3 to 4% on British debt in the 18th century [s, r], letting these states outspend larger rivals in war (the financial revolution).","chokepoint":false,"part":"04","parts":["04"]},{"id":"fur_trade","label":"North American fur trade","domain":"exchange","kind":"industry","start":1600,"date_src":"general","wide":1750,"place":"North America","paradigm":"frontier_settler","desc":"Commercial trapping for European markets (m): a global chain from the hunt to the hatter.","chokepoint":false,"part":"03","parts":["03"]},{"id":"ice_house","label":"Ice houses","domain":"food","kind":"infrastructure","start":1600,"date_src":"general","wide":1800,"place":"Europe","paradigm":"early_modern_state","desc":"Cool cellars and insulated stores of winter ice, first for the rich, then dairies and fish. The rung before mechanical refrigeration.","chokepoint":false,"part":"01","parts":["01"]},{"id":"joint_stock_company","label":"Joint-stock company","domain":"institutions","kind":"institution","start":1600,"date_src":"part","place":"England (East India Company); Dutch VOC 1602","paradigm":"early_modern_state","desc":"Companies with permanent capital and transferable shares: the English East India Company (1600) and the Dutch VOC (1602), whose shares traded on the Amsterdam exchange [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"naval_oak_regulation","label":"Naval oak and compass timber","domain":"institutions","kind":"institution","start":1600,"date_src":"general","wide":1750,"place":"England and France","paradigm":"early_modern_state","desc":"Navies turned great oak into a "Amsterdam bourse","paradigm":"early_modern_state","desc":"Amsterdam traded VOC shares from 1602, with forwards and options within decades; London's brokers met in coffee houses before forming the Stock Exchange (1801), New York's signed the Buttonwood Agreement in 1792 [s]. Pooled capital for long-lived works and liquidity, with bubbles (1720, 1840s, 1929).","chokepoint":false,"part":"04","parts":["04"]},{"id":"coal_wagonway","label":"Colliery wagonways","domain":"transport","kind":"infrastructure","start":1605,"date_src":"part","place":"Tyneside; Coalbrookdale","paradigm":"early_modern_state","desc":"Wooden rail tracks carried coal from Tyneside pits to the river staithes from the early 1600s, because coal paid only near water. Coalbrookdale laid cast-iron rails on them in 1767. The railway is a grown-up wagonway.","chokepoint":false,"part":"07","parts":["07"]},{"id":"newspapers","label":"Newspapers and ship news","domain":"information","kind":"good","start":1605,"date_src":"general","place":"Low Countries and Germany","paradigm":"early_modern_state","desc":"Weekly, then daily, printed news from the 17th century carrying ship arrivals, prices and politics.","chokepoint":false,"part":"04","parts":["04"]},{"id":"bank_of_amsterdam","label":"Bank of Amsterdam","domain":"exchange","kind":"institution","start":1609,"date_src":"part","place":"Amsterdam","paradigm":"early_modern_state","desc":"The Wisselbank took coin of uncertain quality and credited accounts in stable bank money that traded at a premium (the agio); large bills had to be paid through it [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"wisselbank","label":"Amsterdam Wisselbank","domain":"exchange","kind":"institution","start":1609,"date_src":"part","place":"Amsterdam","paradigm":"commercial_city_state","desc":"The exchange bank of 1609 (708 accounts in 1611, 1,202 by 1620), whose bank guilders traded at a premium over coin: the most trusted bank money of its day.","chokepoint":false,"part":"12","parts":["12"]},{"id":"amsterdam_canal_rings","label":"Canal rings on piles","domain":"building","kind":"infrastructure","start":1613,"date_src":"part","place":"Amsterdam","paradigm":"commercial_city_state","desc":"Canal rings dug from 1613, lined with warehouses on wooden piles driven into peat: the entrepot's storage and water access.","chokepoint":false,"part":"12","parts":["12"]},{"id":"new_river","label":"New River water company","domain":"building","kind":"infrastructure","start":1613,"date_src":"part","place":"Hertfordshire springs to London","paradigm":"early_modern_state","desc":"Hugh Myddelton's channel of about 60 km (1613, cost 18,524 pounds), with a private company selling piped water to paying houses a few hours a week through lead or wooden pipes.","chokepoint":false,"part":"12","parts":["12"]},{"id":"coal_glass_furnace","label":"Coal-fired glass","domain":"materials","kind":"industry","start":1615,"date_src":"part","wide":1700,"place":"England","paradigm":"early_modern_state","desc":"English glass moved to coal after the 1615 ban on wood for glass furnaces [M]; coal-fired furnaces made glass bottles in 17th-century England [M]. It joined containers to the coal chain.","chokepoint":false,"part":"01","parts":["01"]},{"id":"patent_system","label":"Patents for inventions","domain":"institutions","kind":"institution","start":1624,"date_src":"part","place":"England (Statute of Monopolies)","paradigm":"early_modern_state","desc":"Patents for new inventions; before 1852 an English patent cost about £100 and £300 or more for all three kingdoms [R], shutting out most workmen. The 1852 Act cut the first fee to about £25 and patenting rose several-fold [R]; much innovation still relied on secrecy (Moser).","chokepoint":false,"part":"07","parts":["07"]},{"id":"sankin_kotai","label":"Alternate residence","domain":"institutions","kind":"institution","start":1635,"date_src":"general","place":"Edo","paradigm":"early_modern_state","desc":"The shogunate made daimyo live in Edo in alternate years (sankin-kotai), putting perhaps half the city in samurai households (rough): a capital made by statute.","chokepoint":false,"part":"12","parts":["12"]},{"id":"goldsmith_bankers","label":"Goldsmith-bankers","domain":"exchange","kind":"practice","start":1640,"date_src":"general","place":"London","paradigm":"early_modern_state","desc":"17th-century London goldsmiths took deposits and lent more than they held: fractional-reserve banking, and with it bank runs. Their receipts were ancestors of banknotes.","chokepoint":false,"part":"04","parts":["04"]},{"id":"excise","label":"Excise on goods","domain":"institutions","kind":"institution","start":1643,"date_src":"general","place":"Dutch Republic; Britain","paradigm":"early_modern_state","desc":"Professional excise on beer, malt, salt, candles, leather and soap, collected by excise men gauging casks. Taxes on traded goods were over half of British indirect taxes by about 1800 (Dal Bó and others) [checked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"tradesmen_tokens","label":"Tradesmen's tokens","domain":"exchange","kind":"good","start":1648,"date_src":"part","place":"England","paradigm":"early_modern_state","desc":"Many thousands of kinds of private copper and lead tokens issued by English tradesmen from 1648 to 1672, and again in the 1780s and 1790s [s], to fill the 'big problem of small change': states could not supply enough small coin, so small trades ran on credit or private tokens.","chokepoint":false,"part":"04","parts":["04"]},{"id":"edo_rice_brokers","label":"Osaka rice brokers","domain":"exchange","kind":"institution","start":1650,"date_src":"general","place":"Osaka and Edo","paradigm":"early_modern_state","desc":"Brokers who turned the daimyo's tax rice into cash and shipped it by sea to Edo, which reached about a million by the 1720s (contested).","chokepoint":false,"part":"12","parts":["12"]},{"id":"industrious_revolution","label":"Industrious revolution","domain":"institutions","kind":"practice","start":1650,"date_src":"part","place":"North-west Europe","paradigm":"early_modern_state","desc":"Households worked more days and more for the market to buy sugar, tea, tobacco, pottery and printed cotton (de Vries). Male hours in London rose from about 2,288 to 3,666 a year between the 1750s and 1800 as Saint Monday and holy days went (Voth) [checked]. Allen and Weisdorf read it as hardship instead.","chokepoint":false,"part":"05","parts":["05"]},{"id":"legumes_clover","label":"Clover leys","domain":"food","kind":"practice","start":1650,"date_src":"general","wide":1800,"place":"Flanders; England","paradigm":"early_modern_state","desc":"Clover fixes nitrogen from the air and makes hay and grazing. One estimate gives clover about half the rise in crop yields between the 14th and early 19th centuries [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"life_insurance","label":"Life insurance and annuities","domain":"exchange","kind":"institution","start":1650,"date_src":"part","place":"Netherlands and England","paradigm":"early_modern_state","desc":"Contracts paying on death or for life, from the 17th century, priced as the arithmetic of mortality improved.","chokepoint":false,"part":"05","parts":["05"]},{"id":"molasses_rum","label":"Molasses and rum","domain":"food","kind":"good","start":1650,"date_src":"general","place":"the Caribbean","paradigm":"plantation_slave","desc":"Purging loaf sugar in clay cone moulds leaves molasses, later distilled into rum: a joint product of the sugar works.","chokepoint":false,"part":"11","parts":["11"]},{"id":"norfolk_four_course","label":"Norfolk four-course rotation","domain":"food","kind":"practice","start":1650,"date_src":"part","wide":1830,"place":"Norfolk, England","paradigm":"early_modern_state","desc":"Wheat, turnips, barley, clover, with no bare fallow: fodder, beasts and fertility closed in one loop on one farm. English wheat yields rose about a quarter 1700 to 1800 and a half again by 1850 "desc":"Trusts set up by act of parliament charged tolls and borrowed to surface roads (from 1663, mostly 1700 to 1830). Coach times London to Manchester or Edinburgh fell by about three quarters between the 1750s and 1830s [s, r].","chokepoint":false,"part":"04","parts":["04","07"]},{"id":"city_coal_dues","label":"City coal dues","domain":"institutions","kind":"institution","start":1667,"date_src":"general","place":"City of London","paradigm":"early_modern_state","desc":"The City taxed coal coming in, and coal dues rebuilt St Paul's after 1666: a tax at the city end of a fuel chokepoint.","chokepoint":false,"part":"12","parts":["12"]},{"id":"central_bank","label":"Central banks","domain":"exchange","kind":"institution","start":1668,"date_src":"part","wide":1913,"place":"Sweden (Riksbank); England (1694)","paradigm":"early_modern_state","desc":"The Riksbank (1668) is the oldest surviving; the Bank of England (1694) was founded on a £1.2 million loan to the government, issued banknotes and later became lender of last resort (Bagehot's rule, 1873) [s]. The Federal Reserve followed the panic of 1907 (1913).","chokepoint":false,"part":"04","parts":["04"]},{"id":"fire_insurance","label":"Fire insurance office","domain":"exchange","kind":"institution","start":1680,"date_src":"part","place":"London (the Fire Office)","paradigm":"early_modern_state","desc":"Insurance against fire, begun in London after the 1666 fire; one of the institutions great fires called into being.","chokepoint":false,"part":"12","parts":["12"]},{"id":"fiscal_military_state","label":"Fiscal-military state","domain":"institutions","kind":"institution","start":1688,"date_src":"part","place":"Britain after 1688; Dutch Republic","paradigm":"early_modern_state","desc":"Parliament's control of taxes, a professional excise, the Bank of England and funded debt raised British taxes from a few per cent of national income to the low teens and near a fifth in the Napoleonic wars [rough, unchecked]. 'War made the Horse-drawn sowing in rows at a set depth saves seed and allows hoeing, as turnips in rows needed. Slow to spread until the 19th century [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"coke","label":"Coke smelting of iron","domain":"energy","kind":"technique","start":1709,"date_src":"part","wide":1806,"place":"Coalbrookdale (Abraham Darby I)","paradigm":"industrial","desc":"Coal baked free of sulphur and tar replaced charcoal in the blast furnace in 1709. It needed a coking coal and low-sulphur ore on one site and a market for cast pots, and beat charcoal iron on cost only from the 1750s. By 1806, 162 of 173 British furnaces used coke.","chokepoint":false,"part":"07","parts":["07"]},{"id":"deep_coal_mining","label":"Deep drained coal pits","domain":"energy","kind":"industry","start":1712,"date_src":"part","place":"British coalfields (Tyneside, South Wales, Lancashire)","paradigm":"industrial","desc":"Coal grew by more men and deeper pits, not machines at the face: pick-and-shovel work until the twentieth century. Depth needed pumping, ventilation and haulage. Coal was a chokepoint of geology: industries moved to the coalfields, and output rose from about 3 million tons (1700) to 287 million (1913), with about 1.1 million miners [R].","chokepoint":true,"part":"07","parts":["07"]},{"id":"steam_engine","label":"Newcomen steam engine","domain":"energy","kind":"technique","start":1712,"date_src":"part","place":"near Dudley Castle, England","paradigm":"industrial","desc":"An atmospheric engine: steam condensed under a piston worked a beam and a mine pump, about 5.5 hp [R]. It needed a cast brass or iron cylinder, a boiler, and a flooding mine with unsaleable slack coal to burn, so it paid first at collieries. About 2,200 engines were built in eighteenth-century Britain.","chokepoint":false,"part":"07","parts":["07"]},{"id":"gold_standard","label":"Gold standard","domain":"exchange","kind":"institution","start":1717,"date_src":"part","wide":1875,"place":"Britain","paradigm":"industrial","desc":"Britain moved onto gold de facto in 1717 when Newton overvalued the guinea, and by law in 1816 to 1821 [s]. From the 1870s to 1914 most trading nations fixed to gold: stable exchange rates and free capital, but money supply tied to mining and recurring deflation.","chokepoint":false,"part":"04","parts":["04"]},{"id":"bubble_act","label":"Bubble Act","domain":"institutions","kind":"institution","start":1720,"date_src":"part","place":"Britain (1720 to 1825)","paradigm":"early_modern_state","desc":"Restricted joint-stock companies after the South Sea crash, so canals, turnpikes, docks and railways were set up one at a time by private Act.","chokepoint":false,"part":"07","parts":["07"]},{"id":"capitalist_tenant_farm","label":"Capitalist tenant farms","domain":"institutions","kind":"institution","start":1720,"date_src":"general","place":"Holkham, Norfolk","paradigm":"early_modern_state","desc":"Large tenant farms on long leases with rotation covenants (Coke of Holkham): the landlord built barns, yards and roads, the tenant stocked the farm, landless labourers worked it. Overton calls it a revolution in institutions as well as output [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"fanning_mill","label":"Fanning mill","domain":"food","kind":"technique","start":1720,"date_src":"general","place":"Britain and Europe","paradigm":"early_modern_state","desc":"A cranked winnowing machine of the 18th century that replaced winnowing in the wind between barn doors [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"porter_breweries","label":"Porter breweries","domain":"food","kind":"industry","start":1720,"date_src":"general","place":"London","paradigm":"industrial","desc":"London porter breweries of the 18th century were among the largest firms of their day, later owning tied houses [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"flying_shuttle","label":"Flying shuttle","domain":"textiles","kind":"technique","start":1733,"date_src":"part","wide":1760,"place":"England (John Kay)","paradigm":"early_modern_state","desc":"One weaver could work a wide loom, roughly doubling weaving speed [R]; it spread slowly against resistance. It deepened the spinning bottleneck: one loom needed the yarn of several spinners [R: three to five].","chokepoint":false,"part":"03","parts":["03","07"]},{"id":"crucible_steel","label":"Crucible steel","domain":"metals","kind":"technique","start":1740,"date_src":"part","wide":1800,"place":"Sheffield (Huntsman)","paradigm":"early_modern_state","desc":"Steel melted in clay pots from Swedish bar iron with coke heat and refractory clay. It made cutlery, tools and springs in small, dear batches until Bessemer.","chokepoint":false,"part":"03","parts":["03","07"]},{"id":"lead_chamber_acid","label":"Lead-chamber sulphuric acid","domain":"materials","kind":"technique","start":1746,"date_src":"part","place":"Birmingham; Prestonpans 1749 (Roebuck and Garbett)","paradigm":"early_modern_state","desc":"Sulphuric acid made in lead rooms instead of glass globes, from Sicilian sulphur and saltpetre. Dilute acid replaced sour milk in bleaching, and acid fed bleach, soda and superphosphate.","chokepoint":false,"part":"07","parts":["07"]},{"id":"sulphuric_acid","label":"Sulphuric acid","domain":"materials","kind":"good","start":1746,"date_src":"general","paradigm":"industrial","place":"","desc":"The base chemical of the chemical industry: bleaching, soda, fertiliser. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"london_corn_exchange","label":"Corn factors and Corn Exchange","domain":"exchange","kind":"institution","start":1747,"date_src":"part","place":"Bear Key and Mark Lane, London","paradigm":"early_modern_state","desc":"Corn factors sold grain and flour brought by coaster and Thames barge from the Home Counties, East Anglia and Kent; the Corn Exchange opened in Mark Lane in 1747. London (about 960,000 by 1801) ate about a quarter of wheat a head a year.","chokepoint":false,"part":"12","parts":["12"]},{"id":"parliamentary_enclosure","label":"Parliamentary enclosure","domain":"institutions","kind":"institution","start":1750,"date_src":"part","place":"England","paradigm":"industrial","desc":"From 1750 mostly by private act of parliament: about 7.25 to 7.35 million acres, some 22% of England [checked]. Turning a split bundle of rights into a single holder's needed a strong institution to register and override small rights.","chokepoint":false,"part":"05","parts":["05"]},{"id":"bridgewater_canal","label":"Bridgewater Canal","domain":"transport","kind":"infrastructure","start":1761,"date_src":"part","place":"Worsley to Manchester (engineer Brindley)","paradigm":"industrial","desc":"Built for the Duke of Bridgewater's Worsley coal; Manchester's coal price halved within a year. It began the canal age: about 4,000 miles by the 1830s [R], horse boats of 20 to 30 tons, at a quarter to a half of road cost per ton-mile [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"spinning_jenny","label":"Spinning jenny","domain":"textiles","kind":"technique","start":1765,"date_src":"part","place":"Lancashire (Hargreaves)","paradigm":"industrial","desc":"A cottage machine on a joiner's frame letting one spinner work 8, then up to 120 spindles of weft. It stayed in the home under putting-out; Allen argues it paid first where wages were high [C].","chokepoint":false,"part":"07","parts":["07"]},{"id":"useful_knowledge_societies","label":"Lunar Society and institutes","domain":"information","kind":"institution","start":1765,"date_src":"general","place":"Birmingham (Lunar Society)","paradigm":"industrial","desc":"Useful knowledge moved through societies (Boulton, Watt, Wedgwood, Priestley), lectures, mechanics' institutes and journals. Mokyr ties the revolution to this contact and to a broad tail of skilled mechanics who improved others' inventions.","chokepoint":false,"part":"07","parts":["07"]},{"id":"manufactory","label":"Centralised manufactory","domain":"institutions","kind":"practice","start":1766,"date_src":"part","place":"Soho, Birmingham; Etruria, Stoke","paradigm":"industrial","desc":"Hand workers gathered under one roof before power did: Boulton's Soho Manufactory (1766, several hundred workers [R]) and Wedgwood's Etruria (1769), with a fine division of labour, clocking-in and rules.","chokepoint":false,"part":"07","parts":["07"]},{"id":"statutory_company","label":"Statutory canal company","domain":"institutions","kind":"institution","start":1766,"date_src":"general","place":"England (Trent & Mersey, canal mania of the 1790s)","paradigm":"industrial","desc":"Canals, docks and railways were incorporated by private Act with shares, tolls and powers over land along the route. It was the industrial era's way round the Bubble Act, and its shares traded on the stock exchange.","chokepoint":false,"part":"07","parts":["07"]},{"id":"mechanised_spinning","label":"Water frame","domain":"textiles","kind":"technique","start":1769,"date_src":"part","place":"Cromford, Derbyshire (Arkwright)","paradigm":"industrial","desc":"Water-driven rollers spun strong warp yarn, so all-cotton cloth could be made. It needed a wheel, a millwright, capital and a fast stream. Yarn prices fell sharply once Arkwright's patents were overturned in 1785.","chokepoint":false,"part":"07","parts":["07"]},{"id":"cheque_clearing","label":"Cheques and clearing houses","domain":"exchange","kind":"institution","start":1770,"date_src":"part","place":"London","paradigm":"industrial","desc":"Banks net their claims on each other daily instead of moving coin (London clearing house from the 1770s) [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"country_banks","label":"Country banks","domain":"exchange","kind":"institution","start":1770,"date_src":"part","place":"England; Lancashire","paradigm":"industrial","desc":"Country banks grew from about a hundred in the 1770s to several hundred by 1810 [R], issuing notes and discounting bills; in Lancashire bills of exchange circulated as money. Crises in 1825, 1847, 1857 and 1866 broke weak banks.","chokepoint":false,"part":"07","parts":["07"]},{"id":"factory_system","label":"Cromford cotton factory","domain":"institutions","kind":"institution","start":1771,"date_src":"part","wide":1830,"place":"Cromford, Derbyshire (Arkwright, Strutt, Need)","paradigm":"industrial","desc":"Workers, wheel and machines in one building: the owner held tools and material, paid wages by time or piece, and ruled by the bell and the clock. Powered machines could not be put out. Families and children were brought and housed in a mill village.","chokepoint":false,"part":"05","parts":["05","07"]},{"id":"cast_plate_glass","label":"Cast plate glass","domain":"materials","kind":"industry","start":1773,"date_src":"part","place":"Ravenhead, St Helens","paradigm":"industrial","desc":"The British Cast Plate Glass Company used French casting methods. St Helens had coal and sand and, after the 1820s, the alkali works next door; Pilkington started there in 1826.","chokepoint":false,"part":"07","parts":["07"]},{"id":"clearing_house","label":"Bankers' clearing house","domain":"exchange","kind":"institution","start":1773,"date_src":"part","place":"London","paradigm":"industrial","desc":"Bankers settled cheques against each other in one place from 1773, netting payments instead of moving coin.","chokepoint":false,"part":"12","parts":["12"]},{"id":"cannon_boring_mill","label":"Wilkinson's boring mill","domain":"metals","kind":"technique","start":1774,"date_src":"part","place":"John Wilkinson's ironworks, England","paradigm":"industrial","desc":"A cannon borer turned to boring engine cylinders true to 'the thickness of an old shilling' [R]. Without it Watt's engine could not hold its steam. Military demand made the machine tool that made the engine.","chokepoint":false,"part":"07","parts":["07"]},{"id":"machinery_export_ban","label":"Bans on artisan emigration","domain":"institutions","kind":"institution","start":1774,"date_src":"general","place":"Britain","paradigm":"industrial","desc":"Britain barred skilled artisans from emigrating (until 1825) and machinery from export (until 1843). Both leaked: Samuel Slater carried the Arkwright system in his head to Rhode Island in 1789.","chokepoint":false,"part":"07","parts":["07"]},{"id":"watt_engine","label":"Watt separate condenser","domain":"energy","kind":"technique","start":1775,"date_src":"part","place":"Soho, Birmingham (Boulton & Watt, from 1775)","paradigm":"industrial","desc":"Patented 1769 and built from 1775: condensing steam apart kept the cylinder hot, cutting coal use to a third or a quarter of Newcomen's [R]. It needed Wilkinson's bored cylinder, Boulton's capital and a 1775 Act extending the patent to 1800. Cornish mines, paying dearly for Welsh coal, bought first; Watt charged a third of the fuel saved.","chokepoint":false,"part":"07","parts":["07"]},{"id":"steam_blown_furnace","label":"Steam-blown blast furnace","domain":"metals","kind":"technique","start":1776,"date_src":"part","place":"Broseley (Wilkinson)","paradigm":"industrial","desc":"Watt engines blew the furnaces and pumped water back over wheels from 1776. Furnaces left the river for the coalfield, larger and running all year: iron and steam became each other's customer.","chokepoint":false,"part":"07","parts":["07"]},{"id":"spinning_mule","label":"Spinning mule","domain":"textiles","kind":"technique","start":1779,"date_src":"part","wide":1800,"place":"Bolton (Crompton)","paradigm":"industrial","desc":"Combined jenny and rollers to spin fine strong yarn matching Indian muslins; never patented. Hours to spin 100 lb of cotton fell from about 50,000 by hand to 2,000 on the 1780 mule [R]. Mule spinning became a skilled adult male trade.","chokepoint":false,"part":"03","parts":["03","07"]},{"id":"demographic_transition","label":"Demographic transition","domain":"institutions","kind":"practice","start":1780,"date_src":"part","wide":1900,"place":"North-west Europe","paradigm":"industrial","desc":"Death rates fell first (late 18th century), then births (from the 1870s). England grew from about 5.8 million (1750) to 16.7 million (1851) [rough]; population and real wages rose together. Today world fertility is about 2.25 and 58% live in towns [checked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"handloom_weaving_boom","label":"Handloom weaving on mill yarn","domain":"textiles","kind":"practice","start":1780,"date_src":"general","place":"Lancashire and Yorkshire villages","paradigm":"industrial","desc":"Cheap machine yarn made handloom weaving grow for decades, to perhaps a quarter of a million weavers about 1820 [R]. It collapsed as power looms rose, hence the Luddites (1811 to 1816).","chokepoint":false,"part":"07","parts":["07"]},{"id":"liverpool_cotton_market","label":"Liverpool cotton port","domain":"exchange","kind":"institution","start":1780,"date_src":"general","place":"Liverpool","paradigm":"maritime_trading","desc":"Britain's leading slave-trading port (roughly half or more of the trade [R]) turned its docks, merchants and credit to cotton; its brokers' market set the world price. Inland carriage ran by the Mersey and Irwell Navigation, canals, then the 1830 railway.","chokepoint":false,"part":"07","parts":["07"]},{"id":"rotative_engine","label":"Rotative steam engine","domain":"energy","kind":"technique","start":1781,"date_src":"part","wide":1830,"place":"Soho, Birmingham","paradigm":"industrial","desc":"From 1781 Watt's engines turned a shaft, so steam could drive mills, not only pumps; 268 Boulton & Watt engines were rotative. Steam reached parity with water power only about 1830, at about 165,000 hp each [R]: a general-purpose technology that took decades to pay.","chokepoint":false,"part":"07","parts":["07"]},{"id":"rolling_mill","label":"Grooved rolling mill","domain":"metals","kind":"technique","start":1783,"date_src":"part","place":"Britain (Henry Cort, patents 1783 to 1784)","paradigm":"industrial","desc":"Hot iron passed through grooved rolls instead of under the hammer, shaping bars, plate and rails fast. The rolls needed steam engines to turn them. Birkinshaw's rolled rails of 1820 came from it.","chokepoint":false,"part":"07","parts":["07"]},{"id":"puddling","label":"Puddling","domain":"metals","kind":"technique","start":1784,"date_src":"part","place":"Britain (Henry Cort); typified at Merthyr Tydfil","paradigm":"industrial","desc":"Pig iron stirred in a coal-fired reverberatory furnace became wrought iron from coal alone, ending the charcoal finery. Puddlers held a heavy long skill of judgement. Merthyr's Cyfarthfa and Dowlais became the world's largest ironworks.","chokepoint":false,"part":"07","parts":["07"]},{"id":"line_shaft_drive","label":"Line-shaft factory","domain":"energy","kind":"practice","start":1785,"date_src":"general","place":"steam mills of Britain and the US","paradigm":"industrial","desc":"A steam factory was built round one engine turning line shafts and belts on every floor, tall and narrow to keep shafts short. The first electric motors simply replaced the engine at the head of the shafts (group drive), and little was gained.","chokepoint":false,"part":"08","parts":["08"]},{"id":"power_loom","label":"Power loom","domain":"textiles","kind":"technique","start":1785,"date_src":"part","wide":1850,"place":"Cartwright; practical with Horrocks and Roberts","paradigm":"industrial","desc":"Weaving by power came decades after power spinning, practical only in the 1800s to 1820s with iron frames. Power looms rose from a few thousand (1813) to about 250,000 (1850) [R], and handloom piece rates fell by more than half [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"steam_cotton_mill","label":"Steam-powered cotton mill","domain":"textiles","kind":"industry","start":1785,"date_src":"part","place":"Papplewick; then Manchester ('Cottonopolis')","paradigm":"industrial","desc":"The first steam-powered cotton mill (1785) used a rotative Watt engine, freeing mills from streams. Mills moved to the Lancashire coalfield: Manchester grew from about 90,000 (1801) to about 400,000 (1851) [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"threshing_machine","label":"Threshing machine","domain":"food","kind":"technique","start":1786,"date_src":"part","place":"Scotland (Andrew Meikle)","paradigm":"industrial","desc":"Raised output per worker about 5 times with horse power and 10 times with water power [c]. It took the winter work that kept labourers off poor relief, and the Swing riots of 1830 (over 3,000 across 45 counties) targeted it [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"cotton_factor_credit","label":"Cotton factors and crop credit","domain":"exchange","kind":"institution","start":1790,"date_src":"general","place":"New Orleans, Mobile, Charleston; London, Liverpool","paradigm":"plantation_slave","desc":"Factors advanced credit to planters, who borrowed on land and on enslaved people as collateral. London and Liverpool houses (Barings, Browns) financed the crop with bills of exchange.","chokepoint":false,"part":"07","parts":["07"]},{"id":"leblanc_process","label":"Leblanc soda","domain":"materials","kind":"technique","start":1790,"date_src":"part","wide":1830,"place":"France (Leblanc); Liverpool, St Helens, Widnes from 1823 (Muspratt)","paradigm":"industrial","desc":"Salt and sulphuric acid gave salt cake, roasted with limestone and coal to black ash and leached to soda. In Britain it grew after the salt tax cut of 1823, on Cheshire salt and Lancashire coal by the Mersey: about 200,000 tons a year in the 1870s, more than the rest of the world [R].","chokepoint":false,"part":"01","parts":["01","07"]},{"id":"machine_cut_nails","label":"Machine-made nails","domain":"metals","kind":"good","start":1790,"date_src":"general","wide":1840,"place":"USA and Britain","paradigm":"industrial","desc":"Nails cut by machine rather than forged by hand (18th to 19th c.) (m); with sawmills they made the balloon frame possible.","chokepoint":false,"part":"03","parts":["03"]},{"id":"gas_lighting","label":"Coal-gas lighting","domain":"energy","kind":"industry","start":1792,"date_src":"part","wide":1850,"place":"Murdoch in Cornwall and Soho; London (Gas Light and Coke Co., 1812)","paradigm":"industrial","desc":"Coal heated in a closed retort gives gas, coke and tar at once. Murdoch lit his house with gas in 1792 and the Gas Light and Coke Company was chartered in 1812; most British towns had gas light by the 1830s [R]. It let mills run long winter shifts and lit streets at night.","chokepoint":false,"part":"01","parts":["01","07"]},{"id":"cotton_gin","label":"Cotton gin","domain":"textiles","kind":"technique","start":1793,"date_src":"part","place":"Georgia (Whitney)","paradigm":"plantation_slave","desc":"Cleaned short-staple upland cotton many times faster [R], answering the demand of the British mills. Cotton spread across the American South, from about 1.5 million lb (1790) to about 2 billion lb (1860) [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"cotton_ginning","label":"Cotton ginning","domain":"textiles","kind":"technique","start":1793,"date_src":"general","place":"US South (Whitney's saw gin)","paradigm":"plantation_slave","desc":"The gin separates lint from seed to make bales; picking is by machine in the US, Australia and Brazil and by hand in much of India and Africa. China and India grow about 25-28 million bales each (USDA via Cotton Inc.). A joint-product step: cottonseed goes to oil and feed.","chokepoint":false,"part":"13","parts":["13"]},{"id":"cotton_plantation","label":"Cotton South plantations","domain":"textiles","kind":"industry","start":1793,"date_src":"part","place":"American South","paradigm":"plantation_slave","desc":"Upland cotton grown on land worked by enslaved people; the enslaved population rose from about 700,000 to about 4 million, 1790 to 1860, and perhaps a million were moved by the internal trade [R]. The US supplied over 70% of British cotton from the late 1820s; how far this financed industry is disputed [C].","chokepoint":false,"part":"07","parts":["07"]},{"id":"iron_frame_mill","label":"Iron-framed mill","domain":"building","kind":"infrastructure","start":1797,"date_src":"part","place":"Ditherington, Shrewsbury (Charles Bage)","paradigm":"industrial","desc":"Bage's flax mill of 1797 was the first iron-framed building, built so textile mills would not burn. The same idea carried cast and wrought iron frames to warehouses and the Crystal Palace.","chokepoint":false,"part":"07","parts":["07"]},{"id":"steam_struck_coinage","label":"Steam-struck copper coinage","domain":"exchange","kind":"technique","start":1797,"date_src":"part","place":"Birmingham (Soho Mint), England","paradigm":"industrial","desc":"Matthew Boulton's steam-powered presses struck uniform copper coins for the crown in 1797 [s], hard to counterfeit, ending the second wave of private tokens.","chokepoint":false,"part":"04","parts":["04"]},{"id":"chlorine_bleach","label":"Chlorine bleaching powder","domain":"materials","kind":"technique","start":1799,"date_src":"part","wide":1830,"place":"St Rollox, Glasgow (Charles Tennant)","paradigm":"industrial","desc":"Chlorine (Berthollet, 1785), then Tennant's bleaching powder from acid, salt, manganese dioxide and lime, cut bleaching from months to days. St Rollox became the world's largest chemical works in the 1830s and 1840s, over 100 acres.","chokepoint":false,"part":"01","parts":["01","07"]},{"id":"high_pressure_engine","label":"High-pressure steam engine","domain":"energy","kind":"technique","start":1799,"date_src":"part","place":"Cornwall (Trevithick); Woolf compound 1804","paradigm":"industrial","desc":"Small, light engines from about 1799, once Watt's patent ended (1800), made the locomotive possible. They needed wrought-iron boiler plate. Shared monthly reports in Lean's Engine Reporter (from 1811) helped Cornish engines reach 60 to 100 million duty by the 1840s [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"flush_toilet","label":"Flush toilets","domain":"building","kind":"technique","start":1800,"date_src":"general","wide":1850,"place":"London","paradigm":"industrial","desc":"Flush toilets spreading after the 1850s sent waste into old storm drains and the Thames, multiplying sewage by the water used. Piped water before sewers creates the crisis that sewers solve.","chokepoint":false,"part":"12","parts":["12"]},{"id":"industrial_town","label":"Industrial town","domain":"building","kind":"infrastructure","start":1800,"date_src":"part","place":"Manchester and the coalfield towns","paradigm":"industrial","desc":"Towns grew faster than water, drains and housing: back-to-backs, cellar dwellings, shared privies, rivers for both water and sewage. Chadwick (1842) gave average ages at death of 17 for Manchester labourers against 38 in rural Rutland [C]; cholera struck in 1831, 1848, 1853 and 1866.","chokepoint":false,"part":"07","parts":["07"]},{"id":"machine_tools","label":"Maudslay's machine tools","domain":"metals","kind":"technique","start":1800,"date_src":"part","place":"Lambeth, London (Maudslay's shop)","paradigm":"industrial","desc":"The screw-cutting lathe with slide rest and change gears (about 1800), true planes and a bench micrometer: machines made in iron to drawings. Maudslay's shop trained Roberts, Clement, Nasmyth and Whitworth; skills spread by apprenticeship and the movement of men, not books.","chokepoint":false,"part":"07","parts":["07"]},{"id":"piped_water","label":"Piped water","domain":"building","kind":"infrastructure","start":1800,"date_src":"general","paradigm":"industrial","place":"","desc":"Mains water supply to houses. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"plantation_forestry","label":"Plantation forestry","domain":"materials","kind":"practice","start":1800,"date_src":"part","wide":1920,"place":"Germany and Britain","paradigm":"industrial","desc":"Conifers in even-aged blocks for pit props, pulp and boards: the wood became a crop managed by an owner with machines. The coppice commons fell with the demand that made it worth defending.","chokepoint":false,"part":"03","parts":["03"]},{"id":"factory_acts","label":"Factory Acts","domain":"institutions","kind":"institution","start":1802,"date_src":"part","place":"Britain","paradigm":"industrial","desc":"Child labour was central to the early mills (pauper apprentices at Styal). The Factory Acts (1802, 1819; 1833, the first with paid inspectors), the Mines Act (1842) and the Ten Hours Act (1847) were the response.","chokepoint":false,"part":"05","parts":["05","07"]},{"id":"portsmouth_block_mills","label":"Portsmouth Block Mills","domain":"metals","kind":"industry","start":1803,"date_src":"part","place":"Portsmouth dockyard","paradigm":"industrial","desc":"Maudslay, Marc Brunel and Bentham built 45 machines (1803 to 1808) making the navy's pulley blocks, about 130,000 in 1808. It was claimed ten unskilled men did the work of 110 skilled blockmakers: the first mass production by machine tools.","chokepoint":false,"part":"07","parts":["07"]},{"id":"canning","label":"Tin cans","domain":"food","kind":"technique","start":1810,"date_src":"part","place":"Britain and France","paradigm":"industrial","desc":"Food sealed in tinplate (iron sheet coated with tin) with solder, from the 1810s [M]; first for armies and ships. Containers joined tin mining and later steel.","chokepoint":false,"part":"01","parts":["01","02"],"wide":1870},{"id":"coal_tar_chemicals","label":"Coal tar","domain":"materials","kind":"resource","start":1812,"date_src":"part","place":"British gasworks and coke ovens","paradigm":"industrial","desc":"The tar left by gasworks was a waste for decades. It became creosote, road pitch, naphtha (Macintosh used it in 1823 to dissolve rubber for waterproof cloth) and, from 1856, the feedstock of synthetic dyes. A textbook joint product whose by-products made later industries.","chokepoint":false,"part":"07","parts":["07"]},{"id":"steamship","label":"Iron steamships","domain":"transport","kind":"technique","start":1812,"date_src":"part","wide":1880,"place":"North Atlantic","paradigm":"industrial","desc":"Steam and iron then steel hulls from the 1850s made ocean freight cheap and schedules regular: transatlantic costs fell about 41 to 70% to 1913 [c], tramp rates roughly halved from the early 1870s [c].","chokepoint":false,"part":"04","parts":["04","07"]},{"id":"town_gas","label":"Town gas lighting","domain":"energy","kind":"infrastructure","start":1812,"date_src":"part","place":"London","paradigm":"industrial","desc":"Gas made from coal piped through the streets for lighting from 1812, by private companies later taken over or regulated by cities: the fuel network layer.","chokepoint":false,"part":"12","parts":["12"]},{"id":"interchangeable_parts","label":"American system of parts","domain":"metals","kind":"technique","start":1815,"date_src":"part","place":"US armouries (Springfield, Harpers Ferry)","paradigm":"industrial","desc":"Armouries pursued uniform musket parts; John Hall made interchangeable rifles by the late 1820s with jigs, gauges and special machines. It needed a tolerance discipline and a large uniform order (the army) and cost more than hand fitting at first [C: Hounshell]. Enfield bought American machines in 1855 to 1857.","chokepoint":false,"part":"07","parts":["07"]},{"id":"token_coinage","label":"State token coinage","domain":"exchange","kind":"institution","start":1816,"date_src":"general","place":"Britain and Europe","paradigm":"industrial","desc":"The 19th-century fix to small change: base-metal coins worth more than their metal, whose value comes from the state's promise to exchange them for full money, issued by a monopoly mint in limited quantity.","chokepoint":false,"part":"04","parts":["04"]},{"id":"textile_machine_makers","label":"Textile machine makers","domain":"metals","kind":"industry","start":1820,"date_src":"part","place":"Manchester (Sharp, Roberts & Co., Atlas Works 1828)","paradigm":"industrial","desc":"Engineering firms grew up making mill machinery because the mills were their customers, then built machine tools and locomotives. Rosenberg's technological convergence: the same turning, boring and planing serve many industries.","chokepoint":false,"part":"07","parts":["07"]},{"id":"wrought_iron_rails","label":"Rolled wrought-iron rails","domain":"metals","kind":"good","start":1820,"date_src":"part","place":"Bedlington (Birkinshaw)","paradigm":"industrial","desc":"Rolled wrought-iron rails, laid on the Stockton & Darlington, replaced brittle cast-iron rails. The railway manias took a large share of iron output [R]; steel rails from the 1860s lasted many times longer.","chokepoint":false,"part":"07","parts":["07"]},{"id":"leblanc_waste","label":"Alkali acid gas and galligu","domain":"materials","kind":"resource","start":1823,"date_src":"part","place":"Widnes and St Helens","paradigm":"industrial","desc":"For every eight tons of soda ash, about five and a half tons of hydrogen chloride gas and seven tons of calcium sulphide waste [R]. The gas killed crops and trees for miles; the heaps poisoned streams: a commons.","chokepoint":false,"part":"07","parts":["07"]},{"id":"locomotive_works","label":"Locomotive works","domain":"transport","kind":"industry","start":1823,"date_src":"part","place":"Newcastle (Robert Stephenson & Co.); Crewe and Swindon 1843","paradigm":"industrial","desc":"The first purpose-built locomotive works came from the colliery wagonway world; Rocket won the Rainhill trials in 1829. Sharp Stewart, Beyer Peacock (1854) and company towns at Crewe and Swindon followed, Crewe making its own Bessemer steel from 1864.","chokepoint":false,"part":"07","parts":["07"]},{"id":"cement_concrete","label":"Portland cement","domain":"building","kind":"technique","start":1824,"date_src":"part","place":"Leeds (Joseph Aspdin)","paradigm":"industrial","desc":"Patented 1824 after Smeaton's hydraulic lime work (1756) and Parker's Roman cement (1796), improved with hotter clinker in the 1840s. Firing needed coal kilns and grinding needed steam mills; Bazalgette's drainage used it on a vast scale with strength testing [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"trade_unions","label":"Trade unions","domain":"institutions","kind":"institution","start":1824,"date_src":"part","wide":1950,"place":"Britain","paradigm":"industrial","desc":"Legal after repeal of the Combination Acts (1824 to 1825) and the Trade Union Act 1871 [unchecked]; raised wages where they could restrict supply or stop production. OECD density halved from about 30% (1985) to about 15% (2023 to 2024); US 9.9% in 2024 [checked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"railway","label":"Steam railway","domain":"transport","kind":"infrastructure","start":1825,"date_src":"part","wide":1850,"place":"Stockton & Darlington (1825); Liverpool & Manchester (1830)","paradigm":"industrial","desc":"Iron rails on graded track with locomotives, signals and timetables. It needed wrought-iron rails, high-pressure engines, engineering workshops, joint-stock capital and private Acts with compulsory purchase. Real freight charges per ton-mile by 1870 were about a twentieth of 1700's wagons (Bogart); about 15,000 miles by 1870 [R].","chokepoint":false,"part":"04","parts":["04","07"]},{"id":"self_acting_mule","label":"Self-acting mule","domain":"textiles","kind":"technique","start":1825,"date_src":"part","wide":1850,"place":"Lancashire","paradigm":"industrial","desc":"Roberts's automatic mule (patents 1825, 1830) spun about 900 hanks a machine a day against about 25 for a jenny and 8 for a hand wheel (cited). Hours to spin 100 lb of cotton fell from about 50,000 by hand to about 135 (m, contested).","c phate","label":"Superphosphate","domain":"materials","kind":"good","start":1842,"date_src":"part","place":"England (Lawes; Rothamsted)","paradigm":"industrial","desc":"Bones or rock phosphate treated with sulphuric acid, patented by John Bennet Lawes in 1842, with the Rothamsted experiments from 1843 [s].","chokepoint":false,"part":"02","parts":["02","07"]},{"id":"gutta_percha","label":"Gutta-percha","domain":"materials","kind":"resource","start":1843,"date_src":"general","place":"Malaya","paradigm":"industrial","desc":"A latex from Malayan trees, for decades the only good insulator under sea water. Submarine cables depended on it: a tropical chokepoint, as rubber was for tyres.","chokepoint":true,"part":"08","parts":["08"]},{"id":"iron_hull_steamship","label":"Iron screw steamship","domain":"transport","kind":"technique","start":1843,"date_src":"part","place":"Bristol (Brunel's Great Britain)","paradigm":"industrial","desc":"Brunel's Great Britain (1843), iron-hulled and screw-driven, joined iron plate to the marine engine; steel hulls followed. Shipwrights and boilermakers had to work in iron.","chokepoint":false,"part":"07","parts":["07"]},{"id":"wood_pulp","label":"Wood pulp","domain":"materials","kind":"good","start":1844,"date_src":"general","wide":1900,"place":"Germany and North America","paradigm":"industrial","desc":"Wood ground or cooked to fibre for paper and cardboard; with plywood and particleboard, wood as fibre and panel rather than beam (20th c.).","chokepoint":false,"part":"03","parts":["03"]},{"id":"railway_mania","label":"Railway mania","domain":"exchange","kind":"practice","start":1845,"date_src":"part","place":"Britain (1845 to 1847)","paradigm":"industrial","desc":"Railway investment reached several percent of GDP a year [R], raised through shares on the stock exchange, then crashed. The over-built lines were used cheaply afterwards; cumulative railway investment reached about 60% of GDP by 1913 [R].","chokepoint":false,"part":"07","parts":["07 t a scale no village faces, needing rates, borrowing and engineers.","chokepoint":false,"part":"07","parts":["07"]},{"id":"telegraph_prices","label":"Telegraph price reporting","domain":"information","kind":"practice","start":1848,"date_src":"general","place":"Chicago, New York, Liverpool","paradigm":"industrial","desc":"Telegraph prices brought New York and Liverpool prices to the prairie: prices that travel.","chokepoint":false,"part":"12","parts":["12"]},{"id":"chicago_lumber_market","label":"Chicago lumber market","domain":"materials","kind":"industry","start":1850,"date_src":"part","place":"Chicago","paradigm":"frontier_settler","desc":"Michigan and Wisconsin white pine floated to lake ports, came by schooner to Chicago and went out by rail to the treeless prairie; by the 1850s the world's largest lumber market. The forest was cut over in a generation.","chokepoint":false,"part":"12","parts":["12"]},{"id":"chilean_nitrate","label":"Chilean nitrate","domain":"materials","kind":"resource","start":1850,"date_src":"part","place":"Atacama, Chile","paradigm":"industrial","desc":"From the mid-nineteenth century farms and explosives makers bought Chilean sodium nitrate beside manure, legumes and guano. A chokepoint by geology: Crookes warned of a nitrogen limit in 1898, and the British blockade cut Germany off in the First World War.","chokepoint":true,"part":"02","parts":["02","08"]},{"id":"coaling_stations","label":"Coaling stations","domain":"transport","kind":"infrastructure","start":1850,"date_src":"general","place":"ports of the British Empire","paradigm":"industrial","desc":"Steamships needed coal depots along every route, stocked with Welsh steam coal and held by empire. The part names them the chokepoint of ocean steam.","chokepoint":true,"part":"07","parts":["07"]},{"id":"fish_train","label":"Ice and the fish train","domain":"transport","kind":"practice","start":1850,"date_src":"part","wide":1900,"place":"Britain","paradigm":"industrial","desc":"Ice and railways in the 19th century (m) carried fresh fish to inland cities.","chokepoint":false,"part":"03","parts":["03"]},{"id":"grain_elevator","label":"Steam grain elevators","domain":"food","kind":"infrastructure","start":1850,"date_src":"part","place":"Buffalo, then Chicago","paradigm":"industrial","desc":"Steam elevators took grain in bulk instead of in each farmer's sacks; an elevator receipt returned an equal quantity of equal grade, so ownership separated from the grain.","chokepoint":false,"part":"02","parts":["02","12"]},{"id":"horse_manure","label":"Street horse manure","domain":"building","kind":"good","start":1850,"date_src":"general","place":"industrial cities","paradigm":"industrial","desc":"A city horse dropped 15 to 30 lb of manure a day (Tarr); New York's 100,000 to 200,000 horses around 1900 (contested) left about 1,000 to 2,000 tons a day on the streets. The motor vehicle was welcomed as a sanitary reform.","chokepoint":false,"part":"12","parts":["12"]},{"id":"industrial_rendering","label":"Industrial rendering","domain":"food","kind":"industry","start":1850,"date_src":"part","wide":1950,"place":"beside slaughterhouses (Chicago)","paradigm":"industrial","desc":"Everything not eaten gathered into one plant: fats, proteins and meals for feed, pet food, soap, oleochemicals, biodiesel and fertiliser. North American rendering takes about 27.5 Mt of raw material a year (cited). By-product capture completed.","chokepoint":false,"part":"03","parts":["03"]},{"id":"managerial_enterprise","label":"Managerial enterprise","domain":"institutions","kind":"institution","start":1850,"date_src":"general","place":"US and British railways","paradigm":"industrial","desc":"Railways and the telegraph let head offices coordinate plants and branches daily, so administration replaced the market for many decisions (Chandler's visible hand). The railway company was the first big firm with professional managers.","chokepoint":false,"part":"08","parts":["08"]},{"id":"municipal_bonds", nt_store","label":"Department store","domain":"exchange","kind":"institution","start":1852,"date_src":"part","place":"Paris (Bon Marche)","paradigm":"industrial","desc":"Fixed-price retail of many lines under one roof from 1852, joined by Chicago's wholesale houses and Sears' mail order.","chokepoint":false,"part":"12","parts":["12"]},{"id":"germ_theory","label":"Epidemiology and germ theory","domain":"building","kind":"technique","start":1854,"date_src":"part","place":"London (Snow); Pasteur and Koch (cholera germ 1883)","paradigm":"industrial","desc":"Snow traced the 1854 Broad Street cholera outbreak to a pump; Pasteur and Koch gave germ theory and bacteriological testing of water. It told engineers what clean water had to remove.","chokepoint":false,"part":"08","parts":["08"]},{"id":"limited_liability","label":"General limited liability","domain":"institutions","kind":"institution","start":1855,"date_src":"part","place":"Britain (1844, 1855, 1862)","paradigm":"industrial","desc":"General incorporation (1844), limited liability (1855) and the Companies Act (1862) replaced incorporation by Act. Most manufacturers still stayed partnerships, funded by kin, partners and retained profit (Crouzet).","chokepoint":false,"part":"05","parts":["05","07"]},{"id":"metropolitan_board_works","label":"Metropolitan Board of Works","domain":"institutions","kind":"institution","start":1855,"date_src":"part","place":"London","paradigm":"industrial","desc":"A public authority with a rate, created in 1855; after the Great Stink of 1858 Parliament acted within weeks and Bazalgette built about 1,100 miles of street drains feeding 82 miles of intercepting sewers (1858-75).","chokepoint":false,"part":"12","parts":["12"]},{"id":"aniline_dyes","label":"Coal-tar dyes","domain":"textiles","kind":"industry","start":1856,"date_src":"general","wide":1880,"place":"Britain and Germany","paradigm":"industrial","desc":"Synthetic dyes from coal tar from the 1850s (m); they ended the plant-dye trades and merged cloth with chemistry.","chokepoint":false,"part":"03","parts":["03"]},{"id":"bessemer_steel","label":"Bessemer converter","domain":"metals","kind":"technique","start":1856,"date_src":"part","place":"Henry Bessemer; Sheffield works 1858","paradigm":"industrial","desc":"Air blown through molten pig burned out carbon in about 20 minutes with no fuel, tons per blow. It needed low-phosphorus haematite pig and Mushet's spiegeleisen, so ore chemistry was its chokepoint. British Bessemer steel fell from about $80 a ton (1873) to under $20 (1886) [R].","chokepoint":true,"part":"07","parts":["07"]},{"id":"condensed_milk","label":"Condensed milk","domain":"food","kind":"industry","start":1856,"date_src":"part","place":"United States (Gail Borden)","paradigm":"industrial","desc":"Borden's 1856 patent preserved milk in cans, taking a perishable household good into the factory [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"grain_grading","label":"Grain grading standards","domain":"exchange","kind":"institution","start":1856,"date_src":"part","place":"Chicago","paradigm":"industrial","desc":"In 1856 the Board of Trade set grades (white winter, red winter, spring wheat, each with quality standards), so grain became a commodity and receipts became money-like. Shipments tripled from 1853 to 1856, to 21 million bushels (as quoted from Cronon).","chokepoint":false,"part":"12","parts":["12"]},{"id":"synthetic_dyes","label":"Synthetic aniline dyes","domain":"textiles","kind":"industry","start":1856,"date_src":"part","place":"London (Perkin's mauve); then Germany (BASF, Bayer, Hoechst)","paradigm":"industrial","desc":"Perkin, aged 18, made mauve from aniline, out of gasworks benzene and nitric acid. Britain invented, Germany scaled: German firms made about 80 to 90% of world dyes by 1913 [R], helped by university chemistry, in-house laboratories, the 1877 Patent Act and bank finance.","chokepoint":false,"part":"07","parts":["07"]},{"id":"elevator","label":"Passenger lift","domain":"building","kind":"technique","start":1857,"date_src":"general","paradigm":"industrial","place":"","desc":"Safety lifts that made tall buildings usable. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"land_registry","label":"Land title registers","domain":"institutions","kind":"institution","start":1858,"date_src":"general","place":"South Australia (Torrens); worldwide","paradigm":"industrial","desc":"Registers and titles make land collateral; de Soto argues the poor of many countries cannot borrow against customary, unregistered claims. Modern property is mostly claims on claims kept by institutions.","chokepoint":false,"part":"05","parts":["05"]},{"id":"professional_licensing","label":"Professions and licensing","domain":"institutions","kind":"institution","start":1858,"date_src":"general","wide":2000,"place":"Britain; United States","paradigm":"service_information","desc":"The guilds' heirs: entry by education and examination, self-regulation, often a state licence. The US share of workers needing a licence rose from about 5% in the 1950s to over a quarter by the 2000s (Kleiner and Krueger) [unchecked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"submarine_cable","label":"Transatlantic cable","domain":"information","kind":"infrastructure","start":1858,"date_src":"part","place":"Ireland to Newfoundland (durable 1866)","paradigm":"industrial","desc":"The 1858 cable failed within weeks; a durable one came in 1866. News between New York and Liverpool fell from 7 to 15 days to about a day, and the cotton price gap fell by more than a third and its variance by over 90% [Steinwender 2018].","chokepoint":false,"part":"04","parts":["04","08"]},{"id":"bazalgette_sewers","label":"Bazalgette's London sewers","domain":"building","kind":"infrastructure","start":1859,"date_src":"part","place":"London","paradigm":"industrial","desc":"After the Great Stink of 1858, about 80 miles of main and 1,100 miles of street sewers [R] carried waste east of the city, opened 1865 and finished about 1875. Built on the wrong theory (bad air), it worked anyway.","chokepoint":false,"part":"07","parts":["07"]},{"id":"chain_stores","label":"Grocery chain stores","domain":"food","kind":"industry","start":1859,"date_src":"general","place":"United States (A&P)","paradigm":"industrial","desc":"The Great Atlantic & Pacific Tea Company grew to the largest US retailer by the 1920s and 1930s [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"oil_petroleum","label":"Drilled petroleum","domain":"energy","kind":"resource","start":1859,"date_src":"part","place":"Titusville, Pennsylvania (Drake)","paradigm":"industrial","desc":"Drake's well began the industry; drillers borrowed salt-well boring and tank cars rode the railways before pipelines. In the US the landowner owned what lay beneath, which made a scramble. Spindletop (1901), Persia (1908) and Saudi Arabia (1938) moved the centre of supply.","chokepoint":false,"part":"08","parts":["08"]},{"id":"cottonseed_oil","label":"Cottonseed oil and feed","domain":"food","kind":"good","start":1860,"date_src":"general","place":"US South","paradigm":"industrial","desc":"The joint product of ginning: seed pressed for oil, the cake fed to animals. One of the part's examples of a by-product chain.","chokepoint":false,"part":"13","parts":["13"]},{"id":"gasoline","label":"Gasoline","domain":"energy","kind":"good","start":1860,"date_src":"part","place":"US refineries","paradigm":"industrial","desc":"A by-product of kerosene refining, dumped until the car made it the main product. Burton's thermal cracking (1913) and catalytic cracking (1930s) raised its share of each barrel.","chokepoint":false,"part":"08","parts":["08"]},{"id":"kerosene_refining","label":"Kerosene refining","domain":"energy","kind":"industry","start":1860,"date_src":"part","wide":1870,"place":"Pennsylvania and Cleveland","paradigm":"industrial","desc":"Distillation, learned in the coal-oil industry of the 1850s, turned crude into lamp oil for an existing mass market for light (whale oil, coal oil). For forty years oil was a lighting business; gasoline was a dangerous waste, often dumped.","chokepoint":false,"part":"01","parts":["01","08"]},{"id":"alkali_act","label":"Alkali Act and Inspectorate","domain":"institutions","kind":"institution","start":1863,"date_src":"part","place":"Britain","paradigm":"industrial","desc":"Britain's first major air pollution law required works to absorb 95% of their hydrogen chloride and set up inspectors to enforce it. Regulation turned a waste into a joint product.","chokepoint":false,"part":"07","parts":["07"]},{"id":"solvay_process","label":"Solvay ammonia-soda","domain":"materials","kind":"technique","start":1863,"date_src":"part","wide":1900,"place":"Belgium (Solvay); Winnington, Cheshire (Brunner Mond, 1873)","paradigm":"industrial","desc":"Made soda from brine with ammonia and far less waste; it displaced Leblanc by about 1900. The Leblanc firms merged into the United Alkali Company (1890) to survive; Brunner Mond became a founder of ICI (1926).","chokepoint":false,"part":"01","parts":["01","07"]},{"id":"underground_railway","label":"Underground railway","domain":"transport","kind":"infrastructure","start":1863,"date_src":"part","place":"London (Metropolitan Railway)","paradigm":"industrial","desc":"Steam railways in cut-and-cover tunnels from 1863, about 25 to 35 km/h, giving railway suburbs and workmen's fares; steam in tunnels was barely tolerable.","chokepoint":false,"part":"12","parts":["12"]},{"id":"open_hearth_steel","label":"Open-hearth steel","domain":"metals","kind":"technique","start":1864,"date_src":"part","wide":1900,"place":"Siemens (1856 to 1861); Martin (1864 to 1865)","paradigm":"industrial","desc":"Waste heat recycled through brick chequers gave a slower, controllable melt that could take scrap. It needed gas producers and refractories, made ship plate and structural steel, and overtook Bessemer about 1900 [R].","chokepoint":false,"part":"07","parts":["07"]},{"id":"compound_marine_engine","label":"Compound marine engine","domain":"transport","kind":"technique","start":1865,"date_src":"part","place":"Liverpool (Holt's ships to China)","paradigm":"industrial","desc":"Compound engines burnt little enough coal for long voyages; with Suez (1869) steam took the long routes. Tramp freight rates roughly halved from the early 1870s to the early 1910s (Hatton).","chokepoint":false,"part":"07","parts":["07"]},{"id":"hcl_chlorine_recovery","label":"Weldon and Deacon processes","domain":"materials","kind":"technique","start":1865,"date_src":"part","place":"Mersey alkali works","paradigm":"industrial","desc":"The captured hydrogen chloride was turned into chlorine for bleaching powder (1860s to 1870s). A waste became a product once the law made the works catch it.","chokepoint":false,"part":"07","parts":["07"]},{"id":"pipelines","label":"Pipelines","domain":"transport","kind":"infrastructure","start":1865,"date_src":"general","paradigm":"industrial","place":"","desc":"Pipes moving oil, gas and water. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"reinforced_concrete","label":"Reinforced concrete","domain":"building","kind":"technique","start":1865,"date_src":"part","wide":1920,"place":"France","paradigm":"industrial","desc":"Steel and cement fused into one material (1860s to 1890s) (m). Cement now emits about 1.56 Gt of CO2 a year (2023), 5 to 8% of the world's, 60% of it from calcination (cited): the lime kiln at planetary scale.","chokepoint":false,"part":"03","parts":["03","07"]},{"id":"steel_rails","label":"Steel rails","domain":"transport","kind":"good","start":1865,"date_src":"general","wide":1890,"place":"USA and Britain","paradigm":"industrial","desc":"Rails were the first mass market for steel. US rails fell from $174 a ton in 1868 to $17 in 1898 (cited).","chokepoint":false,"part":"03","parts":["03"]},{"id":"steel_scrap","label":"Steel scrap loop","domain":"metals","kind":"resource","start":1865,"date_src":"general","wide":1990,"place":"industrial countries","paradigm":"industrial","desc":"Scrap remelted in open hearths and then electric arc furnaces; about 29% of world steel now comes by electric arc, much of it from scrap (cited). The scrap yard is now an ore deposit.","chokepoint":false,"part":"03","parts":["03"]},{"id":"union_stock_yards","label":"Union Stock Yards","domain":"food","kind":"infrastructure","start":1865,"date_src":"part","place":"Chicago","paradigm":"industrial","desc":"Opened on 25 December 1865, receiving 1.29 million hogs and 384,000 cattle in 1866 and more than 15 million animals a year by the 1920s (contested).","chokepoint":false,"part":"02","parts":["02","12"]},{"id":"synthetic_alizarin_indigo","label":"Synthetic alizarin and indigo","domain":"textiles","kind":"technique","start":1868,"date_src":"part","place":"Germany (alizarin 1868; BASF indigo 1897)","paradigm":"industrial","desc":"Synthetic alizarin destroyed the madder fields of France and the Low Countries within a decade; synthetic indigo hit Bengal's indigo plantations after 1897. A paradigm switch in one country removed a land-based chain in another.","chokepoint":false,"part":"07","parts":["07"]},{"id":"suez_canal","label":"Suez Canal chokepoint","domain":"transport","kind":"infrastructure","start":1869,"date_src":"part","place":"Egypt","paradigm":"industrial","desc":"12 to 15% of world maritime trade and over 20% of container trade passed before 2024 (UNCTAD). The Ever Given held up about $9-10 billion of trade a day for six days in 2021 (LL); Red Sea attacks cut Suez volume about 50% in early 2024 (IMF). Its value is set by the alternative: round the Cape adds 10 to 14 days (rough).","chokepoint":true,"part":"04","parts":["04","13"]},{"id":"asphalt_paving","label":"Refinery asphalt roads","domain":"transport","kind":"good","start":1870,"date_src":"general","place":"US and European cities","paradigm":"industrial","desc":"The heaviest refinery residue paved the roads the cars needed, beside Portland cement surfaces. A joint product that built its own market.","chokepoint":false,"part":"08","parts":["08"]},{"id":"electricity","label":"Generated electricity","domain":"energy","kind":"technique","start":1870,"date_src":"part","place":"Europe and the United States (dynamos)","paradigm":"industrial","desc":"Faraday's induction (1831) led to working dynamos in the 1860s and 1870s, turning steam or water power into current sent along a wire. It separated where energy is made from where it is used, and divided it into any quantity. The first science-based industry beside chemistry.","chokepoint":false,"part":"08","parts":["08"]},{"id":"industrial_research_lab","label":"Industrial research laboratory","domain":"institutions","kind":"institution","start":1870,"date_src":"general","place":"Germany (BASF, Bayer, Hoechst)","paradigm":"industrial","desc":"A paid team of scientists searching for new products on purpose, invented by the German dye firms with university-trained chemists; GE (1900), DuPont (1903) and Bell (1925) copied it. Industries came to depend on organised knowledge held by an organisation, not a craftsman.","chokepoint":false,"part":"08","parts":["08"]},{"id":"refrigeration_cold_chain","label":"Cold chain","domain":"food","kind":"infrastructure","start":1870,"date_src":"part","wide":1955,"place":"United States; New Zealand to London","paradigm":"industrial","desc":"Ice, then refrigerating machines (1870s); frozen New Zealand mutton reached London in 1882; most US homes had refrigerators by the 1950s; reefer containers later [s]. An assembly in time, only as good as its weakest cold store.","chokepoint":false,"part":"02","parts":["02"]},{"id":"roller_milling","label":"Roller milling","domain":"food","kind":"industry","start":1870,"date_src":"part","place":"Budapest; Minneapolis","paradigm":"industrial","desc":"Steel or porcelain rollers in stages with sifting give white flour in bulk (Budapest 1870s, Minneapolis 1880s) [s]. Flour became a national industry of branded millers (Washburn-Crosby, Pillsbury) and small mills closed.","chokepoint":false,"part":"02","parts":["02","13"],"wide":1890},{"id":"standard_oil_trust","label":"Standard Oil refining","domain":"energy","kind":"industry","start":1870,"date_src":"general","place":"Cleveland (Rockefeller)","paradigm":"industrial","desc":"Standard grew by controlling refining and transport, not wells: buying out refiners, winning railway rebates, building pipelines. By about 1880 it refined roughly 90% of American oil (rough), until the Supreme Court broke it into 34 companies in 1911. The chokepoint was the middle step.","chokepoint":true,"part":"08","parts":["08"]},{"id":"world_grain_market","label":"World grain market","domain":"exchange","kind":"practice","start":1870,"date_src":"part","place":"Chicago to Liverpool","paradigm":"industrial","desc":"Cheap rail and ocean freight joined distant grain lands to Europe: the Chicago to Liverpool wheat price gap fell from over half to under a sixth, 1870 to 1895 [R]. Meat and emigrants moved the same way.","chokepoint":false,"part":"07","parts":["07"]},{"id":"telegraphic_transfer","label":"Telegraphic money transfer","domain":"exchange","kind":"technique","start":1871,"date_src":"part","place":"United States (Western Union)","paradigm":"industrial","desc":"Money sent across a continent in hours by wire, from 1871 [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"internal_combustion_engine","label":"Otto four-stroke engine","domain":"energy","kind":"technique","start":1876,"date_src":"part","place":"Germany (Otto)","paradigm":"industrial","desc":"A cycle modelled on the steam engine's, built by machinists to fine tolerances, put a light engine inside a moving vehicle. Engine and liquid fuel moved power off the rail and the shaft into anything that could carry a tank.","chokepoint":false,"part":"08","parts":["08"]},{"id":"rubber_plantations","label":"Rubber plantations","domain":"materials","kind":"industry","start":1876,"date_src":"part","place":"Malaya and the Netherlands Indies","paradigm":"industrial","desc":"Seeds taken from Brazil in 1876 founded Asian plantations that displaced wild Amazon rubber. Rubber is a chokepoint by climate: when Japan took the plantations in 1942, the Allies lost most of their supply.","chokepoint":true,"part":"08","parts":["08"]},{"id":"telephone","label":"Telephone","domain":"information","kind":"technique","start":1876,"date_src":"part","place":"United States (Bell's patent)","paradigm":"industrial","desc":"Needed exchanges, a pair of copper wires to every subscriber and power, building on the telegraph's poles and the electric industry. Its value rose with subscribers, a network effect that favoured one network; it let firms split head office from plant.","chokepoint":false,"part":"08","parts":["08"]},{"id":"basic_process","label":"Thomas-Gilchrist basic process","domain":"metals","kind":"technique","start":1878,"date_src":"part","wide":1900,"place":"Britain; used in Lorraine and Germany","paradigm":"industrial","desc":"A dolomite lining removed phosphorus, so Lorraine's phosphoric ores became usable and German steel surged. Germany overtook Britain in steel about 1893 [R]: the technique spread to where the ore was.","chokepoint":false,"part":"03","parts":["03","07"]},{"id":"chrome_tanning","label":"Chrome tanning","domain":"textiles","kind":"technique","start":1878,"date_src":"part","wide":1920,"place":"Germany and USA","paradigm":"industrial","desc":"Described by Knapp in 1858, commercial from about 1878, patented in the US 1884 (cited): tanning in days instead of the 11 to 18 months of bark (cited). About 80% of leather is now chrome-tanned; leather moved from the woods to the chemical works.","chokepoint":false,"part":"03","parts":["03"]},{"id":"refrigerated_rail_car","label":"Refrigerated rail car","domain":"transport","kind":"infrastructure","start":1878,"date_src":"part","place":"Chicago (Swift, Chase)","paradigm":"industrial","desc":"Swift ordered ten cars in 1878 with ice above the load and built icing stations along the route [c]. Shipping dressed beef cut freight weight since the inedible half stayed in Chicago; Swift ran ~7,000 cars by 1920 [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"refrigerator_car","label":"Refrigerator rail cars","domain":"transport","kind":"technique","start":1878,"date_src":"part","place":"Chicago (Swift)","paradigm":"industrial","desc":"Swift's refrigerator cars from 1878, cooled by ice, let dressed beef replace live cattle on the rails and removed perishability as a limit.","chokepoint":false,"part":"12","parts":["12"]},{"id":"telephone_exchange","label":"Telephone exchanges","domain":"information","kind":"infrastructure","start":1878,"date_src":"general","place":"United States","paradigm":"industrial","desc":"Switchboards joined subscribers' lines, run by operators (one of the largest new women's occupations), then automatic switches from the 1890s. Their lines and switching later carried the first data networks.","chokepoint":false,"part":"08","parts":["08"]},{"id":"incandescent_lamp","label":"Electric lamp","domain":"energy","kind":"good","start":1879,"date_src":"general","place":"Menlo Park, New Jersey (Edison)","paradigm":"industrial","desc":"Light was electricity's first mass demand, since gas lighting had shown people would pay for it. Carbon filaments gave way to GE's ductile tungsten (Coolidge, 1910). The lamp makers' skill at pumping glass empty later made the first vacuum tubes.","chokepoint":false,"part":"08","parts":["08"]},{"id":"basic_slag_fertiliser","label":"Basic slag fertiliser","domain":"food","kind":"good","start":1880,"date_src":"general","place":"Germany and Britain","paradigm":"industrial","desc":"The phosphorus-rich slag of basic steelmaking was ground and sold as fertiliser. A waste of one chain became an input of farming.","chokepoint":false,"part":"07","parts":["07"]},{"id":"electric_lighting","label":"Electric light","domain":"energy","kind":"good","start":1880,"date_src":"part","wide":1920,"place":"New York and London","paradigm":"industrial","desc":"Lamps fed by wire from central stations, from 1882 (Pearl Street, Holborn Viaduct) [M]. Four separate light chains (herds, bees, whales, coal) collapsed into one network that also drove motors and trams.","chokepoint":false,"part":"01","parts":["01"]},{"id":"electrolytic_copper","label":"Electrolytic copper","domain":"metals","kind":"technique","start":1880,"date_src":"general","place":"US; later Chile and Central Africa","paradigm":"industrial","desc":"Wire-grade copper is refined by current, so the metal came to depend on the power it carried (a loop). Electrification made copper strategic: open-pit mines such as Bingham Canyon (1906) and the copper belts followed demand.","chokepoint":true,"part":"08","parts":["08"]},{"id":"natural_gas","label":"Natural gas","domain":"energy","kind":"resource","start":1880,"date_src":"general","paradigm":"industrial","place":"","desc":"Methane from wells, piped for heat, power and as feedstock for ammonia. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"packer_byproducts","label":"Packinghouse by-products","domain":"materials","kind":"industry","start":1880,"date_src":"general","place":"Chicago","paradigm":"industrial","desc":"Glue, fertiliser, soap, lard and gelatin from what had been waste, 'everything but the squeal' [s]: the by-products made the packers' margin. The carcass as a hub feeding leather, light, glue and fertiliser.","chokepoint":false,"part":"02","parts":["02","12"]},{"id":"steam_trawler","label":"Steam trawler","domain":"food","kind":"technique","start":1881,"date_src":"part","wide":1900,"place":"North Sea
