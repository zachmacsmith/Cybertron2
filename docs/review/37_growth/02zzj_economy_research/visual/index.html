 ports","paradigm":"industrial","desc":"Steam trawlers and the otter trawl of the 1880s to 1890s (m): the seabed swept, fishing a capital fleet with wage crews.","chokepoint":false,"part":"03","parts":["03"]},{"id":"electric_grid","label":"Central power station","domain":"energy","kind":"infrastructure","start":1882,"date_src":"part","place":"Pearl Street Station, New York","paradigm":"industrial","desc":"Pearl Street began with about 400 lamps for 59 to 85 customers, though its six dynamos could light about 7,200 (sources differ). Edison's invention was the system: station, dynamo, cables, fuse, meter and lamp, each made by a separate Edison company. It needed coal by rail, copper, streets to bury cables in, and bank capital.","chokepoint":false,"part":"08","parts":["08"]},{"id":"hydroelectric","label":"Hydroelectric power","domain":"energy","kind":"industry","start":1882,"date_src":"part","wide":1930,"place":"Niagara Falls","paradigm":"industrial","desc":"Falling water drove generators at Niagara from the mid-1890s, and cheap hydro drew power-hungry industries to it: Alcoa moved its aluminium smelting there in 1895. Later dams made hydro a large share of power.","chokepoint":false,"part":"01","parts":["01","08"]},{"id":"pearl_street_station","label":"Pearl Street power station","domain":"energy","kind":"infrastructure","start":1882,"date_src":"part","place":"New York (Edison)","paradigm":"industrial","desc":"Edison's central generating station of 1882, wiring streets for light; private, then regulated or municipal. Electricity is the layer under lifts, metros and electric traction.","chokepoint":false,"part":"12","parts":["12"]},{"id":"social_insurance","label":"State social insurance","domain":"institutions","kind":"institution","start":1883,"date_src":"part","place":"Germany (Bismarck)","paradigm":"industrial","desc":"Bismarck's sickness, accident and old-age insurance (1883 to 1889), British pensions (1908) and National Insurance (1911), US Social Security (1935).","chokepoint":false,"part":"05","parts":["05"]},{"id":"steam_turbine","label":"Steam turbine","domain":"energy","kind":"technique","start":1884,"date_src":"part","place":"Britain (Parsons)","paradigm":"industrial","desc":"Parsons' turbine replaced reciprocating engines driving dynamos and became the standard generator drive, carrying the steam layer into the electric age.","chokepoint":false,"part":"08","parts":["08"]},{"id":"combine_harvester","label":"Combine harvester","domain":"food","kind":"technique","start":1885,"date_src":"part","wide":1935,"place":"California","paradigm":"industrial","desc":"Reaping and threshing in one machine, pulled by 20 or more horses in 1880s California and spreading with tractors from the 1920s and 1930s [s]. It pays only over many acres, so farms grew or rented custom crews.","chokepoint":false,"part":"02","parts":["02"]},{"id":"large_power_transformers","label":"Large power transformers","domain":"energy","kind":"good","start":1885,"date_src":"general","place":"worldwide; few makers","paradigm":"industrial","desc":"Custom-built, made by few firms, with lead times stretched to two to four years in the 2020s (rough); grain-oriented electrical steel has few makers. A chokepoint for grids and for new buildings.","chokepoint":true,"part":"13","parts":["13"]},{"id":"petrol_diesel","label":"Petrol and diesel","domain":"energy","kind":"good","start":1885,"date_src":"general","wide":1920,"place":"Europe and USA","paradigm":"industrial","desc":"Lighter and heavier cuts of crude oil, first a waste of the kerosene trade, then the fuel of engines. They made the car, the tractor and the aeroplane.","chokepoint":false,"part":"01","parts":["01"]},{"id":"steel_frame","label":"Steel frame","domain":"building","kind":"technique","start":1885,"date_src":"general","paradigm":"industrial","place":"","desc":"Skyscraper construction on a steel skeleton. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"ac_transmission","label":"AC transmission","domain":"energy","kind":"technique","start":1886,"date_src":"general","place":"United States (Westinghouse, Tesla)","paradigm":"industrial","desc":"Westinghouse's alternating current, with Tesla's motor patents and transformers, let power travel far at high voltage. It won after Niagara Falls sent power to Buffalo in 1896; voltage and frequency standards locked in.","chokepoint":false,"part":"08","parts":["08"]},{"id":"aluminium","label":"Hall-Heroult aluminium","domain":"metals","kind":"technique","start":1886,"date_src":"part","place":"Pittsburgh (Hall); France (Heroult); Niagara from 1895","paradigm":"industrial","desc":"Alumina dissolved in molten cryolite is split by current. The price fell from about $4.86 a pound (1888) to $0.78 (1893) as Alcoa scaled up. The chain runs bauxite, Bayer alumina (1888), smelter, rolling mill; at roughly 13 to 15 kWh per kilogram (rough), smelters go where power is cheapest: location set by energy, not ore.","chokepoint":false,"part":"08","parts":["08"]},{"id":"motor_vehicle","label":"Motor car","domain":"transport","kind":"good","start":1886,"date_src":"general","place":"Germany (Benz); then Detroit (Ford's Model T, 1908)","paradigm":"industrial","desc":"Began as a craft product assembled by small firms, often bicycle and carriage makers, from bought parts. It needed steel sheet, machine tools, rubber, glass, refined fuel and roads. The Model T fell from $850 to $260 by 1925; about 15 million were built by 1927 (figures vary).","chokepoint":false,"part":"08","parts":["08"]},{"id":"economic_regulation","label":"Regulatory state","domain":"institutions","kind":"institution","start":1887,"date_src":"general","place":"United States; Europe","paradigm":"industrial","desc":"Regulation of food, drugs, labour, banks, competition, environment and zoning that now sets much of the terms of every contract; with credit bureaus and ratings, reputation kept by third parties.","chokepoint":false,"part":"05","parts":["05"]},{"id":"electric_tram","label":"Electric tram","domain":"transport","kind":"technique","start":1888,"date_src":"part","place":"Richmond, Virginia (Sprague)","paradigm":"industrial","desc":"Electric traction removed the horse: about 15 to 20 km/h and a city of about 250 km2 (rough); land developers built lines to sell lots.","chokepoint":false,"part":"12","parts":["12"]},{"id":"pneumatic_tyre","label":"Pneumatic tyre","domain":"transport","kind":"good","start":1888,"date_src":"part","place":"Belfast (Dunlop)","paradigm":"industrial","desc":"The air-filled tyre made rubber a vehicle material, first for bicycles, then cars.","chokepoint":false,"part":"08","parts":["08"]},{"id":"chlor_alkali","label":"Chlor-alkali electrolysis","domain":"materials","kind":"technique","start":1890,"date_src":"general","place":"US and Europe","paradigm":"industrial","desc":"Electrolysis of brine gives chlorine and caustic soda. Water treatment and later plastics needed its chlorine.","chokepoint":false,"part":"08","parts":["08"]},{"id":"electric_metro","label":"Electric deep-tube metro","domain":"transport","kind":"infrastructure","start":1890,"date_src":"part","place":"London 1890; Budapest, Paris, New York 1904","paradigm":"industrial","desc":"Deep tube railways needing electric traction, about 30 km/h with stops: the office downtown fed by trains.","chokepoint":false,"part":"12","parts":["12"]},{"id":"punched_card_tabulator","label":"Punched-card tabulator","domain":"information","kind":"technique","start":1890,"date_src":"part","place":"US census (Hollerith); IBM from 1924","paradigm":"industrial","desc":"Hollerith's tabulators counted the 1890 census, beside cash registers and adding machines in offices. They stood on machine tools, electric relays and bureaucracies with records to count.","chokepoint":false,"part":"08","parts":["08"]},{"id":"electrical_equipment_oligopoly","label":"Electrical equipment makers","domain":"energy","kind":"industry","start":1892,"date_src":"part","place":"US (GE, Westinghouse); Germany (Siemens, AEG)","paradigm":"industrial","desc":"Edison General Electric merged with Thomson-Houston to form General Electric (1892); Westinghouse built the rival AC system. Two firms dominated the US for most of a century: equipment making as an oligopoly from the start, held by patents.","chokepoint":true,"part":"08","parts":["08"]},{"id":"diesel_engine","label":"Diesel engine","domain":"energy","kind":"technique","start":1893,"date_src":"part","place":"Germany (Diesel)","paradigm":"industrial","desc":"A compression-ignition engine burning a heavier refinery cut; it came to drive trucks, tractors, ships, locomotives and pumps.","chokepoint":false,"part":"08","parts":["08"]},{"id":"breakfast_cereals","label":"Breakfast cereals","domain":"food","kind":"industry","start":1895,"date_src":"part","place":"Battle Creek, Michigan (Kellogg, Post)","paradigm":"industrial","desc":"Branded cereals of the 1890s [s]: a craft step taken into a factory and given a brand and national distribution.","chokepoint":false,"part":"02","parts":["02"]},{"id":"synthetic_drugs","label":"Synthetic drugs","domain":"materials","kind":"industry","start":1899,"date_src":"part","place":"Germany (Bayer aspirin; Hoechst Salvarsan)","paradigm":"industrial","desc":"The dye firms knew how to make, test and purify organic molecules: aspirin (1899), Ehrlich's Salvarsan (1910, from dyes that stained some cells), and Prontosil (1935), the first sulfa drug, itself a red dye.","chokepoint":false,"part":"08","parts":["08"]},{"id":"electric_arc_steel","label":"Electric arc furnace","domain":"metals","kind":"technique","start":1900,"date_src":"part","place":"France (Heroult)","paradigm":"industrial","desc":"Heroult's arc furnace made steel with current; arc furnaces later made metallurgical silicon (about 98 to 99% pure) for chips.","chokepoint":false,"part":"08","parts":["08"]},{"id":"sand_gravel_aggregates","label":"Sand and gravel aggregates","domain":"building","kind":"resource","start":1900,"date_src":"general","place":"rivers, coasts, quarries worldwide","paradigm":"industrial","desc":"The most extracted solid material: about 50 billion t a year (UNEP 2022). Desert sand is too rounded; river and marine sand mining is contested and in places criminal.","chokepoint":false,"part":"13","parts":["13"]},{"id":"unit_drive","label":"Electric unit drive","domain":"energy","kind":"practice","start":1900,"date_src":"part","wide":1920,"place":"American factories","paradigm":"industrial","desc":"A motor in each machine let factories be rebuilt as single-storey plants laid out by the flow of work. It waited on old buildings wearing out and on managers who knew flow layout; US manufacturing output per man-hour rose about 1.3% a year before 1919 and 3.1% after [Devine 1983]. Paul David's dynamo lesson.","chokepoint":false,"part":"08","parts":["08"]},{"id":"radio","label":"Radio","domain":"information","kind":"technique","start":1901,"date_src":"part","place":"Marconi, across the Atlantic","paradigm":"industrial","desc":"Needed Maxwell and Hertz's theory, Marconi's engineering and then the vacuum tube to amplify. RCA was formed in 1919 from GE's and others' patents; about 40% of US households had a radio by 1930 [Census 2023].","chokepoint":false,"part":"08","parts":["08"]},{"id":"air_separation_gases","label":"Air separation (industrial gases)","domain":"materials","kind":"industry","start":1902,"date_src":"general","place":"Germany (Linde); worldwide","paradigm":"industrial","desc":"Plants separate air into oxygen, nitrogen, argon and neon. Oxygen feeds the steel converter; semiconductor-grade neon is a by-product of steel-plant air separation, and Ukraine supplied about 45-54% before 2022 (Reuters via CNBC). By-product supply does not respond to its own price.","chokepoint":false,"part":"13","parts":["13"]},{"id":"aviation","label":"Powered flight","domain":"transport","kind":"technique","start":1903,"date_src":"part","place":"Kitty Hawk (the Wright brothers)","paradigm":"industrial","desc":"The first flight (12 seconds, 120 feet) used a light engine built in the Wrights' own shop and their own wind tunnel; bicycle makers and machinists came first. The First World War made aircraft a mass-produced weapon and built the first aircraft and engine industries.","chokepoint":false,"part":"08","parts":["08"]},{"id":"vacuum_tube","label":"Vacuum tube","domain":"information","kind":"technique","start":1904,"date_src":"part","place":"Britain (Fleming diode); US (de Forest triode, 1906)","paradigm":"industrial","desc":"Fleming's diode came from the Edison effect in light bulbs; de Forest's triode amplified. The lamp industry became the electronics industry: radio, then ENIAC's 18,000 tubes.","chokepoint":false,"part":"08","parts":["08"]},{"id":"rayon","label":"Rayon","domain":"textiles","kind":"good","start":1905,"date_src":"general","wide":1930,"place":"Britain and France","paradigm":"industrial","desc":"Regenerated cellulose fibre made from wood pulp (m): the first fibre from a chemical works rather than a field or flock.","chokepoint":false,"part":"03","parts":["03"]},{"id":"duralumin","label":"Duralumin","domain":"metals","kind":"good","start":1906,"date_src":"part","place":"Germany (Alfred Wilm)","paradigm":"industrial","desc":"An aluminium alloy that hardens with age, letting metal airframes replace spruce and fabric; aircraft came to depend on cheap electrolytic aluminium.","chokepoint":false,"part":"08","parts":["08"]},{"id":"meat_inspection_antitrust","label":"Meat inspection and antitrust","domain":"institutions","kind":"institution","start":1906,"date_src":"part","place":"United States","paradigm":"industrial","desc":"The Big Five drew the Meat Inspection Act (1906), the 1920 consent decree and the Packers and Stockyards Act (1921) [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"plastics","label":"Synthetic plastics","domain":"materials","kind":"good","start":1907,"date_src":"part","place":"Yonkers, New York (Baekeland's Bakelite)","paradigm":"industrial","desc":"Began on the coal layer: celluloid (1860s) and Bakelite from coal-tar phenol, then polyethylene (ICI, 1933), PVC and polystyrene. Cheap only once refining made their inputs in bulk: about 2 million tonnes (1950) to 380 million (2015), with about 79% of all waste in landfill or the environment [Geyer, Jambeck and Law 2017].","chokepoint":false,"part":"08","parts":["08"]},{"id":"utility_franchise","label":"Regulated utility monopoly","domain":"institutions","kind":"institution","start":1907,"date_src":"part","place":"Chicago (Insull, Commonwealth Edison)","paradigm":"industrial","desc":"Insull ran large stations for many customers whose peaks fell at different hours (the load factor), with low prices to win load, and took a monopoly franchise in return for state rate regulation (commissions from 1907). His holding-company pyramid collapsed in 1932 and the 1935 Act broke such pyramids up.","chokepoint":true,"part":"08","parts":["08"]},{"id":"chlorination","label":"Chlorinated water supply","domain":"building","kind":"technique","start":1908,"date_src":"part","place":"Jersey City","paradigm":"industrial","desc":"The first continuous chlorination of a public supply spread across American cities within a decade, using chlor-alkali chlorine. With filtration it ended the urban penalty, so cities could grow from their own births.","chokepoint":false,"part":"08","parts":["08"]},{"id":"tractor","label":"Farm tractor","domain":"food","kind":"technique","start":1910,"date_src":"general","wide":1954,"place":"United States","paradigm":"industrial","desc":"US farm tractors rose from about 240,000 (1920) to almost 1.6 million (1940) (rough). They freed the roughly 93 million acres of cropland that fed horses and mules at the 1915 peak, about a quarter of the harvest [Olmstead and Rhode 2001], lifting the land ceiling a second time. They needed fuel at every farm, repair skills and credit, and emptied the countryside.","chokepoint":false,"part":"02","parts":["02","08"]},{"id":"moving_assembly_line","label":"Moving assembly line","domain":"institutions","kind":"technique","start":1913,"date_src":"part","place":"Ford Highland Park, Detroit","paradigm":"industrial","desc":"The work moves past the worker and each does one task, on parts made to gauge so nothing is fitted at assembly. Chassis time fell from about 12.5 hours to about 93 minutes over 1913-14 (AM). A paradigm switch with increasing returns past a volume threshold.","chokepoint":false,"part":"08","parts":["08","13"],"wide":1920},{"id":"oil_refining_cracking","label":"Oil refining and cracking","domain":"energy","kind":"industry","start":1913,"date_src":"general","wide":1930,"place":"United States","paradigm":"industrial","desc":"Crude is distilled, cracked and reformed into fuels. A joint-product plant: every barrel gives a mix of petrol, diesel, jet, fuel oil, naphtha, LPG, asphalt and coke, and refiners choose crude and units to tilt the mix. World oil use about 100-105 million barrels a day (rough).","chokepoint":false,"part":"13","parts":["13"]},{"id":"ready_mix_concrete","label":"Ready-mix concrete","domain":"building","kind":"industry","start":1913,"date_src":"general","wide":1950,"place":"Baltimore, United States","paradigm":"industrial","desc":"Cement, aggregates, water and admixtures batched at a plant and carried in a drum truck that must pour within about 90 minutes (rough), so the chain is heavy and local. Supplementary fly ash and slag come as joint products of other chains. World cement about 4.1 billion t in 2023, China about half (GC).","chokepoint":false,"part":"13","parts":["13"]},{"id":"regulated_telephone_monopoly","label":"Bell regulated monopoly","domain":"institutions","kind":"institution","start":1913,"date_src":"part","place":"United States (AT&T)","paradigm":"industrial","desc":"AT&T settled with the government in 1913 (the Kingsbury Commitment), was regulated as a monopoly from 1934, and was broken up only in 1984. The monopoly network was telecoms' chokepoint, and its rents funded research.","chokepoint":true,"part":"08","parts":["08"]},{"id":"synthetic_nitrogen","label":"Haber-Bosch ammonia","domain":"food","kind":"technique","start":1913,"date_src":"part","place":"Oppau, Germany (BASF)","paradigm":"industrial","desc":"Haber (1909) combined nitrogen and hydrogen at high pressure over a catalyst; Bosch made it industrial with a lined steel reactor, since hydrogen embrittles steel at about 200 atmospheres. Hydrogen came from coal via water gas, now mainly natural gas. About 44% of the world's people in 2000 were fed by its nitrogen [Erisman et al. 2008].","chokepoint":false,"part":"02","parts":["02","08"]},{"id":"five_dollar_day","label":"Five-dollar day","domain":"institutions","kind":"practice","start":1914,"date_src":"part","place":"Ford, Detroit","paradigm":"industrial","desc":"Ford doubled wages in January 1914 to hold workers on dull, fast line work, when turnover had been several hundred per cent a year (rough). Part of the Fordist settlement of high wages and mass consumption: a worker who could buy what he made.","chokepoint":false,"part":"13","parts":["13"]},{"id":"panama_canal","label":"Panama Canal chokepoint","domain":"transport","kind":"infrastructure","start":1914,"date_src":"general","place":"Panama","paradigm":"industrial","desc":"About 5% of world trade by volume, through locks fed by fresh water from Gatun Lake (about 200 million litres per transit, rough). The 2023-24 drought cut daily transits from about 36-38 to about 24 (GCAP, ME).","chokepoint":true,"part":"13","parts":["13"]},{"id":"sewage_treatment","label":"Sewage treatment","domain":"building","kind":"technique","start":1914,"date_src":"part","place":"Britain, then worldwide","paradigm":"industrial","desc":"Sewage farms, then biological treatment (activated sludge, 1914), needing electricity and chemistry: a precondition of megacity density.","chokepoint":false,"part":"12","parts":["12"]},{"id":"building_codes_planning","label":"Building codes and planning permission","domain":"institutions","kind":"institution","start":1916,"date_src":"general","place":"New York zoning (1916); worldwide","paradigm":"industrial","desc":"Land and planning permission, codes, testing and inspectors stand behind every building; the part lists land, permission and credit as the building chain's chokepoints.","chokepoint":true,"part":"13","parts":["13"]},{"id":"highway_finance","label":"Public highway finance","domain":"institutions","kind":"institution","start":1916,"date_src":"part","place":"United States (1916, 1919, 1956)","paradigm":"industrial","desc":"Cars needed roads and roads needed public money: the Federal Aid Road Act (1916), petrol taxes earmarked for roads (Oregon, 1919) and the Interstate Highway Act (1956). Roads brought filling stations, motels, suburbs and trucking, and the decline of the electric interurban.","chokepoint":false,"part":"08","parts":["08"]},{"id":"self_service_store","label":"Self-service store","domain":"food","kind":"practice","start":1916,"date_src":"part","place":"Memphis (Piggly Wiggly)","paradigm":"industrial","desc":"Piggly Wiggly let customers take goods from shelves themselves (1916) [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"river_rouge_integration","label":"River Rouge vertical integration","domain":"institutions","kind":"institution","start":1917,"date_src":"part","place":"River Rouge, Dearborn, Michigan","paradigm":"industrial","desc":"One owner of the whole chain: ore, coal, sand and rubber in, cars out, with Ford's own ships, railways, mines, forests and a Brazilian rubber plantation. Ore to finished car in about 28 hours (BRIT; commonly cited), about 100,000 workers, still at least 6,000 outside suppliers (CLUI). Cheaper than buying at each step because the line cannot stop for a late part, but rigid: one model, one colour.","chokepoint":false,"part":"08","parts":["08","13"]},{"id":"airmail_contracts","label":"Airmail contracts","domain":"institutions","kind":"institution","start":1918,"date_src":"part","place":"United States (Post Office; Kelly Act 1925)","paradigm":"industrial","desc":"The Post Office flew mail from 1918 and the Kelly Act put it out to private carriers; those contracts founded the major airlines. The Air Commerce Act (1926) licensed pilots and aircraft.","chokepoint":false,"part":"08","parts":["08"]},{"id":"consumer_credit","label":"Instalment consumer credit","domain":"exchange","kind":"institution","start":1919,"date_src":"part","place":"United States (GMAC, 1919)","paradigm":"industrial","desc":"GM's finance arm and the 1920s instalment plans let households buy cars and appliances on credit. Both waited on it.","chokepoint":false,"part":"08","parts":["08"]},{"id":"broadcast_advertising","label":"Broadcasting and advertising","domain":"information","kind":"practice","start":1920,"date_src":"part","place":"Pittsburgh (KDKA)","paradigm":"industrial","desc":"Free to the listener, paid for by advertising, which made national brands and national markets in attention. Television took the same model: about 9% of US households in 1950, roughly 87% by 1960 (rough).","chokepoint":false,"part":"08","parts":["08"]},{"id":"car_suburbs","label":"Expressways and car suburbs","domain":"transport","kind":"infrastructure","start":1920,"date_src":"part","place":"United States from the 1920s","paradigm":"industrial","desc":"Cars at 30 to 60 km/h give a 20 to 30 km radius and 1,500 to 3,000 km2 (rough): dispersed suburbs and edge cities, the centre's share of jobs falling. Needs fuel distribution and traffic rules.","chokepoint":false,"part":"12","parts":["12"]},{"id":"commuter_rail_suburbs","label":"Private commuter rail suburbs","domain":"transport","kind":"infrastructure","start":1920,"date_src":"part","place":"Tokyo","paradigm":"industrial","desc":"Private railways built lines, terminal stores and suburbs together, at 40 to 60 km/h: the rail metropolis of 30 million and more (Shinjuku about 3.5 million passengers a day).","chokepoint":false,"part":"12","parts":["12"]},{"id":"highways_trucking","label":"Trucks and highways","domain":"transport","kind":"infrastructure","start":1920,"date_src":"part","wide":1956,"place":"United States (Interstate 1956)","paradigm":"industrial","desc":"Door-to-door freight from the 1920s, and the US Interstate system from 1956; factories could leave railheads [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"household_appliances","label":"Household appliances","domain":"energy","kind":"good","start":1920,"date_src":"part","place":"United States","paradigm":"industrial","desc":"Irons, washing machines, refrigerators and radios came decades after light: they needed wired houses and consumer credit. US household electrification went from about 35% (1920) to nearly 68% (1929) [Richmond Fed 2020].","chokepoint":false,"part":"08","parts":["08"]},{"id":"multidivisional_firm","label":"Multidivisional firm (Sloan)","domain":"institutions","kind":"institution","start":1920,"date_src":"general","place":"General Motors, United States","paradigm":"industrial","desc":"GM under Alfred Sloan answered Ford's rigidity in the 1920s with a range of models at price steps, the annual model change, and divisions run on financial targets. Chandler made it the centre of his account of modern business (The Visible Hand).","chokepoint":false,"part":"08","parts":["08","13"]},{"id":"petrochemicals","label":"Petrochemical cracking","domain":"materials","kind":"industry","start":1920,"date_src":"general","wide":1950,"place":"United States; Germany","paradigm":"industrial","desc":"Naphtha and ethane are cracked to ethylene, propylene and benzene, then made into plastics (PE, PP, PVC, PET), synthetic fibres, rubber, solvents and detergents. The hub that ties food packaging, clothing and buildings to oil and gas.","chokepoint":false,"part":"13","parts":["13"]},{"id":"bell_labs","label":"Bell Labs","domain":"information","kind":"institution","start":1925,"date_src":"part","place":"New Jersey (AT&T)","paradigm":"industrial","desc":"A regulated monopoly funding basic research from secure rents: the transistor (1947), information theory (Shannon, 1948) and Unix.","chokepoint":false,"part":"08","parts":["08"]},{"id":"commercial_airlines","label":"Commercial airlines","domain":"transport","kind":"industry","start":1925,"date_src":"part","place":"United States (DC-3, 1936)","paradigm":"industrial","desc":"Founded on airmail subsidy; the Douglas DC-3 (1936) was the first airliner to pay on passengers alone. By the mid-2020s airlines carried on the order of four to five billion trips a year (rough).","chokepoint":false,"part":"08","parts":["08"]},{"id":"frozen_food","label":"Quick-frozen food","domain":"food","kind":"industry","start":1925,"date_src":"part","place":"United States (Birdseye)","paradigm":"industrial","desc":"Birdseye's quick freezing in the 1920s [s], dependent on cold stores all the way to the home.","chokepoint":false,"part":"02","parts":["02"]},{"id":"hybrid_maize_seed","label":"Hybrid seed maize","domain":"food","kind":"industry","start":1926,"date_src":"part","place":"US Corn Belt (Pioneer Hi-Bred)","paradigm":"industrial","desc":"Higher-yielding hybrids that do not breed true, so farmers buy seed every year; seed selection moved from farmer to company [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"spectrum_licensing","label":"Spectrum licensing","domain":"institutions","kind":"institution","start":1927,"date_src":"general","place":"United States","paradigm":"industrial","desc":"The state licenses who may transmit on which frequency. The part names spectrum a chokepoint of telecoms, and its licences as necessary as the machines.","chokepoint":true,"part":"08","parts":["08"]},{"id":"factory_bread","label":"Factory bread","domain":"food","kind":"industry","start":1928,"date_src":"part","place":"United States; Chorleywood, England","paradigm":"industrial","desc":"Sliced bread in 1928 and the Chorleywood process in 1961 moved bread from the baker to the factory and then the supermarket's frozen dough [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"supermarket","label":"Supermarket","domain":"food","kind":"industry","start":1930,"date_src":"part","place":"Queens, New York (King Kullen)","paradigm":"industrial","desc":"Self-service, low prices, volume and a car park (1930) [s]; Walmart later became the largest US grocer. Retailers set standards, private labels and prices; the US farmer's share of the food dollar is ~15 cents [s, r].","chokepoint":true,"part":"02","parts":["02"]},{"id":"multipurpose_dams","label":"Multipurpose dams","domain":"building","kind":"infrastructure","start":1933,"date_src":"part","place":"TVA (1933); Hoover (1936); Aswan High (1970)","paradigm":"industrial","desc":"Large dams combined water supply, flood control, irrigation and hydro power, bringing upstream-against-downstream conflicts between nations and displacing people from reservoirs. World irrigated area rose from about 147 to 343 million hectares, 1961 to 2020 [USDA ERS 2024].","chokepoint":false,"part":"08","parts":["08"]},{"id":"mortgage_market","label":"Mortgage and construction credit","domain":"exchange","kind":"institution","start":1934,"date_src":"general","place":"United States (FHA); worldwide","paradigm":"industrial","desc":"A construction loan and a mortgage market are inputs to a building as much as cement; construction ties the global economy to land, credit and law.","chokepoint":false,"part":"13","parts":["13"]},{"id":"radar","label":"Radar","domain":"information","kind":"technique","start":1935,"date_src":"general","place":"Britain and Germany","paradigm":"industrial","desc":"Radio turned to detecting aircraft and ships, then to navigation and military command. Radar and radio beacons became part of the controlled sky airliners needed.","chokepoint":false,"part":"08","parts":["08"]},{"id":"rural_electrification","label":"Rural electric cooperatives","domain":"institutions","kind":"institution","start":1935,"date_src":"part","wide":1955,"place":"United States (REA)","paradigm":"industrial","desc":"In 1930 about nine in ten urban homes had access but only about one farm in ten, because the load did not pay for the wire. The Rural Electrification Administration (1935) lent to farmers' cooperatives to build their own lines; farms passed nine in ten by the mid-1950s (rough). A network leaves out its thin edges unless an institution pays.","chokepoint":false,"part":"08","parts":["08"]},{"id":"synthetic_fibres","label":"Nylon","domain":"textiles","kind":"good","start":1935,"date_src":"part","place":"DuPont, United States","paradigm":"industrial","desc":"DuPont's nylon (1935 to 1939), from an industrial research laboratory, was the first fully synthetic fibre; fibres later drew on petrochemical feedstocks.","chokepoint":false,"part":"08","parts":["08"]},{"id":"drug_regulation","label":"Drug safety and efficacy law","domain":"institutions","kind":"institution","start":1938,"date_src":"part","place":"United States (1938, 1962)","paradigm":"industrial","desc":"The Elixir Sulfanilamide deaths led to the 1938 Act (proof of safety) and thalidomide to the 1962 rule of proof of efficacy. Drugs became an industry gated by testing, with costly trials as its threshold.","chokepoint":true,"part":"08","parts":["08"]},{"id":"ddt_pesticides","label":"DDT and pesticides","domain":"food","kind":"good","start":1939,"date_src":"part","place":"Switzerland (Paul Muller)","paradigm":"industrial","desc":"Used against typhus and malaria in the war, then on crops. Silent Spring (1962) made its harm public and the US banned most uses in 1972: a commons, the gain private and the harm shared downstream.","chokepoint":false,"part":"08","parts":["08"]},{"id":"jet_engine","label":"Jet engine","domain":"transport","kind":"technique","start":1939,"date_src":"part","place":"Britain (Whittle); Germany (von Ohain)","paradigm":"industrial","desc":"Burned refinery kerosene in a turbine whose blades must keep their strength red-hot. The Comet (1952) taught through fatigue failures how pressurised hulls break; the 707 (1958) and 747 (1970) made jet travel cheap.","chokepoint":false,"part":"08","parts":["08"]},{"id":"nickel_superalloys","label":"Nickel superalloys","domain":"metals","kind":"good","start":1940,"date_src":"general","place":"Britain and the US","paradigm":"industrial","desc":"Alloys that keep their strength red-hot for turbine blades, much later grown as single crystals. A metallurgical long skill held by few engine makers.","chokepoint":false,"part":"08","parts":["08"]},{"id":"synthetic_rubber","label":"Synthetic rubber","domain":"materials","kind":"good","start":1942,"date_src":"part","place":"Germany; United States","paradigm":"industrial","desc":"Rubber made from petrochemicals, blended with natural rubber (Thailand, Indonesia), carbon black and steel cord in tyres. A substitute that loosened the plantation chokepoint.","chokepoint":false,"part":"08","parts":["08","13"]},{"id":"welfare_state","label":"Welfare state","domain":"institutions","kind":"institution","start":1942,"date_src":"part","wide":1960,"place":"Britain (Beveridge); OECD","paradigm":"industrial","desc":"Public spending in industrial countries rose from about 8 to 11% of GDP around 1870 to nearly 46% by 1996 [checked] (Tanzi and Schuknecht), driven by wars, the franchise and social spending on pensions, unemployment, health and schooling. Lindert: high spenders did not grow more slowly.","chokepoint":false,"part":"05","parts":["05"]},{"id":"bretton_woods","label":"Bretton Woods system","domain":"exchange","kind":"institution","start":1944,"date_src":"part","place":"International","paradigm":"industrial","desc":"Currencies pegged to the dollar and the dollar convertible to gold for central banks, with the IMF and World Bank. It ended when the US closed the gold window on 15 August 1971.","chokepoint":false,"part":"04","parts":["04"]},{"id":"icao_air_rights","label":"Chicago Convention air rights","domain":"institutions","kind":"institution","start":1944,"date_src":"part","place":"Chicago (ICAO)","paradigm":"industrial","desc":"Created the International Civil Aviation Organization and the system of rights to fly over and land in other countries: the legal frame of any international route.","chokepoint":false,"part":"08","parts":["08"]},{"id":"penicillin_fermentation","label":"Deep-tank penicillin","domain":"materials","kind":"technique","start":1944,"date_src":"part","place":"Brooklyn (Pfizer)","paradigm":"industrial","desc":"Fleming's penicillin (1928), made a drug by Florey and Chain (1940), was mass produced by deep-tank fermentation borrowed from brewing and citric-acid making. Pfizer's plant in a converted ice factory, fourteen 7,500-gallon tanks, opened in March 1944 [ACS landmark].","chokepoint":false,"part":"08","parts":["08"]},{"id":"computer","label":"Electronic computer","domain":"information","kind":"technique","start":1945,"date_src":"part","place":"ENIAC, Philadelphia","paradigm":"industrial","desc":"About 18,000 vacuum tubes and 150 kW of power, built for artillery tables (rough), from the lamp and radio industries' tubes and wartime money. Like the dynamo, it was slow to show in productivity (Solow, 1987).","chokepoint":false,"part":"08","parts":["08"]},{"id":"semi_dwarf_varieties","label":"Semi-dwarf wheat and rice","domain":"food","kind":"technique","start":1945,"date_src":"part","place":"Mexico (Borlaug); IRRI, Philippines (IR8, 1966)","paradigm":"industrial","desc":"Short-stemmed wheat bred with the Japanese Norin-10 gene took heavy fertiliser without falling over; IR8 rice followed in 1966. The seed was useless alone.","chokepoint":false,"part":"08","parts":["08"]},{"id":"uranium_enrichment","label":"Uranium enrichment","domain":"energy","kind":"industry","start":1945,"date_src":"general","place":"Russia (Rosatom), Urenco, Orano, CNNC","paradigm":"industrial","desc":"Mined uranium is milled to yellowcake, converted to UF6 and enriched before fuel fabrication. Rosatom held about 44% of world enrichment capacity in 2024 (POWERTECH; estimates 40-46%), a chokepoint that survived the 2022 sanctions because the West had let its own capacity run down.","chokepoint":true,"part":"13","parts":["13"]},{"id":"semiconductors","label":"Transistor","domain":"information","kind":"technique","start":1947,"date_src":"part","place":"Bell Labs, New Jersey","paradigm":"industrial","desc":"Came from the telephone monopoly's laboratory and quantum physics, in germanium then silicon. It replaced the vacuum tube and began the semiconductor industry.","chokepoint":false,"part":"08","parts":["08"]},{"id":"broiler_genetics","label":"Broiler breeding firms","domain":"food","kind":"industry","start":1950,"date_src":"general","place":"Aviagen, Cobb-Vantress","paradigm":"industrial","desc":"Two breeding firms supply grandparent stock for most of the world's broiler lines (rough: a large majority). A chokepoint at the head of the most industrialised animal chain.","chokepoint":true,"part":"13","parts":["13"]},{"id":"credit_cards","label":"Credit and charge cards","domain":"exchange","kind":"technique","start":1950,"date_src":"part","place":"United States (Diners Club)","paradigm":"industrial","desc":"Diners Club (1950) and BankAmericard (1958) brought consumer credit to the point of sale [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"groundwater_pumping","label":"Groundwater pump irrigation","domain":"food","kind":"practice","start":1950,"date_src":"general","place":"the Punjab; the US Plains","paradigm":"irrigation","desc":"Electric and diesel pumps lifted groundwater for fields: the classic depleting commons. It watered the Green Revolution and lowered water tables.","chokepoint":false,"part":"08","parts":["08"]},{"id":"high_purity_quartz","label":"High-purity quartz (Spruce Pine)","domain":"materials","kind":"resource","start":1950,"date_src":"general","place":"Spruce Pine, North Carolina","paradigm":"service_information","desc":"Two firms in one town supply about 70-90% of high-purity quartz (TT, BNN), used for the crucibles in which silicon ingots are grown. Hurricane Helene shut both mines for about two weeks in 2024. A chokepoint of geology.","chokepoint":true,"part":"13","parts":["13"]},{"id":"informal_settlements","label":"Informal settlements","domain":"building","kind":"practice","start":1950,"date_src":"general","place":"21st-century megacities","paradigm":"service_information","desc":"Where infrastructure has not kept pace with migration, density brings back the old diseases: UN-Habitat counts roughly a billion people in slums (rough).","chokepoint":false,"part":"12","parts":["12"]},{"id":"keiretsu_supplier_network","label":"Keiretsu supplier network","domain":"institutions","kind":"institution","start":1950,"date_src":"general","place":"Toyota group, Japan","paradigm":"industrial","desc":"A tiered network of long-term, often part-owned suppliers who design parts with the assembler, share costs and are not dropped for a cheaper bid (Gereffi's relational governance). After the Aisin fire of Feb 1997 cut about 99% of Toyota's P-valves, more than 200 group firms improvised production and plants restarted in about five days (WIKI-AISIN; sources give two to five).","chokepoint":false,"part":"13","parts":["13"]},{"id":"lean_supplier_networks","label":"Lean supplier networks","domain":"institutions","kind":"practice","start":1950,"date_src":"general","place":"Japan (Toyota, keiretsu)","paradigm":"industrial","desc":"A core plant drawing parts just in time from a pyramid of affiliated suppliers tied by long relationships and cross-shareholding; Japanese makers bought around 80% of parts from affiliates while GM made more than half in house (rough). The lean plant built a car in about 16 hours against 31 [Womack, Jones and Roos 1990].","chokepoint":false,"part":"08","parts":["08"]},{"id":"oil_straits","label":"Oil straits (Hormuz, Malacca)","domain":"transport","kind":"infrastructure","start":1950,"date_src":"general","place":"Persian Gulf; Strait of Malacca","paradigm":"industrial","desc":"Hormuz carried about 20 million barrels a day of oil in 2023 and much of the world's LNG; Malacca about 23.7 million, the largest oil chokepoint (EIA). Geography forces many routes into one; tanker war 1984-88, seizures in 2019.","chokepoint":true,"part":"13","parts":["13"]},{"id":"petrochemical_cracking","label":"Steam cracking feedstocks","domain":"materials","kind":"technique","start":1950,"date_src":"part","place":"US and European refineries","paradigm":"industrial","desc":"After the Second World War, steam cracking of naphtha and ethane gave ethylene and propylene in bulk, switching the chemical industry's raw material from coal to oil and gas.","chokepoint":false,"part":"08","parts":["08"]},{"id":"seaborne_iron_ore","label":"Seaborne iron ore trade","domain":"transport","kind":"infrastructure","start":1950,"date_src":"general","wide":2005,"place":"Pilbara and Brazil to China","paradigm":"service_information","desc":"Ore is crushed, pelletised or sintered and carried in 200,000-400,000 tonne bulk carriers. Australia-China iron ore is the world's largest bulk trade by tonnage (rough); the ore is in Australia and Brazil, the furnaces in China.","chokepoint":false,"part":"13","parts":["13"]},{"id":"toyota_production_system","label":"Toyota Production System (lean)","domain":"institutions","kind":"technique","start":1950,"date_src":"part","wide":1990,"place":"Toyota, Japan","paradigm":"industrial","desc":"Ohno and Toyoda's answer to a firm that could not afford Ford's scale or stocks: just in time, jidoka (stop the line at the first defect), small lots and quick die changes so many models share one line. The MIT IMVP found about 16 labour hours and 45 defects per 100 cars against 31 hours and 130 defects for mass production (MIT IMVP via TST). NUMMI (1984) showed the gap was organisation, not culture.","chokepoint":false,"part":"13","parts":["13"]},{"id":"wiring_harness","label":"Car wiring harness","domain":"transport","kind":"good","start":1950,"date_src":"general","place":"Mexico, Morocco, Eastern Europe, Philippines","paradigm":"industrial","desc":"About 1 to 5 km of copper wire per car, hand-assembled in low-wage countries (rough). Harness labour is one of the car chain's chokepoints alongside chips, batteries and magnets.","chokepoint":true,"part":"13","parts":["13"]},{"id":"basic_oxygen_furnace","label":"Basic oxygen steelmaking","domain":"metals","kind":"technique","start":1952,"date_src":"part","wide":1975,"place":"Linz-Donawitz, Austria","paradigm":"industrial","desc":"Blast-furnace hot metal is blown with oxygen in a converter with some scrap; BF-BOF makes about 70% of world steel (rough), needing about 1.4 t ore, 0.8 t coking coal and 0.3 t limestone per t (WSA-RM). World crude steel was 1,882.6 Mt in 2024, 53% in China (WSA).","chokepoint":false,"part":"03","parts":["03","13"]},{"id":"just_in_time_kanban","label":"Just in time (kanban)","domain":"institutions","kind":"practice","start":1953,"date_src":"general","wide":1990,"place":"Toyota, Japan","paradigm":"industrial","desc":"Each part arrives when needed in the quantity needed, pulled by a card from downstream rather than pushed to a plan. Lean plants held about two hours of parts stock against about two weeks (MIT IMVP). It removes buffer stock, which is cheap insurance, so every single source becomes a point of failure.","chokepoint":false,"part":"13","parts":["13"]},{"id":"factory_trawler","label":"Freezer factory trawler","domain":"food","kind":"technique","start":1954,"date_src":"general","wide":1970,"place":"North Atlantic","paradigm":"industrial","desc":"Diesel, sonar, synthetic nets and freezers in the 20th century (m): distant-water fleets with catches far beyond the fish's recovery.","chokepoint":false,"part":"03","parts":["03"]},{"id":"nuclear_power","label":"Nuclear power","domain":"energy","kind":"technique","start":1954,"date_src":"general","paradigm":"service_information","place":"","desc":"Fission heat raising steam for electricity. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"broiler_integration","label":"Integrated broiler chain","domain":"food","kind":"industry","start":1955,"date_src":"part","place":"US South (Tyson, Perdue); Brazil (BRF, JBS)","paradigm":"industrial","desc":"One firm owns breeder flocks, hatchery, feed mill, processing plant and brand; contract growers own the barns and are paid per pound under a tournament ranking, bearing the capital risk. Broilers went from 112 days to 2.5 lb at feed conversion 4.7 (1925) to 47 days to 6.6 lb at 1.69 (2024) (NCC, FS).","chokepoint":false,"part":"02","parts":["02","13"],"wide":1970},{"id":"hyperpure_silicon","label":"Hyperpure silicon wafers","domain":"materials","kind":"good","start":1955,"date_src":"general","place":"US, Japan, Germany","paradigm":"service_information","desc":"Quartz is reduced in arc furnaces to metallurgical silicon, purified to polysilicon of 'nine to eleven nines', pulled into single-crystal ingots and sliced into wafers. Silicon is abundant; purity is not.","chokepoint":false,"part":"08","parts":["08"]},{"id":"polysilicon","label":"Polysilicon refining","domain":"materials","kind":"industry","start":1955,"date_src":"general","wide":2010,"place":"now China","paradigm":"service_information","desc":"Quartz is reduced with coal or charcoal in arc furnaces to metallurgical silicon, then refined to polysilicon, using a great deal of power. China holds over 95% of polysilicon and wafers for solar and over 80% of every solar manufacturing stage (IEA-PV).","chokepoint":true,"part":"13","parts":["13"]},{"id":"silicon_wafers","label":"Silicon wafers","domain":"information","kind":"good","start":1955,"date_src":"general","place":"Shin-Etsu, SUMCO (Japan)","paradigm":"service_information","desc":"Polysilicon grown into ingots in quartz crucibles and sliced into wafers; Japanese firms dominate wafers and photoresists (JSR, TOK) through process chemistry and purity know-how.","chokepoint":true,"part":"13","parts":["13"]},{"id":"container_shipping","label":"Container shipping","domain":"transport","kind":"technique","start":1956,"date_src":"part","wide":1970,"place":"Newark to Houston (Ideal-X)","paradigm":"industrial","desc":"The Ideal-X carried 58 containers in April 1956 [c]; ISO standard sizes followed in the late 1960s. Loading loose cargo cost $5.83 a ton against about 16 cents by container (Levinson) [c]; ships, trains and trucks share one box.","chokepoint":false,"part":"04","parts":["04"]},{"id":"photolithography","label":"Chip lithography","domain":"information","kind":"technique","start":1957,"date_src":"general","place":"US labs; today ASML, Netherlands","paradigm":"service_information","desc":"Patterning chips with light, borrowed from printing. Extreme ultraviolet machines come from one firm, ASML, built from about 100,000 parts and 5,000 suppliers with Zeiss mirrors and Trumpf lasers, about EUR 350 million each (rough): a chokepoint of knowledge with no substitute.","chokepoint":true,"part":"08","parts":["08"]},{"id":"air_traffic_control","label":"Radar air traffic control","domain":"institutions","kind":"institution","start":1958,"date_src":"part","place":"United States (Federal Aviation Agency)","paradigm":"industrial","desc":"After two airliners collided over the Grand Canyon in 1956, one radar-based control system was created for the sky. American fares and routes were regulated until 1978.","chokepoint":false,"part":"08","parts":["08"]},{"id":"integrated_circuit","label":"Integrated circuit","domain":"information","kind":"technique","start":1958,"date_src":"part","place":"Texas Instruments (Kilby); Fairchild (Noyce, planar 1959)","paradigm":"service_information","desc":"Many transistors on one chip by photolithography, diffusion furnaces and pure chemicals. Minuteman missiles and the Apollo guidance computer bought most of the first ones, carrying the industry down its learning curve (rough).","chokepoint":false,"part":"08","parts":["08"]},{"id":"float_glass","label":"Float glass (Pilkington)","domain":"materials","kind":"technique","start":1959,"date_src":"general","wide":1970,"place":"Pilkington, England","paradigm":"industrial","desc":"Flat glass formed on a bath of molten tin from silica sand, soda ash and limestone, heated by gas; the part dates it to the 1950s. It glazes building envelopes and cars.","chokepoint":false,"part":"13","parts":["13"]},{"id":"air_cargo","label":"Air cargo","domain":"transport","kind":"industry","start":1960,"date_src":"general","place":"world airports","paradigm":"industrial","desc":"Under 1% of world trade by weight but close to a third by value [IATA 2025]: flowers, fish, drugs, chips, spare parts. It lets one chip supply chain run across several continents.","chokepoint":false,"part":"08","parts":["08"]},{"id":"air_freight","label":"Air freight","domain":"transport","kind":"industry","start":1960,"date_src":"part","place":"Worldwide (jet freighters)","paradigm":"service_information","desc":"Jet freighters from the 1960s carried high-value goods fast; the cost of air freight fell about an order of magnitude from 1955 to 2004 (Hummels) [c]. Air carries a large share of trade by value but under 1% by weight [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"modern_tower_block","label":"Concrete and glass tower","domain":"building","kind":"infrastructure","start":1960,"date_src":"general","place":"cities worldwide","paradigm":"industrial","desc":"An office or apartment tower is a long local assembly of dozens of trades on global parts: concrete, rebar and structural steel, float glass, lifts, HVAC, copper cable and transformers. 100-200 industries and 10-40 countries touched (rough). China used about 6.6 billion t of cement in 2011-13, more than the US in the whole 20th century (Smil, rough).","chokepoint":false,"part":"13","parts":["13"]},{"id":"chorleywood_bread_process","label":"Chorleywood bread process","domain":"food","kind":"technique","start":1961,"date_src":"part","wide":1970,"place":"Chorleywood, England","paradigm":"industrial","desc":"Industrial baking that cut fermentation to minutes with high-speed mixing, fats and improvers; it makes most British bread (rough, about 80%). Slicing and bagging machines and polyethylene bags complete the loaf.","chokepoint":false,"part":"13","parts":["13"]},{"id":"container_ports_gantry","label":"Container ports and gantry cranes","domain":"transport","kind":"infrastructure","start":1962,"date_src":"general","wide":1975,"place":"Port Newark-Elizabeth; Felixstowe; Rotterdam","paradigm":"industrial","desc":"Gantry cranes, large flat yards and deep berths for cellular ships. The old docks (Manhattan, London's East End, Liverpool) died and new ones grew where land was, after long fights with dockers' unions settled by buyouts and guaranteed incomes. Shanghai now handles about 50 million TEU a year (rough).","chokepoint":false,"part":"13","parts":["13"]},{"id":"pharma_rnd_trials","label":"Drug R&D and clinical trials","domain":"institutions","kind":"industry","start":1962,"date_src":"general","place":"US (FDA), Europe (EMA)","paradigm":"industrial","desc":"Discovery, preclinical tests and Phase I-III trials before a regulator's review, about 10-15 years; about $2.6 billion per approved drug including failures (Tufts CSDD; contested). Time capital at its extreme, then a pulse of monopoly profit during patent life.","chokepoint":false,"part":"13","parts":["13"]},{"id":"lng_shipping","label":"LNG liquefaction and tankers","domain":"energy","kind":"infrastructure","start":1964,"date_src":"general","wide":2010,"place":"Algeria to UK; now US, Qatar, Australia","paradigm":"industrial","desc":"Gas is liquefied, shipped in tankers and regasified, freeing it from pipelines; the US, Qatar and Australia are the largest exporters. When Russian pipeline gas to Europe was cut in 2022, European gas and power prices rose several-fold and fertiliser plants closed.","chokepoint":false,"part":"13","parts":["13"]},{"id":"export_processing_zones","label":"Export-processing zones","domain":"exchange","kind":"institution","start":1965,"date_src":"general","wide":1980,"place":"Mexico's maquiladoras; East Asia; Shenzhen 1980","paradigm":"service_information","desc":"Zones where labour-intensive steps (garments, electronics assembly) were moved to low-wage coasts from the 1970s to the 1990s, with Shenzhen opened in 1980. A step between multinationals building whole plants abroad and the fine-sliced value chain.","chokepoint":false,"part":"13","parts":["13"]},{"id":"green_revolution","label":"Green Revolution","domain":"food","kind":"practice","start":1965,"date_src":"part","place":"India and Pakistan (the Punjab)","paradigm":"industrial","desc":"New wheats helped raise Indian wheat from about 12 to about 20 million tonnes, mid-1960s to 1970 (rough). It was an assembly of seed, fertiliser, irrigation, pesticides, credit, extension agents and price support; where any was missing gains were small, and in the Punjab they came with falling water tables and widening gaps.","chokepoint":false,"part":"02","parts":["02","08"]},{"id":"rare_earth_separation","label":"Rare-earth separation","domain":"metals","kind":"industry","start":1965,"date_src":"general","wide":1995,"place":"China (also Mountain Pass, Myanmar)","paradigm":"service_information","desc":"Hundreds of solvent-extraction stages separate the elements, with chemistry skill and acid waste. China does about 90% of separation (91% of magnet rare earths in 2024, IEA). Its April 2025 licensing of seven heavy rare earths halved magnet exports within a month (SMM, ENGNEWS): a chokepoint used as a dial.","chokepoint":true,"part":"13","parts":["13"]},{"id":"boxed_beef","label":"Boxed beef","domain":"food","kind":"industry","start":1967,"date_src":"general","place":"US cattle country (IBP)","paradigm":"industrial","desc":"Iowa Beef Packers built plants in the cattle country in the 1960s, ran fast lines with low-skilled labour and shipped vacuum-packed cuts instead of carcasses [s].","chokepoint":false,"part":"02","parts":["02"]},{"id":"iso_container_standard","label":"ISO container standard","domain":"transport","kind":"institution","start":1968,"date_src":"general","wide":1970,"place":"ISO; United States and Europe","paradigm":"industrial","desc":"Standard 20- and 40-foot boxes and corner fittings, agreed in the 1960s after fights between firms and countries over sizes. The box was not the invention; the system was, and the standard is a public good someone had to set and others accept.","chokepoint":false,"part":"13","parts":["13"]},{"id":"internet","label":"Internet","domain":"information","kind":"infrastructure","start":1969,"date_src":"part","place":"United States (ARPANET); CERN (the Web, 1989 to 1991)","paradigm":"service_information","desc":"ARPANET joined university computers on lines leased from the telephone network; TCP/IP (1983) interconnected networks, the Web gave a public face and the backbone opened to commerce in 1995. About 5.5 billion people, 68% of the world, were online in 2024 [ITU 2024]; it later carried voice as data.","chokepoint":false,"part":"08","parts":["08"]},{"id":"software_industry","label":"Software industry","domain":"information","kind":"industry","start":1969,"date_src":"part","place":"United States (IBM unbundling; IBM PC 1981, Microsoft)","paradigm":"service_information","desc":"Selling software apart from machines, then as a mass product for personal computers. It needed university training in programming and copyright for code.","chokepoint":false,"part":"08","parts":["08"]},{"id":"aerospace_oligopoly","label":"Airframe and engine oligopoly","domain":"transport","kind":"industry","start":1970,"date_src":"general","place":"Boeing, Airbus; GE, Rolls-Royce, Pratt & Whitney","paradigm":"industrial","desc":"Large airframes came down to two makers and large jet engines to three. Very high fixed costs of design and certification, long learning curves and few buyers made an oligopoly by increasing returns and long skill.","chokepoint":true,"part":"08","parts":["08"]},{"id":"critical_minerals","label":"Rare chip elements","domain":"materials","kind":"resource","start":1970,"date_src":"general","place":"China and scattered mines","paradigm":"service_information","desc":"Gallium, germanium, hafnium, tantalum, cobalt, helium and rare earths are minor by weight and major by dependence. China produced about 98% of the world's gallium in 2023 [Global Taiwan Institute 2023].","chokepoint":true,"part":"08","parts":["08"]},{"id":"direct_reduced_iron","label":"Direct-reduced iron","domain":"metals","kind":"technique","start":1970,"date_src":"general","place":"Mexico, Middle East, India","paradigm":"service_information","desc":"Ore reduced in the solid state by natural gas (or hydrogen) rather than coke, fed with scrap to the electric arc furnace. The route that green steel plans rely on.","chokepoint":false,"part":"13","parts":["13"]},{"id":"electronic_payments","label":"Electronic card payments","domain":"exchange","kind":"infrastructure","start":1970,"date_src":"general","wide":2010,"place":"Rich countries","paradigm":"service_information","desc":"Retail payment as entries on a network's ledger. In 2024 contactless card spending was about $10.4 trillion over 456.6 billion transactions [c]; most retail payments in rich countries became electronic.","chokepoint":false,"part":"04","parts":["04"]},{"id":"global_feed_trade","label":"Global feed trade","domain":"food","kind":"industry","start":1970,"date_src":"general","place":"Brazil and US to China and Europe","paradigm":"service_information","desc":"Soybeans and maize shipped across continents feed pigs, poultry and feedlots; livestock eats about a third of the world's cereal crop [s, r]. Efficient but brittle: in 2020 a handful of closed packing plants backed hogs up on farms.","chokepoint":false,"part":"02","parts":["02"]},{"id":"steel_minimill","label":"Scrap-based minimill","domain":"metals","kind":"industry","start":1970,"date_src":"part","wide":1990,"place":"Nucor, United States","paradigm":"service_information","desc":"Small, flexible electric arc furnace plants on scrap or DRI, now about 30% of world steel (rough), switching the chain from mining to recycling. They destroyed much of the old integrated industry: Christensen's standard example of disruption.","chokepoint":false,"part":"13","parts":["13"]},{"id":"fiat_money","label":"Fiat money","domain":"exchange","kind":"institution","start":1971,"date_src":"part","place":"International","paradigm":"service_information","desc":"Currency backed only by the state's acceptance of it for taxes and the central bank's management; floating rates from 1973. Inflation targeting by independent central banks spread from New Zealand (1990) [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"microprocessor","label":"Microprocessor","domain":"information","kind":"technique","start":1971,"date_src":"part","place":"Intel, California (4004)","paradigm":"service_information","desc":"About 2,300 transistors on one chip; a 2024 GPU package held about 208 billion. Half a century of shrinking was paid for by each generation's sales; Perez dates the information surge from it.","chokepoint":false,"part":"08","parts":["08"]},{"id":"swift_messaging","label":"SWIFT and clearing hubs","domain":"exchange","kind":"infrastructure","start":1973,"date_src":"part","place":"Brussels; global","paradigm":"service_information","desc":"Clearing houses, card networks (Visa, Mastercard) and messaging (SWIFT) are themselves chokepoints of finance; foreign exchange turnover was about $9.6 trillion a day in April 2025 (BIS). States sitting on such hubs can weaponise interdependence (Farrell and Newman).","chokepoint":true,"part":"04","parts":["04","13"]},{"id":"barcode_upc","label":"Bar code (UPC)","domain":"information","kind":"technique","start":1974,"date_src":"part","wide":1985,"place":"United States","paradigm":"service_information","desc":"The Universal Product Code, first scanned in 1974, joined retail checkout to stock records. With satellite links it let Walmart run its own logistics from the 1980s, and retailers' data on what sells came to set factory orders.","chokepoint":false,"part":"13","parts":["13"]},{"id":"multi_fibre_arrangement","label":"Multi Fibre Arrangement","domain":"exchange","kind":"institution","start":1974,"date_src":"part","place":"GATT; importing countries","paradigm":"service_information","desc":"A quota system (1974-2004) that spread garment making across dozens of countries; its end in 2005 concentrated it in China, Bangladesh and Vietnam. Rivoli's finding was that politics (subsidies, quotas, rules of origin) shaped the T-shirt's route as much as markets.","chokepoint":false,"part":"13","parts":["13"]},{"id":"aquaculture","label":"Aquaculture","domain":"food","kind":"industry","start":1975,"date_src":"part","wide":2022,"place":"China, Norway, Southeast Asia","paradigm":"service_information","desc":"Keeping instead of catching at scale: in 2022 aquaculture overtook capture for aquatic animals, 94.4 Mt against 92.3 Mt (cited), growing about 5% a year since 2000. The medieval fishpond became the dominant form.","chokepoint":false,"part":"03","parts":["03"]},{"id":"global_garment_chain","label":"Global garment chain","domain":"textiles","kind":"industry","start":1975,"date_src":"general","wide":2000,"place":"Bangladesh, China and brands' home countries","paradigm":"service_information","desc":"Fibre plants, mills, dye houses and cut-and-sew workshops in low-wage countries, the brand owning design and market: putting-out made global. World fibre was about 132 Mt in 2024, polyester 59% (cited); Rana Plaza (2013) killed over 1,100 garment workers (m).","chokepoint":false,"part":"03","parts":["03"]},{"id":"global_value_chains","label":"Global value chains","domain":"exchange","kind":"practice","start":1975,"date_src":"part","wide":2000,"place":"worldwide; China after WTO entry (2001)","paradigm":"service_information","desc":"Baldwin's second unbundling: cheap telecoms let the factory itself be split across countries, with know-how sent with the work. Trade inside such chains reached almost half of world trade by 2008 and then stalled (WDR 2020). Specialisation compounds wealth and fragility together.","chokepoint":false,"part":"04","parts":["04","13"]},{"id":"megacity_systems","label":"Megacity metropolitan systems","domain":"building","kind":"infrastructure","start":1975,"date_src":"part","place":"Tokyo, Jakarta, Dhaka, Shanghai","paradigm":"service_information","desc":"Metro, expressways, airports, container ports, treatment plants, grids and data at a scale for 10 million and more: 8 such cities in 1975 and 33 in the UN's 2025 count. Every lower layer must already hold.","chokepoint":false,"part":"12","parts":["12"]},{"id":"eez","label":"Exclusive economic zones","domain":"institutions","kind":"institution","start":1977,"date_src":"part","wide":1985,"place":"coastal states worldwide","paradigm":"service_information","desc":"The sea enclosed by states in the 1970s and 1980s (m).","chokepoint":false,"part":"03","parts":["03"]},{"id":"api_fine_chemicals","label":"Active ingredient (API) chemistry","domain":"materials","kind":"industry","start":1980,"date_src":"general","wide":2000,"place":"China and India","paradigm":"service_information","desc":"Key starting materials, intermediates and the active pharmaceutical ingredient, made as fine chemicals; India's makers import about 70% of their API inputs from China (rough). Very high Chinese shares in some whole classes, such as older antibiotics (USP).","chokepoint":true,"part":"13","parts":["13"]},{"id":"cross_dock_distribution","label":"Cross-dock distribution centre","domain":"transport","kind":"infrastructure","start":1980,"date_src":"part","wide":1990,"place":"Walmart, United States","paradigm":"service_information","desc":"The 20th-century warehouse stored; the distribution centre flows, unloading inbound trucks straight onto outbound ones for daily store delivery. Bread goes bakery depot to the supermarket's regional cross-dock to store, daily.","chokepoint":false,"part":"13","parts":["13"]},{"id":"gallium_germanium","label":"Gallium and germanium","domain":"metals","kind":"resource","start":1980,"date_src":"general","place":"China","paradigm":"service_information","desc":"Minor metals for radio chips (gallium arsenide) and optics; China has about 98% of primary gallium (rough). China licensed exports from Aug 2023 and banned some to the US from Dec 2024 (rough).","chokepoint":true,"part":"13","parts":["13"]},{"id":"offshore_garment_sewing","label":"Offshore garment sewing","domain":"textiles","kind":"industry","start":1980,"date_src":"general","wide":2005,"place":"Bangladesh, Vietnam, Cambodia, China","paradigm":"service_information","desc":"A buyer-driven chain: the brand designs and sells but owns no factory; cutting and sewing go to the cheapest coast. Garments are over 80% of Bangladesh's exports, about $46 billion in 2022 (DT); Rana Plaza (2013) killed 1,134 workers. The sewing wage is put at around 1% of the retail price (rough, contested).","chokepoint":false,"part":"13","parts":["13"]},{"id":"producer_services","label":"Global-city producer services","domain":"exchange","kind":"industry","start":1980,"date_src":"general","place":"New York, London, Tokyo","paradigm":"service_information","desc":"Sassen: globalisation dispersed production but concentrated control in cities that make and trade finance, law, accounting, advertising and consulting, polarising into well-paid professionals and low-paid service workers. Global cities rank by firms' office networks, not size.","chokepoint":false,"part":"12","parts":["12"]},{"id":"secondhand_clothing_trade","label":"Secondhand clothing export","domain":"textiles","kind":"industry","start":1980,"date_src":"general","place":"East Africa, Eastern Europe","paradigm":"service_information","desc":"After use, donated clothes are sorted, baled and exported to secondhand markets, then become rags or landfill: the long tail of the T-shirt chain that Rivoli followed to Tanzania (RIV).","chokepoint":false,"part":"13","parts":["13"]},{"id":"solar_wind","label":"Solar and wind power","domain":"energy","kind":"technique","start":1980,"date_src":"general","paradigm":"service_information","place":"","desc":"Photovoltaic and wind-turbine generation, cheap at scale from the 2010s. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"biologics","label":"Biologic drugs","domain":"materials","kind":"industry","start":1982,"date_src":"general","place":"United States; Europe","paradigm":"service_information","desc":"Cell lines, bioreactors, purification and a cold chain instead of chemistry. The Pfizer-BioNTech COVID vaccine needed about 280 materials from 86 suppliers in 19 countries (rough, company figure); sterile fill-finish glass vials are a recurrent shortage.","chokepoint":false,"part":"13","parts":["13"]},{"id":"mobile_phone","label":"Mobile phone","domain":"information","kind":"good","start":1983,"date_src":"general","paradigm":"service_information","place":"","desc":"Cellular telephones. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"double_stack_rail","label":"Double-stack container rail","domain":"transport","kind":"infrastructure","start":1984,"date_src":"part","place":"North America","paradigm":"service_information","desc":"The same box moves from ship to rail to truck; US double-stack trains from 1984, after the 1980 deregulation of rail and trucking. It made the container intermodal over long land distances.","chokepoint":false,"part":"13","parts":["13"]},{"id":"generic_drugs","label":"Generic drugs","domain":"materials","kind":"industry","start":1984,"date_src":"general","wide":2000,"place":"India; United States market","paradigm":"service_information","desc":"After patent expiry the drug becomes a commodity made by the cheapest maker: Indian firms supplied about 47% of US generic prescriptions in 2022 (IQVIA). Selling near cost, makers cut to one or two plants per molecule, so one failed inspection causes national shortages (cisplatin 2023, rough).","chokepoint":false,"part":"13","parts":["13"]},{"id":"ndfeb_magnets","label":"Neodymium (NdFeB) magnets","domain":"metals","kind":"good","start":1984,"date_src":"general","wide":2015,"place":"China about 90% (rough)","paradigm":"service_information","desc":"Neodymium-iron-boron magnets for EV motors, wind turbines, phone speakers and haptics, and missiles. China makes about 90% (rough); in 2025 some car plants outside China cut output for lack of them (SMM).","chokepoint":true,"part":"13","parts":["13"]},{"id":"eda_software","label":"Chip design (EDA) software","domain":"information","kind":"industry","start":1985,"date_src":"general","place":"Synopsys, Cadence (US); Siemens EDA","paradigm":"service_information","desc":"Electronic design automation tools and libraries on which chip designers are trained; decades of accumulated tools make it a chokepoint with no quick substitute. Arm's instruction set (UK) is a parallel ecosystem node.","chokepoint":true,"part":"13","parts":["13"]},{"id":"fishing_quotas","label":"Tradable fishing quotas","domain":"institutions","kind":"institution","start":1985,"date_src":"part","place":"Iceland, New Zealand","paradigm":"service_information","desc":"Late 20th-century quotas and tradable shares (m): the commons privatised as rights to a share of the catch.","chokepoint":false,"part":"03","parts":["03"]},{"id":"foundry_model","label":"Fabless chip foundry","domain":"information","kind":"industry","start":1987,"date_src":"part","wide":2000,"place":"TSMC, Hsinchu, Taiwan","paradigm":"service_information","desc":"Chip design split from fabrication: fabless firms design, a foundry makes for many customers. A leading fab costs $20 billion or more (rough), and yield learning ties customers' designs to one process, so TSMC became a chokepoint built by learning rather than geography.","chokepoint":true,"part":"13","parts":["13"]},{"id":"pure_play_foundry","label":"Foundry and fabless split","domain":"information","kind":"industry","start":1987,"date_src":"part","place":"Taiwan (TSMC)","paradigm":"service_information","desc":"Chipmaking split into fabless designers (Nvidia, Apple, Qualcomm) and foundries that do not compete with their customers, on standard design rules. A leading-edge fab costs about $20 billion or more and TSMC makes roughly 90% of the most advanced logic chips (rough).","chokepoint":true,"part":"08","parts":["08"]},{"id":"fibre_optic_backbone","label":"Fibre-optic backbones","domain":"information","kind":"infrastructure","start":1988,"date_src":"general","place":"undersea and along rail and pipeline corridors","paradigm":"service_information","desc":"Fibre cables carry most intercontinental traffic, laid along railway and pipeline corridors and the old telegraph cable routes. They feed data centres, which draw on the grid.","chokepoint":false,"part":"08","parts":["08"]},{"id":"battery_mineral_refining","label":"Battery-mineral refining","domain":"metals","kind":"industry","start":1990,"date_src":"general","wide":2015,"place":"China; Indonesia (nickel)","paradigm":"service_information","desc":"Lithium, nickel, cobalt and graphite are mined widely but refined mostly in China: about 80-88% of cobalt refining (IISD), over 90% of battery-grade graphite (IEA), and leadership in 19 of 20 energy minerals at about 70% average share (IEA-CMO). Refining is the chokepoint because it needs cheap power, chemistry skill, tolerance of pollution and years to build.","chokepoint":true,"part":"13","parts":["13"]},{"id":"contract_manufacturing","label":"Contract manufacturing","domain":"institutions","kind":"industry","start":1990,"date_src":"part","wide":2000,"place":"Foxconn, Flextronics; southern China","paradigm":"service_information","desc":"Firms that assemble other firms' branded products to written specifications: Gereffi's modular governance. Foxconn, Pegatron and Luxshare assemble most smartphones, in China and increasingly India and Vietnam. Assembly is easy to move and earns little (Chinese assembly labour about 1.8% of an iPhone 4's price, KLD).","chokepoint":false,"part":"13","parts":["13"]},{"id":"electronic_exchanges","label":"Electronic trading","domain":"exchange","kind":"technique","start":1990,"date_src":"part","place":"Worldwide","paradigm":"service_information","desc":"Prices for everyone in milliseconds from the 1990s, and algorithmic trading.","chokepoint":false,"part":"04","parts":["04"]},{"id":"power_market_liberalisation","label":"Liberalised power markets","domain":"energy","kind":"institution","start":1990,"date_src":"part","place":"UK, US, EU","paradigm":"service_information","desc":"Grids began as private firms (Edison), became regulated monopolies or state utilities (one wire network per place), and since the 1990s many were split into competing generators, regulated wires and a wholesale market. Supply must still equal demand every second across a synchronous area.","chokepoint":false,"part":"13","parts":["13"]},{"id":"lithium_ion_battery","label":"Lithium-ion battery cells","domain":"energy","kind":"industry","start":1991,"date_src":"general","wide":2015,"place":"Japan; now China (CATL, BYD)","paradigm":"service_information","desc":"Cells of cathode (lithium, nickel, cobalt, manganese or iron phosphate), graphite anode, electrolyte and separator, made by CATL, BYD, LG, Panasonic and others; China has roughly three quarters of world cell capacity (rough). They feed cars, grid storage and phones.","chokepoint":false,"part":"13","parts":["13"]},{"id":"cod_moratorium","label":"Northern cod moratorium","domain":"institutions","kind":"institution","start":1992,"date_src":"part","place":"Newfoundland","paradigm":"service_information","desc":"Harvestable northern cod fell 82% from 1962 to 1977 and the spawning stock was about 1% of its peak by 1992; the moratorium of 2 July 1992 put 30,000 to 40,000 people out of work (cited). The weir and the commons at the scale of an ocean.","chokepoint":false,"part":"03","parts":["03"]},{"id":"smile_curve_value_capture","label":"Smile curve of value","domain":"exchange","kind":"practice","start":1992,"date_src":"part","place":"Acer, Taiwan (Stan Shih)","paradigm":"service_information","desc":"Value added is high at both ends of a chain (R&D, design, brand, distribution, service) and low in the middle (fabrication, assembly). In 2010 Apple kept about 58.5% of an iPhone's price as profit, materials about 21.9%, Chinese labour about 1.8% (KLD). Value goes to what is scarce and hard to copy.","chokepoint":false,"part":"13","parts":["13"]},{"id":"ecommerce_fulfilment","label":"E-commerce fulfilment network","domain":"transport","kind":"infrastructure","start":1994,"date_src":"general","wide":2020,"place":"Amazon, United States","paradigm":"service_information","desc":"Walmart's template carried to the parcel: Amazon had about 1.5 million employees in 2025, most in operations, and around a million robots (RSF, GEEK). E-commerce is about a fifth of world retail (EMK). Increasing returns from network density, so a few firms dominate; the last mile is the costliest step per item.","chokepoint":false,"part":"13","parts":["13"]},{"id":"digital_platforms","label":"Digital platforms","domain":"exchange","kind":"institution","start":1995,"date_src":"general","place":"United States; China","paradigm":"service_information","desc":"Two-sided markets (app stores, marketplaces, ride hailing, payment networks) worth more to each side the more the other has: increasing returns of a social kind. One or two win per market and take a toll on every transaction (app stores 15-30%). The modern form of the miller's share: a rent for shared capital, here a network.","chokepoint":false,"part":"08","parts":["08","13"],"wide":2015},{"id":"data_centres","label":"Data centres","domain":"information","kind":"infrastructure","start":2000,"date_src":"general","place":"worldwide","paradigm":"service_information","desc":"Used about 415 TWh in 2024, around 1.5% of the world's electricity, projected to more than double by 2030 [IEA 2025]. Computing has come round to depend on the grid.","chokepoint":false,"part":"08","parts":["08"]},{"id":"cloud_computing","label":"Cloud computing","domain":"information","kind":"industry","start":2006,"date_src":"general","wide":2015,"place":"AWS, Azure, Google Cloud","paradigm":"service_information","desc":"Computing rented from huge data centres; three firms hold most of the market (rough). Cloud and AI are a new hub that draws power, chips and water.","chokepoint":false,"part":"13","parts":["13"]},{"id":"mobile_money","label":"Mobile money (M-Pesa)","domain":"exchange","kind":"technique","start":2007,"date_src":"part","place":"Kenya","paradigm":"service_information","desc":"Payments by phone for people without bank accounts, M-Pesa from 2007 [s].","chokepoint":false,"part":"04","parts":["04"]},{"id":"smartphone","label":"Smartphone","domain":"information","kind":"good","start":2007,"date_src":"general","wide":2015,"place":"designed in California, Seoul, Beijing; assembled in China","paradigm":"service_information","desc":"Assembly across the most countries of any common good, with chokepoints at both ends (minerals; leading-edge chips and EUV) and the steepest smile curve. Several dozen elements, often quoted as 60-70 (rough); 200-400 industries touched (rough). A 2023 teardown put the iPhone 15 Pro Max's parts at about $502 against a $1,199 price (CP).","chokepoint":false,"part":"13","parts":["13"]},{"id":"electric_vehicle","label":"Electric vehicle","domain":"transport","kind":"good","start":2008,"date_src":"general","wide":2020,"place":"US (Tesla); China (BYD)","paradigm":"service_information","desc":"A battery with a car around it: battery pack, rare-earth motor, silicon-carbide inverter. The IEA put a typical EV's mineral input at about six times a conventional car's (about 207 kg against 34 kg, excluding steel and aluminium; IEA 2021, rough).","chokepoint":false,"part":"13","parts":["13"]},{"id":"cryptocurrency","label":"Cryptocurrency","domain":"exchange","kind":"technique","start":2009,"date_src":"part","place":"Internet (Bitcoin)","paradigm":"service_information","desc":"A ledger kept by no single party, Bitcoin from 2009; mostly a speculative asset.","chokepoint":false,"part":"04","parts":["04"]},{"id":"gig_platforms","label":"Gig work platforms","domain":"institutions","kind":"institution","start":2009,"date_src":"general","place":"United States and worldwide","paradigm":"service_information","desc":"Piece rates and day labour with a digital hiring fair and a reputation score; about 1% of US employment as main work in 2017 [unchecked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"instant_payments","label":"Instant account payments (UPI)","domain":"exchange","kind":"infrastructure","start":2016,"date_src":"part","place":"India","paradigm":"service_information","desc":"Free, instant account-to-account retail payments at national scale: India's UPI from 2016, about 25.5 billion transactions in October 2026 [c].","chokepoint":false,"part":"04","parts":["04"]},{"id":"euv_lithography","label":"EUV lithography","domain":"information","kind":"technique","start":2019,"date_src":"general","place":"ASML, Veldhoven, Netherlands","paradigm":"service_information","de
