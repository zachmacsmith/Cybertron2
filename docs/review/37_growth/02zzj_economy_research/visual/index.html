 weights.","chokepoint":false,"part":"10","parts":["10"]},{"id":"silver_shekel","label":"Weighed silver shekel","domain":"exchange","kind":"good","start":-2500,"date_src":"general","place":"Mesopotamia","paradigm":"early_state","desc":"Silver weighed out as money of account, store and medium for trade, debt and fines: the shekel of about 8.3 to 8.4 g, 60 to the mina [c, x]. Barley was the unit inside the village; the Laws of Eshnunna set 1 shekel = 1 gur (300 sila) of barley [s]. It needed scales, scribes and a metal valued everywhere.","chokepoint":false,"part":"04","parts":["04"]},{"id":"tin_route","label":"Long-distance tin trade","domain":"exchange","kind":"practice","start":-2500,"date_src":"general","wide":-1300,"place":"eastern Mediterranean to Central Asia","paradigm":"early_state","desc":"Tin is rare and far from most copper, so bronze needed traders, ships and safe routes. The Uluburun wreck (c.1320 BC) carried 348 ingots, about 10 t of copper and 1 t of tin, a third of the tin traced to Musiston in Uzbekistan (cited). Assembly plus double chokepoint; when the routes broke, the metal failed.","chokepoint":true,"part":"03","parts":["03"]},{"id":"field_salinisation","label":"Salinisation and the barley shift","domain":"food","kind":"practice","start":-2400,"date_src":"general","place":"southern Mesopotamia","paradigm":"irrigation","desc":"Jacobsen and Adams argued irrigation without drainage salted the fields, pushing wheat out for salt-tolerant barley; Powell (1985) disputed it [contested]. Either way, intensification can degrade its own base.","chokepoint":false,"part":"10","parts":["10"]},{"id":"horse_riding_chariots","label":"Horse riding and chariots","domain":"transport","kind":"technique","start":-2200,"date_src":"part","place":"western steppe","paradigm":"pastoral_nomadic","desc":"The modern horse lineage spreads from ~2200 BC (Librado et al. 2024); Botai ~3500 BC [contested]. Firm riding and chariots in the late 3rd to early 2nd millennium BC: war and speed.","chokepoint":false,"part":"10","parts":["10"]},{"id":"dependent_weaving_workshops","label":"Temple weaving workshops","domain":"textiles","kind":"industry","start":-2100,"date_src":"part","place":"Lagash province, Guabba (Ur III)","paradigm":"early_state","desc":"Wool from household flocks spun and woven by dependent women on rations; one Ur III text records over 10,000 people in Lagash's weaving establishments, two-thirds women weavers [rough]. Cloth was traded for the timber, metal and stone the plain lacked.","chokepoint":false,"part":"10","parts":["10"]},{"id":"law_courts","label":"Royal courts and common law","domain":"institutions","kind":"institution","start":-2100,"date_src":"general","place":"England","paradigm":"feudal_manorial","desc":"Travelling justices and juries from Henry II's assizes; Common Pleas and King's Bench heard debt and contract. Courts that enforced promises between strangers impartially mattered most for trade beyond the village (North). Debt suits peaked around 1600 (Muldrew) [rough].","chokepoint":false,"part":"05","parts":["05"]},{"id":"amber_road","label":"Baltic amber road","domain":"exchange","kind":"practice","start":-2000,"date_src":"part","place":"Baltic to Mycenaean Greece","paradigm":"chiefdom","desc":"A long chain of linked exchanges carrying Baltic amber to the Mediterranean in the 2nd millennium BC [s]. A high value-for-weight good that could pay for great distances.","chokepoint":false,"part":"04","parts":["04"]},{"id":"debt_bondage","label":"Debt bondage","domain":"institutions","kind":"institution","start":-2000,"date_src":"general","place":"Mesopotamia","paradigm":"early_state","desc":"Debt was the main path to dependence: debtors pledged land, then family members, then themselves. Interest-bearing loans in a world of harvest risk turned free farmers into bondsmen.","chokepoint":false,"part":"04","parts":["04"]},{"id":"rendering_tallow","label":"Rendering and tallow","domain":"materials","kind":"industry","start":-2000,"date_src":"general","paradigm":"early_state","place":"","desc":"Animal fat rendered into tallow for candles, soap and grease. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"salt_preservation","label":"Salting fish and meat","domain":"food","kind":"technique","start":-2000,"date_src":"general","place":"worldwide; North Sea and Baltic","paradigm":"agrarian_empire","desc":"Salt keeps protein a year or more in barrels: herring, salt pork and beef for navies [s]. Salt is the chokepoint for keeping protein.","chokepoint":false,"part":"02","parts":["02"]},{"id":"donkey_caravan","label":"Donkey caravans","domain":"transport","kind":"practice","start":-1950,"date_src":"part","place":"Assur to Anatolia","paradigm":"early_state","desc":"Black donkeys each carried about 65 kg of tin plus some 25 textiles, in caravans of about 15, covering about 1,000 km in six to seven weeks [c]. Tolls were paid to each kingdom on the way, and donkeys were often sold at the end.","chokepoint":false,"part":"04","parts":["04"]},{"id":"kanesh_caravan_firms","label":"Assyrian caravan firms","domain":"exchange","kind":"institution","start":-1950,"date_src":"part","place":"Assur to Kanesh, Anatolia","paradigm":"early_state","desc":"Old Assyrian family firms sent tin and woollen textiles by donkey caravans of tens of animals some 1,000 km to Kanesh, sold them for silver and gold and sent the metal home. Over 22,000 letters and contracts show branch offices, pooled-capital partnerships, interest-bearing loans and tolls paid en route: merchant credit and agency in the Bronze Age.","chokepoint":false,"part":"11","parts":["11"]},{"id":"merchant_treaties_court","label":"Merchants' court and trade treaties","domain":"institutions","kind":"institution","start":-1950,"date_src":"part","place":"Kanesh karum","paradigm":"commercial_city_state","desc":"A merchants' court in the karum and treaties with Anatolian rulers fixing taxes (a share of cloth at entry, a right of first purchase) and guaranteeing caravans (Larsen 2015; Veenhof).","chokepoint":false,"part":"10","parts":["10"]},{"id":"naruqqum_fund","label":"Naruqqum investment fund","domain":"exchange","kind":"institution","start":-1950,"date_src":"part","place":"Assur","paradigm":"early_state","desc":"A long-term joint fund ('sack'): a dozen or so investors pooled gold with a travelling merchant for about ten years, for a share of profit [s]. An early pooling of capital from many hands behind one trader, ancestor in form of the commenda.","chokepoint":false,"part":"04","parts":["04","10"]},{"id":"old_assyrian_trade","label":"Old Assyrian karum trade","domain":"exchange","kind":"institution","start":-1950,"date_src":"part","place":"Assur to Kanesh (Kültepe), Anatolia","paradigm":"early_state","desc":"A trading quarter of Assyrian merchants at Kanesh, with family firms, agents abroad, consignment and credit, a karum court and treaties with Anatolian rulers fixing taxes. Over 22,000 tablets of letters and accounts survive [c]. Tin and textiles went west for silver and gold; tin sold for roughly twice its Assur price [s, r].","chokepoint":false,"part":"04","parts":["04","10"],"wide":-1800},{"id":"debt_cancellation","label":"Royal debt cancellation","domain":"institutions","kind":"institution","start":-1800,"date_src":"part","place":"Old Babylonian kingdoms","paradigm":"early_state","desc":"Kings periodically cancelled debts (mīšarum edicts) to restore free farmers who owed military service (Michael Hudson's reading) [s]. Debt relief as politics: the state protected its tax and soldier base from creditors.","chokepoint":false,"part":"04","parts":["04"]},{"id":"interest_caps_hammurabi","label":"Hammurabi interest caps","domain":"institutions","kind":"institution","start":-1750,"date_src":"part","place":"Babylon","paradigm":"early_state","desc":"The Laws of Hammurabi capped interest at 20% a year on silver and 33 1/3% on barley loans; a creditor who charged more lost the loan [c]. Actual rates sometimes ran higher [c]. Written law over credit made interest-bearing loans a regulated practice.","chokepoint":false,"part":"04","parts":["04"]},{"id":"deben_unit_of_account","label":"Copper deben unit of account","domain":"exchange","kind":"institution","start":-1550,"date_src":"general","place":"New Kingdom Egypt","paradigm":"early_state","desc":"Village barter priced in the deben (~91 g of copper) and the sack of grain, goods paid in a mix of other goods (Janssen 1975) [firm]. Money as a measure of value long before coin.","chokepoint":false,"part":"10","parts":["10"]},{"id":"alkali_soda","label":"Alkali (soda)","domain":"materials","kind":"good","start":-1500,"date_src":"general","paradigm":"early_state","place":"","desc":"Soda and potash from plant ash and kelp, later Leblanc and Solvay processes; for glass, soap and bleaching. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"alum","label":"Alum mordant","domain":"materials","kind":"good","start":-1500,"date_src":"general","wide":1460,"place":"Anatolia; later Tolfa (Papal States)","paradigm":"agrarian_empire","desc":"The mordant that fixed dyes, also used in tawing; a traded chokepoint of the dyer's assembly.","chokepoint":true,"part":"03","parts":["03"]},{"id":"alum_mordant","label":"Alum mordant","domain":"materials","kind":"resource","start":-1500,"date_src":"general","place":"India; the Levant","paradigm":"early_state","desc":"A mineral salt that binds dyes to fibre: it fixed Indian chintz colours, and Levantine alum was an input of Florence's woollen cloth.","chokepoint":false,"part":"11","parts":["11"]},{"id":"indigo","label":"Indigo dye cakes","domain":"textiles","kind":"good","start":-1500,"date_src":"general","place":"Bayana near Agra; Sarkhej near Ahmedabad","paradigm":"agrarian_empire","desc":"Leaves fermented in one vat, the liquor beaten in a second to oxidise it, and the blue sediment pressed into cakes: light and valuable, ideal for long trade. Under the British it moved to Bengal plantations on forced contracts (the Indigo Revolt, 1859 to 1860).","chokepoint":false,"part":"11","parts":["11"]},{"id":"linear_b_accounts","label":"Linear B palace accounts","domain":"information","kind":"practice","start":-1400,"date_src":"part","place":"Knossos, Pylos","paradigm":"early_state","desc":"Mycenaean palaces tracked a few high-value chains closely: flocks with wool targets and deficits, ~750 women textile workers on rations at Pylos [rough], ~270 bronzesmiths [rough]. Selective redistributors that left most farming to villages (Halstead 1992).","chokepoint":false,"part":"10","parts":["10"]},{"id":"ta_ra_si_ja","label":"Ta-ra-si-ja allocation","domain":"institutions","kind":"institution","start":-1400,"date_src":"part","place":"Pylos, Knossos","paradigm":"early_state","desc":"The palace issued raw material (bronze at ~0.75 to 4 kg a group) and took back finished goods, the worker working at home: a putting-out system three thousand years before proto-industry. Many smiths 'without allocation' signal metal shortage.","chokepoint":false,"part":"10","parts":["10"]},{"id":"oxhide_ingot_shipping","label":"Copper ingot sea trade","domain":"exchange","kind":"practice","start":-1320,"date_src":"part","place":"Uluburun wreck, south-west Turkey","paradigm":"maritime_trading","desc":"The Uluburun ship carried ~10 t of Cypriot copper in ~350 oxhide ingots and ~1 t of tin, the 10:1 bronze ratio, plus ~175 glass ingots and amber (Pulak 2008). Goods of half a dozen cultures on one hull.","chokepoint":false,"part":"10","parts":["10"]},{"id":"bloomery_iron","label":"Bloomery iron","domain":"metals","kind":"technique","start":-1200,"date_src":"general","paradigm":"agrarian_empire","place":"","desc":"Iron reduced in a small furnace with charcoal and hammered. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"bog_iron_ore","label":"Bog ore and ironstone","domain":"metals","kind":"resource","start":-1200,"date_src":"general","place":"almost everywhere","paradigm":"chiefdom","desc":"Iron ore is common almost everywhere, so iron ended bronze's double chokepoint. The chokepoint moved from the mine to the woods and the smith.","chokepoint":false,"part":"03","parts":["03"]},{"id":"ration_strike","label":"Ration strike","domain":"institutions","kind":"practice","start":-1157,"date_src":"part","place":"Deir el-Medina, Egypt","paradigm":"early_state","desc":"In year 29 of Ramesses III the royal tomb-builders stopped work and sat in at temples when rations were weeks late (Turin Strike Papyrus) [firm]. Their wage was 4 khar of emmer and 1.5 of barley a month.","chokepoint":false,"part":"10","parts":["10"]},{"id":"andean_terraces","label":"Andean terraces","domain":"food","kind":"infrastructure","start":-1000,"date_src":"general","place":"the Andes","paradigm":"chiefdom","desc":"Terraces and irrigation built by community and later mit'a labour over generations: time capital in the land.","chokepoint":false,"part":"11","parts":["11"]},{"id":"camel_caravan","label":"Camel saddle caravans","domain":"transport","kind":"technique","start":-1000,"date_src":"part","place":"Middle East and North Africa","paradigm":"pastoral_nomadic","desc":"From about the 3rd to the 6th century camels with a better saddle displaced carts, being cheaper per load and needing no roads (Bulliet). Land transport became caravans of hundreds or thousands of camels between watered stops.","chokepoint":false,"part":"04","parts":["04","10","11"]},{"id":"iron_edged_tools","label":"Iron-edged tools","domain":"metals","kind":"good","start":-1000,"date_src":"general","wide":1000,"place":"Near East, then Europe","paradigm":"chiefdom","desc":"An iron edge on wood: ploughshare, axe, spade, scythe, sickle. It multiplied the labour of every other chain, and the smith's mending kept it working.","chokepoint":false,"part":"03","parts":["03"]},{"id":"llama_caravans","label":"Llama caravans","domain":"transport","kind":"practice","start":-1000,"date_src":"general","place":"the Andes","paradigm":"horticultural_tribal","desc":"The only Andean pack animal, carrying about 25 to 30 kg; llama trains carried the Inca stores and later fed Potosi from valleys far below.","chokepoint":false,"part":"11","parts":["11"]},{"id":"oak_bark","label":"Oak tanbark","domain":"materials","kind":"good","start":-1000,"date_src":"general","place":"oak coppice","paradigm":"chiefdom","desc":"Oak bark stripped in spring when the sap runs, a pulse in the coppice year; the peeled oak then sold as poles or charcoal wood. It bound the tanner to the oak woods.","chokepoint":false,"part":"03","parts":["03"]},{"id":"tawing","label":"Tawing (alum leather)","domain":"textiles","kind":"technique","start":-1000,"date_src":"general","place":"Near East and Europe","paradigm":"chiefdom","desc":"White leather made quickly with alum and salt, and oil tanning (chamois) with fish oil (m): the faster, lighter substitutes to bark tanning for gloves and fine goods.","chokepoint":false,"part":"03","parts":["03"]},{"id":"tlameme_porters","label":"Porters (tlameme)","domain":"transport","kind":"practice","start":-1000,"date_src":"general","place":"Mesoamerica","paradigm":"chiefdom","desc":"With no draft animals or carts, porters carried about 23 kg some 20 to 30 km a day (Hassig), which made staple maize uneconomic to move more than a few hundred kilometres by land (Drennan).","chokepoint":false,"part":"11","parts":["11"]},{"id":"village_smith","label":"Village smithy","domain":"metals","kind":"practice","start":-1000,"date_src":"general","place":"everywhere","paradigm":"chiefdom","desc":"Anvil, hearth, bellows, hammers, tongs, a stock of iron and charcoal, and years of skill: the deepest village trade. The village depended on the smith as on the miller; towns split the trade into blacksmiths, locksmiths, farriers, cutlers and more.","chokepoint":false,"part":"03","parts":["03"]},{"id":"woad_madder","label":"Woad, madder and weld","domain":"textiles","kind":"resource","start":-1000,"date_src":"general","wide":1300,"place":"Picardy, Languedoc, Flanders","paradigm":"chiefdom","desc":"Field-grown plant dyes (blue, red, yellow) often carried far to the dyer. Displaced by coal-tar dyes from the 1850s.","chokepoint":false,"part":"03","parts":["03"]},{"id":"qanat","label":"Qanat","domain":"building","kind":"infrastructure","start":-800,"date_src":"part","place":"Iran; spread to Oman, Central Asia, North Africa, Spain","paradigm":"irrigation","desc":"A gently sloping tunnel tapping groundwater under an alluvial fan and leading it by gravity to fields kilometres away, dug from a line of shafts by hereditary diggers (muqannis). The Gonabad qanat has a 300 m mother well and 427 shafts over about 33 km; about 37,000 were still in use in Iran in the 2000s (counts vary widely). The village dies if it collapses.","chokepoint":true,"part":"11","parts":["11"]},{"id":"briquetage","label":"Briquetage salt pots","domain":"materials","kind":"technique","start":-700,"date_src":"general","place":"Iron Age Droitwich and Europe","paradigm":"chiefdom","desc":"Brine boiled dry in coarse clay pots that were broken to get the salt out; Iron Age Droitwich worked this way [M].","chokepoint":false,"part":"01","parts":["01"]},{"id":"clay_roof_tiles","label":"Clay roof tiles","domain":"building","kind":"good","start":-700,"date_src":"general","wide":1600,"place":"Greece; later towns of northern Europe","paradigm":"agrarian_empire","desc":"Clay fired in a kiln: dear but fire-resistant. Fuel-bound with increasing returns, like brick.","chokepoint":false,"part":"03","parts":["03"]},{"id":"coinage","label":"Stamped coinage","domain":"exchange","kind":"good","start":-630,"date_src":"part","wide":-500,"place":"Lydia, western Anatolia","paradigm":"agrarian_empire","desc":"Pieces of metal whose weight and fineness are guaranteed by a stamp, so they need not be weighed at each use: Lydian electrum about 630 to 600 BC [s], then Greek silver. It made it cheap to pay many strangers (soldiers, crews, builders) and to collect taxes, and enabled money rents, retail markets and comparable prices.","chokepoint":false,"part":"04","parts":["04"]},{"id":"cloaca_maxima","label":"Cloaca Maxima","domain":"building","kind":"infrastructure","start":-600,"date_src":"general","place":"Rome","paradigm":"early_state","desc":"Rome's great drain, flushed by the aqueducts' surplus: the first of the drainage layer in the part's list, long before intercepting sewers.","chokepoint":false,"part":"12","parts":["12"]},{"id":"markets_fairs","label":"Weekly markets and fairs","domain":"exchange","kind":"institution","start":-600,"date_src":"general","wide":1300,"place":"Greek agoras; medieval Europe","paradigm":"agrarian_empire","desc":"A known place and day where many buyers and sellers meet under a peace someone keeps. Most English villagers about 1300 lived within 7 to 10 miles of one [s, r]; markets sat about a day's round walk apart and nested into a central-place hierarchy. They enabled specialisation by village and craft and visible prices.","chokepoint":false,"part":"04","parts":["04"]},{"id":"nok_iron","label":"West African iron smelting","domain":"metals","kind":"technique","start":-600,"date_src":"part","place":"Taruga (Nok), Nigeria","paradigm":"chiefdom","desc":"Iron furnaces dated to the mid-first millennium BC (about 600 to 200 BC reported); African smelters built bowl furnaces with bellows and tall natural-draft furnaces that needed none. Whether invented independently is unsettled; smiths were often a distinct caste (the Mande numu).","chokepoint":false,"part":"11","parts":["11"]},{"id":"mining_leases","label":"Mine leases to contractors","domain":"institutions","kind":"institution","start":-550,"date_src":"general","place":"Laurion; Roman Spain (Vipasca)","paradigm":"agrarian_empire","desc":"The state kept ownership of the ore and leased shafts to contractors (Athens's lessees at Laurion, Rome's publicani and later imperial procurators), who supplied the labour. The Vipasca tablets set the lease rules.","chokepoint":false,"part":"11","parts":["11"]},{"id":"postal_service","label":"Public relay post","domain":"information","kind":"infrastructure","start":-550,"date_src":"general","place":"Habsburg lands (Taxis family)","paradigm":"early_modern_state","desc":"The Taxis family posts across the Habsburg lands from 1490 carried letters for anyone who paid: Brussels to Innsbruck in five days, six in winter [c]. Regular public post made merchant information cheaper and faster.","chokepoint":false,"part":"04","parts":["04"]},{"id":"state_courier_relay","label":"State courier relays","domain":"information","kind":"infrastructure","start":-550,"date_src":"general","place":"Persia; Roman cursus publicus; Mongol yam","paradigm":"agrarian_empire","desc":"Relays of riders and fresh horses carrying state letters 100 to 200 km a day: the Roman cursus publicus, the Mongol yam. Fast but reserved for the ruler.","chokepoint":false,"part":"04","parts":["04"]},{"id":"laurion_silver","label":"Laurion silver mines","domain":"metals","kind":"industry","start":-540,"date_src":"general","place":"Laurion, Attica","paradigm":"commercial_city_state","desc":"A rich silver strike in 483/2 BC was spent, at Themistocles's urging, on a fleet of about 200 triremes that won at Salamis. The state leased the mines to contractors working them with slaves; over 20,000 slaves fled Athens in 413 BC (Thucydides 7.27).","chokepoint":false,"part":"11","parts":["11"]},{"id":"athenian_owl","label":"Athenian silver owl","domain":"exchange","kind":"good","start":-510,"date_src":"general","place":"Athens","paradigm":"commercial_city_state","desc":"The silver tetradrachm struck from Laurion silver, the Aegean's common money by the 5th century BC. Rowers paid in coin from a mine dug by slaves: one loop of silver, labour and sea power.","chokepoint":false,"part":"11","parts":["11"]},{"id":"canals","label":"Canals","domain":"transport","kind":"infrastructure","start":-500,"date_src":"general","wide":1795,"place":"Bridgewater, England; Erie Canal 1825","paradigm":"industrial","desc":"Water where there was none: the Bridgewater (1761) roughly halved Manchester's coal price [s]; the Erie Canal (1825, 363 miles) cut Buffalo to New York freight from about $100 to $10 a ton [c, x]. Needed capital from investors and tolls and acts of parliament.","chokepoint":false,"part":"04","parts":["04"]},{"id":"chinese_cast_iron","label":"Chinese blast-furnace cast iron","domain":"metals","kind":"technique","start":-500,"date_src":"part","place":"Warring States China","paradigm":"early_state","desc":"China smelted cast iron in blast furnaces from about the 5th century BC, over 1,500 years before Europe at scale, mass-casting ploughshares and hoes in clay and iron moulds and annealing them. Bellows were worked by men and horses, later by water.","chokepoint":false,"part":"11","parts":["11"]},{"id":"chuno_charki","label":"Chuno and ch'arki","domain":"food","kind":"technique","start":-500,"date_src":"general","place":"Andean highlands","paradigm":"horticultural_tribal","desc":"Potatoes freeze-dried by night frost and day sun (chuno) and dried meat (ch'arki): food that kept for years in the stores.","chokepoint":false,"part":"11","parts":["11"]},{"id":"hay_meadow","label":"Hay meadow and haymaking","domain":"food","kind":"practice","start":-500,"date_src":"general","place":"northern Europe","paradigm":"feudal_manorial","desc":"Winter is the bottleneck and hay sets the size of the herd; meadow was valued at two to three or more times arable per acre [s, r]. Haymaking is a labour pulse in early summer needing dry weather and many hands.","chokepoint":true,"part":"01","parts":["01","02"]},{"id":"mordant_chintz","label":"Mordant-painted chintz","domain":"textiles","kind":"technique","start":-500,"date_src":"general","place":"Coromandel coast","paradigm":"agrarian_empire","desc":"Mordants (alum, iron) fixed madder and chay-root reds and indigo blue, with resist and hand painting: fast colours no one else could match. Washermen bleached the cloth in river water with lye and sun.","chokepoint":false,"part":"11","parts":["11"]},{"id":"roman_lead","label":"Lead pipes and sheeting","domain":"metals","kind":"good","start":-500,"date_src":"general","place":"Laurion, Iberia, Britain","paradigm":"agrarian_empire","desc":"Lead was the by-product of desilvering galena and went into water pipes and sheeting. Lead in the NGRIP ice core tracks Roman mining year by year, peaking under the early Empire and falling with civil wars and the Antonine plague (McConnell 2018).","chokepoint":false,"part":"11","parts":["11"]},{"id":"rotary_quern","label":"Rotary quern","domain":"food","kind":"technique","start":-500,"date_src":"general","place":"Mediterranean and Iron Age Europe","paradigm":"agrarian_empire","desc":"Two round stones, the upper turned by hand, about 4.3 times as efficient as the saddle quern [c] and ~20 kg of stone when new [c]. A household's daily flour in an hour or two [r], mostly women's work.","chokepoint":false,"part":"02","parts":["02"]},{"id":"rushlight","label":"Rushlight","domain":"energy","kind":"good","start":-500,"date_src":"general","place":"Europe","paradigm":"chiefdom","desc":"Rush pith dipped in kitchen fat: the cheapest made light, open to any household with fat. For most of history the evening was rationed by fat.","chokepoint":false,"part":"01","parts":["01"]},{"id":"scythe","label":"Scythe","domain":"food","kind":"technique","start":-500,"date_src":"general","wide":1830,"place":"Europe","paradigm":"agrarian_empire","desc":"Always used for hay; for grain it spread from the late Middle Ages for barley and oats and in the 18th and 19th centuries for wheat. A mower cut ~2 to 3 acres of wheat a day [c] and harvest costs fell 20 to 30% [c], but farmers switched only when labour became scarce (Collins 1969).","chokepoint":false,"part":"02","parts":["02"]},{"id":"vertical_archipelago","label":"Vertical archipelago","domain":"food","kind":"practice","start":-500,"date_src":"general","place":"the Andes","paradigm":"chiefdom","desc":"John Murra showed Andean communities held land at several altitudes (tubers high, maize in the valleys, coca and cotton lower) and moved goods within the kin group or the state instead of trading.","chokepoint":false,"part":"11","parts":["11"]},{"id":"water_time_shares","label":"Water time shares","domain":"institutions","kind":"institution","start":-500,"date_src":"general","place":"Iran and Oman","paradigm":"irrigation","desc":"A qanat's flow owned in shares of time in a cycle of days, measured with a water clock and run by a water master; shares were sold, inherited and pledged. A commons that is also property.","chokepoint":false,"part":"11","parts":["11"]},{"id":"athenian_grain_policy","label":"Athenian grain-route policing","domain":"institutions","kind":"institution","start":-450,"date_src":"general","place":"Athens, the Hellespont, the Bosporan kingdom","paradigm":"commercial_city_state","desc":"Athens imported grain from the Black Sea, Egypt and Sicily (about 400,000 medimnoi, 12,000 to 16,000 t, a year from the Bosporus, per Demosthenes), policed the Hellespont, forbade citizens to ship grain elsewhere and set grain wardens over the market. How dependent it was is debated.","chokepoint":false,"part":"11","parts":["11"]},{"id":"crown_mercury","label":"Almaden and Huancavelica mercury","domain":"metals","kind":"resource","start":-400,"date_src":"general","place":"Almaden (Spain); Huancavelica (Peru, from 1564)","paradigm":"early_modern_state","desc":"The two crown mercury mines on which American silver amalgamation hung: a crown monopoly that poisoned its workers.","chokepoint":true,"part":"11","parts":["11"]},{"id":"roman_aqueducts","label":"Roman gravity aqueducts","domain":"building","kind":"infrastructure","start":-312,"date_src":"general","place":"Rome","paradigm":"agrarian_empire","desc":"Channels on a steady fall from springs to public fountains, baths and a few paying private connections: 11 by AD 226. Frontinus (about AD 97) recorded 14,018 quinariae delivered and about 10,000 more stolen; about 300 to 1,000 litres a head a day nominal (contested). A public good with rationed private access whose main problem was theft.","chokepoint":false,"part":"12","parts":["12"]},{"id":"wootz_steel","label":"Wootz crucible steel","domain":"metals","kind":"technique","start":-300,"date_src":"part","place":"Kodumanal (Tamil Nadu); Sri Lanka","paradigm":"agrarian_empire","desc":"Iron and wood or leaves sealed in small clay crucibles, held at heat for hours and cooled slowly, giving high-carbon steel (about 1 to 2 per cent) with a banded structure; in Sri Lanka ridge furnaces were blown by the monsoon wind. The secret lay in ores with traces of vanadium plus the recipe; when those broke in the 18th and 19th centuries the blades could not be made.","chokepoint":true,"part":"11","parts":["11"]},{"id":"watermill","label":"Watermill","domain":"energy","kind":"infrastructure","start":-250,"date_src":"general","paradigm":"agrarian_empire","place":"","desc":"About 6,000 in England's Domesday survey of 1086 and about 10,000 by 1300 (part 01). A wheel turned by a stream, driving grinding, fulling, bellows, hammers and saws; shared streams made it a chokepoint. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"iberian_silver_mines","label":"Iberian silver-lead mines","domain":"metals","kind":"industry","start":-230,"date_src":"general","place":"Carthago Nova, Sierra Morena, Rio Tinto","paradigm":"agrarian_empire","desc":"Rome's money rested on Iberian lead-silver ore, state-owned and leased to contractors who worked it with slaves and convicts, drained shafts with man-worked water wheels in series and smelted with charcoal from the surrounding woods. Polybius says the mines near Carthago Nova employed 40,000 workers; Rio Tinto left 6 to 16 million tonnes of slag (contested).","chokepoint":true,"part":"11","parts":["11"]},{"id":"chinese_cast_cash","label":"Chinese cast bronze cash","domain":"exchange","kind":"good","start":-221,"date_src":"part","place":"Qin China","paradigm":"agrarian_empire","desc":"Bronze spade and knife money of the Zhou, unified under Qin (221 BC) as the round ban liang with a square hole [s]. Cast base-metal coin heavy for its value; in Sichuan iron coin was too heavy for trade, which pushed paper money.","chokepoint":false,"part":"04","parts":["04"]},{"id":"copper_cash","label":"Copper cash coins","domain":"exchange","kind":"good","start":-221,"date_src":"general","place":"China","paradigm":"agrarian_empire","desc":"Round bronze coins with a square hole, strung by the thousand. Northern Song minting peaked at roughly 5 to 6 billion coins a year around 1080 (rough).","chokepoint":false,"part":"11","parts":["11"]},{"id":"denarius","label":"Silver denarius","domain":"exchange","kind":"good","start":-211,"date_src":"general","place":"Rome","paradigm":"agrarian_empire","desc":"About 3.9 g of nearly pure silver under Augustus, minted from Iberian silver, paid to the army and carrying a monetary economy that reached peasants in many provinces. Nero cut its weight and fineness in AD 64, and by the 260s its successor held a few per cent silver (rough), with steep price rises.","chokepoint":false,"part":"11","parts":["11"]},{"id":"coal","label":"Coal","domain":"energy","kind":"resource","start":-200,"date_src":"general","paradigm":"agrarian_empire","place":"","desc":"Mineral fuel, used in Han and Song China and dug in England from the 13th century. About half of England's energy by 1700 and over 90% by 1850 (part 01), ending the organic economy's land limit. Mineral fuel; half of England's energy by about 1700 and over 90% by 1850, ending the organic economy's land limit. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"dragon_kiln","label":"Dragon and egg kilns","domain":"materials","kind":"technique","start":-200,"date_src":"general","place":"south China; Jingdezhen","paradigm":"agrarian_empire","desc":"Long kilns climbing a slope, and Jingdezhen's egg-shaped kilns, firing porcelain with pine wood in vast amounts fetched from ever further away.","chokepoint":false,"part":"11","parts":["11"]},{"id":"drawloom_brocade","label":"Drawloom damask and brocade","domain":"textiles","kind":"technique","start":-200,"date_src":"general","place":"Suzhou, Hangzhou, Nanjing","paradigm":"agrarian_empire","desc":"Patterned silks woven on drawlooms in city workshops, while plain silk was woven in peasant homes.","chokepoint":false,"part":"11","parts":["11"]},{"id":"flour_milling","label":"Powered grain mills","domain":"food","kind":"industry","start":-200,"date_src":"general","wide":1300,"place":"Roman bakeries; medieval England","paradigm":"feudal_manorial","desc":"Stones turned by animals, water or wind; England had ~5,624 water mills at Domesday [c] and ~10,000 mills grinding about 80% of the grain by 1300 [c, Langdon]. A water mill needs a site, dam, leat, gears, millstones and a millwright, and pays only with many customers.","chokepoint":true,"part":"02","parts":["02"]},{"id":"insulae_tenements","label":"Rented tenement blocks","domain":"building","kind":"practice","start":-200,"date_src":"general","place":"Rome; later Edo, New York","paradigm":"agrarian_empire","desc":"Rome's insulae (blocks of five or six storeys let by the room), Edo's back-alley nagaya and New York's 1879 dumbbell tenements: the same answer to migrants outpacing building. Housing is a stock, so rents and crowding follow the building rate.","chokepoint":false,"part":"12","parts":["12"]},{"id":"parchment","label":"Parchment","domain":"information","kind":"good","start":-200,"date_src":"general","wide":800,"place":"Pergamon; medieval Europe","paradigm":"agrarian_empire","desc":"Limed and scraped skins of sheep, goats and calves for writing; a branch of the carcass chain.","chokepoint":false,"part":"03","parts":["03"]},{"id":"peculium_slave_agents","label":"Slave agents with peculium","domain":"institutions","kind":"institution","start":-200,"date_src":"general","place":"Roman Italy","paradigm":"agrarian_empire","desc":"Skilled slaves ran shops, ships and money for their owners as agents with a peculium, a fund they managed and could buy freedom with; freedmen became a large part of the urban commercial class. Italy held about 1 to 1.5 million slaves at the height (contested).","chokepoint":false,"part":"11","parts":["11"]},{"id":"pozzolana","label":"Pozzolana volcanic ash","domain":"materials","kind":"resource","start":-200,"date_src":"general","place":"ash pits near Puteoli (Naples)","paradigm":"agrarian_empire","desc":"Volcanic ash that reacts with lime to give a hydraulic set. The pits near Naples were a regional chokepoint, with crushed brick a weaker substitute elsewhere.","chokepoint":true,"part":"11","parts":["11"]},{"id":"silk_tax_cloth","label":"Taxes paid in silk","domain":"exchange","kind":"institution","start":-200,"date_src":"general","place":"China","paradigm":"agrarian_empire","desc":"Households paid tax in cloth for centuries, and the Tang paid its Central Asian garrisons in silk, which then entered trade (Hansen).","chokepoint":false,"part":"11","parts":["11"]},{"id":"taxes_and_trade","label":"Money tax forcing trade","domain":"exchange","kind":"institution","start":-200,"date_src":"part","place":"Roman Empire; later Mughal India, Ming China","paradigm":"agrarian_empire","desc":"Keith Hopkins's model: the state taxed rich inner provinces in money and spent it in Rome and on the frontier armies, so the provinces had to sell goods where the coin was spent to get next year's tax. A tax payable only in coin makes households sell, and a market forms where none was.","chokepoint":false,"part":"11","parts":["11"]},{"id":"roman_concrete","label":"Roman pozzolana concrete","domain":"building","kind":"technique","start":-150,"date_src":"general","place":"Rome and Campania","paradigm":"agrarian_empire","desc":"Opus caementicium mixed lime, volcanic ash and rubble; the ash reacts with lime to set hard even under water, so harbour moles could be cast in the sea. It let semi-skilled gangs under contractors build vaults cheaply inside brick facing over timber formwork; the Pantheon's unreinforced dome (about AD 126) is 43.3 m across.","chokepoint":false,"part":"11","parts":["11"]},{"id":"silk_roads","label":"Silk Roads relay trade","domain":"exchange","kind":"institution","start":-138,"date_src":"part","place":"China to the Mediterranean via Dunhuang, Samarkand, Merv","paradigm":"agrarian_empire","desc":"Opened as state business with Zhang Qian's missions (from 138 BC); goods passed segment by segment through oasis cities, the Sogdians being the great intermediaries from the 4th to 8th century. Silk went west; horses, glass and silver east; paper and religions both ways. Hansen argues most traffic was local and state-driven.","chokepoint":false,"part":"11","parts":["11"]},{"id":"frumentatio_dole","label":"Free grain dole","domain":"institutions","kind":"institution","start":-123,"date_src":"general","place":"Rome","paradigm":"agrarian_empire","desc":"Free grain from ticketed citizen lists: 5 modii a month to about 200,000 citizens under Augustus (about 80,000 t a year). It was under half of what the city ate; the rest was sold on the market.","chokepoint":false,"part":"11","parts":["11"]},{"id":"han_salt_iron_monopoly","label":"Han salt and iron monopoly","domain":"institutions","kind":"institution","start":-117,"date_src":"part","place":"Han China (Sang Hongyang)","paradigm":"agrarian_empire","desc":"In 117 BC Emperor Wu, needing money for wars with the Xiongnu, made salt and iron state monopolies: some four dozen iron offices (rough), big works outside city walls run by conscripts and convicts, tools sold at fixed prices. The 81 BC Discourses on Salt and Iron argued the case; the salt monopoly stayed a fiscal pillar for two thousand years.","chokepoint":true,"part":"11","parts":["11"]},{"id":"barrel_cooperage","label":"Coopered barrels","domain":"materials","kind":"good","start":-100,"date_src":"part","wide":1000,"place":"Gaul and the Roman west","paradigm":"agrarian_empire","desc":"Oak staves and iron or withy hoops, made by a cooper's long skill. The standard bulk container of Europe from Roman times to the 19th century: wine, ale, salt fish, salt meat, butter, nails, gunpowder [M].","chokepoint":false,"part":"01","parts":["01"]},{"id":"chaogang_steel","label":"Chaogang fining steel","domain":"metals","kind":"technique","start":-100,"date_src":"general","place":"Han China","paradigm":"agrarian_empire","desc":"Steel made by decarburising cast iron in a stirred hearth: a puddling process in the Han, far ahead of Europe. It turned brittle cast iron into tools and weapons.","chokepoint":false,"part":"11","parts":["11"]},{"id":"horrea","label":"Horrea grain warehouses","domain":"building","kind":"infrastructure","start":-100,"date_src":"general","place":"Ostia, Portus and Rome","paradigm":"agrarian_empire","desc":"State and private warehouses holding the grain shipped in during the six-month sailing season, turning a pulse into a year's supply. Grain reached them up the Tiber in barges towed by men and oxen.","chokepoint":false,"part":"11","parts":["11"]},{"id":"indian_cotton_cloth","label":"Indian painted and printed cottons","domain":"textiles","kind":"industry","start":-100,"date_src":"general","place":"Gujarat, Coromandel, Bengal","paradigm":"agrarian_empire","desc":"India was the world's great cloth maker from antiquity to about 1800: printed cottons from Gujarat, painted chintz from Coromandel, Dhaka muslins from Bengal, woven by caste weavers on pit looms. Textiles were about two-thirds or more of the English East India Company's Asian imports in the 17th and 18th centuries; ships sailed on the monsoon, so cloth had to be ready by a date.","chokepoint":false,"part":"11","parts":["11"]},{"id":"monsoon_ocean_trade","label":"Monsoon Indian Ocean trade","domain":"exchange","kind":"institution","start":-100,"date_src":"general","place":"Aden, Hormuz, Cambay, Calicut, Melaka, Quanzhou","paradigm":"maritime_trading","desc":"The largest trade zone before 1500, run on seasonal monsoon winds in three segments joined at emporia where merchants waited for the wind, with resident merchant minorities under their own headmen. The Muziris papyrus values one ship's cargo from Kerala near 9 million sesterces, a quarter taken in customs.","chokepoint":false,"part":"11","parts":["11"]},{"id":"water_trip_hammer","label":"Water-powered trip hammers","domain":"energy","kind":"technique","start":-100,"date_src":"general","place":"China; later Islamic paper mills","paradigm":"agrarian_empire","desc":"Water wheels lifting hammers, used on Jingdezhen's streams to crush china stone and in Islamic mills to beat rags to pulp. Water power gave paper increasing returns.","chokepoint":false,"part":"11","parts":["11"]},{"id":"ever_normal_granary","label":"Ever-normal granaries","domain":"institutions","kind":"institution","start":-54,"date_src":"general","place":"China","paradigm":"agrarian_empire","desc":"State granaries that bought in plenty and sold in dearth (Will and Wong 1991) [s], beside the church's tithe barns and town granaries elsewhere. Losses to rats and damp often ran a tenth or more a year [r].","chokepoint":false,"part":"02","parts":["02","12"]},{"id":"egyptian_tax_grain","label":"Egyptian Nile tax grain","domain":"food","kind":"resource","start":-30,"date_src":"general","place":"Nile valley, Egypt","paradigm":"agrarian_empire","desc":"One flood crop a year on Nile farms, much of it taken as tax in kind and shipped to Rome: 20 million modii (about 135,000 t) a year under Augustus. Whoever held Egypt held Rome's bread, so Augustus ruled it through his own prefect and barred senators from it.","chokepoint":true,"part":"11","parts":["11"]},{"id":"roman_annona","label":"Roman annona grain office","domain":"institutions","kind":"institution","start":-22,"date_src":"general","place":"Rome, Ostia, Portus","paradigm":"agrarian_empire","desc":"The cura annonae under a prefect levied or bought grain (much of Egypt's as tax in kind), contracted private shippers and stored the grain in horrea for a city of 800,000 to a million (rough). Rome's yearly need is put at 150,000 to 400,000 t (contested). A hybrid: state demand and guarantees calling a private shipping industry into being.","chokepoint":true,"part":"11","parts":["11"]},{"id":"baetican_olive_oil","label":"Baetican olive oil trade","domain":"food","kind":"industry","start":30,"date_src":"general","wide":140,"place":"Guadalquivir valley (Baetica), Spain","paradigm":"agrarian_empire","desc":"Groves taking 15 to 20 years to full bearing, lever and screw presses and estate amphora kilns supplied oil shipped via Hispalis to Rome and the frontier armies, much of it bought by the state. Monte Testaccio, a 35 m hill of jars dumped about AD 140 to 260, holds 20 to 53 million amphorae (contested).","chokepoint":false,"part":"11","parts":["11"]},{"id":"dressel20_amphorae","label":"Dressel 20 oil amphorae","domain":"materials","kind":"good","start":30,"date_src":"general","place":"estate kilns on the Guadalquivir","paradigm":"agrarian_empire","desc":"Globular oil jars of about 70 litres, stamped with the estate and painted with the shipper and checking officials. Oil-soaked sherds could not be reused, so they were dumped on Monte Testaccio, in effect a customs archive.","chokepoint":false,"part":"11","parts":["11"]},{"id":"water_bellows","label":"Water-powered bellows","domain":"energy","kind":"technique","start":31,"date_src":"part","place":"Han China (Du Shi)","paradigm":"agrarian_empire","desc":"Du Shi's water-driven bellows (AD 31) blew Han iron furnaces; Wang Zhen described Song-Yuan water bellows in 1313. Water replaced men and horses at the bellows.","chokepoint":false,"part":"11","parts":["11"]},{"id":"navicularii","label":"Navicularii grain shippers","domain":"transport","kind":"industry","start":41,"date_src":"general","place":"Mediterranean to Ostia and Portus","paradigm":"agrarian_empire","desc":"Private shipowners contracted to carry the annona's grain, in ships of about 340 t commonly (rough). Emperors drew them in with privileges: Claudius insured them against storm losses, and a Junian Latin who carried grain for six years in a 10,000-modii ship earned citizenship. The April-to-October sailing season made a year's supply arrive in six months.","chokepoint":false,"part":"11","parts":["11"]},{"id":"portus_harbour","label":"Portus harbour","domain":"transport","kind":"infrastructure","start":42,"date_src":"general","place":"Portus, mouth of the Tiber","paradigm":"agrarian_empire","desc":"Claudius and Trajan built an artificial harbour at Portus for the big grain ships, after Puteoli and Ostia. It was the chokepoint of Rome's bread; when the grain fleet was late, Rome rioted.","chokepoint":true,"part":"11","parts":["11"]},{"id":"coin_debasement","label":"Coin debasement","domain":"exchange","kind":"practice","start":64,"date_src":"general","place":"Roman Empire; Tudor England","paradigm":"agrarian_empire","desc":"Rulers cut the metal in coins to pay their debts. The Roman denarius fell from near-pure silver to a few per cent by the 260s and 270s [s, r]; England's Great Debasement (1544 to 1551) cut the standard from 92.5% to about 25% [c] and prices roughly doubled. Gresham's law: the bad coin circulates, the good is hoarded.","chokepoint":false,"part":"04","parts":["04"]},{"id":"fire_building_codes","label":"Fire building codes","domain":"institutions","kind":"institution","start":64,"date_src":"part","place":"Rome 64; London 1666; Chicago 1871","paradigm":"agrarian_empire","desc":"Each great fire brought building codes, brick or stone instead of timber and thatch, wider streets, fire insurance and brigades.","chokepoint":false,"part":"12","parts":["12"]},{"id":"tallow_candle","label":"Tallow candle","domain":"energy","kind":"good","start":100,"date_src":"general","place":"Roman and medieval Europe","paradigm":"agrarian_empire","desc":"Tallow from cattle and sheep on a wick of cotton or linen; a chandler's trade in towns, and smoky. Beeswax candles were for the Church and the rich.","chokepoint":false,"part":"01","parts":["01"]},{"id":"treadle_chain_pump","label":"Treadle chain pump","domain":"food","kind":"technique","start":100,"date_src":"general","place":"China","paradigm":"agrarian_empire","desc":"A chain of paddles in a trough, worked by foot, lifting canal water into paddy fields: the irrigation tool of Song rice intensification.","chokepoint":false,"part":"11","parts":["11"]},{"id":"paper","label":"Paper","domain":"materials","kind":"good","start":105,"date_src":"general","paradigm":"agrarian_empire","place":"","desc":"Pulped fibre sheets, from China; carrier of records, print and paper money. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"coloni_tenancy","label":"Coloni bound tenants","domain":"institutions","kind":"institution","start":200,"date_src":"part","place":"Roman Empire","paradigm":"agrarian_empire","desc":"From the 2nd to the 4th century the slave estate gave way to tenants (coloni) bound to the land, as slave supply fell back on breeding and frontier capture after the conquests ended.","chokepoint":false,"part":"11","parts":["11"]},{"id":"price_edict","label":"Diocletian's Price Edict","domain":"institutions","kind":"institution","start":301,"date_src":"part","place":"Roman Empire","paradigm":"agrarian_empire","desc":"The Edict on Maximum Prices (301 AD) tried to fix prices after debasement-driven inflation, and failed. It also lists freight rates: wheat carried 100 miles by land cost about 55% of its value, by sea about 1.3% [c].","chokepoint":false,"part":"04","parts":["04"]},{"id":"cane_sugar_crystal","label":"Crystallised cane sugar","domain":"food","kind":"technique","start":350,"date_src":"general","place":"India, then Sasanian Persia","paradigm":"agrarian_empire","desc":"Cane juice boiled and crystallised first in India (Sanskrit khanda, the root of 'candy'), then in Sasanian Persia.","chokepoint":false,"part":"11","parts":["11"]},{"id":"flail_threshing","label":"Flail threshing","domain":"food","kind":"technique","start":400,"date_src":"general","place":"Europe","paradigm":"feudal_manorial","desc":"Grain beaten out on a barn floor through the winter: about a quarter of all farm labour by the 18th century [c], and up to half a labourer's winter income [c, Clark 2001]. A labour sink that filled the slack season.","chokepoint":false,"part":"02","parts":["02"]},{"id":"churka_gin","label":"Churka roller gin","domain":"textiles","kind":"technique","start":500,"date_src":"general","place":"India","paradigm":"agrarian_empire","desc":"Two rollers squeezing the seeds out of raw cotton, followed by bowing to open the fibre before spinning.","chokepoint":false,"part":"11","parts":["11"]},{"id":"infield_outfield","label":"Infield-outfield","domain":"food","kind":"practice","start":500,"date_src":"general","place":"Scotland, Ireland, Wales, Scandinavia","paradigm":"feudal_manorial","desc":"The infield by the steading was cropped every year and got all the byre's dung; the outfield was cropped a few years after cattle were folded on it, with oat yields of 2 or 3 to 1 [r]. Fertility flowed from outfield and hill through the beasts to the infield; in Scotland joint tenants worked it in run-rig.","chokepoint":false,"part":"02","parts":["02"]},{"id":"iron_hoe_money","label":"Iron hoes and bars as money","domain":"exchange","kind":"good","start":500,"date_src":"general","place":"sub-Saharan Africa","paradigm":"chiefdom","desc":"Iron hoes and axes opened forest and savanna to farming, and iron bars and hoes served as money and bridewealth.","chokepoint":false,"part":"11","parts":["11"]},{"id":"ward_markets","label":"Supervised ward markets","domain":"exchange","kind":"institution","start":582,"date_src":"general","place":"Sui-Tang Chang'an","paradigm":"agrarian_empire","desc":"Tang Chang'an (about 800,000 to 1 million in about 84 km2, contested) confined trade to two official markets with set hours and price records, inside 108 walled wards shut at night.","chokepoint":false,"part":"12","parts":["12"]},{"id":"tithe","label":"Church tithe","domain":"institutions","kind":"institution","start":585,"date_src":"general","place":"Western Christendom","paradigm":"feudal_manorial","desc":"A tenth of produce to the church: great tithes (grain, hay, wood) to the rector, small tithes (lambs, wool, eggs) to the vicar, counted in the field by stooks. Commuted in England to a money rent charge in 1836 [unchecked].","chokepoint":false,"part":"05","parts":["05"]},{"id":"khipu","label":"Khipu knotted cords","domain":"information","kind":"technique","start":600,"date_src":"general","place":"the Andes","paradigm":"agrarian_empire","desc":"Knotted cords recording labour owed and goods stored: records for a state with no writing in the usual sense.","chokepoint":false,"part":"11","parts":["11"]},{"id":"grand_canal","label":"Grand Canal","domain":"transport","kind":"infrastructure","start":605,"date_src":"part","place":"Yangzi to Kaifeng, later Beijing","paradigm":"agrarian_empire","desc":"Begun by the Sui from 605 to join the Yangzi to the north and extended by the Yuan to Beijing: about 1,776 km. It carried 3 to 4 million shi of tax grain a year in Ming and Qing (rough), the binding chokepoint of the capitals' bread.","chokepoint":true,"part":"11","parts":["11"]},{"id":"canal_tax_grain","label":"Canal tax-grain tribute","domain":"institutions","kind":"institution","start":610,"date_src":"general","place":"Tang Chang'an, Song Kaifeng, Ming-Qing Beijing","paradigm":"agrarian_empire","desc":"Tax grain from the Yangzi moved north on the canals to feed the court, officials and army: bulk that moved far only on a state's demand. Kaifeng's Bian canal brought several million shi a year (contested).","chokepoint":false,"part":"11","parts":["11"]},{"id":"qirad","label":"Qirad partnership","domain":"exchange","kind":"institution","start":650,"date_src":"general","place":"Arabia and the Islamic world","paradigm":"agrarian_empire","desc":"One partner gives capital, the other travels and trades, and profit is shared: capital joined to skill without interest, very like the later Italian commenda (Udovitch).","chokepoint":false,"part":"11","parts":["11"]},{"id":"arab_crop_package","label":"Islamic crop and irrigation spread","domain":"food","kind":"practice","start":700,"date_src":"general","place":"Iraq to al-Andalus","paradigm":"agrarian_empire","desc":"Watson's 'Arab agricultural revolution': Muslim rule spreading sugar, rice, cotton, citrus and sorghum with summer irrigation from Iraq to Spain; Decker and others argue many were already in the Roman and Sasanian world (contested).","chokepoint":false,"part":"11","parts":["11"]},{"id":"fish_weir","label":"Fish weir","domain":"food","kind":"infrastructure","start":700,"date_src":"general","wide":1200,"place":"English rivers","paradigm":"feudal_manorial","desc":"Stakes, wattle and stones across a river, taking a share of every run and blocking boats and the fish of those upstream. Magna Carta ordered weirs removed from the Thames and Medway (m).","chokepoint":true,"part":"03","parts":["03"]},{"id":"heavy_mouldboard_plough","label":"Heavy mouldboard plough","domain":"food","kind":"technique","start":700,"date_src":"general","place":"northern Europe","paradigm":"feudal_manorial","desc":"Coulter, share and mouldboard turn the furrow on heavy clays and make ridge and furrow, which drains; Domesday's standard team was 8 oxen [c], about an acre a day [r]. Lynn White made it an engine of medieval growth; most now think it followed population and soils [s, r].","chokepoint":false,"part":"02","parts":["02"]},{"id":"pannage","label":"Pannage","domain":"institutions","kind":"institution","start":700,"date_src":"general","place":"English and European woods","paradigm":"feudal_manorial","desc":"The right to turn pigs into a wood in autumn for acorns and mast, paid to the lord as one pig in ten or a fee per pig [s, r]; Domesday measured some woodland by the pigs it fed. Pigs convert waste and a seasonal pulse on a commons.","chokepoint":false,"part":"02","parts":["02"]},{"id":"printing","label":"Printing","domain":"information","kind":"technique","start":700,"date_src":"general","paradigm":"agrarian_empire","place":"","desc":"Woodblock printing in Tang China, movable type in Song China and Korea, and in Europe from about 1450; it carried paper money, prices, contracts and manuals. (A general entry: no part defined this node, though parts link to it.)","chokepoint":false,"parts":[],"fallback":true,"part":""},{"id":"saharan_rock_salt","label":"Saharan rock salt","domain":"materials","kind":"resource","start":700,"date_src":"general","place":"Taghaza, later Taoudenni","paradigm":"pastoral_nomadic","desc":"Rock salt cut by slaves at Taghaza, where Ibn Battuta (1352) found houses and a mosque of salt blocks and all food and water brought in. A camel carried two slabs of up to about 90 kg each (rough), and the price multiplied many times on the way south.","chokepoint":true,"part":"11","parts":["11"]},{"id":"waqf","label":"Waqf endowment","domain":"institutions","kind":"institution","start":700,"date_src":"general","place":"Islamic world","paradigm":"agrarian_empire","desc":"A perpetual endowment whose rents paid for public works; many of a road's inns and markets were built and kept by waqf.","chokepoint":false,"part":"11","parts":["11"]},{"id":"west_african_gold","label":"West African gold fields","domain":"metals","kind":"resource","start":700,"date_src":"general","place":"Bambuk, Bure, later the Akan forest","paradigm":"early_state","desc":"Alluvial washing and shallow shafts worked by farmers in the dry season under local lords' rights; perhaps two-thirds of the medieval Mediterranean's gold (rough), one to several tonnes a year (contested).","chokepoint":true,"part":"11","parts":["11"]},{"id":"linen_rags","label":"Linen rag trade","domain":"textiles","kind":"resource","start":750,"date_src":"general","place":"Islamic world; later Europe","paradigm":"agrarian_empire","desc":"Used linen and hemp cloth collected as paper fibre (China used mulberry bark, bamboo and hemp): a waste stream turned input.","chokepoint":false,"part":"11","parts":["11"]},{"id":"trans_saharan_trade","label":"Trans-Saharan gold-salt trade","domain":"exchange","kind":"institution","start":750,"date_src":"part","place":"Sijilmasa to Walata, Timbuktu, Gao","paradigm":"pastoral_nomadic","desc":"With the camel in wide use and Muslim merchants from the 8th century, gold went north and salt, copper, horses, cloth, beads and cowries south for nearly a thousand years. Saharan nomads (Massufa, later Tuareg) carried and protected caravans for a fee; Wangara traders worked inland.","chokepoint":false,"part":"11","parts":["11"]},{"id":"carolingian_money_account","label":"Pound-shilling-penny reckoning","domain":"exchange","kind":"institution","start":794,"date_src":"part","place":"Carolingian Francia","paradigm":"feudal_manorial","desc":"Charlemagne's reform fixed 1 pound = 20 shillings = 240 pence, a system that lasted a thousand years. Only the silver penny was struck for centuries; pound and shilling were units of account for debts, rents and prices. Around 1300 a labourer earned 1 to 2 pence a day [s, r].","chokepoint":false,"part":"04","parts":["04"]},{"id":"islamic_paper_mill","label":"Islamic rag-paper mills","domain":"materials","kind":"industry","start":794,"date_src":"part","place":"Baghdad; then Damascus, Cairo, Fez, Xativa","paradigm":"agrarian_empire","desc":"A paper mill worked in Baghdad by about 794: linen and hemp rags retted, beaten to pulp by water- or animal-driven trip hammers, formed with a mould, pressed and sized with starch. Bloom argues cheap paper made bureaucracy, accounts, commercial letters and books practical before print.","chokepoint":false,"part":"11","parts":["11"]},{"id":"caravanserai_funduq","label":"Caravanserai and funduq","domain":"building","kind":"infrastructure","start":800,"date_src":"general","place":"Islamic routes and ports","paradigm":"agrarian_empire","desc":"Walled inns with one guarded gate, a courtyard for beasts and goods and rooms above; in ports the funduq was also warehouse, customs point and residence for foreign merchants of one nation. Venice copied the form in the Fondaco dei Tedeschi.","chokepoint":false,"part":"11","parts":["11"]},{"id":"commons_stints","label":"Common grazing and stints","domain":"institutions","kind":"institution","start":800,"date_src":"part","place":"open-field townships","paradigm":"feudal_manorial","desc":"The fallow and stubble were grazed in common, with stints limiting each holding's beasts in proportion to its arable. A coordination problem: no household could change its rotation alone. Common rights could be worth a large share of a poor family's income [s, r].","chokepoint":false,"part":"01","parts":["01","02"]},{"id":"gold_dinar","label":"Sijilmasa gold dinars","domain":"exchange","kind":"good","start":800,"date_src":"general","place":"Sijilmasa and other North African mints","paradigm":"agrarian_empire","desc":"Islamic gold coin; West African gold was minted into dinars at Sijilmasa and elsewhere (Almoravid and Fatimid dinars), later into Genoese and Venetian gold coin.","chokepoint":false,"part":"11","parts":["11"]},{"id":"hawala","label":"Hawala debt transfer","domain":"exchange","kind":"institution","start":800,"date_src":"general","place":"Islamic world","paradigm":"agrarian_empire","desc":"Legal transfer of a debt to another debtor, letting debts circulate; the root of the modern informal transfer system of that name.","chokepoint":false,"part":"11","parts":["11"]},{"id":"jahbadh_bankers","label":"Jahbadh bankers","domain":"exchange","kind":"institution","start":800,"date_src":"general","place":"Abbasid Baghdad (Karkh)","paradigm":"agrarian_empire","desc":"State and merchant bankers of Abbasid Baghdad (300,000 to 1 million, contested), hub of the routes from India to the Mediterranean, dealing in cheques (sakk) and transfer bills (suftaja).","chokepoint":false,"part":"12","parts":["12"]},{"id":"labour_dues","label":"Week-work and boon days","domain":"institutions","kind":"institution","start":800,"date_src":"general","place":"English manors","paradigm":"feudal_manorial","desc":"Villein yardlanders owed two or three days a week on some manors plus boon works at harvest, 0 to 150 days a year, often sent by a son or servant. The lord's peak was also the tenant's; 'the work of a villein is worth half that of a hired man'.","chokepoint":false,"part":"05","parts":["05"]},{"id":"lordship_manor","label":"The manor","domain":"institutions","kind":"institution","start":800,"date_src":"general","place":"Western Europe","paradigm":"feudal_manorial","desc":"A lord's demesne worked by servants, hired hands and tenants' dues, tenants' holdings, commons and the lord's monopolies, run by a steward, bailiff and a reeve chosen from the tenants. Yearly account rolls recorded every bushel and penny. Lordship turned rural surplus into urban demand.","chokepoint":false,"part":"05","parts":["05"]},{"id":"muhtasib","label":"Muhtasib market inspector","domain":"institutions","kind":"institution","start":800,"date_src":"general","place":"Islamic cities","paradigm":"agrarian_empire","desc":"An official enforcing weights, measures, the prices of necessities and honest dealing (hisba): the market's rules, visible and enforced on the spot.","chokepoint":false,"part":"11","parts":["11"]},{"id":"open_field_strips","label":"Open fields in strips","domain":"food","kind":"practice","start":800,"date_src":"general","place":"Midland England and northern Europe","paradigm":"feudal_manorial","desc":"Arable in scattered strips across two or three great fields, meadow allotted for hay, common pasture and waste, with everyone's beasts on the stubble. Scattering may have insured against harvest variance (McCloskey) [contested].","chokepoint":false,"part":"05","parts":["05"]},{"id":"sakk","label":"Sakk payment order","domain":"exchange","kind":"institution","start":800,"date_src":"general","place":"Abbasid Baghdad","paradigm":"agrarian_empire","desc":"A written order to pay among known bankers, the root of Europe's 'cheque'.","chokepoint":false,"part":"11","parts":["11"]},{"id":"serfdom","label":"Serfdom","domain":"institutions","kind":"institution","start":800,"date_src":"general","wide":1100,"place":"Western Europe","paradigm":"feudal_manorial","desc":"Binds the worker to the land and a lord rather than making him property. An English villein about 1300 owed week-work, boons, heriot and merchet and needed leave to go. Domar: free land, free labour and a landowning class cannot coexist; it ended in England after the Black Death.","chokepoint":false,"part":"05","parts":["05"]},{"id":"suftaja","label":"Suftaja transfer bill","domain":"exchange","kind":"institution","start":800,"date_src":"general","place":"Abbasid world","paradigm":"agrarian_empire","desc":"Money paid in one city and repaid in another by the issuer's correspondent, so value moved without carrying coin on dangerous roads; jurists debated it because the lender gained safe carriage.","chokepoint":false,"part":"11","parts":["11"]},{"id":"three_field_rotation","label":"Three-field rotation","domain":"food","kind":"practice","start":800,"date_src":"part","wide":1250,"place":"English Midlands, northern France, Germany","paradigm":"feudal_manorial","desc":"Winter corn, spring corn, fallow: the cropped share rises from 50% to 67%, a third more crop from the same arable [s], with risk spread over two crops. Wheat yielded about 4:1 gross [s, r]; after seed and the tithe a household kept about two-thirds.","chokepoint":false,"part":"02","parts":["02"]},{"id":"two_field_system","label":"Two-field system","domain":"food","kind":"practice","start":800,"date_src":"part","place":"Mediterranean; northern Europe","paradigm":"feudal_manorial","desc":"One field in crop, one in fallow each year: half the arable fallow, grazed in common. Boserup's short-fallow stage, reached as people per acre rose.","chokepoint":false,"part":"02","parts":["02"]},{"id":"saltpetre","label":"Saltpetre","domain":"materials","kind":"good","start":850,"date_src":"general","wide":1500,"place":"China; European nitre beds; India","paradigm":"agrarian_empire","desc":"Nitre from beds of dung and urine and earth scraped from stables, later Indian imports. In Europe gathered under state monopolies (saltpetre men), for gunpowder and curing meat.","chokepoint":true,"part":"01","parts":["01"]},{"id":"damascus_blades","label":"Damascus patterned blades","domain":"metals","kind":"good","start":900,"date_src":"general","place":"Persia and Syria","paradigm":"agrarian_empire","desc":"Wootz cakes carried across the Arabian Sea were forged at low heat into the patterned blades Europeans called Damascus steel.","chokepoint":false,"part":"11","parts":["11"]},{"id":"gunpowder","label":"Gunpowder","domain":"materials","kind":"good","start":900,"date_src":"general","wide":1500,"place":"China","paradigm":"agrarian_empire","desc":"Saltpetre, charcoal and sulphur. It made charcoal and saltpetre strategic and was shipped in barrels.","chokepoint":false,"part":"01","parts":["01"]},{"id":"horse_collar","label":"Collar-harnessed horse","domain":"energy","kind":"technique","start":900,"date_src":"part","wide":1400,"place":"Europe","paradigm":"feudal_manorial","desc":"A horse with a padded collar and iron shoes, in Europe from about the 10th century [M]: about 500 to 750 W, half again as fast as an ox, but it needs oats [M]. Oxen still outnumbered horses about two to one on English demesnes at the end of the 14th century; peasants took to the horse faster [V].","chokepoint":false,"part":"01","parts":["01"]},{"id":"oats_fodder","label":"Fodder oats","domain":"food","kind":"good","start":900,"date_src":"general","place":"northern Europe","paradigm":"feudal_manorial","desc":"Grain grown for horses rather than people. A hard-worked 19th-century horse ate 12 to 16 lb of grain and 12 lb of hay a day [V], roughly 2 to 3 ha of land per horse [C]. England's horses ate the produce of perhaps a fifth of the farmland [M].","chokepoint":false,"part":"01","parts":["01"]},{"id":"song_wet_rice","label":"Song wet-rice intensification","domain":"food","kind":"technique","start":900,"date_src":"part","place":"Lower Yangzi, south China","paradigm":"agrarian_empire","desc":"Wet rice with transplanting, irrigation by treadle pumps, and night soil and canal mud as manure let the south overtake the north; China's population passed about 100 million around 1100 (rough).","chokepoint":false,"part":"11","parts":["11"]},{"id":"spring_legumes","label":"Legumes in the spring field","domain":"food","kind":"practice","start":900,"date_src":"general","place":"open-field England and France","paradigm":"feudal_manorial","desc":"Peas, beans and vetch sown in the spring field of the three-field system: the first step in closing the manure gap. Eastern Norfolk's high medieval yields rested on legumes and intensive manuring (Campbell 1983) [c].","chokepoint":false,"part":"02","parts":["02"]},{"id":"sichuan_iron_cash","label":"Sichuan iron coins","domain":"exchange","kind":"good","start":960,"date_src":"general","place":"Sichuan","paradigm":"agrarian_empire","desc":"Sichuan's coins were iron and too heavy to carry for trade, which pushed its merchants toward paper receipts.","chokepoint":false,"part":"11","parts":["11"]},{"id":"silver_mining_towns","label":"Silver mining towns","domain":"metals","kind":"industry","start":968,"date_src":"general","wide":1500,"place":"Rammelsberg, Kutna Hora, Saxony","paradigm":"feudal_manorial","desc":"The great silver strikes made mining towns with their own law (m). Coin made from their silver fed every other chain's exchange.","chokepoint":false,"part":"03","parts":["03"]},{"id":"charkha","label":"Charkha spinning wheel","domain":"textiles","kind":"technique","start":1000,"date_src":"general","place":"India","paradigm":"agrarian_empire","desc":"The wheel on which women spun cotton at home; yarn fineness was set by the spinner's skill.","chokepoint":false,"part":"11","parts":["11"]},{"id":"coppice_with_standards","label":"Coppice with standards","domain":"materials","kind":"practice","start":1000,"date_src":"general","wide":1300,"place":"lowland England","paradigm":"feudal_manorial","desc":"Underwood cut on rotation with oaks left among it to grow to timber over 50 to 150 years. Broadleaf coppice grows about 2.5 t of dry wood a hectare a year (cited); a standard was capital left by grandfathers.","chokepoint":false,"part":"03","parts":["03"]},{"id":"cowrie_money","label":"Cowrie shell money","domain":"exchange","kind":"good","start":1000,"date_src":"general","place":"Maldives to West Africa","paradigm":"early_state","desc":"Maldive cowries carried by way of Cairo and across the Sahara became West Africa's small change.","chokepoint":false,"part":"11","parts":["11"]},{"id":"ghana_gold_toll","label":"Ghana's salt toll and nugget rule","domain":"institutions","kind":"institution","start":1000,"date_src":"general","place":"Ghana empire, the Sahel","paradigm":"early_state","desc":"Al-Bakri (1068) says the king of Ghana took one dinar per donkey-load of salt coming in and two going out, and kept all gold nuggets, leaving the dust to the people so that gold would not lose its value: a state restricting supply to hold a price. Mali and Songhay later taxed at the desert's edge.","chokepoint":true,"part":"11","parts":["11"]},{"id":"jiaozi_receipts","label":"Jiaozi deposit receipts","domain":"exchange","kind":"good","start":1000,"date_src":"part","place":"Chengdu, Sichuan","paradigm":"agrarian_empire","desc":"Merchant houses in Sichuan issued deposit receipts against heavy iron coin around 1000: private paper that circulated as money. The state suppressed them and took over issue.","chokepoint":false,"part":"11","parts":["11"]},{"id":"kaolin_china_stone","label":"Kaolin and china stone","domain":"materials","kind":"resource","start":1000,"date_src":"general","place":"Gaoling hill and quarries near Jingdezhen","paradigm":"agrarian_empire","desc":"Porcelain's two body materials lay near Jingdezhen: kaolin (named after Gaoling hill) and petuntse, crushed by water-powered trip hammers, settled in tanks and shipped to town as white bricks. China stone with lime-and-fern ash also made the glaze.","chokepoint":false,"part":"11","parts":["11"]},{"id":"maghribi_reputation","label":"Merchant reputation networks","domain":"institutions","kind":"institution","start":1000,"date_src":"part","place":"Fustat (Cairo Geniza), Mediterranean","paradigm":"agrarian_empire","desc":"Greif argued the 11th-century Maghribi traders enforced agents' honesty by collective reputation; Edwards and Ogilvie replied that they used courts and dealt with outsiders; Goldberg sees networks of reciprocal agency. Enforcement mixed reputation, courts and kin, changing with distance.","chokepoint":false,"part":"11","parts":["11"]},{"id":"merchant_letters","label":"Merchant letters","domain":"information","kind":"practice","start":1000,"date_src":"general","place":"Italy and Europe","paradigm":"commercial_city_state","desc":"From the 12th century merchants wrote prices, exchange rates, ship arrivals and politics to correspondents (the Geniza letters are earlier still). Around 1500 a letter reached Venice in one week from Genoa, two from Paris, three from Antwerp [c]; Datini of Prato left about 150,000 letters [s]. Whoever knew prices elsewhere made the margin.","chokepoint":false,"part":"04","parts":["04"]},{"id":"movement_tolls","label":"Tolls on roads and rivers","domain":"exchange","kind":"institution","start":1000,"date_src":"general","place":"Rhine and medieval Europe","paradigm":"feudal_manorial","desc":"Pontage, murage, pavage, market and river tolls: the lord's or town's rent on movement. The Rhine had dozens of toll stations by the late Middle Ages, making river transport much dearer than it needed to be [s, r]; freedom from tolls was a prized privilege.","chokepoint":true,"part":"04","parts":["04"]},{"id":"seigneurial_banalites","label":"Lord's oven and press","domain":"institutions","kind":"institution","start":1000,"date_src":"general","place":"France and western Europe","paradigm":"feudal_manorial","desc":"Banalités: the lord's power to command the mill, oven, wine press, sometimes the bull and boar. Tenants paid in kind each time, so the lord's share rose with output; capital beyond a household plus power to forbid alternatives.","chokepoint":true,"part":"05","parts":["05"]},{"id":"song_coal_iron","label":"Song coal-fired iron industry","domain":"metals","kind":"industry","start":1000,"date_src":"general","place":"Cizhou and Xingzhou, Hebei and Henan","paradigm":"agrarian_empire","desc":"A large, partly private iron industry under state licence and quota, using coal from shafts as the northern woods ran out, blast furnaces with water bellows, and refining to wrought iron and steel for armies, builders and farmers. Hartwell put 1078 output at 75,000 to 125,000 t, near Britain's 1788 level; Wagner says no reliable calculation is possible (contested). It fell after the Jurchen conquest (1126) and the Yellow River's shift (1194).","chokepoint":false,"part":"11","parts":["11"]},{"id":"song_open_markets","label":"Open street commerce","domain":"exchange","kind":"institution","start":1000,"date_src":"general","place":"Northern Song Kaifeng","paradigm":"agrarian_empire","desc":"Over the late Tang and Song the ward walls fell, shops opened onto every street, night markets ran, guilds (hang) organised trades and commercial taxes grew: the 'medieval urban revolution'. The same size of city run by markets instead of supervision; Kaifeng had about a million (contested).","chokepoint":false,"part":"12","parts":["12"]},{"id":"swahili_hosts","label":"Swahili merchant hosts","domain":"exchange","kind":"institution","start":1000,"date_src":"general","place":"Swahili coast, Mogadishu to Sofala","paradigm":"maritime_trading","desc":"The monsoon allowed one round trip a year, so foreign merchants waited months as guests of local hosts who stored and sold their goods. The coral-stone towns were brokers of gold, ivory, captives and mangrove poles rather than carriers.","chokepoint":false,"part":"11","parts":["11"]},{"id":"weir_rights","label":"Weirs and fisheries","domain":"institutions","kind":"institution","start":1000,"date_src":"general","place":"English rivers","paradigm":"feudal_manorial","desc":"Fisheries and weirs were valuable lords' rights, but a weir blocked boats; Magna Carta (1215) ordered fish weirs removed from the Thames and Medway.","chokepoint":true,"part":"05","parts":["05"]},{"id":"jingdezhen_porcelain","label":"Jingdezhen porcelain","domain":"materials","kind":"industry","start":1004,"date_src":"general","place":"Jingdezhen, Jiangxi","paradigm":"agrarian_empire","desc":"The world's porcelain city from the Song on: hundreds of private kilns with throwing, moulding, painting, glazing and saggar-making as separate trades (a cup passes through seventy-two hands, Song Yingxing 1637). D'Entrecolles reported some 3,000 kilns in 1712 (reported, probably exaggerated); ware went by river to the Yangzi and overland to Guangzhou and Quanzhou.","chokepoint":false,"part":"11","parts":["11"]},{"id":"champa_rice","label":"Champa early-ripening rice","domain":"food","kind":"good","start":1012,"date_src":"part","place":"Champa (central Vietnam) via Fujian","paradigm":"agrarian_empire","desc":"Early-ripening, drought-tolerant rice; after the 1012 drought Emperor Zhenzong had 30,000 bushels of seed sent to the lower Yangzi and Huai. It allowed a second crop, or a crop on higher land; its origin is debated in genomic studies.","chokepoint":false,"part":"11","parts":["11"]},{"id":"paper_money","label":"Paper money","domain":"exchange","kind":"good","start":1023,"date_src":"part","place":"Sichuan, Song China","paradigm":"agrarian_empire","desc":"The first government paper money, the jiaozi, taken over by the Song state in 1023 to 1024 from private deposit-receipt houses, where iron coins were too heavy for trade [s]. The Yuan made paper the main currency; over-issue caused inflation and the Ming abandoned it for silver by the mid-15th century. Paper works while issuers limit it.","chokepoint":false,"part":"04","parts":["04"]},{"id":"song_state_notes","label":"Song state paper notes","domain":"exchange","kind":"good","start":1024,"date_src":"part","place":"Chengdu note office, Sichuan","paradigm":"agrarian_empire","desc":"The Song state took over issue in 1023 to 1024 with an official office at Chengdu, the first state paper money. Notes had a term, a fixed issue and a cash reserve; over-issue for war depreciated them.","chokepoint":false,"part":"11","parts":["11"]},{"id":"colleganza","label":"Colleganza partnership","domain":"exchange","kind":"institution","start":1050,"date_src":"general","place":"Venice","paradigm":"commercial_city_state","desc":"Venice's sea-loan partnership joining a stay-at-home investor's capital to a travelling merchant's voyage, with profit shared.","chokepoint":false,"part":"12","parts":["12"]},{"id":"commenda","label":"Commenda partnership","domain":"exchange","kind":"institution","start":1050,"date_src":"part","place":"Genoa and Venice","paradigm":"commercial_city_state","desc":"A sedentary investor provided capital and a travelling merchant took goods on a voyage; with all capital from the investor the traveller took about a quarter of profit, in the societas maris an equal split [s]. Islamic qirad and Jewish isqa came before it. Giovanni Scriba's register (1154 to 1164) holds hundreds; shares in many voyages spread risk.","chokepoint":false,"part":"04","parts":["04"]},{"id":"kaifeng_coal_fuel","label":"Coal heating Kaifeng","domain":"energy","kind":"practice","start":1050,"date_src":"general","place":"Kaifeng, Northern Song","paradigm":"agrarian_empire","desc":"A wood fuel crisis in the Northern Song led to wide use of mineral coal to heat the capital, brought from the Shanxi and Hebei coalfields by canal and cart. A city near a million on mineral fuel, centuries before London.","chokepoint":false,"part":"11","parts":["11"]},{"id":"maghribi_coalition","label":"Maghribi trader coalition","domain":"exchange","kind":"institution","start":1050,"date_src":"part","place":"Mediterranean (Cairo Geniza)","paradigm":"maritime_trading","desc":"11th-century Jewish merchants shared news of agents' honesty by letter and collectively refused to employ a cheat (Greif). Edwards and Ogilvie, and Goldberg, answered that the same letters show heavy use of courts and contracts [s, x]. A reputation system needing a closed group and an information channel.","chokepoint":false,"part":"04","parts":["04"]},{"id":"treadle_loom","label":"Horizontal treadle loom","domain":"textiles","kind":"technique","start":1050,"date_src":"part","wide":1200,"place":"Flanders and Europe","paradigm":"feudal_manorial","desc":"A foot-worked loom of the high Middle Ages (m) that took weaving out of the household into men's workshops in towns. A loom is capital; efficient weaving used two looms and two weavers.","chokepoint":false,"part":"03","part
