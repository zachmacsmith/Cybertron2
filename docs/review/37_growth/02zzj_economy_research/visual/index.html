// ---------- year scrubber + sparkline ----------
const yearIn=$('#year');
const SAMPLES=240;const spark=[];for(let i=0;i<=SAMPLES;i++){const y=YR(i/SAMPLES*TW);let c=0,md=0;nodes.forEach(n=>{if(n.start<=y){c++;}});spark.push({y,c});}
function drawSpark(){const s=d3.select('#spark');const r=s.node().getBoundingClientRect();const w=r.width,h=r.height;if(!w)return;
  const mx=nodes.length||1;const pts=spark.map((d,i)=>[i/SAMPLES*w,h-3-(d.c/mx)*(h-8)]);
  s.selectAll('*').remove();
  s.append('path').attr('d','M0,'+(h-3)+'L'+pts.map(p=>p.join(',')).join('L')+'L'+w+','+(h-3)+'Z').style('fill','var(--accent)').style('fill-opacity',.14);
  s.append('path').attr('d','M'+pts.map(p=>p.join(',')).join('L')).style('fill','none').style('stroke','var(--accent)').style('stroke-width',1.4);
  s.append('line').attr('x1',0).attr('x2',w).attr('y1',h-3).attr('y2',h-3).style('stroke','var(--rule)');
  [[-10000,'10k BCE'],[0,'0'],[1500,'1500'],[1850,'1850'],[1950,'1950']].forEach(([y,l])=>{const x=X(y)/TW*w;s.append('line').attr('x1',x).attr('x2',x).attr('y1',h-6).attr('y2',h-1).style('stroke','var(--muted)');
    s.append('text').attr('x',x+2).attr('y',9).text(l).style('font','9px var(--f-mono)').style('fill','var(--muted)');});
  const cx=yearIn.value/1000*w;s.append('line').attr('x1',cx).attr('x2',cx).attr('y1',0).attr('y2',h).style('stroke','var(--ink)').style('stroke-width',2);
  s.append('circle').attr('cx',cx).attr('cy',pts[Math.round(yearIn.value/1000*SAMPLES)][1]).attr('r',3.5).style('fill','var(--ink)');}
function setYear(v,fromPlay){const prev=year;yearIn.value=v;year=v>=1000?2030:YR(v/1000*TW);
  $('#yr').textContent=year>=2030?'today':fmtY(year);
  const u=nodes.filter(unlocked);let md=0;u.forEach(n=>{let d=0;md=Math.max(md,n._d);});
  $('#stat').innerHTML=`<b>${u.length}</b> of ${nodes.length} unlocked · deepest chain <b>${md}</b>`;
  if(fromPlay){nSel.filter(n=>n.start>prev&&n.start<=year).each(function(){const el=this;el.classList.remove('pop');void el.getBBox();el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),1150);});}
  drawSpark();render();if(sel)showNode(sel);}
yearIn.addEventListener('input',()=>{stop();setYear(+yearIn.value);});
function stop(){if(playing){clearInterval(playing);playing=null;$('#play').textContent='▶ Play';}}
$('#play').onclick=()=>{if(playing){stop();return;}let v=+yearIn.value;if(v>=1000)v=0;$('#play').textContent='❚❚ Pause';
  playing=setInterval(()=>{v=Math.min(1000,v+2);setYear(v,true);
    const nx=sx(X(year));if(nx>W-80||nx<LEFT+40){const x=(W-LEFT)*0.6-X(year)*T.k;svg.call(zoom.transform,d3.zoomIdentity.translate(x,0).scale(T.k));}
    if(v>=1000)stop();},70);};

// ---------- domain chips, search ----------
const chips=$('#domchips');
chips.innerHTML=DOMAINS.map(d=>`<button class="chip" data-d="${d}" aria-pressed="true" style="--c:var(--d-${d})"><i></i>${DLAB[d]} <span class="stat">${nodes.filter(n=>n.domain===d).length}</span></button>`).join('');
chips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const d=c.dataset.d;if(hidden.has(d))hidden.delete(d);else hidden.add(d);
  c.setAttribute('aria-pressed',!hidden.has(d));layoutLanes();clampY();render();});
$('#names').innerHTML=nodes.slice().sort((a,b)=>a.label.localeCompare(b.label)).map(n=>`<option value="${esc(n.label)}">`).join('');
$('#q').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();if(!v)return;
  const n=nodes.find(n=>n.label.toLowerCase()===v)||nodes.find(n=>n.label.toLowerCase().includes(v));
  if(n){if(hidden.has(n.domain)){hidden.delete(n.domain);chips.querySelector(`[data-d="${n.domain}"]`).setAttribute('aria-pressed','true');layoutLanes();}
    select(n);centerOn(n);}});

// ---------- societies view ----------
function renderSoc(){const wrap=$('#socwrap');if($('#stage-soc').hidden)return;
  const w=Math.max(940,wrap.clientWidth-32);const types=P.filter(p=>p.kind!=='branch').sort((a,b)=>a.start-b.start);
  const br=P.filter(p=>p.kind==='branch').sort((a,b)=>a.start-b.start);const RH=40;
  const L0=8,R0=w-8,s0=y=>L0+X(y)/TW*(R0-L0);const crow=[];COLL.slice().sort((a,b)=>a.when-b.when).forEach(c=>{const x=s0(c.when);let r=crow.findIndex(e=>e<x-4);if(r<0){r=crow.length;crow.push(0);}crow[r]=x+8+tw(c.label)*0.95;c.row=r;});
  const top=36+crow.length*13+14;
  const rows=new Map();types.forEach((p,i)=>rows.set(p.id,top+i*RH));br.forEach((p,i)=>rows.set(p.id,top+(types.length+0.6+i)*RH));
  const h=top+(types.length+br.length+1)*RH+10;const L=8,R=w-8;const s=y=>L+X(y)/TW*(R-L);
  const g=d3.select('#soc').attr('width',w).attr('height',h);g.selectAll('*').remove();
  let lx=-1e9;TICKS.forEach(t=>{const x=s(t);if(x-lx<58)return;lx=x;g.append('line').attr('x1',x).attr('x2',x).attr('y1',22).attr('y2',h).attr('class','gridline');
    g.append('text').attr('x',x).attr('y',16).attr('text-anchor','middle').text(fmtY(t)).style('font','10px var(--f-mono)').style('fill','var(--muted)');});
  if(br.length)g.append('text').attr('x',L).attr('y',top+(types.length+0.35)*RH).text('BRANCHES').attr('class','tracklab');
  COLL.forEach(c=>{const x=s(c.when);const cg=g.append('g').attr('class','collapse');cg.append('line').attr('x1',x).attr('x2',x).attr('y1',26).attr('y2',h);
    cg.append('text').attr('x',x+3).attr('y',32+c.row*13).text(c.label);cg.append('title').text(`${c.label}: ${c.summary}`);});
  const tg=g.append('g');
  TRANS.forEach(t=>{const a=PById.get(t.from),b=PById.get(t.to);if(!a||!b)return;const x=s(b.start),y1=rows.get(a.id)+12,y2=rows.get(b.id)+12;
    const d=`M${x-14},${y1}C${x},${y1} ${x-10},${y2} ${x},${y2}`;tg.append('path').attr('class','trans').attr('d',d).attr('marker-end','url(#arr)');
    tg.append('path').attr('class','trans-hit').attr('d',d).on('click',()=>{selectP(b);}).append('title').text(`${t.label} (${t.when||''}): ${t.mechanism}`);});
  g.append('defs').append('marker').attr('id','arr').attr('viewBox','0 0 8 8').attr('refX',7).attr('refY',4).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
    .append('path').attr('d','M0,0L8,4L0,8Z').style('fill','var(--accent)');
  P.forEach(p=>{const y=rows.get(p.id),x0=s(p.start),x1=s(p.end==null?2030:p.end);const bg=g.append('g').attr('class','sbar'+(p.kind==='branch'?' branch':'')+(p===selP?' sel':'')).attr('transform',`translate(0,${y})`).on('click',()=>selectP(p));
    bg.append('rect').attr('x',x0).attr('y',4).attr('width',Math.max(6,x1-x0)).attr('height',16).attr('rx',4);
    const short=p.engine?String(p.engine).split(/[.:;(,]/)[0].slice(0,40):'';const lw=tw(p.label)*1.12+(short?tw(short)+60:0);
    const lab=bg.append('text').attr('y',-1).attr('x',Math.max(L,Math.min(x0,R-lw))).text(p.label);
    if(short)lab.append('tspan').attr('class','eng').attr('dx',8).text('engine: '+short);
    bg.append('title').text(p.summary||p.label);});
}
$('#theories').innerHTML=THEO.map(t=>`<div><b>${esc(t.name)}</b><p>${esc(t.claim)}</p><p class="crit">${esc(t.critique||'')}</p></div>`).join('')||'<p class="src">None recorded.</p>';
function tab(which){const web=which==='web';$('#tab-web').setAttribute('aria-selected',web);$('#tab-soc').setAttribute('aria-selected',!web);
  $('#stage-web').hidden=!web;$('#stage-soc').hidden=web;$('#webcontrols').hidden=!web;$('#domchips').hidden=!web;if(web)resize();else renderSoc();}
$('#tab-web').onclick=()=>tab('web');$('#tab-soc').onclick=()=>tab('soc');

// ---------- boot ----------
$('#sub').textContent=`${nodes.length} techniques, industries, goods and institutions from foragers to the chip fab, with ${edges.length} lines saying what each needed. From the 02zzj research.`;
new ResizeObserver(()=>{resize();drawSpark();renderSoc();}).observe(document.querySelector('main'));
resize();fit();setYear(1000);showIntro();
})();
</script>
