<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
const D = JSON.parse(document.getElementById('econ-data').textContent);
const DOMAINS=['energy','food','materials','metals','textiles','building','transport','exchange','institutions','information'];
const DLAB={energy:'Energy',food:'Farming & food',materials:'Materials & chemicals',metals:'Metals & machines',textiles:'Textiles & leather',
  building:'Building & cities',transport:'Transport',exchange:'Exchange & finance',institutions:'Institutions & labour',information:'Information'};
const KLAB={technique:'technique',industry:'industry',good:'good',resource:'resource',infrastructure:'infrastructure',institution:'institution',practice:'practice'};
const PARTS={'01':'01_goods_resources_energy.md','02':'02_farming_herding_food.md','03':'03_crafts_woods_metal_building.md',
 '04':'04_exchange_money_transport.md','05':'05_labour_institutions_population.md','06':'06_societies_and_transitions.md',
 '07':'07_industrial_revolution.md','08':'08_later_paradigms.md','09':'09_engine_mapping.md','10':'10_prehistory_first_economies.md',
 '11':'11_ancient_and_world_economies.md','12':'12_cities_as_economies.md','13':'13_modern_global_industries.md'};
const REPO='https://github.com/zachmacsmith/Cybertron2/blob/main/docs/review/37_growth/02zzj_economy_research/';
const ETYPE={input:'input',enables:'needs',replaces:'switch',byproduct:'by-product'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- graph ----------
const nodes=D.nodes, byId=new Map(), edges=[];
nodes.forEach(n=>{n.in=[];n.out=[];byId.set(n.id,n);if(!DOMAINS.includes(n.domain))n.domain='materials';if(typeof n.start!=='number')n.start=0;});
D.edges.forEach(e=>{const a=byId.get(e.from),b=byId.get(e.to);if(a&&b&&a!==b){e.a=a;e.b=b;a.out.push(e);b.in.push(e);edges.push(e);}});
const visiting=new Set();
function depth(n){if(n._d!=null)return n._d;if(visiting.has(n))return 0;visiting.add(n);let d=0;for(const e of n.in)d=Math.max(d,depth(e.a)+1);visiting.delete(n);n._d=d;return d;}
nodes.forEach(depth);
nodes.forEach(n=>n.deg=n.in.length+n.out.length);
const P=(D.paradigms&&D.paradigms.paradigms)||[]; const PById=new Map(P.map(p=>[p.id,p]));
const TRANS=(D.paradigms&&D.paradigms.transitions)||[]; const COLL=(D.paradigms&&D.paradigms.collapses)||[];
const THEO=(D.paradigms&&D.paradigms.theories)||[];

// ---------- time scale (piecewise; each era widened by how much happened in it) ----------
const BR=[-300000,-50000,-10000,-3000,0,1000,1500,1750,1850,1900,1950,2030];
const segW=BR.slice(0,-1).map((b,i)=>110+19*nodes.filter(n=>n.start>=b&&n.start<BR[i+1]).length);
const cum=[0];segW.forEach((w,i)=>cum.push(cum[i]+w));const TW=cum.at(-1);
function X(y){y=Math.max(BR[0],Math.min(BR.at(-1)-1e-6,y));let i=0;while(y>=BR[i+1])i++;return cum[i]+(y-BR[i])/(BR[i+1]-BR[i])*segW[i];}
function YR(x){x=Math.max(0,Math.min(TW,x));let i=0;while(i<segW.length-1&&x>cum[i+1])i++;return BR[i]+(x-cum[i])/segW[i]*(BR[i+1]-BR[i]);}
function fmtY(y){y=Math.round(y);if(y<=-20000)return (Math.round(-y/1000)).toLocaleString()+'k BCE';if(y<0)return (-y).toLocaleString()+' BCE';if(y<1000)return y+' CE';return String(y);}
const TICKS=[-300000,-200000,-100000,-50000,-30000,-10000,-8000,-6000,-4000,-3000,-2000,-1000,0,500,1000,1250,1500,1600,1700,1750,1800,1850,1875,1900,1925,1950,1975,2000,2025];

// ---------- text measure & lane packing ----------
const mctx=document.createElement('canvas').getContext('2d');mctx.font='500 11px "IBM Plex Sans", system-ui, sans-serif';
const tw=s=>mctx.measureText(s).width;
const ROWH=18,LPAD=11;let LEFT=150;
const DSHORT={energy:'Energy',food:'Food',materials:'Materials',metals:'Metals',textiles:'Textiles',building:'Building',transport:'Transport',exchange:'Exchange',institutions:'Institutions',information:'Information'};
const laneRows={};
DOMAINS.forEach(d=>{const ns=nodes.filter(n=>n.domain===d).sort((a,b)=>a.start-b.start||b.deg-a.deg);const ends=[];
  ns.forEach(n=>{const x=X(n.start);let r=ends.findIndex(e=>e<x-3);if(r<0){r=ends.length;ends.push(0);}ends[r]=x+12+tw(n.label);n.row=r;});
  laneRows[d]=Math.max(1,ends.length);});
const hidden=new Set();const laneTop={},laneH={};let totalH=0;
function layoutLanes(){let y=0;DOMAINS.forEach(d=>{laneTop[d]=y;laneH[d]=hidden.has(d)?0:laneRows[d]*ROWH+LPAD*2;y+=laneH[d];});totalH=y;
  nodes.forEach(n=>n.y=laneTop[n.domain]+LPAD+n.row*ROWH+ROWH/2);}
layoutLanes();
// paradigm track rows
const pRows=[];P.slice().sort((a,b)=>a.start-b.start).forEach(p=>{const x0=X(p.start),x1=Math.max(X(p.end==null?2030:p.end),x0+18+tw(p.label)*0.95);
  let r=pRows.findIndex(e=>e<x0-4);if(r<0){r=pRows.length;pRows.push(0);}pRows[r]=x1;p.row=r;});
const PROWH=17,AXIS=24,TOP=(P.length?pRows.length*PROWH+22:4)+AXIS;

// ---------- state ----------
let year=2030, sel=null, selP=null, mode='both', T={x:0,k:1}, ty=0, playing=null;
const unlocked=n=>n.start<=year;

// ---------- svg ----------
const svg=d3.select('#web');
const defs=svg.append('defs');
defs.append('clipPath').attr('id','clipLanes').append('rect').attr('id','clipRect');
const gBg=svg.append('g');const gGrid=svg.append('g');
const gMain=svg.append('g').attr('clip-path','url(#clipLanes)');
const gEdges=gMain.append('g');const gNodes=gMain.append('g');const gNow=svg.append('g');
const gTop=svg.append('g');const gCol=svg.append('g');

const laneBg=gBg.selectAll('rect').data(DOMAINS).join('rect').attr('class',(d,i)=>'lane-bg '+(i%2?'b':'a'));
const eSel=gEdges.selectAll('path').data(edges).join('path').attr('class',e=>'edge '+(e.type||'enables'));
const nSel=gNodes.selectAll('g').data(nodes).join('g').attr('class',n=>'node'+(n.chokepoint?' choke':'')).style('--c',n=>`var(--d-${n.domain})`)
  .on('click',(ev,n)=>{ev.stopPropagation();select(n);});
nSel.append('circle').attr('class','ring').attr('r',4);
nSel.append('circle').attr('class','dot').attr('r',n=>3.2+Math.min(3.3,Math.sqrt(n.deg)*0.75));
nSel.append('text').attr('x',n=>6+Math.min(3.3,Math.sqrt(n.deg)*0.75)).attr('dy','0.35em').text(n=>n.label);
nSel.append('title').text(n=>`${n.label} · ${fmtY(n.start)}`);

function render(){

  // ticks
  const tk=TICKS.filter(t=>{const x=sx(X(t));return x>LEFT-1&&x<W+1;});
  let lastX=-1e9;const shown=tk.filter(t=>{const x=sx(X(t));if(x-lastX>62){lastX=x;return true;}return false;});
  gTicks.selectAll('g.tick').data(shown,d=>d).join(en=>{const g=en.append('g').attr('class','tick');g.append('line');g.append('text').attr('text-anchor','middle');return g;})
    .attr('transform',t=>`translate(${sx(X(t))},0)`).call(g=>{g.select('line').attr('y1',TOP-6).attr('y2',TOP);g.select('text').attr('y',TOP-9).text(fmtY);});
  gGrid.selectAll('line').data(shown,d=>d).join('line').attr('class','gridline').attr('x1',t=>sx(X(t))).attr('x2',t=>sx(X(t))).attr('y1',TOP).attr('y2',H);

    .classed('live',p=>p.start<=year&&(p.end==null||p.end>=year)).classed('sel',p=>p===selP);
  pSel.select('rect').attr('width',p=>Math.max(4,(X(p.end==null?2030:p.end)-X(p.start))*k));
  pSel.select('text').attr('x',4);
  // nodes
  const rel=relSet();
  const labelOK=n=>rel?rel.nodes.has(n):(k>=0.72||(n.deg>=9&&k>=0.28)||(n.deg>=6&&k>=0.45)||n===sel);
  nSel.attr('transform',n=>`translate(${sx(X(n.start))},${TOP+ty+n.y})`)
    .attr('display',n=>hidden.has(n.domain)?'none':null)

  nSel.select('text').attr('display',n=>labelOK(n)?null:'none');

  eSel.attr('display',e=>(hidden.has(e.a.domain)||hidden.has(e.b.domain)||!unlocked(e.a)||!unlocked(e.b))?'none':null)
    .attr('d',e=>{const x1=sx(X(e.a.start)),y1=TOP+ty+e.a.y,x2=sx(X(e.b.start)),y2=TOP+ty+e.b.y;const dx=Math.max(24,Math.abs(x2-x1)*0.45);
      return `M${x1},${y1}C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;})
    .attr('class',e=>{let c='edge '+(e.type||'enables');if(rel&&rel.edges.has(e))c+=' on '+rel.edges.get(e);return c;});

// ---------- relations ----------
function walk(n,dir){const seen=new Map();const q=[[n,0]];const es=new Map();let maxd=0;
  while(q.length){const [m,d]=q.shift();for(const e of (dir==='up'?m.in:m.out)){const o=dir==='up'?e.a:e.b;if(!unlocked(o)&&dir==='down'&&year<2030)continue;
    es.set(e,dir==='up'?'needs':'unlocks');if(!seen.has(o)&&o!==n){seen.set(o,d+1);maxd=Math.max(maxd,d+1);q.push([o,d+1]);}}}
  return {nodes:seen,edges:es,max:maxd};}
function relSet(){
  if(sel){const s={nodes:new Set([sel]),edges:new Map()};
    if(mode==='up'||mode==='both'){const u=walk(sel,'up');u.nodes.forEach((v,k)=>s.nodes.add(k));u.edges.forEach((v,k)=>s.edges.set(k,v));}
    if(mode==='down'||mode==='both'){const u=walk(sel,'down');u.nodes.forEach((v,k)=>s.nodes.add(k));u.edges.forEach((v,k)=>s.edges.set(k,v));}
    if(mode==='near'){sel.in.forEach(e=>{s.nodes.add(e.a);s.edges.set(e,'needs');});sel.out.forEach(e=>{s.nodes.add(e.b);s.edges.set(e,'unlocks');});}
    return s;}
  if(selP){const s={nodes:new Set(),edges:new Map()};nodes.forEach(n=>{if(n.paradigm===selP.id)s.nodes.add(n);});
    (selP.typical_nodes||[]).concat(selP.precondition_nodes||[]).forEach(id=>{const n=byId.get(id);if(n)s.nodes.add(n);});
    edges.forEach(e=>{if(s.nodes.has(e.a)&&s.nodes.has(e.b))s.edges.set(e,'unlocks');});return s;}
  return null;}

function showIntro(){
  const ch=nodes.filter(n=>n.chokepoint).length, sw=edges.filter(e=>e.type==='replaces').length;
  const deep=nodes.slice().sort((a,b)=>b._d-a._d).slice(0,6);

  panel.innerHTML=`<button class="btn close" id="pclose" aria-label="Close">✕</button>
  <h2>How economies unlocked</h2>

   <svg width="44" height="14"><circle cx="22" cy="7" r="5" fill="var(--d-metals)" stroke="var(--ink)" stroke-width="1.6"/></svg><span>dark ring: a chokepoint the research names (${ch})</span>
   <svg width="44" height="14"><circle cx="22" cy="7" r="5" fill="var(--bg)" stroke="var(--locked)" stroke-width="1.2"/></svg><span>hollow: not yet unlocked at the chosen year</span>

  .on('zoom',e=>{const t=e.transform;if(lastT&&t.k===lastT.k)ty+=t.y-lastT.y;lastT=t;T={x:t.x,k:t.k};clampY();render();});
let lastT=null;svg.call(zoom);
svg.on('wheel',e=>{e.preventDefault();const [px]=d3.pointer(e,svg.node());
  if(e.ctrlKey||e.metaKey){zoom.scaleBy(svg,Math.pow(2,-e.deltaY*(e.deltaMode?0.05:0.0025)),[px-LEFT,0]);}
  else{const dx=e.shiftKey?e.deltaY:e.deltaX,dy=e.shiftKey?0:e.deltaY;if(dx)zoom.translateBy(svg,-dx/T.k,0);if(dy){ty-=dy;clampY();render();}}},{passive:false});

function renderSoc(){const wrap=$('#socwrap');if($('#stage-soc').hidden)return;

  const h=top+(types.length+br.length+1)*RH+10;const L=8,R=w-8;const s=y=>L+X(y)/TW*(R-L);
  const g=d3.select('#soc').attr('width',w).attr('height',h);g.selectAll('*').remove();
  let lx=-1e9;TICKS.forEach(t=>{const x=s(t);if(x-lx<58)return;lx=x;g.append('line').attr('x1',x).attr('x2',x).attr('y1',22).attr('y2',h).attr('class','gridline');
    g.append('text').attr('x',x).attr('y',16).attr('text-anchor','middle').text(fmtY(t)).style('font','10px var(--f-mono)').style('fill','var(--muted)');});
  if(br.length)g.append('text').attr('x',L).attr('y',top+(types.length+0.35)*RH).text('BRANCHES').attr('class','tracklab');
  COLL.forEach(c=>{const x=s(c.when);const cg=g.append('g').attr('class','collapse');cg.append('line').attr('x1',x).attr('x2',x).attr('y1',26).attr('y2',h);
    cg.append('text').attr('x',x+3).attr('y',34).text(c.label);cg.append('title').text(c.summary);});
  const tg=g.append('g');
  TRANS.forEach(t=>{const a=PById.get(t.from),b=PById.get(t.to);if(!a||!b)return;const x=s(b.start),y1=rows.get(a.id)+12,y2=rows.get(b.id)+12;
    const d=`M${x-14},${y1}C${x},${y1} ${x-10},${y2} ${x},${y2}`;tg.append('path').attr('class','trans').attr('d',d).attr('marker-end','url(#arr)');
    tg.append('path').attr('class','trans-hit').attr('d',d).on('click',()=>{selectP(b);}).append('title').text(`${t.label} (${t.when||''}): ${t.mechanism}`);});
  g.append('defs').append('marker').attr('id','arr').attr('viewBox','0 0 8 8').attr('refX',7).attr('refY',4).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
    .append('path').attr('d','M0,0L8,4L0,8Z').style('fill','var(--accent)');
  P.forEach(p=>{const y=rows.get(p.id),x0=s(p.start),x1=s(p.end==null?2030:p.end);const bg=g.append('g').attr('class','sbar'+(p.kind==='branch'?' branch':'')+(p===selP?' sel':'')).attr('transform',`translate(0,${y})`).on('click',()=>selectP(p));
    bg.append('rect').attr('x',x0).attr('y',4).attr('width',Math.max(6,x1-x0)).attr('height',16).attr('rx',4);
    const lab=bg.append('text').attr('y',-1).text(p.label);const lw=tw(p.label)*1.12;lab.attr('x',Math.min(x0,R-lw));
    if(p.engine){const short=String(p.engine).split(/[.:;(]/)[0].slice(0,60);bg.append('text').attr('class','eng').attr('y',32).attr('x',Math.min(x0,R-tw(short)*0.9)).text('engine: '+short);}
    bg.append('title').text(p.summary||p.label);});
}
$('#theories').innerHTML=THEO.map(t=>`<div><b>${esc(t.name)}</b><p>${esc(t.claim)}</p><p class="crit">${esc(t.critique||'')}</p></div>`).join('')||'<p class="src">None recorded.</p>';
function tab(which){const web=which==='web';$('#tab-web').setAttribute('aria-selected',web);$('#tab-soc').setAttribute('aria-selected',!web);
  $('#stage-web').hidden=!web;$('#stage-soc').hidden=web;$('#webcontrols').hidden=!web;$('#domchips').hidden=!web;if(web)resize();else renderSoc();}
$('#tab-web').onclick=()=>tab('web');$('#tab-soc').onclick=()=>tab('soc');

// ---------- boot ----------
$('#sub').textContent=`${nodes.length} techniques, industries, goods and institutions from foragers to the chip fab, with ${edges.length} lines saying what each needed. From the 02zzj research.`;
new ResizeObserver(()=>{resize();drawSpark();renderSoc();}).observe(document.querySelector('main'));
resize();fit();setYear(1000);showIntro();
})();
</script>
