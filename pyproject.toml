[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertron2"
version = "0.1.0"
description = "Cybertron 2: a multi-agent LLM society engine on a graph of places"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zach Macsmith" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["anthropic>=0.70"]          # LLM_BACKEND=api; claude_code needs the `claude` CLI instead
publish = ["pyarrow>=14", "huggingface_hub>=0.23"]   # journal tables as Parquet; publishing to the dataset (HF_TOKEN)
viz = ["numpy"]                    # c2viz and the landscape generator
dev = ["pytest", "pytest-xdist"]

[tool.setuptools.packages.find]
include = ["cybertron2*", "c2viz*"]

[tool.setuptools.package-data]
cybertron2 = ["specs/**/*", "engine/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than ~10 s; deselect with -m \"not slow\" for the quick loop",
]
